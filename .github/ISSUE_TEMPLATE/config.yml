# 案：白紙の Issue は許さない。外のリンクは出さない。
#
# 理由
# - 窓口は GitHub の Issue だけ（ai-and-sources の contact）。白紙を許すと、
#   確認日や版の欄がない報告や、個人の情報を含む報告が増える。
#   テンプレートは2つあるので、種類に迷ったら「その他」で足りる。
# - 外のリンク（contact_links）は、第三者の窓口を案内することになり、
#   新しい約束や名指しになりうるので、出さない。
#   Anthropic への連絡などを案内する必要が出たら、作者が決めてから足す。
blank_issues_enabled: false
