# 検査とデプロイ（planning/design.md §8.6・§8.8）。push と pull request のたびに動く。
#
# - いまある検査：サイトのビルド（mkdocs build --strict）、試験（tests/ の tools・site・hooks・guides）、
#   目次の検査（tools/check_catalog.py）。
#   design §8.6 の表の残り（front matter・参照・生成物の鮮度・数値と出典・確認日・書き方・描画・雛形の静的な検査）は、
#   道具ができたら tools/check_all.py（CI と同じ検査の組）にまとめ、ここから流す
# - デプロイ（GitHub Pages）は、main への push と、main で手で動かしたときに、上の検査がすべて通った後に動く。
#   Zensical の試験ビルド（zensical.yml）と外部リンク（links.yml）は別のワークフローで、デプロイは待たない
# - 前提：リポジトリの設定で、Pages の公開元（Settings → Pages → Build and deployment の Source）を
#   「GitHub Actions」にしておく。なっていないと、公開の job の configure-pages が止まる
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチの古い実行は止める。main は止めない（公開の途中で取り消さないため）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Material 9.8 がビルドのたびに出す、保守の終わり（2027-05-05）の知らせを消す。
  # 保守の終わりと Zensical への移行は decisions 2026-11-03「サイトを作る道具」と design §8.1 で扱う
  NO_MKDOCS_2_WARNING: "1"

jobs:
  site:
    name: サイトのビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv は v10.3.3 のような版のタグしか出さないので、コミットの SHA で固定する
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: 依存を入れる（uv.lock のとおり。Python は .python-version の 3.12）
        run: uv sync --locked
      - name: MkDocs でビルドする（警告で失敗）
        run: uv run mkdocs build --strict
      - name: 公開するサイトを預ける（main のときだけ）
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  tools:
    name: 試験と目次の検査
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: 依存を入れる（uv.lock のとおり）
        run: uv sync --locked
      - name: 道具の試験（tests/tools）
        run: uv run python -m unittest discover -s tests/tools
      # Chrome を使う試験（test_site_browser.py）は、CA_CHROME がないので飛ぶ（手元の Chrome を決める工程6a の3段目まで）
      - name: サイトの設定と CI の試験（tests/site）
        run: uv run python -m unittest discover -s tests/site
      # hooks は読者の python3（標準のライブラリだけ）で動くので、両方で流す（tests/hooks/test_hooks.py の動かし方）
      - name: hooks の試験（tests/hooks。標準のライブラリだけの python3）
        run: python3 -m unittest discover -s tests/hooks
      - name: hooks の試験（tests/hooks。uv run）
        run: uv run python -m unittest discover -s tests/hooks
      - name: 手引きとチェックリストの試験（tests/guides）
        run: uv run python -m unittest discover -s tests/guides
      # 目次の検査は骨格（工程6c）の後に退く（design §8.3）。そのときにこの手順を外す
      - name: 目次の検査（planning/catalog）
        run: uv run python tools/check_catalog.py

  deploy:
    name: 公開する（GitHub Pages）
    needs: [site, tools]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # job の permissions は上の permissions を丸ごと置き換えるので、contents: read も書く
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 公開は1つずつ順に行い、途中のものを取り消さない
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Pages の設定を確かめる
        uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
