<svg xmlns="http://www.w3.org/2000/svg" width="400" height="296" viewBox="0 0 400 296" font-family="sans-serif" font-size="13">
  <rect width="400" height="296" fill="#ffffff"/>
  <g fill="#f5f5f5" stroke="#333333" stroke-width="1.5">
    <rect x="30" y="8" width="340" height="52"/>
    <rect x="30" y="82" width="340" height="52"/>
    <rect x="30" y="156" width="340" height="52"/>
    <rect x="30" y="230" width="340" height="52"/>
  </g>
  <g fill="#222222">
    <text x="44" y="30" font-weight="bold">関門 1　プロファイル</text>
    <text x="44" y="48" font-size="11">遅い上位の関数を、計測の出力で確かめる</text>
    <text x="44" y="104" font-weight="bold">関門 2　対象の指定</text>
    <text x="44" y="122" font-size="11">上位の関数だけを頼み、変更もそこに収まる</text>
    <text x="44" y="178" font-weight="bold">関門 3　出力の一致</text>
    <text x="44" y="196" font-size="11">同じ入力の出力が変更の前後で一致する</text>
    <text x="44" y="252" font-weight="bold">関門 4　複数回の実測</text>
    <text x="44" y="270" font-size="11">各回の値と中央値が、前後で並んでいる</text>
  </g>
  <g stroke="#333333" stroke-width="1.5" fill="#333333">
    <line x1="200" y1="60" x2="200" y2="76"/>
    <polygon points="194,74 206,74 200,82" stroke="none"/>
    <line x1="200" y1="134" x2="200" y2="150"/>
    <polygon points="194,148 206,148 200,156" stroke="none"/>
    <line x1="200" y1="208" x2="200" y2="224"/>
    <polygon points="194,222 206,222 200,230" stroke="none"/>
  </g>
</svg>
