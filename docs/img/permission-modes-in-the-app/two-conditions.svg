<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-labelledby="t d">
  <title id="t">被害が起きる 2 つの条件と、片方を外す手段</title>
  <desc id="d">信頼の外の情報を読めることと、被害につながる行動ができることが両方そろうと、仕込まれた指示で被害が起きる。専用のフォルダは読める範囲を、Manual は行動を、コネクタの許可は届く先を絞る。</desc>
  <rect width="400" height="260" fill="#ffffff"/>
  <rect x="10" y="10" width="170" height="64" rx="6" fill="#eef3fb" stroke="#33507a" stroke-width="2"/>
  <text x="95" y="36" font-size="13" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">条件 A</text>
  <text x="95" y="56" font-size="12" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">信頼の外の情報を読める</text>
  <rect x="220" y="10" width="170" height="64" rx="6" fill="#eef3fb" stroke="#33507a" stroke-width="2"/>
  <text x="305" y="36" font-size="13" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">条件 B</text>
  <text x="305" y="56" font-size="12" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">被害につながる行動ができる</text>
  <text x="200" y="48" font-size="20" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">＋</text>
  <path d="M95 74 V104 H190 M305 74 V104 H210" fill="none" stroke="#33507a" stroke-width="2"/>
  <rect x="120" y="104" width="160" height="40" rx="6" fill="#fdecea" stroke="#9b2c2c" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="200" y="128" font-size="13" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">両方そろうと被害が成り立つ</text>
  <text x="200" y="168" font-size="13" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">どちらか一方を外す</text>
  <rect x="10" y="182" width="120" height="64" rx="6" fill="#f3f7ee" stroke="#4a6b2a" stroke-width="2"/>
  <text x="70" y="204" font-size="12" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">専用のフォルダ</text>
  <text x="70" y="224" font-size="11" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">A の届く範囲を絞る</text>
  <rect x="140" y="182" width="120" height="64" rx="6" fill="#f3f7ee" stroke="#4a6b2a" stroke-width="2"/>
  <text x="200" y="204" font-size="12" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">Manual</text>
  <text x="200" y="224" font-size="11" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">B の前に人が止める</text>
  <rect x="270" y="182" width="120" height="64" rx="6" fill="#f3f7ee" stroke="#4a6b2a" stroke-width="2"/>
  <text x="330" y="204" font-size="12" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">コネクタの許可</text>
  <text x="330" y="224" font-size="11" text-anchor="middle" fill="#1a1a1a" font-family="sans-serif">届く先を選んで絞る</text>
</svg>
