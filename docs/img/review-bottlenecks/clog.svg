  <rect x="310" y="124" width="80" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="350" y="148" text-anchor="middle" fill="#222222">マージ</text>
  <text x="200" y="186" text-anchor="middle" fill="#222222">灰色の棒は待つ PR。人の処理が細い口になる</text>
