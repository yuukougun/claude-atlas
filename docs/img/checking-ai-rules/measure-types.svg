<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="何を測るかで規則の型が分かれる図。個人の考える力を測る大会は禁止へ、成果物を測る大会は許可と開示へ、両方を測る大会は部門分けへ向かう。">
  <rect width="400" height="300" fill="#ffffff"/>
  <text x="200" y="26" font-size="15" text-anchor="middle" fill="#000000" font-family="sans-serif">何を測るか → 規則の型</text>
  <rect x="10" y="44" width="170" height="60" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="95" y="70" font-size="13" text-anchor="middle" fill="#000000" font-family="sans-serif">個人の考える力</text>
  <text x="95" y="90" font-size="13" text-anchor="middle" fill="#000000" font-family="sans-serif">を測る</text>
  <rect x="220" y="44" width="170" height="60" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="305" y="70" font-size="13" text-anchor="middle" fill="#000000" font-family="sans-serif">成果物</text>
  <text x="305" y="90" font-size="13" text-anchor="middle" fill="#000000" font-family="sans-serif">を測る</text>
  <line x1="95" y1="104" x2="95" y2="170" stroke="#000000" stroke-width="2"/>
  <polygon points="95,178 89,166 101,166" fill="#000000"/>
  <line x1="305" y1="104" x2="305" y2="170" stroke="#000000" stroke-width="2"/>
  <polygon points="305,178 299,166 311,166" fill="#000000"/>
  <rect x="10" y="180" width="170" height="50" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="95" y="210" font-size="14" text-anchor="middle" fill="#000000" font-family="sans-serif">型1：禁止</text>
  <rect x="220" y="180" width="170" height="50" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="305" y="210" font-size="14" text-anchor="middle" fill="#000000" font-family="sans-serif">型3：許可と開示</text>
  <rect x="115" y="236" width="170" height="50" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="200" y="258" font-size="14" text-anchor="middle" fill="#000000" font-family="sans-serif">型2：部門分け</text>
  <text x="200" y="276" font-size="11" text-anchor="middle" fill="#000000" font-family="sans-serif">（両方を測る場合）</text>
</svg>
