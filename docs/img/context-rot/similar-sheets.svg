<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" font-family="sans-serif">
  <rect width="400" height="280" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="bold" fill="#000000">似た書類が混ざると取り違えやすい</text>
  <text x="20" y="46" font-size="13" fill="#000000">質問：A 社の 2024 年の実績は？</text>

  <text x="20" y="72" font-size="12" fill="#333333">机の上が少ない場合</text>
  <rect x="20" y="80" width="175" height="36" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="28" y="103" font-size="12" fill="#000000">【正解】A 社 2024 年 実績</text>
  <rect x="205" y="80" width="175" height="36" fill="#ffffff" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="213" y="103" font-size="12" fill="#333333">雑談のメモ</text>

  <text x="20" y="146" font-size="12" fill="#333333">似ているが違う書類が混ざる場合</text>
  <rect x="20" y="154" width="175" height="36" fill="#ffffff" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="28" y="177" font-size="12" fill="#333333">A 社 2023 年 実績</text>
  <rect x="205" y="154" width="175" height="36" fill="#ffffff" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="213" y="177" font-size="12" fill="#333333">A 社 2024 年 目標</text>
  <rect x="20" y="198" width="175" height="36" fill="#ffffff" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="28" y="221" font-size="12" fill="#333333">B 社 2024 年 実績</text>
  <rect x="205" y="198" width="175" height="36" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="213" y="221" font-size="12" fill="#000000">【正解】A 社 2024 年 実績</text>

  <text x="20" y="262" font-size="11" fill="#333333">起きることの模式図。実験の数値ではない。</text>
