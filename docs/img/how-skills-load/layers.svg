<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" font-family="sans-serif" font-size="12">
  <rect width="400" height="240" fill="#ffffff"/>
  <text x="100" y="18" text-anchor="middle" fill="#222222" font-weight="bold">スキルの部品</text>
  <text x="300" y="18" text-anchor="middle" fill="#222222" font-weight="bold">机に載る時期</text>
  <rect x="8" y="28" width="184" height="44" fill="#f5f5f5" stroke="#111111" stroke-width="3"/>
  <text x="100" y="46" text-anchor="middle" fill="#111111">説明文</text>
  <text x="100" y="62" text-anchor="middle" font-size="10" fill="#111111">名前と description</text>
  <rect x="208" y="28" width="184" height="44" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="300" y="46" text-anchor="middle" fill="#111111">いつも載っている</text>
  <text x="300" y="62" text-anchor="middle" font-size="10" fill="#111111">短い札だけ</text>
  <rect x="8" y="80" width="184" height="44" fill="#f5f5f5" stroke="#555555" stroke-width="2"/>
  <text x="100" y="98" text-anchor="middle" fill="#222222">SKILL.md の本文</text>
  <text x="100" y="114" text-anchor="middle" font-size="10" fill="#222222">手順の概要と案内</text>
  <rect x="208" y="80" width="184" height="44" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="300" y="98" text-anchor="middle" fill="#222222">呼ばれたとき載る</text>
  <text x="300" y="114" text-anchor="middle" font-size="10" fill="#222222">載った後は会話に残る</text>
  <rect x="8" y="132" width="184" height="44" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
  <text x="100" y="150" text-anchor="middle" fill="#222222">補助ファイル</text>
  <text x="100" y="166" text-anchor="middle" font-size="10" fill="#222222">詳しい資料や例</text>
  <rect x="208" y="132" width="184" height="44" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="300" y="150" text-anchor="middle" fill="#222222">要るときに読む</text>
  <text x="300" y="166" text-anchor="middle" font-size="10" fill="#222222">本文の案内が頼り</text>
  <rect x="8" y="184" width="184" height="44" fill="#f5f5f5" stroke="#999999" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="100" y="202" text-anchor="middle" fill="#222222">スクリプト</text>
  <text x="100" y="218" text-anchor="middle" font-size="10" fill="#222222">決まった処理</text>
  <rect x="208" y="184" width="184" height="44" fill="#ffffff" stroke="#999999" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="300" y="202" text-anchor="middle" fill="#222222">実行するだけ</text>
  <text x="300" y="218" text-anchor="middle" font-size="10" fill="#222222">中身は机に載らない</text>
</svg>
