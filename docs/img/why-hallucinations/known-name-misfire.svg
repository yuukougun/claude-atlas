<svg xmlns="http://www.w3.org/2000/svg" lang="ja" viewBox="0 0 400 300" width="400" height="300" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" role="img">
  <title>名前だけ知っているときに断る既定が外れる流れ</title>
  <desc>モデルの既定は答えられないと断ることである。名前に見覚えがあると知っている名前の合図が働き、断る既定を抑える。経歴まで知っている場合は正しく答えられる。名前に見覚えがあるだけで中身を知らない場合も合図が働いてしまい、断る既定が外れて、もっともらしい作り話になる。</desc>
  <rect x="0" y="0" width="400" height="300" fill="#ffffff"/>
  <text x="12" y="24" font-size="14" font-weight="700" fill="#1a1a1a">顔は知っているが経歴を知らない人</text>

  <rect x="8" y="40" width="384" height="48" rx="6" fill="#f3f5f7" stroke="#8a95a1" stroke-width="1"/>
  <text x="18" y="60" font-size="12.5" font-weight="700" fill="#1a1a1a">既定：「答えられない」と断る</text>
  <text x="18" y="78" font-size="12" fill="#333333">情報が足りないときは、まず断る側に傾いている</text>

  <text x="12" y="108" font-size="12" fill="#333333">見覚えのある名前が来ると「知っている名前」の合図が働き、断る既定を抑える</text>

  <rect x="8" y="120" width="184" height="104" rx="6" fill="#ffffff" stroke="#2f3b48" stroke-width="1.2"/>
  <text x="18" y="140" font-size="12.5" font-weight="700" fill="#1a1a1a">名前も経歴も知っている</text>
  <text x="18" y="162" font-size="12" fill="#1a1a1a">合図が働く</text>
  <text x="18" y="180" font-size="12" fill="#1a1a1a">答える材料がある</text>
  <text x="18" y="204" font-size="12" font-weight="700" fill="#1a1a1a">正しい答えになる</text>

  <rect x="208" y="120" width="184" height="104" rx="6" fill="#ffffff" stroke="#2f3b48" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="218" y="140" font-size="12.5" font-weight="700" fill="#1a1a1a">名前だけ知っている</text>
  <text x="218" y="162" font-size="12" fill="#1a1a1a">合図が誤って働く</text>
  <text x="218" y="180" font-size="12" fill="#1a1a1a">断る既定が外れる</text>
  <text x="218" y="204" font-size="12" font-weight="700" fill="#1a1a1a">中身を作ってしまう</text>

  <text x="12" y="252" font-size="12.5" font-weight="700" fill="#1a1a1a">作り話は、知らないと気づかないまま出る</text>
  <text x="12" y="272" font-size="12" fill="#333333">聞き覚えの強さと、中身を知っているかは別である</text>
</svg>
