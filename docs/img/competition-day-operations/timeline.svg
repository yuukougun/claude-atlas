<svg xmlns="http://www.w3.org/2000/svg" width="400" height="380" viewBox="0 0 400 380" font-family="sans-serif" font-size="12">
  <rect width="400" height="380" fill="#ffffff"/>
  <rect x="10" y="10" width="380" height="52" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <text x="22" y="30" font-size="13" font-weight="bold" fill="#111111">1 前日まで</text>
  <text x="22" y="51" fill="#222222">規則・利用枠・課金経路・AI なしの手順をそろえる</text>
  <line x1="200" y1="62" x2="200" y2="80" stroke="#555555" stroke-width="1.5"/>
  <polygon points="194,78 206,78 200,88" fill="#555555"/>
  <rect x="10" y="90" width="380" height="52" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <text x="22" y="110" font-size="13" font-weight="bold" fill="#111111">2 開始直後</text>
  <text x="22" y="131" fill="#222222">人が問題を読み、評価器を先に立てる</text>
  <line x1="200" y1="142" x2="200" y2="160" stroke="#555555" stroke-width="1.5"/>
  <polygon points="194,158 206,158 200,168" fill="#555555"/>
  <rect x="10" y="170" width="380" height="52" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <text x="22" y="190" font-size="13" font-weight="bold" fill="#111111">3 中盤</text>
  <text x="22" y="211" fill="#222222">スコアの頭打ちと、AI のループを見る</text>
  <line x1="200" y1="222" x2="200" y2="240" stroke="#555555" stroke-width="1.5"/>
  <polygon points="194,238 206,238 200,248" fill="#555555"/>
  <rect x="10" y="250" width="380" height="52" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <text x="22" y="270" font-size="13" font-weight="bold" fill="#111111">4 終盤</text>
  <text x="22" y="291" fill="#222222">変更を凍結し、本番の条件で最終確認する</text>
  <line x1="200" y1="302" x2="200" y2="320" stroke="#555555" stroke-width="1.5"/>
  <polygon points="194,318 206,318 200,328" fill="#555555"/>
  <rect x="10" y="330" width="380" height="42" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="22" y="349" font-size="13" font-weight="bold" fill="#111111">5 提出</text>
  <text x="22" y="365" fill="#222222">出力や flag を人が確かめてから出す（太い枠）</text>
</svg>
