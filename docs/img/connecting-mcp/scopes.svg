<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" width="400" height="270" font-family="sans-serif" font-size="13">
  <rect x="0" y="0" width="400" height="270" fill="#ffffff"/>
  <text x="200" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">MCP のスコープと書かれる場所</text>
  <rect x="10" y="36" width="380" height="64" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2"/>
  <text x="22" y="58" font-weight="bold" fill="#222222">local（既定）</text>
  <text x="22" y="78" fill="#222222">このプロジェクトの、自分だけ</text>
  <text x="22" y="94" fill="#222222">~/.claude.json（共有されない）</text>
  <rect x="10" y="108" width="380" height="64" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="22" y="130" font-weight="bold" fill="#222222">project</text>
  <text x="22" y="150" fill="#222222">このプロジェクトの、チーム全員</text>
  <text x="22" y="166" fill="#222222">リポジトリ直下の .mcp.json（commit して共有）</text>
  <rect x="10" y="180" width="380" height="64" rx="6" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="22" y="202" font-weight="bold" fill="#222222">user</text>
  <text x="22" y="222" fill="#222222">すべてのプロジェクトの、自分だけ</text>
  <text x="22" y="238" fill="#222222">~/.claude.json（共有されない）</text>
  <text x="200" y="262" text-anchor="middle" font-size="12" fill="#222222">同じ名前は local、project、user の順に勝つ</text>
</svg>
