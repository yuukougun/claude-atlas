<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" font-family="sans-serif" font-size="12">
  <rect width="400" height="240" fill="#ffffff"/>
  <text x="200" y="18" text-anchor="middle" fill="#222222">1 回の送信で読み直す量（ターンごと）</text>
  <line x1="20" y1="180" x2="390" y2="180" stroke="#555555" stroke-width="1"/>
  <rect x="30" y="160" width="40" height="20" fill="#222222"/>
  <rect x="90" y="135" width="40" height="25" fill="#bbbbbb" stroke="#555555"/>
  <rect x="90" y="115" width="40" height="20" fill="#222222"/>
  <rect x="150" y="110" width="40" height="50" fill="#bbbbbb" stroke="#555555"/>
  <rect x="150" y="90" width="40" height="20" fill="#222222"/>
  <rect x="210" y="85" width="40" height="75" fill="#bbbbbb" stroke="#555555"/>
  <rect x="210" y="65" width="40" height="20" fill="#222222"/>
  <rect x="270" y="60" width="40" height="100" fill="#bbbbbb" stroke="#555555"/>
  <rect x="270" y="40" width="40" height="20" fill="#222222"/>
  <rect x="340" y="40" width="40" height="120" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="50" y="198" text-anchor="middle" fill="#222222">1</text>
  <text x="110" y="198" text-anchor="middle" fill="#222222">2</text>
  <text x="170" y="198" text-anchor="middle" fill="#222222">3</text>
  <text x="230" y="198" text-anchor="middle" fill="#222222">4</text>
  <text x="290" y="198" text-anchor="middle" fill="#222222">5</text>
  <text x="360" y="198" text-anchor="middle" fill="#222222">休んだ後</text>
  <text x="360" y="100" text-anchor="middle" fill="#222222">全部を</text>
  <text x="360" y="116" text-anchor="middle" fill="#222222">読み直し</text>
  <rect x="30" y="212" width="12" height="12" fill="#222222"/>
  <text x="48" y="222" fill="#222222">そのターンの新しい分</text>
  <rect x="190" y="212" width="12" height="12" fill="#bbbbbb" stroke="#555555"/>
  <text x="208" y="222" fill="#222222">それまでの履歴の読み直し</text>
</svg>
