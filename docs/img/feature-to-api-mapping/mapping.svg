<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 364" width="400" height="364" role="img" aria-labelledby="t d" font-family="sans-serif" font-size="12">
  <title id="t">アプリと Claude Code の機能と、対応する API の概念</title>
  <desc id="d">左の列にアプリと Claude Code の機能を 9 つ、右の列に対応する API の概念を並べ、線でつないだ図。実線は公式の文書から対応が読み取れるもの、破線は役割が近いだけで実装が同じとは確かめていないもの。</desc>
