<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" font-family="sans-serif" font-size="12">
  <rect width="400" height="240" fill="#ffffff"/>
  <rect x="10" y="150" width="120" height="60" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <rect x="140" y="110" width="120" height="100" fill="#e8e8e8" stroke="#555555" stroke-width="1"/>
  <rect x="270" y="70" width="120" height="140" fill="#d8d8d8" stroke="#555555" stroke-width="1"/>
  <text x="70" y="172" text-anchor="middle" fill="#111111" font-weight="bold">1 段目</text>
  <text x="70" y="190" text-anchor="middle" fill="#111111">既定のまま</text>
  <text x="200" y="132" text-anchor="middle" fill="#111111" font-weight="bold">2 段目</text>
  <text x="200" y="150" text-anchor="middle" fill="#111111">effort を上げる</text>
  <text x="200" y="168" text-anchor="middle" fill="#111111">（同じモデル）</text>
  <text x="330" y="92" text-anchor="middle" fill="#111111" font-weight="bold">3 段目</text>
  <text x="330" y="110" text-anchor="middle" fill="#111111">上位のモデルに</text>
  <text x="330" y="128" text-anchor="middle" fill="#111111">替える</text>
  <text x="200" y="26" text-anchor="middle" fill="#222222">足りなければ 1 段ずつ上がる</text>
  <path d="M 20 42 L 380 42" stroke="#111111" stroke-width="2" fill="none"/>
  <path d="M 380 42 L 370 37 M 380 42 L 370 47" stroke="#111111" stroke-width="2" fill="none"/>
  <text x="200" y="60" text-anchor="middle" fill="#222222">待ち時間と使用量が増える</text>
  <text x="200" y="230" text-anchor="middle" fill="#222222">各段で、同じ作業をやり直して効果を確かめる</text>
