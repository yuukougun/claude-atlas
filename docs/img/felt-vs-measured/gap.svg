<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" font-family="sans-serif" font-size="12">
  <rect width="400" height="230" fill="#ffffff"/>
  <text x="200" y="18" text-anchor="middle" fill="#222222">作業の所要時間の変化（AI を使ったタスク）</text>
  <line x1="235" y1="30" x2="235" y2="190" stroke="#222222" stroke-width="1"/>
  <text x="8" y="48" fill="#222222">開始前の予想</text>
  <rect x="115" y="54" width="120" height="24" fill="#ffffff" stroke="#222222" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="125" y="71" fill="#222222">24% 短くなる</text>
  <text x="8" y="100" fill="#222222">終了後の体感</text>
  <rect x="135" y="106" width="100" height="24" fill="#dddddd" stroke="#222222" stroke-width="2"/>
  <text x="145" y="123" fill="#222222">20% 短くなった</text>
  <text x="8" y="152" fill="#222222">実測</text>
  <rect x="235" y="158" width="95" height="24" fill="#222222" stroke="#222222" stroke-width="2"/>
  <text x="243" y="175" fill="#ffffff">19% 長くなった</text>
  <text x="230" y="206" text-anchor="end" fill="#222222">← 短い</text>
  <text x="240" y="206" fill="#222222">長い →</text>
  <text x="200" y="224" text-anchor="middle" font-size="10" fill="#555555">METR 2025・熟練の開発者 16 人・246 タスク</text>
</svg>
