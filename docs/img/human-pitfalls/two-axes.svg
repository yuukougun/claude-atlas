<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" font-family="sans-serif" font-size="12">
  <rect width="400" height="320" fill="#ffffff"/>
  <rect x="8" y="8" width="240" height="144" fill="#f5f5f5" stroke="#555555" stroke-width="1"/>
  <text x="20" y="28" font-weight="bold" fill="#111111">Claude 側の 6 つの原因</text>
  <text x="20" y="50" fill="#222222">1 見えていない</text>
  <text x="20" y="68" fill="#222222">2 散らかっている</text>
  <text x="20" y="86" fill="#222222">3 確かめていない</text>
  <text x="20" y="104" fill="#222222">4 縛っていない</text>
  <text x="20" y="122" fill="#222222">5 合っていない</text>
  <text x="20" y="140" fill="#222222">6 境界がない</text>
  <line x1="248" y1="80" x2="276" y2="80" stroke="#111111" stroke-width="2"/>
  <polygon points="276,74 288,80 276,86" fill="#111111"/>
  <rect x="292" y="52" width="100" height="56" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="342" y="76" text-anchor="middle" fill="#111111">見せる</text>
  <text x="342" y="94" text-anchor="middle" fill="#111111">確かめる・縛る</text>
  <rect x="8" y="168" width="240" height="144" fill="#f5f5f5" stroke="#555555" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="20" y="188" font-weight="bold" fill="#111111">人の側の 5 つの落とし穴</text>
  <text x="20" y="210" fill="#222222">ア 預けすぎる</text>
  <text x="20" y="228" fill="#222222">イ 同意を根拠にする</text>
  <text x="20" y="246" fill="#222222">ウ やめられない</text>
  <text x="20" y="264" fill="#222222">エ 体感を信じる</text>
  <text x="20" y="282" fill="#222222">オ みんなの案になる</text>
  <line x1="248" y1="240" x2="276" y2="240" stroke="#111111" stroke-width="2"/>
  <polygon points="276,234 288,240 276,246" fill="#111111"/>
  <rect x="292" y="212" width="100" height="56" fill="#ffffff" stroke="#111111" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="342" y="236" text-anchor="middle" fill="#111111">握る・確かめる</text>
  <text x="342" y="254" text-anchor="middle" fill="#111111">決まりと道具</text>
</svg>
