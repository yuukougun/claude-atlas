<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250" role="img" aria-labelledby="t d">
  <title id="t">並べる本数と人のレビューの帯域</title>
  <desc id="d">レビューの要る本流は少ない本数を実線で人のレビューの帯域へ送り、全部読む。調査・偵察・使い捨ての作業は多くの本数を破線で送るが、読むのは要約だけで、大半は捨てる。</desc>
  <rect x="0" y="0" width="400" height="250" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="12" fill="#222222">
    <text x="10" y="22" font-weight="bold">本流（レビューが要る）</text>
    <rect x="10" y="34" width="52" height="30" fill="#e8eefc" stroke="#222222" stroke-width="2"/>
    <text x="20" y="54">作業 1</text>
    <rect x="76" y="34" width="52" height="30" fill="#e8eefc" stroke="#222222" stroke-width="2"/>
    <text x="86" y="54">作業 2</text>
    <line x1="128" y1="49" x2="268" y2="76" stroke="#222222" stroke-width="3"/>
    <polygon points="268,70 280,78 266,82" fill="#222222"/>
    <text x="150" y="52">全部読む</text>

    <text x="10" y="132" font-weight="bold">調査・偵察・使い捨て</text>
    <rect x="10" y="144" width="34" height="24" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="50" y="144" width="34" height="24" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="90" y="144" width="34" height="24" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="10" y="174" width="34" height="24" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="50" y="174" width="34" height="24" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="90" y="174" width="34" height="24" fill="#ffffff" stroke="#222222" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="130" y1="170" x2="268" y2="140" stroke="#222222" stroke-width="1.5" stroke-dasharray="5 4"/>
    <polygon points="268,134 280,138 268,146" fill="#222222"/>
    <text x="136" y="192">要約だけ読む・大半は捨てる</text>

    <rect x="284" y="40" width="106" height="130" fill="#fdf1d6" stroke="#222222" stroke-width="2"/>
    <text x="294" y="92">人の</text>
    <text x="294" y="110">レビューの</text>
    <text x="294" y="128">帯域</text>
    <text x="284" y="200">本数の上限はここで決まる</text>
    <text x="284" y="218">（マシンや予算ではない）</text>
  </g>
</svg>
