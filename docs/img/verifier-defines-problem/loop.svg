<svg xmlns="http://www.w3.org/2000/svg" width="400" height="270" viewBox="0 0 400 270" font-family="sans-serif">
  <title>検証器が問題を定義するループの図</title>
  <desc>Claude が変更し、検証器が採点し、合否や点数が返り、次の変更を決める、の 4 段が輪になっている。検証器の段だけ塗りつぶしてある。輪の下に、検証器がずれていると、ずれた方向へ同じ速さで進むと書いてある。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="400" height="270" fill="#ffffff"/>
  <rect x="20" y="20" width="150" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="95" y="47" font-size="12" text-anchor="middle" fill="#222222">1 Claude が変更する</text>
  <rect x="230" y="20" width="150" height="44" fill="#4a6a8a" stroke="#222222" stroke-width="1.5"/>
  <text x="305" y="47" font-size="12" text-anchor="middle" fill="#ffffff">2 検証器が採点する</text>
  <rect x="230" y="130" width="150" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="305" y="157" font-size="12" text-anchor="middle" fill="#222222">3 合否や点数が返る</text>
  <rect x="20" y="130" width="150" height="44" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="95" y="157" font-size="12" text-anchor="middle" fill="#222222">4 次の変更を決める</text>
  <line x1="170" y1="42" x2="228" y2="42" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="305" y1="64" x2="305" y2="128" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="152" x2="172" y2="152" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="95" y1="130" x2="95" y2="66" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="20" y1="200" x2="380" y2="200" stroke="#222222" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="200" y="224" font-size="12" text-anchor="middle" fill="#222222">検証器に映ったものだけが、ループの目標になる</text>
  <text x="200" y="246" font-size="12" text-anchor="middle" fill="#222222">検証器がずれていると、ずれた方向へ同じ速さで進む</text>
</svg>
