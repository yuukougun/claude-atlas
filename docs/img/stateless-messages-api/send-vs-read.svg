<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-labelledby="t d">
  <title id="t">送る量と、モデルが読む量</title>
  <desc id="d">上段は基本の形。呼び出し側が system と全履歴と新しい発言を送り、モデルはその全体を読む。下段は message threads。送るのは新しい発言だけだが、API が全体を組み立て直すので、モデルが読むのは上段と同じ全体である。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
    <style>
      text { font-family: sans-serif; font-size: 11px; fill: #222222; }
      .h { font-size: 13px; font-weight: bold; }
      .box { fill: #ffffff; stroke: #222222; stroke-width: 1.5; }
      .read { fill: #e8e8e8; stroke: #222222; stroke-width: 2; }
      .line { stroke: #222222; stroke-width: 1.5; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="400" height="260" fill="#ffffff"/>

  <text class="h" x="10" y="20">基本の形：毎回、全体を送る</text>
  <rect class="box" x="10" y="30" width="105" height="22"/>
  <text x="18" y="45">system</text>
  <rect class="box" x="10" y="54" width="105" height="22"/>
  <text x="18" y="69">これまでの全履歴</text>
  <rect class="box" x="10" y="78" width="105" height="22"/>
  <text x="18" y="93">新しい発言</text>
  <line class="line" x1="120" y1="65" x2="150" y2="65"/>
  <rect class="box" x="155" y="45" width="95" height="40"/>
  <text x="163" y="62">そのまま渡す</text>
  <text x="163" y="76">（送る量＝全体）</text>
  <line class="line" x1="255" y1="65" x2="280" y2="65"/>
  <rect class="read" x="285" y="35" width="105" height="60"/>
  <text x="293" y="60">モデルが読む</text>
  <text x="293" y="76">全体</text>

  <text class="h" x="10" y="135">message threads：送る量だけ減る</text>
  <rect class="box" x="10" y="150" width="105" height="22"/>
  <text x="18" y="165">新しい発言だけ</text>
  <line class="line" x1="120" y1="161" x2="150" y2="161"/>
  <rect class="box" x="155" y="141" width="95" height="40"/>
  <text x="163" y="158">API が全体を</text>
  <text x="163" y="172">組み立て直す</text>
  <line class="line" x1="255" y1="161" x2="280" y2="161"/>
  <rect class="read" x="285" y="131" width="105" height="60"/>
  <text x="293" y="156">モデルが読む</text>
  <text x="293" y="172">全体（上と同じ）</text>

  <text x="10" y="222">減るのは「送る量」だけである。</text>
  <text x="10" y="240">読む量も、料金と rate limits も変わらない。</text>
</svg>
