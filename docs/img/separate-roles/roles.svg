<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">三つの役割と、それぞれが持つもの</title>
  <desc id="d">書く人は実装を持つ。承認する人は評価器と撤退の判定を持つ。疑う人は批評を持つ。三つとも同じ人が兼ねない。</desc>
  <rect width="400" height="300" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="14" fill="#222222">
    <rect x="10" y="10" width="380" height="80" fill="#f2f2f2" stroke="#444444" stroke-width="2"/>
    <text x="24" y="38" font-weight="bold">書く人（実装担当）</text>
    <text x="24" y="62">持つもの：実装と、完了の報告</text>
    <text x="24" y="80" font-size="12">持たないもの：評価の定義・採否・撤退</text>

    <rect x="10" y="110" width="380" height="80" fill="#ffffff" stroke="#444444" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="24" y="138" font-weight="bold">承認する人（評価担当・QA）</text>
    <text x="24" y="162">持つもの：評価器・採否・撤退の判定</text>
    <text x="24" y="180" font-size="12">持たないもの：実装</text>

    <rect x="10" y="210" width="380" height="80" fill="#e6e6e6" stroke="#444444" stroke-width="2" stroke-dasharray="2 3"/>
    <text x="24" y="238" font-weight="bold">疑う人（批評担当・持ち回り）</text>
    <text x="24" y="262">持つもの：外からの批評と、反証の確かめ方</text>
    <text x="24" y="280" font-size="12">持たないもの：その変更の実装</text>
  </g>
</svg>
