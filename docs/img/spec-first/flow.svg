<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" font-family="sans-serif" font-size="13">
  <rect width="400" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="20" y="10" width="360" height="50" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="31" text-anchor="middle" fill="#111111">1 インタビューで詰める</text>
  <text x="200" y="49" text-anchor="middle" font-size="11" fill="#444444">質問に答え、決めたことと要確認を分ける</text>
  <line x1="200" y1="60" x2="200" y2="84" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="86" width="360" height="50" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="107" text-anchor="middle" fill="#111111">2 SPEC.md に書く（画面はモックで合意）</text>
  <text x="200" y="125" text-anchor="middle" font-size="11" fill="#444444">範囲外と確かめ方まで書く</text>
  <line x1="200" y1="136" x2="200" y2="160" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="162" width="360" height="50" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
  <text x="200" y="183" text-anchor="middle" fill="#111111">3 新しいセッションで実装する</text>
  <text x="200" y="201" text-anchor="middle" font-size="11" fill="#444444">SPEC.md だけを渡し、計画を読んでから進める</text>
  <line x1="200" y1="212" x2="200" y2="236" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="238" width="360" height="50" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <text x="200" y="259" text-anchor="middle" fill="#111111">4 確かめ方で受け入れる</text>
  <text x="200" y="277" text-anchor="middle" font-size="11" fill="#444444">コマンドと実際の出力で、終わりを判断する</text>
</svg>
