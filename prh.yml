  # アプリの権限モードの Auto は英語の名前のまま（直さない。用語集 same-names-across-surfaces で書き分ける）
  - expected: auto モード
    patterns:
      - '/(?<![-\w./\\:@#$%"（(「『])auto mode(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
      - '/オート ?モード/'
    prh: 公式の日本語版の多数派（用語集 translation-policy。research/27 §3.1）
    specs:
      - {from: auto mode で動かす, to: auto モードで動かす}
      - {from: オートモードの分類器, to: auto モードの分類器}
      - {from: auto モード（auto mode）, to: auto モード（auto mode）}
