# 表記の揺れを直す規則（textlint-rule-prh が読む。設定は .textlintrc.json）。
#
# 正は用語集のページ（start の glossary。design §6.2・§7）で、このファイルは用語集の表から作る。
# - 用語集の表の1行（正規形・本文で使ってよい別の書き方・直す表記）が、ここの規則の1つ（expected・patterns）になる。
#   規則を足すときは用語集の表にも行を足し、表から行を消したら規則も消す
# - 初めの版（2026-11-04、工程6a）：用語集の本文がまだないので、design §6.2、research/27 §3.1 の表（公式の日本語版の
#   本文の多数派）、planning/batches/step3/brief-integrate.md の M1、decisions 2026-11-04（割れている3語）から作った。
#   用語集を書くときは、この版の規則を表に写してから、表を正にする
# - 機械で直してよい表記だけを置く。誤検出しやすいものは入れない（入れなかったものと理由は末尾）
#
# 書き方
# - 正規表現は '/…/' の形で、YAML の単引用符で囲む。prh は gmu の旗を付ける（u なので、\# \: \@ のような
#   不要なエスケープは誤りになる）。textlint-rule-prh は Str の節ごとに当てるので、前後の照合はその節の中だけを見る
# - 正規表現の規則には specs（規則の試験）を付ける。読み込むときに prh が確かめ、外れると textlint が止まる
# - 英語の名前を和文の語（サブエージェントなど）に直す規則は、語の前後を次の形にそろえる
#     前：(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])
#     後：(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?
#   識別子・パス・コマンド・URL の一部（前後が英数字・_・-・.・/ など）と、かっこやかぎかっこにじかに接した英語
#   （「サブエージェント（subagent）」のように初出に英語を添える書き方。research/27 §4 P11）は直さない。
#   和文の字に挟まれた空白は一緒に取る（「の subagent に」→「のサブエージェントに」）。正規形が英字で始まるか
#   終わるときは、その側の空白を取らない
# - 和文の語を英語の名前（plan mode など）に直す規則は空白を足さない。半角と全角の間の空白は
#   ja-space-between-half-and-full-width が指摘し、textlint --fix で続けて直る
# - prh: の文は、指摘に添えて出る（理由と、用語集の節）
#
# 外し方
# - ページ冒頭の別名の行（aliases を並べた行。揺れた表記と英語の名前をわざと含む）は
#   <!-- textlint-disable -->〜<!-- textlint-enable --> で囲む
# - 表記の揺れをわざと例に出す箇所（用語集の表など）は <!-- textlint-disable prh -->〜<!-- textlint-enable prh --> で囲む
# - 公式の英語のページの題名（Hooks reference など）は、リンクにするか日本語版の題名で書く（リンクの文字は prh が見ない）。
#   原文をそのまま引くときは引用（> の段落。prh が見ない）にする
#
# 用語集とこのファイルはメインが更新する。執筆者は報告に「提案」として書く（design §10.2）
version: 1

rules:
  # ---- 公式で表記が割れている3語：英語のまま書き、日本語の訳は別名に入れる（decisions 2026-11-04「表記が割れている3語」） ----
  - expected: plan mode
    pattern: '/[Pp]lan ?モード|プラン ?モード|Plan [Mm]ode|plan Mode/'
    prh: 公式で割れている語は英語のまま書く（用語集 split-terms。decisions 2026-11-04）
    specs:
      - {from: plan モードで計画させる, to: plan modeで計画させる}
      - {from: プランモード（Shift+Tab）, to: plan mode（Shift+Tab）}
      - {from: Plan Mode の使いどころ, to: plan mode の使いどころ}
      - {from: plan mode のまま, to: plan mode のまま}
      - {from: 料金プランのモード, to: 料金プランのモード}
  - expected: effort
    pattern: 努力レベル
    prh: 公式で割れている語は英語のまま書く（用語集 split-terms。decisions 2026-11-04）。effort レベルはそのまま使ってよい
  - expected: allow ルール
    pattern: 許可ルール
    prh: 公式で割れている語は英語のまま書く（用語集 split-terms。decisions 2026-11-04）
  - expected: ask ルール
    pattern: 確認ルール
    prh: 公式で割れている語は英語のまま書く（用語集 split-terms。decisions 2026-11-04）
  - expected: deny ルール
    pattern: 拒否ルール
    prh: 公式で割れている語は英語のまま書く（用語集 split-terms。decisions 2026-11-04）

  # ---- 公式の日本語版の本文の多数派（research/27 §3.1、M1）：英語の名前を和文の中で使ったときと、少数の表記 ----
  - expected: サブエージェント
    patterns:
      - '/(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])[Ss]ub-?agents?(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
      - サブ・エージェント
    prh: 公式の日本語版の多数派（用語集 translation-policy。research/27 §3.1）
    specs:
      - {from: Claude Code の subagent に調べさせる, to: Claude Code のサブエージェントに調べさせる}
      - {from: sub-agents を並べる, to: サブエージェントを並べる}
      - {from: サブエージェント（subagent）, to: サブエージェント（subagent）}
      - {from: SubagentStop で止める, to: SubagentStop で止める}
      - {from: subagent_type を渡す, to: subagent_type を渡す}
      - {from: 「subagent」という名前, to: 「subagent」という名前}
  # hook event は「フックイベント」。イベントの名前（PreToolUse など）と matcher は英語のまま（M1）
  - expected: フックイベント
    pattern: '/(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])[Hh]ook [Ee]vents?(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
    prh: 公式の日本語版の多数派（用語集 translation-policy。research/27 §3.1）
    specs:
      - {from: hook event の一覧, to: フックイベントの一覧}
  # Mods の「hooks module」は名前なので直さない
  - expected: フック
    pattern: '/(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])[Hh]ooks?(?! module)(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
    prh: 公式の日本語版の多数派（用語集 translation-policy。research/27 §3.1）。イベントの名前と matcher は英語のまま
    specs:
      - {from: PreToolUse の hook で止める, to: PreToolUse のフックで止める}
      - {from: Hooks の入門, to: フックの入門}
      - {from: プラグインの hooks module, to: プラグインの hooks module}
      - {from: .claude/hooks/ に置く, to: .claude/hooks/ に置く}
      - {from: webhook を呼ぶ, to: webhook を呼ぶ}
      - {from: hookify で作る, to: hookify で作る}
      - {from: hooks.json を読む, to: hooks.json を読む}
  # Agent Skills（標準の名前）と Skills API（API の名前。M1 で英語のまま）は直さない。単数の大文字の Skill は道具の名前なので直さない
  - expected: スキル
    pattern: '/(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])(?<!Agent )(?:skills?|Skills)(?! API)(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
    prh: 公式の日本語版の多数派（用語集 translation-policy。research/27 §3.1）
    specs:
      - {from: skill を作る, to: スキルを作る}
      - {from: アプリの Skills を使う, to: アプリのスキルを使う}
      - {from: Agent Skills の標準, to: Agent Skills の標準}
      - {from: skill-creator で作る, to: skill-creator で作る}
      - {from: /skills で一覧を見る, to: /skills で一覧を見る}
      - {from: SKILL.md を書く, to: SKILL.md を書く}
      - {from: Skills API に上げる, to: Skills API に上げる}
  # 英語の名前が2つ続くと、別々に直したときに和文の間に空白が残るので、続いた形を1つの規則にする（同じ位置なら長いほうが勝つ）
  - expected: プラグインマーケットプレイス
    pattern: '/(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])[Pp]lugin [Mm]arketplaces?(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
    prh: プラグインとマーケットプレイス（公式の日本語版の多数派）を続けた形（用語集 translation-policy。research/27 §3.1）
    specs:
      - {from: plugin marketplace を作る, to: プラグインマーケットプレイスを作る}
      - {from: /plugin marketplace add で足す, to: /plugin marketplace add で足す}
  # claude plugin（コマンド）は直さない
  - expected: プラグイン
    pattern: '/(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])(?<!claude )[Pp]lugins?(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
    prh: 公式の日本語版の多数派（用語集 translation-policy。research/27 §3.1）
    specs:
      - {from: plugin で配る, to: プラグインで配る}
      - {from: claude plugin validate を流す, to: claude plugin validate を流す}
      - {from: /plugin で入れる, to: /plugin で入れる}
      - {from: plugin.json を書く, to: plugin.json を書く}
  - expected: マーケットプレイス
    patterns:
      - '/(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])(?<!plugin )[Mm]arketplaces?(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
      - マーケットプレース
    prh: 公式の日本語版の多数派（用語集 translation-policy。research/27 §3.1）
    specs:
      - {from: marketplace を足す, to: マーケットプレイスを足す}
      - {from: /plugin marketplace add で足す, to: /plugin marketplace add で足す}
      - {from: マーケットプレースから入れる, to: マーケットプレイスから入れる}
  # permission mode・permission prompt・permission rule は、下の「権限」より長く一致するので先に効く（prh は同じ位置なら長いほうを取る）
  - expected: 権限モード
    pattern: '/(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])[Pp]ermission [Mm]odes?(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
    prh: 公式の日本語版の多数派（用語集 translation-policy。research/27 §3.1）
    specs:
      - {from: permission mode を選ぶ, to: 権限モードを選ぶ}
      - {from: Permission Modes の文書, to: 権限モードの文書}
  - expected: 権限プロンプト
    pattern: '/(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])[Pp]ermission [Pp]rompts?(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
    prh: 公式の日本語版の多数派（用語集 translation-policy。research/27 §3.1）
    specs:
      - {from: permission prompt が出る, to: 権限プロンプトが出る}
  - expected: 権限ルール
    pattern: '/(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])[Pp]ermission [Rr]ules?(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
    prh: 目次の題名「権限ルール（allow・ask・deny）」の表記（用語集 translation-policy）
    specs:
      - {from: permission rules の書き方, to: 権限ルールの書き方}
  - expected: 権限
    pattern: '/(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])[Pp]ermissions?(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
    prh: 公式の日本語版の多数派（用語集 translation-policy。research/27 §3.1）。設定のキーはコードの書式で書く
    specs:
      - {from: permissions の deny ルール, to: 権限の deny ルール}
      - {from: bypassPermissions で動かす, to: bypassPermissions で動かす}
      - {from: permissions.deny に足す, to: permissions.deny に足す}
      - {from: --permission-mode を渡す, to: --permission-mode を渡す}
  - expected: サンドボックス
    pattern: '/(?:(?<=[ぁ-んァ-ヶー一-龠々]) )?(?<![-\w./\\:@#$%"（(「『])[Ss]andbox(?:es)?(?![-\w./\\:@#$%"）)」』])(?: (?=[ぁ-んァ-ヶー一-龠々]))?/'
    prh: 公式の日本語版の多数派（用語集 translation-policy。research/27 §3.1）
    specs:
      - {from: sandbox で閉じ込める, to: サンドボックスで閉じ込める}
