- id: claude-md-recommended-lines
  title: CLAUDE.md の 1 ファイルの推奨の長さ
  value: 200
  unit: 行
  sentence: 目安は 1 ファイル {value} {unit}以内
  sources:
  - cc-docs-memory
  checked: '2026-11-04'
  volatility: 中
  status: 確認済み
  note: 公式は Write effective instructions で「target under 200 lines per CLAUDE.md file. Longer files consume more context and reduce adherence」と書く。超えたファイルがあると、起動時と /status に警告が出る（rules のファイルと @path の取り込みも別のファイルとして数える）。
