- id: model-prompting-tendencies
  title: 公式のモデル別プロンプト指針が挙げる偏り（系統・版・effort ごと）
  table:
    rows: モデル
    columns:
    - id: tendency
      title: 偏りと対処
    cells:
    - row: Opus 5
      tendency: 既定で冗長。自分で検証するので確かめ直しの指示は外す。委任しすぎを抑える
    - row: Opus 5.5
      tendency: 既定 effort は medium で thinking は常時オン。思考を減らすなら指示より effort を下げる
    - row: Sonnet 5.5
      tendency: low と medium では確認で止まりすぎ、high 以上では頼まれていない追加をしがち
    - row: Fable 5.1
      tendency: 最後の段落が計画や約束で終わらないか確かめさせる。low では検索を減らし記憶で答えがち。書式を控えめにする
    - row: Haiku 5.5
      tendency: low では早く止まりがちで、medium に上げると減った。一律の「何でも検索」は過剰検索になる
