- id: claude-md
  title: CLAUDE.md
  page: what-to-put-in-claude-md
  surfaces:
  - claude-code
  maturity: GA
  enforcement: お願い
  load_timing: セッション開始
  context_cost: 常駐
  survives_compaction: true
  match_terms:
  - CLAUDE.md
  - CLAUDE.local.md
  - claudeMdExcludes
  - /init
  - /memory
  - AGENTS.md
  - '@-imports'
  - CLAUDE.md imports
  sources:
  - cc-docs-memory
  - cc-docs-features-overview
  - cc-docs-features-overview-ja
  - cc-docs-context-window
  checked: '2026-11-04'
  volatility: 中
  status: 確認済み
  note: 公式は CLAUDE.md を強制する設定ではなく文脈として扱うと書く（Claude treats them as context, not enforced configuration）。読み込みは作業ディレクトリから上の階層の分がセッション開始で、サブディレクトリの CLAUDE.md は Claude がそのディレクトリのファイルを読み書きしたときに読み込まれる。圧縮で残るのはプロジェクトの根の CLAUDE.md（ディスクから入れ直す）で、入れ子の CLAUDE.md は要約に消え、必要になったときに読み直される。入った版は CHANGELOG の最も古い版より前なので書かない
- id: rules
  title: rules（.claude/rules/）
  page: path-scoped-rules
  surfaces:
  - claude-code
  maturity: GA
  enforcement: お願い
  load_timing: セッション開始か、一致するファイルを扱うとき
  context_cost: 常駐か、一致するファイルのときだけ
  survives_compaction: null
  conditional: [survives_compaction]
  since:
    claude_code: 2.0.64
    date: '2025-12-10'
  match_terms:
  - .claude/rules
  - paths frontmatter
  - path-scoped rules
  - conditional rules
  - InstructionsLoaded
  sources:
  - cc-docs-memory
  - cc-docs-features-overview-ja
  - cc-docs-context-window
  - cc-changelog
  - cc-docs-changelog
  checked: '2026-11-04'
  volatility: 中
  status: 確認済み
  note: paths のない rules は .claude/CLAUDE.md と同じ扱いでセッション開始に読み込まれ、圧縮の後もディスクから入れ直される。paths のある rules は一致するファイルを扱うときだけ読み込まれ、圧縮では要約に消えて、一致するファイルを再び扱うと読み直される（公式は、圧縮を越えて残すなら paths を外すか根の CLAUDE.md に移すよう勧める）。圧縮で残るかの属性は、paths のない rules と paths のある rules で答えが違い、真偽で言い切れないので書かない（公式の What survives compaction の表は、前者を「ディスクから入れ直す」、後者を「必要なときに読み直す」と分けて書く）。読み込みの時期は公式の比較のタブ（CLAUDE.md とルールとスキル）の「すべてのセッション、または一致するファイルが開かれたとき」から。コンテキストのコストは公式の表に行がないので memory のページの記述から決めた。強制力は CLAUDE.md と同じ扱いの指示であることから
