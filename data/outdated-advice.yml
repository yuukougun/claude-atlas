# 古くなった助言の台帳（design §9.1・DR-18。research/00 §5）。形は schema/outdated-advice.schema.json
# （schema/keys.yml の outdated-advice の節から作る）。
# - id は目次の registry の ledger の id（planning/catalog/registry.yaml）。ページは outdated_advice で指し、台帳のページ
#   （changes の outdated-advice-ledger）と逆リンクは道具が作る
# - 行は消さない（古い記事の手順が通じない読者の入口になるため。例：改名されて、今は別の機能になったコマンド）
# - 名前と画面の変更の行は changed を持たず、name で data/facts.yml の names の id を指す（時期はそこから引く。DR-18）
# - 状態（撤回・置換・条件付き）が変わる更新は、作者が承認する（design §9.4 の4）
# - 初版は工程6b
#
# 書き方の例（値はすべて置き場所の印）:
#   advice:
#     - id: <registry の ledger の id>
#       title: <古い助言>
#       now: <今どうするか>
#       changed: {date: <YYYY か YYYY-MM か YYYY-MM-DD>, version: <x.y.z。任意>, approx: true}   # 名前の変更なら name
#       status: <撤回・置換・条件付き>
#       principle: [<どの原理の回避策だったか>]
#       why_then: <かつてなぜ正しかったか>
#       how_to_find: <自分の設定や記事で見つける方法>
#       sources: [<sources の id>]
#       checked: <確認日>

advice:
- id: hash-to-memorize
  title: 「#」で始めると CLAUDE.md に記憶される
  now: CLAUDE.md に足したいことは、Claude に CLAUDE.md の編集を頼むか、/memory でファイルを開いて自分で書く。セッションの中で学んだことは、自動メモリが書き残す。
  changed:
    date: '2025-12-15'
    version: 2.0.70
  status: 撤回
  surfaces:
  - claude-code
  principle:
  - 見せる
  why_then: '2.0.70 より前は、入力の先頭に # を付けると、その行を CLAUDE.md に書き足す近道があった。'
  how_to_find: '記事や手順書で、入力の先頭に # を付けて覚えさせる手順を探す。手元の版を claude --version で確かめ、2.0.70 以上ならこの近道はない。今の入力の記号の表（Interactive mode の Quick commands）に # はない。'
  sources:
  - cc-changelog
  - cc-docs-changelog
  - cc-docs-memory
  - cc-docs-interactive-mode
  checked: '2026-11-04'
- id: commands-directory
  title: .claude/commands/ にカスタムコマンドを作る、/project:name 記法
  now: '新しく作るものはスキル（.claude/skills/<名前>/SKILL.md）にする。.claude/commands/ のファイルも今も同じように動き、同じ名前のスキルがあればスキルが優先される。名前に project: や user: は付けず /<名前> で呼ぶ（サブディレクトリのファイルは /<フォルダ>:<名前>）。'
  changed:
    date: '2026-01-09'
    version: 2.1.3
    note: 'スラッシュコマンドとスキルがまとめられた（動きは変わらない）。名前の project: と user: の前置きは、それより前に外れた（時期は names の project-prefix-removed）'
  status: 置換
  surfaces:
  - claude-code
  principle:
  - 見せる
  why_then: 'スキルが入る前は、繰り返す頼み方を .claude/commands/ の Markdown にしてスラッシュコマンドで呼ぶのが公式のやり方だった（0.2.31 から）。以前は、コマンドの名前に project: と user: の前置きが付いていた。'
  how_to_find: リポジトリと ~/.claude/ に commands/ のフォルダがあるかを見る。動くので急いで移さなくてよいが、補助のファイルを置く、Claude が自分で読み込む、呼ぶ人を決める、といったスキルの働きが要るものから移す。記事の /project:<名前> は /<名前> で呼ぶ。
  sources:
  - cc-changelog
  - cc-docs-changelog
  - cc-docs-skills
  checked: '2026-11-04'
- id: agents-command
  title: /agents でサブエージェントを作る
  now: Claude にサブエージェントを作らせるか直させる（どこに置き、何をさせ、どの道具を許すかを頼む）。または .claude/agents/ か ~/.claude/agents/ の Markdown を直接書く。今の /agents は、このやり方を知らせる文を出すだけになった。
  changed:
    date: '2026-07-01'
    version: 2.1.198
  status: 撤回
  surfaces:
  - claude-code
  principle:
  - 見せる
  why_then: サブエージェントが入った 1.0.60（2025-07-24）から 2.1.197 まで、/agents は作成と管理の対話の画面（ウィザード）を開いた。
  how_to_find: 記事や手順書で、/agents の画面の操作（作成のウィザード、Running と Library のタブ）を説明していないかを見る。2.1.198 以上で /agents を打つと、案内の文だけが出る。
  sources:
  - cc-changelog
  - cc-docs-changelog
  - cc-docs-commands
  - cc-docs-sub-agents
  checked: '2026-11-04'
- id: think-hard-keywords
  title: think → think hard → ultrathink の段階、日本語の「熟考」
  now: think・think hard・think harder・「熟考」・「よく考えて」と書いても、effort は上がらない。これらはキーワードとして扱われず、effort の範囲で少し後押しするふつうの文として渡る。考える深さは effort（/effort・--effort・設定）で決める。ultrathink だけは、そのターンだけ深く考えるよう頼む言葉として認識され、セッションの effort は変えない。Claude Code が Anthropic の API で Opus 5.5・Sonnet 5.5・Haiku 5.5・Fable 5.1 を使うときは、ultrathink のターンを xhigh で動かす。この動きは、対話のターミナル（2.1.311 以上）と VS Code（2.1.316 以上）で働く。CLAUDE_CODE_DISABLE_ULTRATHINK（2.1.316 以上）で切れる。
  changed:
    date: '2026-03-04'
    version: 2.1.68
    note: 2.1.68 で ultrathink が「次のターンを high の effort にする」言葉として戻った（CHANGELOG は「再び入れた」と書くので、それより前に外れていたが、外れた版は CHANGELOG にない）。2.1.311（2026-10-26）から、対話のターミナルでそのターンを xhigh で動かす
    label: ultrathink が戻った版。think hard などの段階のキーワードが外れた時期は、確かめられていない
  status: 置換
  surfaces:
  - claude-code
  principle:
  - 確かめる
  why_then: 0.2.44 で think・think harder・ultrathink と書いて考える量を頼めるようになり、1.0.8（2025-06-02）で英語以外の言語でも思考を起動できるようになった。effort の段を選ぶ手段がまだなく、言葉で考える量を変えるのが公式のやり方だった。段階のキーワードがいつ外れたかは、一次資料に版の記述がない。変わった時期に書いた 2.1.68 は、ultrathink だけが戻った版である。
  how_to_find: CLAUDE.md・スキル・保存した頼み方で、think hard・think harder・「熟考」「よく考えて」などを探す。effort を上げる働きはないので、深く考えさせたいターンは ultrathink か effort で頼む。/doctor prompt-audit（2.1.283 以上）は、古いモデル向けに書いた指示を洗い出す。
  sources:
  - cc-changelog
  - cc-docs-changelog
  - cc-docs-model-config
  - cc-docs-best-practices
  - cc-docs-memory
  checked: '2026-11-04'
  note: 日本語の語が当時の思考の段階に当たったことは、1.0.8 の「英語以外の言語で思考を起動できるようにした」で確かめた。どの語がどの段に当たったかは一次資料で確かめていない
- id: important-caps
  title: IMPORTANT や YOU MUST で強調すれば守られる
  now: 強調せず、ふつうの言葉で書く。それでも守られないなら、ファイルが長すぎて埋もれていないかを見て短くするか、例外を許さない規則ならフックか deny ルールにする。強調を重ねると、Claude が規則を当てはめすぎる原因にもなる。
  changed:
    date: '2026-10-27'
    approx: true
    note: Best practices の改稿で「What you can stop doing」の表に入った（Internet Archive の写しで 2026-10-26 19:44 UTC の版になく、10-27 08:15 UTC の版にある）
  status: 撤回
  surfaces:
  - app
  - claude-code
  - api
  principle:
  - 縛る
  why_then: 以前のモデルは、強調しないと指示を落とすことがあった。改稿前の Best practices も、守られない 1 行にだけ IMPORTANT などの強調を付けるよう勧めていた（多くの行を強調すると、どれも目立たなくなるとも書いていた）。
  how_to_find: CLAUDE.md・rules・スキルで、IMPORTANT・YOU MUST・NEVER・全部が大文字の行を探す。/doctor prompt-audit（2.1.283 以上）は、古いモデル向けに書いた指示や食い違う指示を洗い出す。
  sources:
  - cc-docs-best-practices
  - wb-cc-best-practices-2026-10-26
  - wb-cc-best-practices-2026-10-27
  - cc-docs-memory
  checked: '2026-11-04'
- id: yolo-skip-permissions
  title: --dangerously-skip-permissions で YOLO 運用
  now: ふだんの対話は auto モード（今の既定）にし、サンドボックスを重ねる。bypassPermissions（--dangerously-skip-permissions と同じ）は、使い捨てのコンテナや VM の中だけで使う。permissions.blockWritesOutsideWorkingDirectories（2.1.314 以上）は、bypass でも Write・Edit・NotebookEdit が作業ディレクトリの外に書くのを止める。ただしシェルのコマンドは止めないので、隔離の代わりにはならない。
  changed:
    date: '2026-08-14'
    until: '2026-09-28'
    note: auto モードが既定になった時期（2026-08-14 から Pro・Max・Team の新しいセッション、2.1.283〜2.1.284 で対話のセッション全体）。auto モードは 2.1.111（2026-04-16）で --enable-auto-mode なしに使えるようになった
    label: 始まり：Pro・Max・Team の新しいセッションで auto モードが既定になった日。終わり：対話のセッション全体で既定になった日
  status: 置換
  surfaces:
  - claude-code
  principle:
  - 縛る
  why_then: auto モードが使えるようになる前は、確認なしに長い作業を進める手段が、allow ルールを積み上げるか、bypass で確認をすべて飛ばすかしかなかった。
  how_to_find: --dangerously-skip-permissions・--allow-dangerously-skip-permissions・bypassPermissions を探す。探す場所は、シェルの alias・スクリプト・CI の設定・settings.json。コンテナや VM の外で使っていたら、auto モードとサンドボックスに替える。
  sources:
  - cc-docs-permission-modes
  - cc-docs-settings-reference
  - cc-changelog
  - cc-docs-changelog
  - claude-blog-auto-mode-default
  checked: '2026-11-04'
- id: approve-everything-first
  title: 最初は毎回承認を求められる
  now: 何も設定していなければ、ターミナルと VS Code の対話のセッションは auto モードで始まる（2.1.283 以上）。毎回確かめたいなら、permissions.defaultMode を default（表示は Manual）にするか、--permission-mode manual で起動する。claude -p と Agent SDK は、決めていなければ Manual で動く。
  changed:
    date: '2026-08-14'
    until: '2026-09-28'
    version: 2.1.283
    note: 2026-08-14 から Pro・Max・Team の新しいセッション（文書では 2.1.228 以上で、機能フラグを取得するセッション）。文書は 2.1.283 を、どのプランと提供元でも auto モードで始まる境とする。CHANGELOG では 2.1.283（09-25）が他社の基盤とテレメトリを切ったセッション、2.1.284（09-28）がすべてのプランと提供元
    label: 始まり：Pro・Max・Team の新しいセッションで auto モードが既定になった日。終わり：どのプランと提供元でも既定になった日。2.1.283 は、公式の文書が既定の境とする版
  status: 撤回
  surfaces:
  - claude-code
  principle:
  - 縛る
  why_then: 既定の権限モードが default（今の表示は Manual）だったころは、読み取り以外の操作のたびに確認が出た。
  how_to_find: 記事や社内の手順書が「最初はすべて確認が出るので承認していく」前提で書かれていないかを見る。起動したときのモードは、画面の下の表示（auto mode on・manual mode on など）で分かる。
  sources:
  - cc-docs-permission-modes
  - cc-changelog
  - cc-docs-changelog
  - claude-blog-auto-mode-default
  checked: '2026-11-04'
  note: 表示の名前の変更（default から Manual）は names の default-to-manual-mode
- id: save-context-for-200k
  title: 200k を前提にコンテキストを最優先で節約する
  now: 今の多くのモデルは 1M トークンのコンテキストウィンドウを持ち、圧縮も自動なので、溢れることはまれになった。関係のない作業に移るときの /clear は、答えの質とコストのために今も勧められる。大きな会話（既定で 200K トークン以上）を 1 時間ほど放置すると、プロンプトキャッシュが切れる前に要約される（idle compaction）。ターミナルは 2.1.299、VS Code と Desktop の Code タブは 2.1.314 から働き、idleCompaction を false にするか /config で止められる。
  changed:
    date: '2026-10-27'
    approx: true
    note: Best practices の改稿で「What you can stop doing」の表に入った。Claude Code の既定のモデルが 1M の窓を持つのは、Sonnet 5 が既定になった 2.1.197（2026-06-30）から
  status: 条件付き
  surfaces:
  - claude-code
  principle:
  - 見せる
  why_then: 窓が 200K トークンだったころは長い作業で埋まりやすく、改稿前の Best practices も「窓はすぐ埋まり、埋まるほど性能が落ちる」という制約から多くの勧めを導いていた。
  how_to_find: CLAUDE.md や手順書で、窓を節約するための決まり（毎回要約させる、ファイルを読ませない、など）を探す。今の窓の使い方は /context で見る。
  sources:
  - cc-docs-best-practices
  - wb-cc-best-practices-2026-10-26
  - wb-cc-best-practices-2026-10-27
  - cc-changelog
  - cc-docs-changelog
  - cc-docs-settings-reference
  checked: '2026-11-04'
- id: architecture-in-claude-md
  title: アーキテクチャやファイル構成を CLAUDE.md に書く
  now: Claude はリポジトリを自分で読むので、構成やファイルの並びは書かない。書くのは、リポジトリを読んでも分からないこと（推測できない理由・決まり・落とし穴）だけにする。
  changed:
    date: '2026-10-27'
    approx: true
    note: Best practices の改稿で「What you can stop doing」の表に入った（important-caps と同じ改稿）
  status: 撤回
  surfaces:
  - claude-code
  principle:
  - 見せる
  why_then: 公式の Best practices は、「もうやめてよい助言」の表の助言はどれも書かれた当時はよい助言で、多くはモデルがまだ確実にできなかったことの回避策だったとする。この行がどの回避策に当たるかは、公式は書いていない。構成を書いておけば Claude が毎回リポジトリをたどらずに全体をつかめた、というのはここでの推測である。改稿の前の版（2026-10-26 の写し）も、コードを読めば分かることとファイルごとの説明は CLAUDE.md に書かないものに、プロジェクト固有のアーキテクチャの判断は書くものに挙げていた。
  how_to_find: CLAUDE.md のディレクトリの木、ファイルの一覧、使っているフレームワークの説明を探す。/doctor は、コードから分かる中身を削る案を出す。
  sources:
  - cc-docs-best-practices
  - wb-cc-best-practices-2026-10-26
  - wb-cc-best-practices-2026-10-27
  checked: '2026-11-04'
- id: keep-going-dont-be-lazy
  title: 「keep going」「don't be lazy」と書く
  now: こうした一言は消す。今のモデルは合意した作業を言われなくても続け、この手の文はやりすぎの原因になりやすい。代わりに、通すべきテストのような確かめる手段を渡す。途中で止まったら continue と言い、誰も見ていない実行は /goal か Stop フックで続けさせる。
  changed:
    date: '2026-10-27'
    approx: true
    note: Best practices の改稿で「What you can stop doing」の表に入った（important-caps と同じ改稿）
  status: 撤回
  surfaces:
  - app
  - claude-code
  - api
  principle:
  - 確かめる
  why_then: 以前のモデルは長い作業の途中で止まりやすく、続けるよう促す一言が効いた。公式の Best practices は、「もうやめてよい助言」の表の助言の多くはモデルがまだ確実にできなかったことの回避策だったとする。
  how_to_find: CLAUDE.md・スキル・繰り返す頼み方で、keep going・don't stop・don't be lazy・loop until done・「最後までやり切れ」などを探す。
  sources:
  - cc-docs-best-practices
  - wb-cc-best-practices-2026-10-26
  - wb-cc-best-practices-2026-10-27
  - cc-docs-goal
  checked: '2026-11-04'
- id: add-double-check
  title: 「最後に double-check して」と書き足す
  now: 確かめる手段（テスト・型の検査・照らす基準）を渡す。Opus 5 は自分の作業を言われなくても確かめるので、「見直して」「double-check して」や、確かめ役のサブエージェントを使わせる指示は消す（確かめすぎでトークンと時間が増える）。Opus 5.5 の公式の手引きは、Opus 5 の頼み方を出発点として使えるとするので、同じ扱いから始め、自分の作業で比べる。ほかのモデルでは、終わる前に基準と照らして確かめるよう頼むのは今も効く。
  changed:
    date: '2026-07-24'
    note: Claude Opus 5 の公開の日。Opus 5 の頼み方の手引きが、確かめる指示を消すよう書く。Opus 5.5 の手引きも、Opus 5 の型は出発点として使えると書く
  status: 条件付き
  surfaces:
  - app
  - claude-code
  - api
  principle:
  - 確かめる
  why_then: 自分の答えを見直させる一言で、コードや計算の誤りが減った。今の Prompting best practices も、多くのモデルにはこの頼み方を勧め、Opus 5 を例外とする。
  how_to_find: システムプロンプト・CLAUDE.md・スキルで、double-check・re-verify・「最後に見直して」・「確かめ役のサブエージェントを使え」を探し、使うモデルを確かめる。Opus 5 と Opus 5.5 は、一言を消して比べることから始める。ほかのモデルは残してよい。
  sources:
  - api-docs-prompting-opus-5
  - api-docs-prompting-opus-5-5
  - api-docs-prompting-best-practices
  - api-release-notes
  checked: '2026-11-04'
- id: tell-it-to-use-subagents
  title: 「subagent を使え」と書き足す
  now: 書き足さない。サブエージェントに任せるのは、大きく、本当に独立していて並べられる作業だけにする。同じ作業をサブエージェントに渡しても答えはよくならない（よくなるのは、書く過程を見ていない別のレビューを頼むとき）。Claude Code では CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH と CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS で数を縛れる。
  changed:
    date: '2026-07-24'
    until: '2026-10-27'
    note: Opus 5 の頼み方の手引き（2026-07-24 の公開）が委任のしすぎを抑えるよう書き、Best practices の改稿（2026-10-27 ごろ）が「よい答えのためにサブエージェントに任せる」を古い助言の表に入れた
    label: 始まり：Opus 5 の頼み方の手引きの公開日。終わり：Best practices の改稿の日
  status: 撤回
  surfaces:
  - claude-code
  see_also:
  - subagent-per-step
  - subagents-to-save-context
  principle:
  - 見せる
  why_then: 以前のモデルは自分からはあまり委任しなかった。Opus 5 は、以前のモデルより進んで委任する（Opus 5 の頼み方の手引き）。
  how_to_find: CLAUDE.md・スキル・システムプロンプトで、「subagent を使え」「並べて調べさせよ」などの一言を探す。/usage でサブエージェントの種類ごとの使用量を見て、元が取れているかを確かめる。
  sources:
  - api-docs-prompting-opus-5
  - cc-docs-best-practices
