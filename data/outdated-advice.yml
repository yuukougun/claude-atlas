- id: styles-for-tone
  title: スタイル（Styles）で応答の調子と形式を切り替える
  now: いつも同じ調子にするなら、全会話に効く Claude への指示（設定の Instructions）に書く。場面ごとに切り替えるならスキルにする。自分で作ったスタイルは移行でスキルになり、名前から作られるスラッシュコマンド（/<名前>-style）で呼ぶ。既定の Learning はスキルとして残った。
  changed:
    date: '2026-06-01'
    note: スタイルからスキルへの移行の告知の日。既定の Concise・Explanatory・Formal はなくなり、移行が終わるとスタイルのメニューは出なくなる。告知の記事は 2026-11-04 には取り下げられている（Internet Archive の写しで読んだ）
  status: 置換
