# 工程6b の下書き（担当 D4）：第一波のページ（136。tools/check_catalog.py の数え方）ごとに、使える一次資料の sources の id
# - 執筆者に渡す一覧。id は planning/batches/step6/data/D4.yml・D1.yml・D2.yml の sources にある（メインが data/ にまとめた後は
#   data/sources.yml）
# - 作り方：目次の materials の各項目を調査資料（planning/research/）の節・表の行・項目にたどり、そこにある URL を集めた。
#   工程2の報告（research/22〜28）は、表の行の「出典」の欄と「使った一次資料」の一覧の名前・S 番号・使った項目からも拾った。
#   照合の一覧（11）の論点（p12#・p34#・p56#）は、照合のノートの「章」と「主な出典」から補完調査（10）の章のリンクを拾った。
#   説明つきの参照（「00 §1（…の段落）」など）は、当たる段落・行に絞った
# - 除いたもの：注記・訂正の付いた主張の根拠にだけ出てくる URL、開けなかった URL、AI の利用を断るドメイン（報告の §5）
# - 並び：公式文書 → CHANGELOG → リリースノート → 公式ブログ → 研究 → 実践者 → 報道（同じ種類の中は id の順）
# - 一覧は「materials がたどる節にある出典」で、ページの本文に全部を使うという意味ではない。値は執筆の時に一次資料で確かめる
