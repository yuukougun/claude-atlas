     kind: 公式文書, publisher: Anthropic, lang: en, checked: 2026-11-04,
     note: "「Context cost by feature」の表（When it loads・What loads・Context cost）と比較のタブ"}
  - {id: cc-docs-features-overview-ja, url: "https://code.claude.com/docs/ja/features-overview", title: Claude Code を拡張する,
