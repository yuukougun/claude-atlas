# 工程6b の下書き（担当 D1）：features のうち Claude Code の機能（planning/catalog/features.yaml の
# 「Claude Code の文脈と指示」「Claude Code の縛り」「Claude Code の操作」「Claude Code の任せ方」「Claude Code の面」の 65 件）
# - 形は data/facts.yml の features と data/sources.yml の domains・sources（schema/facts.schema.json・sources.schema.json）。
#   メインが data/ にまとめる。報告は planning/batches/step6/data-D1.md
# - 確認日は 2026-11-04（code.claude.com の英語版と日本語版、GitHub の CHANGELOG を 2.1.318 まで読んだ）
# - load_timing と context_cost の値は、公式の Extend Claude Code の「Context cost by feature」の表（日本語版は
#   「機能別のコンテキストコスト」）の列から決めた語彙（報告の §3.1。メインが site.yml の load_timings・context_costs に足す）:
#     load_timings:  [セッション開始, セッション開始と切り替えたとき, セッション開始か、一致するファイルを扱うとき,
#                     セッション開始と使うとき, 編集の後と調べるとき, 起動したとき, イベントが起きたとき]
#     context_costs: [常駐, 常駐か、一致するファイルのときだけ, 使うまで小さい, 小さい, 分離,
#                     ゼロ（出力を返さない限り）, ゼロ]
# - 成熟度は、公式の文書が research preview・beta・experimental と書くものだけをそれにし、書いていないものは GA にした
# - 強制力は、公式が「指示であり強制しない」と書くものをお願い、Claude Code・OS・決定論のコードが止めるものを鍵にした。
#   別のモデルが判断するもの（auto モードの分類器・/goal の判定・prompt と agent の型のフック）は鍵に数えない
#   （catalog の enforce.yaml の request-lock-table の notes と同じ立場）。どちらとも言えない機能には書かない
# - volatility は、GA の機能を中（機能の使い方の層。requirements §6.1）にし、research preview・beta・experimental は
#   省いた（既定の高）。fast mode はモデルによって research preview が残るので省いた

features:
  # ---- Claude Code の文脈と指示 ----
  - id: claude-md
    title: CLAUDE.md
    page: what-to-put-in-claude-md
    surfaces: [claude-code]
    maturity: GA
    enforcement: お願い
    load_timing: セッション開始
    context_cost: 常駐
    survives_compaction: true
    match_terms: [CLAUDE.md, CLAUDE.local.md, claudeMdExcludes, /init, /memory, AGENTS.md, "@path import"]
    sources: [cc-docs-memory, cc-docs-features-overview, cc-docs-features-overview-ja, cc-docs-context-window]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      公式は CLAUDE.md を強制する設定ではなく文脈として扱うと書く（Claude treats them as context, not enforced
      configuration）。読み込みは作業ディレクトリから上の階層の分がセッション開始で、サブディレクトリの CLAUDE.md は
      Claude がそのディレクトリのファイルを読み書きしたときに読み込まれる。圧縮で残るのはプロジェクトの根の CLAUDE.md
      （ディスクから入れ直す）で、入れ子の CLAUDE.md は要約に消え、必要になったときに読み直される。入った版は CHANGELOG の
      最も古い版より前なので書かない

  - id: rules
    title: "rules（.claude/rules/）"
    page: path-scoped-rules
    surfaces: [claude-code]
    maturity: GA
    enforcement: お願い
    load_timing: セッション開始か、一致するファイルを扱うとき
    context_cost: 常駐か、一致するファイルのときだけ
    survives_compaction: true
    since: {claude_code: 2.0.64, date: 2025-12-10}
    match_terms: [.claude/rules, "paths frontmatter", path-scoped rules, conditional rules, InstructionsLoaded]
    sources: [cc-docs-memory, cc-docs-features-overview-ja, cc-docs-context-window, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      paths のない rules は .claude/CLAUDE.md と同じ扱いでセッション開始に読み込まれ、圧縮の後もディスクから入れ直される。
      paths のある rules は一致するファイルを扱うときだけ読み込まれ、圧縮では要約に消えて、一致するファイルを再び扱うと
      読み直される（公式は、圧縮を越えて残すなら paths を外すか根の CLAUDE.md に移すよう勧める）。読み込みの時期は
      公式の比較のタブ（CLAUDE.md とルールとスキル）の「すべてのセッション、または一致するファイルが開かれたとき」から。
      コンテキストのコストは公式の表に行がないので memory のページの記述から決めた。強制力は CLAUDE.md と同じ扱いの指示
      であることから

  - id: auto-memory
    title: 自動メモリ（auto memory）
    page: using-auto-memory
    surfaces: [claude-code]
    maturity: GA
    enforcement: お願い
    load_timing: セッション開始
    context_cost: 常駐
    survives_compaction: true
    since: {claude_code: 2.1.59, date: 2026-02-26}
    match_terms: [auto memory, auto-memory, MEMORY.md, autoMemoryEnabled, autoMemoryDirectory, /memory]
    sources: [cc-docs-memory, cc-docs-context-window, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      セッション開始に読み込むのは MEMORY.md の頭の部分だけで（行数と大きさの上限は facts に置く）、話題ごとのファイルは
      Claude が必要なときに読む。公式は CLAUDE.md と同じく強制する設定ではなく文脈と書く。圧縮の後はディスクから入れ直す。
      ローカルのセッションでは既定で有効

  - id: skills
    title: スキル（skills）
    page: writing-skills
    surfaces: [claude-code]
    maturity: GA
    enforcement: お願い
    load_timing: セッション開始と使うとき
    context_cost: 使うまで小さい
    survives_compaction: true
    since: {claude_code: 2.0.20, date: 2025-10-16}
    match_terms: [skill, skills, SKILL.md, Skill tool, disable-model-invocation, skillOverrides, skillListingBudgetFraction,
                  .claude/commands, custom commands, bundled skills]
    sources: [cc-docs-skills, cc-docs-features-overview, cc-docs-features-overview-ja, cc-docs-context-window, cc-changelog,
              cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      名前と説明はセッション開始から毎回入り、本体は呼ばれたときに入る。disable-model-invocation: true のスキルは呼ぶまで
      何も入らない。公式は「CLAUDE.md やスキルの指示はお願いで、保証ではない」と書く。圧縮の後、説明は今のスキルから
      作り直して入れ直し（2.1.304 以降）、呼んだスキルの本体は上限つきで入れ直す（古いものから外れる）。カスタムコマンド
      （.claude/commands/）はスキルにまとめられた

  - id: subagents
    title: サブエージェント（subagents）
    page: writing-subagents
    surfaces: [claude-code]
    maturity: GA
    load_timing: 起動したとき
    context_cost: 分離
    since: {claude_code: 1.0.60, date: 2025-07-24}
    match_terms: [subagent, subagents, Agent tool, /agents, .claude/agents, --agents, fork, omitClaudeMd, SubagentStop]
    sources: [cc-docs-sub-agents, cc-docs-features-overview, cc-docs-features-overview-ja, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      起動したときに自分のシステムプロンプト・指定したスキル・CLAUDE.md と git status（組み込みの Explore と Plan は
      どちらも持たない）で新しい文脈を作る。fork は親の会話を引き継ぐ。メインの会話が圧縮されてもサブエージェントの記録は
      影響を受けない。強制力は、定義の指示（お願い）と道具の制限（tools・disallowedTools）が混ざるので書かない

  - id: agent-teams
    title: エージェントチーム（agent teams）
    page: agent-teams
    surfaces: [claude-code]
    maturity: experimental
    load_timing: 起動したとき
    context_cost: 分離
    since: {claude_code: 2.1.32, date: 2026-02-05}
    match_terms: [agent teams, agent team, teammate, CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS, --teammate-mode, TeammateIdle,
                  TaskCompleted]
    sources: [cc-docs-agent-teams, cc-docs-agents, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      公式の文書は「experimental で既定では無効」と書き、CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1 で有効にする。2.1.32 の
      CHANGELOG は「research preview」として入れたと書く（呼び方が違う。今の文書の experimental にした）。チームメイトは
      それぞれ自分のコンテキストウィンドウを持ち、起動したときに CLAUDE.md・MCP サーバー・スキルを読み込む。トークンの
      使用量はチームメイトの数に応じて増える

  - id: output-styles
    title: 出力スタイル（output styles）
    page: output-style-modes
    surfaces: [claude-code]
    maturity: GA
    enforcement: お願い
    load_timing: セッション開始と切り替えたとき
    context_cost: 常駐
    survives_compaction: true
    since: {claude_code: 1.0.81, date: 2025-08-14}
    match_terms: [output style, output styles, outputStyle, /output-style, keep-coding-instructions, force-for-plugin]
    sources: [cc-docs-output-styles, cc-docs-features-overview, cc-docs-features-overview-ja, cc-docs-context-window,
              cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      公式は「Claude が従う指示で、何も強制しない」と書く。Default のスタイルでは何も読み込まない。圧縮の後もシステム
      プロンプトとともにそのまま効く。2.0.30 でいったん非推奨になり、2.0.32 で非推奨を取り消した（CHANGELOG）

  - id: mcp
    title: MCP
    page: connecting-mcp
    surfaces: [claude-code]
    maturity: GA
    load_timing: セッション開始
    context_cost: 使うまで小さい
    match_terms: [MCP, MCP server, claude mcp, /mcp, .mcp.json, tool search, MCP_TIMEOUT]
    sources: [cc-docs-mcp, cc-docs-features-overview, cc-docs-features-overview-ja, cc-docs-how-claude-code-works]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      セッション開始に入るのはツールの名前とサーバーの指示だけで、JSON のスキーマは使うときまで遅らせる（ツール検索が
      既定で有効。Microsoft Foundry の Azure の配置などでは使えない）。圧縮で残るかは公式の圧縮の表に行がないので書かない。
      入った版は CHANGELOG の最も古い版のころからあるので書かない。アプリのコネクタ（connectors）と API の MCP connector は
      別の項目

  - id: plugins
    title: プラグイン（plugins）
    page: plugins-and-marketplaces
    surfaces: [claude-code]
    maturity: GA
    load_timing: セッション開始と使うとき
    context_cost: 使うまで小さい
    since: {claude_code: 2.0.12, date: 2025-10-09}
    match_terms: [plugin, plugins, /plugin, claude plugin, plugin.json, --plugin-dir, /reload-plugins, enabledPlugins]
    sources: [cc-docs-plugins-overview, cc-docs-plugins-measure, cc-docs-features-overview, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      プラグインはスキル・エージェント・フック・MCP サーバーなどを束ねる層で、時期とコストは中身による。有効にした
      プラグインのスキル・エージェント・コマンドの名前と説明が毎回入り、本体は使うときに入る（公式の Measure plugin cost）。
      フックはモデルの文脈のコストを持たない

  - id: marketplaces
    title: マーケットプレイス（plugin marketplaces）
    page: plugins-and-marketplaces
    surfaces: [claude-code]
    maturity: GA
    since: {claude_code: 2.0.12, date: 2025-10-09}
    match_terms: [marketplace, marketplaces, marketplace.json, /plugin marketplace, claude plugin marketplace,
                  extraKnownMarketplaces, strictKnownMarketplaces]
    sources: [cc-docs-plugins-create-marketplace, cc-docs-plugins-overview, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      プラグインの一覧（marketplace.json）を配る仕組みで、それ自体は文脈に入らない。組織は管理設定の
      strictKnownMarketplaces で使えるマーケットプレイスを絞れる

  - id: statusline
    title: ステータスライン（status line）
    page: usage-context-statusline
    surfaces: [claude-code]
    maturity: GA
    context_cost: ゼロ
    since: {claude_code: 1.0.71, date: 2025-08-07}
    match_terms: [status line, statusLine, /statusline]
    sources: [cc-docs-statusline, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      公式は「ステータスラインはローカルで動き、API のトークンを使わない」と書く。設定したシェルのスクリプトがセッションの
      JSON を受け取って表示するだけで、文脈に入らない（読み込みの時期は書かない）

  - id: mods
    title: Mods（プラグインの hooks module）
    page: mods
    surfaces: [claude-code]
    maturity: GA
    enforcement: 鍵
    since: {claude_code: 2.1.287, date: 2026-10-01}
    match_terms: [mod, mods, Claude Mods, hooks module, allowManagedModsOnly, /plugin-authoring,
                  CLAUDE_CODE_ENABLE_FUNCTION_HOOKS]
    sources: [cc-docs-mods-overview, cc-docs-mods-admin, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      プラグインに入れる JavaScript か TypeScript の関数で、Claude Code の中で動き、ツールの呼び出しを止める・書き換える・
      代わりに答えることができる（公式は組織の方針を自作の mod で強制する方法も書く）ので鍵にした。既定で有効で、成熟度の
      表記はない。端末は 2.1.287 以降、Desktop アプリは 2.1.286 以降。--safe-mode・disableAllHooks で止まる（組み込みの
      mod は止まらない）。文脈のコストは公式に記述がないので書かない

  - id: code-intelligence
    title: code intelligence プラグイン（LSP）
    page: code-intelligence-plugins
    surfaces: [claude-code]
    maturity: GA
    load_timing: 編集の後と調べるとき
    context_cost: 小さい
    since: {claude_code: 2.0.74, date: 2025-12-19}
    match_terms: [LSP, LSP tool, code intelligence, language server, lspServers]
    sources: [cc-docs-code-intelligence, cc-docs-features-overview, cc-docs-features-overview-ja, cc-changelog,
              cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      編集の後に型の誤りと警告を、シンボルを調べたときに定義・参照・型の情報を返す。公式は、シンボルの検索が広いファイルの
      読み込みを置き換えるので、全体の文脈の使用は減りうると書く。LSP の道具は言語のプラグインを入れるまで働かない。
      2.0.74 で LSP の道具が入った

  - id: plugin-eval
    title: claude plugin eval（スキルとプラグインの評価）
    page: measure-changes
    surfaces: [claude-code]
    maturity: GA
    since: {claude_code: 2.1.269, date: 2026-09-11}
    match_terms: [claude plugin eval, plugin eval, plugin eval init, experimental.evals, no-plugin baseline]
    sources: [cc-docs-plugin-evals, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      シェルのコマンドで、プラグインの有り無し（no-plugin baseline）を比べて採点する。git がある環境では git 2.31 以降が
      要る。実行と judge の採点はどれも実際のモデルの呼び出しで、プランの使用量か API の請求に数える。マニフェストの
      experimental.evals のキーは形が変わりうる（機能そのものに成熟度の表記はない）。主のページは feature の型のページが
      ないので、tracks に持つ唯一のページ（eval の recipe）にした

  # ---- Claude Code の縛り ----
  - id: hooks
    title: フック（hooks）
    page: hooks-basics
    surfaces: [claude-code]
    maturity: GA
    enforcement: 鍵
    load_timing: イベントが起きたとき
    context_cost: ゼロ（出力を返さない限り）
    survives_compaction: true
    since: {claude_code: 1.0.38, date: 2025-06-30}
    match_terms: [hook, hooks, /hooks, PreToolUse, PostToolUse, Stop hook, SessionStart, PreCompact, PostCompact,
                  disableAllHooks, allowManagedHooksOnly]
    sources: [cc-docs-hooks-guide, cc-docs-features-overview, cc-docs-features-overview-ja, cc-docs-context-window,
              cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      公式は「例外なく守らせる規則はフックに置く。CLAUDE.md やスキルの指示はお願いで、PreToolUse のフックで止めるのが
      強制」と書く。鍵に数えるのはコマンドなどの決定論のフックで、prompt と agent の型は別のモデルが判断する（agent の型は
      experimental）。フックは会話の外で動くので圧縮の後も働く。フックが前に足した文脈は要約に入り、compact の
      SessionStart フックで圧縮の後に文脈を入れ直せる

  - id: permissions
    title: 権限（permissions）
    page: permission-rules
    surfaces: [claude-code]
    maturity: GA
    enforcement: 鍵
    survives_compaction: true
    match_terms: [permission, permissions, /permissions, allow rule, ask rule, deny rule, permissions.allow,
                  permissions.ask, permissions.deny, additionalDirectories]
    sources: [cc-docs-permissions, cc-docs-permission-modes]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      公式は「権限ルールはモデルではなく Claude Code が強制する。プロンプトや CLAUDE.md の指示は Claude が試みることを
      変えるが、許すことは変えない」と書く。deny はどのモードでも（bypassPermissions でも）止める。会話で言った境界は
      圧縮で消えうるので、確かな保証には deny ルールを足すよう公式が勧める（設定にあるルールは圧縮の影響を受けない）。
      入った版は古いので書かない

  - id: permission-modes
    title: 権限モード
    page: permission-modes-overview
    surfaces: [claude-code]
    maturity: GA
    enforcement: 鍵
    match_terms: [permission mode, permission modes, defaultMode, --permission-mode, Manual mode, acceptEdits, dontAsk,
                  bypassPermissions, --dangerously-skip-permissions, Shift+Tab]
    sources: [cc-docs-permission-modes, cc-docs-permissions]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      どの操作を確認なしに通すかを Claude Code が決める基準（Manual は設定の値で default）。その上に権限ルールを重ねる。
      auto モードの分類器の判断は別の項目（auto-mode）で、鍵に数えない。2.1.283 以降は、どのプランと事業者でも、対話の
      端末と VS Code のセッションの既定の開始モードが auto（-p と Agent SDK は Manual）。入った版は古いので書かない

  - id: auto-mode
    title: auto モード
    page: what-auto-mode-stops
    surfaces: [claude-code]
    maturity: GA
    match_terms: [auto mode, autoMode, autoMode.environment, classifier, disableAutoMode, /auto-mode-setup,
                  claude auto-mode, PermissionDenied, useAutoModeDuringPlan]
    sources: [cc-docs-permission-modes, cc-docs-auto-mode-config, cc-docs-feature-availability, cc-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      別の分類器のモデルが操作を実行の前に見て、範囲を超えるものや知らない基盤に向かうものを止める。deny と明示の ask の
      ルールは分類器より先に効く。公式は「確認を減らすが安全を保証しない」と書き、分類器の判断は決定論ではないので強制力は
      書かない。会話で言った境界は記録から読み直すので、圧縮でその発言が消えると効かなくなりうる（確かな保証は deny
      ルール）。今の文書に成熟度の表記はなく、2.1.283 以降は対話の端末と VS Code の既定の開始モード。CHANGELOG に追加の
