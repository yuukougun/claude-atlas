      今のブランチと origin の既定のブランチとの差分を、注入・認証・データの露出などの脆弱性の点で見る組み込みの
      コマンド。origin のリモートが要る。セキュリティの別の道具（security-guidance・Claude Security のプラグイン）とは別。
      主のページは feature の型のページがないので、別名に /security-review と節「セキュリティのレビューを頼む」を持つ
      verify の concept のページにした。入った版は書かない

  # ---- Claude Code の任せ方 ----
  - id: goal
    title: /goal
    page: goal-until-done
    surfaces: [claude-code]
    maturity: GA
    since: {claude_code: 2.1.139, date: 2026-05-11}
    match_terms: [/goal, goal]
    sources: [cc-docs-goal, cc-docs-commands, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      完了の条件を決めると、各ターンの後にモデルが条件を満たしたかを判定し、満たすまで次のターンを続ける。判定は
      モデルなので強制力は書かない。対話・-p・Remote Control で動く

  - id: loop
    title: /loop
    page: loop-and-scheduling
    surfaces: [claude-code]
    maturity: GA
    since: {claude_code: 2.1.71, date: 2026-03-07}
    match_terms: [/loop, CronCreate, cron, CLAUDE_CODE_DISABLE_CRON]
    sources: [cc-docs-scheduled-tasks, cc-docs-commands, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      開いているセッションの中で、プロンプトを間隔をおいて繰り返す（間隔を省くと Claude が決める）バンドルのスキル。
      セッションを閉じると止まり、--resume で一部が戻る。クラウドで動く予定のタスクとは別（scheduled-tasks）

  - id: scheduled-tasks
    title: 予定のタスク（scheduled tasks）
    page: cloud-schedules
    surfaces: [claude-code]
    maturity: research preview
    match_terms: [scheduled tasks, scheduled task, /schedule, routines, routine, /routines, claude.ai/code/routines,
                  experimental-cc-routine-2026-04-01]
    sources: [cc-docs-routines, cc-docs-scheduled-tasks, cc-docs-desktop-scheduled-tasks, cc-docs-feature-availability]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      クラウドの予定のタスク（旧名 routines）は Anthropic のクラウドで動き、予定・API・GitHub のイベントで起動する。
      公式は research preview と書く。Desktop の予定のタスクは自分の機械で動く。Claude のサブスクリプション（Pro・Max・
      Ultra・Team・Enterprise）が要る。旧名からの改名は names の範囲（D3）。主のページはクラウドの定期タスクのページにした
      （/loop は loop）。入った版は書かない

  - id: workflows
    title: ワークフロー（workflows）
    page: dynamic-workflows
    surfaces: [claude-code]
    maturity: GA
    load_timing: 起動したとき
    context_cost: 分離
    since: {claude_code: 2.1.154, date: 2026-05-28, note: CHANGELOG の「Introducing dynamic workflows」の版（2.1.152 にも Workflow の道具の行がある）}
    match_terms: [dynamic workflows, workflow, /workflows, Workflow tool, ultracode, /workflow-authoring]
    sources: [cc-docs-workflows, cc-docs-agents, cc-docs-tools-reference, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      Claude が書くスクリプトが多数のサブエージェントを背景で動かし、一つの結果を返す。スクリプトは会話と分かれた環境で
      動き、途中の結果は Claude の文脈ではなくスクリプトの変数に残る。すべての有料プランと API などで使え、Pro では
      /config で有効にする。2.1.160 で起動の語が workflow から ultracode に替わった

  - id: worktrees
    title: worktree
    page: parallel-with-worktrees
    surfaces: [claude-code]
    maturity: GA
    since: {claude_code: 2.1.49, date: 2026-02-19, note: --worktree（-w）が入った版}
    match_terms: [worktree, worktrees, --worktree, "-w", "isolation: worktree", .worktreeinclude, WorktreeCreate,
                  worktree.bgIsolation]
    sources: [cc-docs-worktrees, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      並列のセッションを別々の git worktree に分けて、変更がぶつからないようにする。2.1.49 で --worktree（-w）が入り、
      2.1.50 でエージェントの定義の isolation: worktree が入った

  - id: agent-view
    title: agent view
    page: agent-view-and-background
    surfaces: [claude-code]
    maturity: research preview
    since: {claude_code: 2.1.139, date: 2026-05-11}
    match_terms: [agent view, claude agents, background session, --bg, /bg, /background]
    sources: [cc-docs-agent-view, cc-docs-agents, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      背景で動くセッションを一つの画面で出し、状態を見る（claude agents で開く）。公式は research preview と書き、画面と
      キーは変わりうる。2.1.139 で research preview として入った

  - id: cloud-sessions
    title: クラウドのセッション
    page: cloud-sessions-and-teleport
    surfaces: [claude-code]
    maturity: GA
    match_terms: [cloud session, cloud sessions, Claude Code on the web, claude.ai/code, --cloud, --teleport, /teleport]
    sources: [cc-docs-claude-code-on-the-web, cc-docs-feature-availability, cc-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      Anthropic のクラウドでセッションを動かし、ブラウザ・スマホ・Desktop・端末から使う。--cloud と --teleport で
      手元との間で移せる。Pro・Max・Ultra・Team のプランと、Enterprise の該当する席で使え、Claude のサブスクリプションの
      認証が要る。入った版は書かない（2.0.24 の CHANGELOG に Web から CLI への teleport の行がある）

  - id: remote-control
    title: Remote Control
    page: control-from-phone
    surfaces: [claude-code]
    maturity: GA
    match_terms: [Remote Control, /remote-control, /rc, claude remote-control]
    sources: [cc-docs-remote-control, cc-docs-feature-availability, cc-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      手元のセッションをスマホ・タブレット・ブラウザ（claude.ai/code と Claude のモバイルアプリ）から続ける。実行は手元の
      機械に残る。API キーでは使えず、Team と Enterprise では Owner が有効にする。Trusted Devices の部分は beta。入った版は
      CHANGELOG に追加の行がないので書かない

  - id: headless
    title: 非対話モード（claude -p）
    page: headless-basics
    surfaces: [claude-code]
    maturity: GA
    match_terms: ["-p", --print, non-interactive mode, headless, --output-format, --permission-mode]
    sources: [cc-docs-headless, cc-docs-cli-reference, cc-docs-permission-modes]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      claude -p でプロンプトを一つ渡して結果を受け取る（スクリプトと CI 向け）。公式は Agent SDK の CLI として説明する。
      2.1.302 以降、モードを指定しない -p と Agent SDK の実行は Manual で始まり、承認の要る呼び出しは allow ルール・フック
      などで許さない限り拒まれる。入った版は古いので書かない

  - id: github-actions
    title: GitHub Actions
    page: github-actions-with-claude
    surfaces: [claude-code]
    maturity: GA
    match_terms: [GitHub Actions, claude-code-action, "@claude", /install-github-app]
    sources: [cc-docs-github-actions, cc-docs-feature-availability]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      GitHub Actions のワークフローで Claude Code を動かし、@claude のメンションに答えたり issue から PR を作ったりする。
      beta の版（@beta）から v1 への移行の手順が公式にある。Claude Platform on AWS では使えない。入った版は書かない

  - id: cross-session-messaging
    title: セッションの間のメッセージ
    page: agent-view-and-background
    surfaces: [claude-code]
    maturity: GA
    since: {claude_code: 2.1.224, date: 2026-08-07, note: 文書が求める版（macOS と Linux。WSL 2 を含む）。Windows のネイティブは 2.1.234 から。CHANGELOG には 2.1.162 から cross-session messaging の修正の行がある}
    match_terms: [cross-session messaging, SendMessage, /list-agents, /peers, crossSessionInbound]
    sources: [cc-docs-cross-session-messaging, cc-docs-tools-reference, cc-docs-feature-availability, cc-changelog,
              cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      一つのセッションの Claude が、自分のほかのセッションにメッセージを届ける（会話の履歴やファイルは送らない）。要件を
      満たすと何もせずに有効。Claude のサブスクリプションではほかの機械とクラウドのセッションにも届き、ほかの認証では
      同じ機械の中だけ

  - id: code-projects
    title: Claude Code の Projects（並列の threads）
    page: choosing-parallel-modes
    surfaces: [claude-code]
    maturity: beta
    match_terms: [Projects, project, threads, thread]
    sources: [cc-docs-claude-projects, cc-docs-agents]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      claude.ai/code か Desktop アプリの一つの会話で、Claude がタスクごとに並列のセッション（threads）を始める。公式は
      Pro・Max・Ultra のプランの public beta で順に広げていると書き、Team と Enterprise ではまだ使えない。アプリの
      projects とは別の機能。主のページは feature の型のページがないので、tracks に持つ唯一のページ（delegate の
      comparison）にした。入った版は書かない

  - id: batch-command
    title: /batch
    page: batch-and-p-loops
    surfaces: [claude-code]
    maturity: GA
    since: {claude_code: 2.1.63, date: 2026-02-28}
    match_terms: [/batch]
    sources: [cc-docs-commands, cc-docs-agents, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      大きな変更を独立の単位に分けて計画を見せ、承認の後に単位ごとに背景のサブエージェントを worktree で動かすバンドルの
      スキル（単位の数の幅は facts に置く）。API の Message Batches API とは別

  - id: bare-mode
    title: --bare
    page: bare-mode
    surfaces: [claude-code]
    maturity: GA
    since: {claude_code: 2.1.81, date: 2026-03-20}
    match_terms: [--bare, bare mode, CLAUDE_CODE_SIMPLE]
    sources: [cc-docs-cli-reference, cc-docs-headless, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      スクリプトの -p の呼び出し向けに、フック・スキル・カスタムコマンド・サブエージェント・入れたプラグイン・MCP
      サーバー・自動メモリ・CLAUDE.md の自動の探索を飛ばして速く起動し、どの機械でも同じ結果にする。サブスクリプションの
      ログインを使わないので ANTHROPIC_API_KEY などが要る（--safe-mode と違い、認証も変わる）

  - id: auto-continue
    title: 利用上限での自動の継続（autoContinueAtUsageLimit）
    page: how-usage-limits-work
    surfaces: [claude-code]
    maturity: GA
    since: {claude_code: 2.1.234, date: 2026-08-17}
    match_terms: [autoContinueAtUsageLimit, automatic continue, Continue automatically at usage limit,
                  /rate-limit-options, usage limit reached]
    sources: [cc-docs-interactive-mode, cc-docs-settings-reference, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      claude.ai の利用上限で止まった作業を、開いたセッションで待ち、上限が戻った後に自分で続ける。claude.ai の
      サブスクリプションで入った対話のセッションでは既定で有効。背景のセッション・-p・API キーと事業者では使えない。
      続ける回数には上限がある（値は facts に置く）。主のページは feature の型のページがないので、tracks に持ち節
      「上限に当たったとき」を持つ cost の concept のページにした

  - id: monitor-tool
    title: Monitor
    page: progress-logs-for-long-jobs
    surfaces: [claude-code]
    maturity: GA
    since: {claude_code: 2.1.98, date: 2026-04-09}
    match_terms: [Monitor, Monitor tool, monitors, experimental.monitors]
    sources: [cc-docs-tools-reference, cc-docs-sandboxing, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      背景でコマンドを動かし（または WebSocket を開き）、出力の行ごとに Claude に返して途中で反応させる道具。Bash と同じ
      権限ルールが効き、サンドボックスも効く。見張りには期限がある（値は facts に置く）。どのページも tracks に持たないので、
      材料に Monitor を挙げる delegate の recipe を主のページにした（tracks に足す提案は報告の §4）

  - id: managed-code-review
    title: Code Review（管理された自動の PR レビュー）
    page: automated-pr-review
    surfaces: [claude-code]
    maturity: GA
    match_terms: [Code Review, REVIEW.md, "@claude review", Claude GitHub App]
    sources: [cc-docs-code-review, cc-docs-code-review-costs, cc-docs-feature-availability]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      GitHub の PR を Claude が見て、指摘を確かめてから行ごとにコメントする。Team と Enterprise のプラン。Zero Data
      Retention や HIPAA の構成、顧客管理の暗号鍵（CMEK）の組織では使えない。費用はプランの枠とは別に usage credits から
      組織に請求される。入った版は書かない

  - id: ultrareview
    title: /ultrareview
    page: automated-pr-review
    surfaces: [claude-code]
    maturity: research preview
    since: {claude_code: 2.1.111, date: 2026-04-16}
    match_terms: [ultrareview, /ultrareview, /code-review ultra, claude ultrareview]
    sources: [cc-docs-ultrareview, cc-docs-commands, cc-docs-feature-availability, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      クラウドで複数のエージェントが深くレビューし、誤りを確かめてから返す。公式は research preview と書く。今の呼び方は
      /code-review ultra で、/ultrareview は別名（名前の移り変わりは names の範囲）。claude.ai のアカウントでの認証が要る。
      無料の回数の後は usage credits が要る（回数は facts に置く）

  # ---- Claude Code の面 ----
  - id: ide-extensions
    title: IDE の拡張
    page: using-ides
    surfaces: [claude-code]
    maturity: GA
    match_terms: [VS Code, VS Code extension, JetBrains, JetBrains plugin, /ide, IDE]
    sources: [cc-docs-vs-code, cc-docs-jetbrains, cc-docs-feature-availability]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      VS Code の拡張と JetBrains の IDE のプラグイン。どちらもすべての事業者で使える。JetBrains のプラグインは名前と設定の
      画面に [Beta] が付く（VS Code の文書には成熟度の表記がない）。入った版は書かない

  - id: desktop-code
    title: Desktop アプリの Claude Code
    page: claude-code-surfaces
    surfaces: [claude-code]
    maturity: GA
    since: {claude_code: 2.0.51, date: 2025-11-24}
    match_terms: [Claude Code Desktop, Desktop app, Code tab, /desktop, /app]
    sources: [cc-docs-desktop, cc-docs-feature-availability, cc-changelog, cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      Claude の Desktop アプリの Code タブで動く Claude Code。Claude のサブスクリプションが要る（Claude Desktop on 3P は
      別の経路）。Linux の Desktop アプリは beta。主のページは feature の型のページがないので、Desktop の Code タブを別名に
      持つ surfaces の comparison のページにした

  - id: claude-in-chrome
    title: Claude in Chrome
    page: browser-control
    surfaces: [app, claude-code]
    maturity: GA
    since: {claude_code: 2.0.72, date: 2025-12-17, note: Claude Code から使う連携が (Beta) として入った版（CHANGELOG）}
    match_terms: [Claude in Chrome, /chrome, --chrome, Chrome extension]
    sources: [cc-docs-chrome, hc-claude-in-chrome, cc-docs-feature-availability, cc-changelog,
              cc-docs-changelog]
    checked: 2026-11-04
    volatility: 中
    status: 確認済み
    note: >-
      Chrome の拡張で、Chrome のサイドパネル・Cowork・Claude Code から使える（Help Center）。有料のプラン。2.0.72 の
      CHANGELOG は (Beta) と書いたが、今の Claude Code の文書と Help Center の Get started には成熟度の表記がないので GA に
      した

