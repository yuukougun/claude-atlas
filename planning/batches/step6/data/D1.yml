     note: "「機能別のコンテキストコスト」の表（ロード時期・ロード内容・コンテキストコスト）。読み込みの時期とコンテキストのコストの語彙の元"}
  - {id: cc-docs-context-window, url: "https://code.claude.com/docs/en/context-window", title: Explore the context window,
     kind: 公式文書, publisher: Anthropic, lang: en, checked: 2026-11-04, note: "「What survives compaction」の表"}
  - {id: cc-docs-how-claude-code-works, url: "https://code.claude.com/docs/en/how-claude-code-works", title: How Claude Code works,
     kind: 公式文書, publisher: Anthropic, lang: en, checked: 2026-11-04}
  - {id: cc-docs-memory, url: "https://code.claude.com/docs/en/memory", title: How Claude remembers your project,
     kind: 公式文書, publisher: Anthropic, lang: en, checked: 2026-11-04}
  - {id: cc-docs-skills, url: "https://code.claude.com/docs/en/skills", title: Extend Claude with skills, kind: 公式文書,
     publisher: Anthropic, lang: en, checked: 2026-11-04}
  - {id: cc-docs-sub-agents, url: "https://code.claude.com/docs/en/sub-agents", title: Create custom subagents, kind: 公式文書,
     publisher: Anthropic, lang: en, checked: 2026-11-04}
  - {id: cc-docs-agent-teams, url: "https://code.claude.com/docs/en/agent-teams", title: Orchestrate teams of Claude Code sessions,
     kind: 公式文書, publisher: Anthropic, lang: en, checked: 2026-11-04}
  - {id: cc-docs-agents, url: "https://code.claude.com/docs/en/agents", title: Run agents in parallel, kind: 公式文書,
     publisher: Anthropic, lang: en, checked: 2026-11-04}
  - {id: cc-docs-output-styles, url: "https://code.claude.com/docs/en/output-styles", title: Output styles, kind: 公式文書,
     publisher: Anthropic, lang: en, checked: 2026-11-04}
  - {id: cc-docs-mcp, url: "https://code.claude.com/docs/en/mcp", title: Connect Claude Code to tools via MCP, kind: 公式文書,
