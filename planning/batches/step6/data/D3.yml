    principle: [握る, 縛る]
    why_then: 2026-07 まではターミナルから始めるフラグが --remote で、2026-09 までは機能の名前も Claude Code on the web だった。
    how_to_find: "スクリプトや手順書で claude --remote を探し、--cloud に替える。--remote-control は別の機能（手元のセッションを他の端末から操る）なので替えない。"
    sources: [cc-docs-claude-code-on-the-web, cc-docs-cli-reference]
    checked: 2026-11-04
    note: "名前の変更が 2 つある行。時期は機能の名前の web-to-cloud-sessions を引く。フラグの変更は remote-to-cloud-flag（2026-07-03〜07-06）"

  - id: routines-name
    title: "routines で定期実行を作る"
    now: "今の名前は予定のタスク（cloud scheduled tasks）。claude.ai/code/routines か Desktop の Code タブ、CLI の /schedule で作る。一部の画面・URL・/routines の別名・API には旧名が残るが、同じ機能を指す。"
    name: routines-to-scheduled-tasks
    status: 置換
    principle: [縛る, 確かめる]
    why_then: 2026-10-20 ごろまでは、公式の文書の題も画面も routines で、作り方の記事はその名前で書かれた。
    how_to_find: "記事の routine・routines の語を、予定のタスクに読み替える。手元で動く予定（Desktop の予定のタスク、/loop）は別の機能なので、どれを指すかを確かめる。"
    sources: [cc-docs-routines, cc-docs-commands]
    checked: 2026-11-04

  - id: slash-cost-and-stats
    title: "/cost・/stats で使用量を見る"
    now: /usage で見る。/cost と /stats は今も打てる別名で、/usage の該当のタブを開く。
    name: cost-stats-to-usage
    status: 置換
    principle: [確かめる, 見せる]
    why_then: 2.1.118 より前は、費用は /cost、使い方の統計は /stats と、別のコマンドだった。
    how_to_find: "手順書やステータスラインの説明で /cost と /stats を探す。打てば動くので急がないが、新しく書く手順は /usage で書く。"
    sources: [cc-docs-commands, cc-changelog]
    checked: 2026-11-04

  - id: fork-to-branch
    title: "/fork で会話を分岐する"
    now: "会話を分けて別の方向を試すのは /branch。今の /fork は、会話を新しい背景のセッションに写し、元の会話を続ける別の機能（2.1.212 から）。"
    name: fork-renamed-branch
    status: 置換
    principle: [見せる]
    why_then: 2.1.77 より前は、会話の分岐のコマンドの名前が /fork だった。
    how_to_find: "記事や手順書の /fork が、会話の分岐の意味かを見る。分岐の意味なら /branch に読み替える。今の /fork で写したセッションは agent view（claude agents）に並ぶ。"
    sources: [cc-docs-commands, cc-changelog]
    checked: 2026-11-04

  - id: removed-commands
    title: "/vim・/tag・/pr-comments・ultraplan・TaskOutput ツールを使う"
    now: "どれも消えた。Vim の操作は /config の Editor mode で切り替える。PR のコメントは Claude に直接頼んで読ませる。ultraplan の代わりは plan mode。背景の作業の出力は、Claude が Read でその出力のファイルを読む。/tag の代わりの案内は文書にない。"
    changed:
      date: 2026-04-02
      until: 2026-09-18
      note: "/pr-comments は 2.1.91（2026-04-02。公式の文書の記述で、CHANGELOG に行はない）、/vim と /tag は 2.1.92（04-04）、ultraplan は 2.1.222（08-04）、TaskOutput は 2.1.83（03-25）で非推奨、2.1.277（09-18）で削除"
    status: 撤回
    principle: [見せる]
    why_then: どれも消える前の版では公式の機能で、記事や手順書に使い方が書かれた。
    how_to_find: "手順書・スキル・フックの設定で /vim・/tag・/pr-comments・/ultraplan・TaskOutput を探す。フックの matcher に TaskOutput を書いていれば、もう当たらない。"
    sources: [cc-changelog, cc-docs-changelog, cc-docs-commands, cc-docs-tools-reference]
    checked: 2026-11-04
    note: /vim の移った先は names の vim-to-editor-mode

  - id: mcp-sse-transport
    title: "MCP を SSE transport でつなぐ"
    now: "リモートの MCP サーバーは HTTP（Streamable HTTP）でつなぐ（claude mcp add --transport http）。2.1.265 以上は、SSE しか出していないサーバーにも HTTP を先に試してから SSE に切り替える。SSE を直接指定するのは、古い版のときか、HTTP を受け付けないサーバーのときだけ。"
    changed:
      date: 2025-03-26
      note: "MCP の仕様の版 2025-03-26 で、HTTP+SSE の転送が Streamable HTTP に置き換えられた。Claude Code は 1.0.27（2025-06-18）で Streamable HTTP に対応した。公式の文書は SSE の転送を非推奨と書く"
    status: 撤回
    principle: [見せる]
    why_then: "MCP の仕様の版 2024-11-05 では、リモートのサーバーの転送は HTTP+SSE だった。Claude Code も 0.2.54 から SSE に対応していた。"
    how_to_find: ".mcp.json・~/.claude.json・管理設定で、type が sse のサーバーを探し、そのサーバーが HTTP を出しているかを確かめる。"
    sources: [cc-docs-mcp, cc-changelog, cc-docs-changelog, mcp-spec-2025-03-26-changelog]
    checked: 2026-11-04

  - id: action-beta-direct-prompt
    title: "GitHub Action を @beta と direct_prompt で書く"
    now: "anthropics/claude-code-action@v1 を使い、direct_prompt は prompt に、max_turns や model などの CLI の設定は claude_args に移す。mode の入力は外す（自動で判定する）。custom_instructions は claude_args の --append-system-prompt になる。"
    changed:
      date: 2025-08-26
      note: claude-code-action の v1（Claude Code GitHub Action v1.0）の公開の日
    status: 置換
    principle: [確かめる]
    why_then: "v1 より前（v0.x）は @beta を参照し、プロンプトを direct_prompt、設定を max_turns などの個別の入力で渡すのが公式の書き方だった。"
    how_to_find: ".github/workflows/ で、claude-code-action@beta・direct_prompt・mode・max_turns の入力を探す。"
    sources: [cc-docs-github-actions, gh-claude-code-action-migration, gh-claude-code-action-v1]
    checked: 2026-11-04

  - id: workflow-keyword-extra-usage
    title: "「workflow」と書いて workflows を起動し、超過分は extra usage で払う"
    now: "dynamic workflows を 1 つの作業で使うなら、プロンプトに ultracode と書くか、「ワークフローで」と自分の言葉で頼む（workflow という語だけでは起動しない）。セッション全体なら /effort ultracode にする。上限を超えた分は usage credits（/usage-credits）で払う。"
    name: workflow-to-ultracode
    status: 置換
    principle: [握る]
    why_then: "dynamic workflows が入った 2.1.154（2026-05-28）から 2.1.159 までは、workflow という語が起動のキーワードだった。超過分を払う仕組みの名前は、2.1.144 より前の Claude Code では extra usage だった。"
    how_to_find: "頼み方の型やスキルで、workflow という語を起動のつもりで書いていないかを見る。手順書の extra usage・/extra-usage は、usage credits・/usage-credits に読み替える（旧名のコマンドも動く）。"
    sources: [cc-changelog, cc-docs-changelog, cc-docs-workflows, cc-docs-commands]
    checked: 2026-11-04
    note: "名前の変更が 2 つある行。時期は workflow-to-ultracode（2.1.160）を引く。超過分の呼び名は extra-usage-to-usage-credits（2.1.144）"

  - id: ralph-loops
    title: "Ralph プラグインや自作 bash ループで回し続ける"
    now: "完了の条件を決めて続けさせるなら /goal、決まった間隔でくり返すなら /loop、大きな作業を多くのエージェントに分けるなら dynamic workflows を使う。無人で回すときは、止まる条件と使う量の上限を先に決める。"
    changed:
      date: 2026-05-11
      until: 2026-05-28
      version: 2.1.139
      note: /goal は 2.1.139（2026-05-11）、dynamic workflows は 2.1.154（05-28）で入った。/loop は 2.1.71（2026-03-07）から
    status: 置換
    principle: [確かめる]
    why_then: "/goal が入る前は、完了の条件を満たすまで続けさせる公式の手段がなく、同じプロンプトを外のループで流し直す手が使われた。"
    how_to_find: "シェルのスクリプトで、ループの中から claude -p を呼んでいるもの、ループのためのプラグインやスキルを探す。止まる条件と上限（--max-turns・--max-budget-usd）のない回し方は特に見直す。"
    sources: [cc-changelog, cc-docs-changelog, cc-docs-goal, cc-docs-scheduled-tasks, cc-docs-workflows]
    checked: 2026-11-04

  - id: tmux-agent-orgs
    title: "tmux で自作のエージェント組織を作る"
    now: "背景のセッションをまとめて見るなら agent view（claude agents。research preview）を使う。リードがチームメイトに仕事を振って調整するなら、エージェントチーム（experimental。CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS を 1 にして有効にする）を使う。どちらも使う量が増えるので、まずサブエージェントやセッションの間のメッセージで足りないかを確かめる。"
    changed:
      date: 2026-02-05
      until: 2026-05-11
      version: 2.1.32
      note: "エージェントチームは 2.1.32（2026-02-05）、agent view は 2.1.139（05-11）で入った。チームメイトの画面を分ける表示は、今も tmux か iTerm2 を使う"
    status: 置換
    principle: [握る]
    why_then: "公式の仕組みが入る前は、tmux の画面を分けて複数の Claude Code を並べ、役割を決めて手で連絡させる自作の組織が使われた。"
    how_to_find: tmux の設定やスクリプトで、複数の claude を起動して互いにメッセージを送る仕組みを探す。
    sources: [cc-changelog, cc-docs-changelog, cc-docs-agent-teams, cc-docs-agent-view]
    checked: 2026-11-04

  - id: avoid-opus-as-expensive
    title: "Opus は高いので避ける"
    now: "一律に避けず、自分の作業で比べて選ぶ。Opus 5.5 は Opus 5 より安く、Claude Code の Pro・Max・Ultra・Team・Enterprise と API で既定のモデル（2.1.280 以上）。プランでは、選ぶモデルで上限の減り方が変わるので、/usage で確かめる。"
    changed:
      date: 2026-09-22
      version: 2.1.280
      note: Claude Opus 5.5 の公開の日。Claude Code では 2.1.280 から既定の Opus になった
    status: 条件付き
    principle: [確かめる]
    why_then: Opus 4 と Opus 4.1 は、API の料金が入力・出力とも Sonnet 4 の 5 倍で、使い分けで費用が大きく変わった。
    how_to_find: "settings.json の model・ANTHROPIC_MODEL・サブエージェントの model で、Sonnet や Haiku に固定していないかを見る。固定の理由が費用だけなら、作業で比べ直す。"
    sources: [api-docs-pricing, api-release-notes, cc-docs-model-config, cc-changelog, hc-usage-limits]
    checked: 2026-11-04
    note: 料金の値は facts に置く（この行には書かない）

  - id: max-5x-or-20x
    title: "Max は 5x と 20x から選ぶ"
    now: "個人の上位のプランは Max と Ultra（旧 Max 20x）の 2 つ。Max は 5 時間ごとと週ごとの上限を持ち、Ultra は確認済みの口座なら 5 時間の上限がなく週の上限だけ。倍率と料金はプランのページで確かめる。"
    name: max-20x-to-ultra
    status: 置換
    principle: [握る]
    why_then: 2026-10-30 より前は、Max の中に 5x と 20x の 2 つの段があった。
    how_to_find: "記事や社内の規程で Max 5x・Max 20x の語を探す。Max 20x は今の Ultra（契約は料金そのままで移った）。今の Max は 1 つの段で、Pro の 5 倍を持つ。"
    sources: [hc-ultra-plan, hc-max-plan, claude-blog-research, claude-pricing]
    checked: 2026-11-04

  - id: wait-out-5-hour-limit
    title: "有料プランは 5 時間の上限に当たったら待つしかない"
    now: "確認済みの Ultra の口座には 5 時間の上限がなく、週の上限だけ。ほかの有料プランは 5 時間と週の 2 段のまま。上限に当たったら、待つほかに、usage credits を有効にして続けるか、プランを上げる手がある。Claude Code（2.1.234 以上）は、開いたままのセッションで待ち、上限が戻ると自動で作業を続ける（続けるのは 3 回まで）。"
    changed:
      date: 2026-10-30
      note: "確認済みの Ultra の口座の 5 時間の上限がなくなった（Ultra への改名の日）。Claude Code の自動の継続は 2.1.234（2026-08-17）から"
    status: 条件付き
    principle: [握る]
    why_then: 有料プランは 5 時間ごとと週ごとの上限を持ち、5 時間の上限に当たると、戻るまで待つのがふつうだった。
    how_to_find: "手順書や見積もりが「上限に当たったら 5 時間待つ」前提になっていないかを見る。自分の口座の上限は Settings > Usage で見る（Current session の棒がなければ、確認済みの Ultra の口座）。"
    sources: [hc-usage-limits, hc-ultra-plan, hc-usage-credits, cc-docs-interactive-mode, cc-changelog]
    checked: 2026-11-04

  - id: customize-tabs
    title: "Customize の「Skills」「Connectors」「Plugins」の各タブで管理する"
    now: "サイドバーの名前は「Plugins」になり、1 つの「Plugins」のページでプラグイン・スキル・コネクタを管理する（スキルとコネクタだけに絞り込める）。スキルはチャットの「+」か「/」で使う。"
    name: customize-to-plugins
    status: 置換
    principle: [見せる]
    why_then: "2026-02-25 に Claude Desktop に、スキル・プラグイン・コネクタをまとめる Customize の区画が入り、その中のタブで管理した。"
    how_to_find: "手順書の「Customize > Skills」のような道順を探し、「Plugins」のページの道順に読み替える。Team と Enterprise で「Skills」を切っている組織は、2026-11-30 から Desktop のプラグインも止まる。"
    sources: [hc-plugins-page, hc-release-notes]
    checked: 2026-11-04

  - id: lower-temperature
    title: "temperature（や top_p・top_k）を下げて出力を安定させる"
    now: "引数を送らず、指示で振る舞いを導く。API の版 2026-10-21 では、この 3 つを送ると既定の値でも 400 エラーになる。それより前の版でも、Claude 4.7 以降のモデルは既定以外の値で 400 になる。既定以外の値を受け付けるモデル（Sonnet 4.6 など）を古い版で呼ぶときだけ今も効くが、版を上げると効き目がなくなり、代わりの設定はない。"
    changed:
      date: 2026-10-21
      note: "API の版 2026-10-21 で temperature・top_p・top_k が外された。Claude 4.7 以降のモデル（Opus 4.7 は 2026-04-16 の公開）は、それより前から既定以外の値を受け付けない。この制限がいつ始まったかは文書で確かめていない"
    status: 撤回
    principle: [確かめる]
    why_then: 以前のモデルは temperature を下げると出力のばらつきが減り、決まった形の答えを安定させる手として使われた。
    how_to_find: "API を呼ぶコードと SDK の設定で temperature・top_p・top_k を探す。SDK を新しい版（API の版 2026-10-21 を既定で送る版）に上げたときに 400 が出たら、まずここを疑う。"
    sources: [api-docs-model-deprecations, api-docs-migration-2026-10-21, api-release-notes]
    checked: 2026-11-04

  - id: styles-for-tone
    title: "スタイル（Styles）で応答の調子と形式を切り替える"
    now: "いつも同じ調子にするなら、全会話に効く Claude への指示（設定の Instructions）に書く。場面ごとに切り替えるならスキルにする。自分で作ったスタイルは移行でスキルになり、名前から作られるスラッシュコマンド（/<名前>-style）で呼ぶ。既定の Learning はスキルとして残った。"
    changed:
      date: 2026-06-01
      note: "スタイルからスキルへの移行の告知の日。既定の Concise・Explanatory・Formal はなくなり、移行が終わるとスタイルのメニューは出なくなる。告知の記事は 2026-11-04 には取り下げられている（Internet Archive の写しで読んだ）"
    status: 置換
    principle: [見せる]
    why_then: 移行の前は、アプリのスタイルで、応答の調子と形式を会話ごとに選べた。
    how_to_find: "手順書で、スタイルのメニューの操作や、既定の Concise・Explanatory・Formal を使う手順を探す。移されたスキルは既定で無効なので、有効にしたかを確かめる。"
    sources: [hc-styles-to-skills, hc-personalization]
    checked: 2026-11-04
    note: "Claude Code の出力スタイルとは別の機能。画面にスタイルのメニューが今も出るかは確かめていない（記事が取り下げられ、移行が終わったかが分からない）"

  - id: subagents-to-save-context
    title: "コンテキストを守るためにサブエージェントに調べさせる"
    now: "溢れることはまれになったので、守るためだけには使わない。サブエージェントが今も向くのは、並べる作業、うるさい出力を本筋から離すこと、独立したレビュー。どれもトークンが余分にかかる。"
    changed:
      date: 2026-10-27
      approx: true
      note: Best practices の改稿で「What you can stop doing」の表に入った（important-caps と同じ改稿）
    status: 条件付き
    principle: [見せる]
    why_then: "窓が埋まりやすかったころは、調べものの長い出力を別の文脈に閉じ込めて要約だけを受け取ると、本筋の窓を守れた。改稿前の Best practices も、コンテキストが根本の制約なので調べものはサブエージェントに任せるよう勧めていた。"
    how_to_find: "CLAUDE.md や頼み方の型で「調べものはサブエージェントに」と一律に決めていないかを見る。/usage でサブエージェントの種類ごとの使用量を見る。"
    sources: [cc-docs-best-practices, wb-cc-best-practices-2026-10-26, wb-cc-best-practices-2026-10-27, cc-docs-sub-agents]
    checked: 2026-11-04
    note: よい答えのための委任は tell-it-to-use-subagents の行

domains:
