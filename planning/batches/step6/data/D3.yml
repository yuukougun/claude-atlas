  - {domain: github.com, checked: 2026-11-04, noai: false, url: "https://github.com/anthropics/claude-code-action/releases/tag/v1", note: "robots.txt は AI 向けのクローラに一部のパスを禁じるが、noai・noimageai の指定はない。anthropics/prompt-eng-interactive-tutorial も同じ結果"}
