advice:
  - id: hash-to-memorize
    title: "「#」で始めると CLAUDE.md に記憶される"
    now: "CLAUDE.md に足したいことは、Claude に CLAUDE.md の編集を頼むか、/memory でファイルを開いて自分で書く。セッションの中で学んだことは、自動メモリが書き残す。"
    changed: {date: 2025-12-15, version: 2.0.70}
    status: 撤回
    principle: [見せる]
    why_then: 2.0.70 より前は、入力の先頭に # を付けると、その行を CLAUDE.md に書き足す近道があった。
    how_to_find: "記事や手順書で、入力の先頭に # を付けて覚えさせる手順を探す。手元の版を claude --version で確かめ、2.0.70 以上ならこの近道はない。今の入力の記号は、先頭の /（コマンドとスキル）と !（シェル）、ファイルを指す @ だけ。"
    sources: [cc-changelog, cc-docs-changelog, cc-docs-memory, cc-docs-interactive-mode]
    checked: 2026-11-04

  - id: commands-directory
    title: ".claude/commands/ にカスタムコマンドを作る、/project:name 記法"
    now: "新しく作るものはスキル（.claude/skills/<名前>/SKILL.md）にする。.claude/commands/ のファイルも今も同じように動き、同じ名前のスキルがあればスキルが優先される。名前に project: や user: は付けず /<名前> で呼ぶ（サブディレクトリのファイルは /<フォルダ>:<名前>）。"
    changed:
      date: 2026-01-09
      version: 2.1.3
      note: "スラッシュコマンドとスキルがまとめられた（動きは変わらない）。名前の project: と user: の前置きは、それより前の 1.0.25（2025-06-16）で外れた（names の project-prefix-removed）"
    status: 置換
    principle: [見せる]
    why_then: "スキルが入る前は、繰り返す頼み方を .claude/commands/ の Markdown にしてスラッシュコマンドで呼ぶのが公式のやり方だった（0.2.31 から）。1.0.25 より前は、コマンドの名前に project: と user: の前置きが付いていた。"
    how_to_find: "リポジトリと ~/.claude/ に commands/ のフォルダがあるかを見る。動くので急いで移さなくてよいが、補助のファイルを置く、Claude が自分で読み込む、呼ぶ人を決める、といったスキルの働きが要るものから移す。記事の /project:<名前> は /<名前> で呼ぶ。"
    sources: [cc-changelog, cc-docs-changelog, cc-docs-skills]
    checked: 2026-11-04

  - id: agents-command
    title: "/agents でサブエージェントを作る"
    now: "Claude にサブエージェントを作らせるか直させる（どこに置き、何をさせ、どの道具を許すかを頼む）。または .claude/agents/ か ~/.claude/agents/ の Markdown を直接書く。今の /agents は、このやり方を知らせる文を出すだけになった。"
    changed: {date: 2026-07-01, version: 2.1.198}
    status: 撤回
    principle: [見せる]
    why_then: "サブエージェントが入った 1.0.60（2025-07-24）から 2.1.197 まで、/agents は作成と管理の対話の画面（ウィザード）を開いた。"
    how_to_find: "記事や手順書で、/agents の画面の操作（作成のウィザード、Running と Library のタブ）を説明していないかを見る。2.1.198 以上で /agents を打つと、案内の文だけが出る。"
    sources: [cc-changelog, cc-docs-changelog, cc-docs-commands, cc-docs-sub-agents]
    checked: 2026-11-04

  - id: think-hard-keywords
    title: "think → think hard → ultrathink の段階、日本語の「熟考」"
    now: "考える深さは effort（/effort・--effort・設定）で決める。think・think hard・「熟考」などの言い回しはキーワードとして扱われず、effort の範囲で少し後押しするふつうの文として渡る。ultrathink だけが、そのターンだけ深く考えるよう頼む言葉として認識され、セッションの effort は変えない。Anthropic の API の Opus 5.5・Sonnet 5.5・Haiku 5.5・Fable 5.1 では、そのターンを xhigh で動かす。効くのは対話のターミナル（2.1.311 以上）と VS Code（2.1.316 以上）。CLAUDE_CODE_DISABLE_ULTRATHINK（2.1.316 以上）で切れる。"
    changed:
      date: 2026-03-04
      version: 2.1.68
      note: "2.1.68 で ultrathink が「次のターンを high の effort にする」言葉として戻った（CHANGELOG は「再び入れた」と書くので、それより前に外れていたが、外れた版は CHANGELOG にない）。2.1.311（2026-10-26）から、対話のターミナルでそのターンを xhigh で動かす"
    status: 置換
    principle: [確かめる]
    why_then: "0.2.44 で think・think harder・ultrathink と書いて考える量を頼めるようになり、1.0.8（2025-06-02）で英語以外の言語でも思考を起動できるようになった。effort の段を選ぶ手段がまだなく、言葉で考える量を変えるのが公式のやり方だった。"
    how_to_find: "CLAUDE.md・スキル・保存した頼み方で、think hard・think harder・「熟考」「よく考えて」などを探す。effort を上げる働きはないので、深く考えさせたいターンは ultrathink か effort で頼む。/doctor prompt-audit（2.1.283 以上）は、古いモデル向けに書いた指示を洗い出す。"
    sources: [cc-changelog, cc-docs-changelog, cc-docs-model-config, cc-docs-best-practices, cc-docs-memory]
    checked: 2026-11-04
    note: "日本語の語が当時の思考の段階に当たったことは、1.0.8 の「英語以外の言語で思考を起動できるようにした」で確かめた。どの語がどの段に当たったかは一次資料で確かめていない"

  - id: important-caps
    title: "IMPORTANT や YOU MUST で強調すれば守られる"
    now: "強調せず、ふつうの言葉で書く。それでも守られないなら、ファイルが長すぎて埋もれていないかを見て短くするか、例外を許さない規則ならフックか deny ルールにする。強調を重ねると、Claude が規則を当てはめすぎる原因にもなる。"
    changed:
      date: 2026-10-27
      approx: true
      note: "Best practices の改稿で「What you can stop doing」の表に入った（Internet Archive の写しで 2026-10-26 19:44 UTC の版になく、10-27 08:15 UTC の版にある）"
    status: 撤回
    principle: [縛る]
    why_then: "以前のモデルは、強調しないと指示を落とすことがあった。改稿前の Best practices も、守られない 1 行にだけ IMPORTANT などの強調を付けるよう勧めていた（多くの行を強調すると、どれも目立たなくなるとも書いていた）。"
    how_to_find: "CLAUDE.md・rules・スキルで、IMPORTANT・YOU MUST・NEVER・全部が大文字の行を探す。/doctor prompt-audit（2.1.283 以上）は、古いモデル向けに書いた指示や食い違う指示を洗い出す。"
    sources: [cc-docs-best-practices, wb-cc-best-practices-2026-10-26, wb-cc-best-practices-2026-10-27, cc-docs-memory]
    checked: 2026-11-04

  - id: yolo-skip-permissions
    title: "--dangerously-skip-permissions で YOLO 運用"
    now: "ふだんの対話は auto モード（今の既定）にし、サンドボックスを重ねる。bypassPermissions（--dangerously-skip-permissions と同じ）は、使い捨てのコンテナや VM の中だけで使う。permissions.blockWritesOutsideWorkingDirectories（2.1.314 以上）は、bypass でも Write・Edit・NotebookEdit が作業ディレクトリの外に書くのを止める。ただしシェルのコマンドは止めないので、隔離の代わりにはならない。"
    changed:
      date: 2026-08-14
      until: 2026-09-28
      note: "auto モードが既定になった時期（2026-08-14 から Pro・Max・Team の新しいセッション、2.1.283〜2.1.284 で対話のセッション全体）。auto モードは 2.1.111（2026-04-16）で --enable-auto-mode なしに使えるようになった"
    status: 置換
    principle: [縛る]
    why_then: "auto モードが使えるようになる前は、確認なしに長い作業を進める手段が、allow ルールを積み上げるか、bypass で確認をすべて飛ばすかしかなかった。"
    how_to_find: "--dangerously-skip-permissions・--allow-dangerously-skip-permissions・bypassPermissions を探す。探す場所は、シェルの alias・スクリプト・CI の設定・settings.json。コンテナや VM の外で使っていたら、auto モードとサンドボックスに替える。"
    sources: [cc-docs-permission-modes, cc-docs-settings-reference, cc-changelog, cc-docs-changelog, claude-blog-auto-mode-default]
    checked: 2026-11-04

  - id: approve-everything-first
    title: "最初は毎回承認を求められる"
    now: "何も設定していなければ、ターミナルと VS Code の対話のセッションは auto モードで始まる（2.1.283 以上）。毎回確かめたいなら、permissions.defaultMode を default（表示は Manual）にするか、--permission-mode manual で起動する。claude -p と Agent SDK は、決めていなければ Manual で動く。"
    changed:
      date: 2026-08-14
      until: 2026-09-28
      version: 2.1.283
      note: "2026-08-14 から Pro・Max・Team の新しいセッション（文書では 2.1.228 以上で、機能フラグを取得するセッション）。文書は 2.1.283 を、どのプランと提供元でも auto モードで始まる境とする。CHANGELOG では 2.1.283（09-25）が他社の基盤とテレメトリを切ったセッション、2.1.284（09-28）がすべてのプランと提供元"
    status: 撤回
    principle: [縛る]
    why_then: 既定の権限モードが default（今の表示は Manual）だったころは、読み取り以外の操作のたびに確認が出た。
    how_to_find: "記事や社内の手順書が「最初はすべて確認が出るので承認していく」前提で書かれていないかを見る。起動したときのモードは、画面の下の表示（auto mode on・manual mode on など）で分かる。"
    sources: [cc-docs-permission-modes, cc-changelog, cc-docs-changelog, claude-blog-auto-mode-default]
    checked: 2026-11-04
    note: "表示の名前の変更（default から Manual）は names の default-to-manual-mode"

  - id: save-context-for-200k
    title: "200k を前提にコンテキストを最優先で節約する"
    now: "今の多くのモデルは 1M トークンのコンテキストウィンドウを持ち、圧縮も自動なので、溢れることはまれになった。関係のない作業に移るときの /clear は、答えの質とコストのために今も勧められる。大きな会話（既定で 200K トークン以上）を 1 時間ほど放置すると、プロンプトキャッシュが切れる前に要約される（idle compaction）。ターミナルは 2.1.299、VS Code と Desktop の Code タブは 2.1.314 から働き、idleCompaction を false にするか /config で止められる。"
    changed:
      date: 2026-10-27
      approx: true
      note: "Best practices の改稿で「What you can stop doing」の表に入った。Claude Code の既定のモデルが 1M の窓を持つのは、Sonnet 5 が既定になった 2.1.197（2026-06-30）から"
    status: 条件付き
    principle: [見せる]
    why_then: "窓が 200K トークンだったころは長い作業で埋まりやすく、改稿前の Best practices も「窓はすぐ埋まり、埋まるほど性能が落ちる」という制約から多くの勧めを導いていた。"
    how_to_find: "CLAUDE.md や手順書で、窓を節約するための決まり（毎回要約させる、ファイルを読ませない、など）を探す。今の窓の使い方は /context で見る。"
    sources: [cc-docs-best-practices, wb-cc-best-practices-2026-10-26, wb-cc-best-practices-2026-10-27, cc-changelog, cc-docs-changelog, cc-docs-settings-reference]
    checked: 2026-11-04

  - id: architecture-in-claude-md
    title: "アーキテクチャやファイル構成を CLAUDE.md に書く"
    now: "Claude はリポジトリを自分で読むので、構成やファイルの並びは書かない。書くのは、リポジトリを読んでも分からないこと（推測できない理由・決まり・落とし穴）だけにする。"
    changed:
      date: 2026-10-27
      approx: true
      note: Best practices の改稿で「What you can stop doing」の表に入った（important-caps と同じ改稿）
    status: 撤回
    principle: [見せる]
    why_then: "公式は、この表の助言はどれも書かれた当時はよい助言で、多くはモデルがまだ確実にできなかったことの回避策だったとする。リポジトリを自分で読んで全体をつかむことも、その 1 つだった。"
    how_to_find: "CLAUDE.md のディレクトリの木、ファイルの一覧、使っているフレームワークの説明を探す。/doctor は、コードから分かる中身を削る案を出す。"
    sources: [cc-docs-best-practices, wb-cc-best-practices-2026-10-26, wb-cc-best-practices-2026-10-27]
    checked: 2026-11-04

  - id: keep-going-dont-be-lazy
    title: "「keep going」「don't be lazy」と書く"
    now: "こうした一言は消す。今のモデルは合意した作業を言われなくても続け、この手の文はやりすぎの原因になりやすい。代わりに、通すべきテストのような確かめる手段を渡す。途中で止まったら continue と言い、誰も見ていない実行は /goal か Stop フックで続けさせる。"
    changed:
      date: 2026-10-27
      approx: true
      note: Best practices の改稿で「What you can stop doing」の表に入った（important-caps と同じ改稿）
    status: 撤回
    principle: [確かめる]
    why_then: "以前のモデルは長い作業の途中で止まりやすく、続けるよう促す一言が効いた。公式は、この表の助言の多くはモデルがまだ確実にできなかったことの回避策だったとする。"
    how_to_find: "CLAUDE.md・スキル・繰り返す頼み方で、keep going・don't stop・don't be lazy・loop until done・「最後までやり切れ」などを探す。"
    sources: [cc-docs-best-practices, wb-cc-best-practices-2026-10-26, wb-cc-best-practices-2026-10-27, cc-docs-goal]
    checked: 2026-11-04

  - id: add-double-check
    title: "「最後に double-check して」と書き足す"
    now: "確かめる手段（テスト・型の検査・照らす基準）を渡す。Opus 5 は自分の作業を言われなくても確かめるので、「見直して」「double-check して」や、確かめ役のサブエージェントを使わせる指示は消す（確かめすぎでトークンと時間が増える）。ほかのモデルでは、終わる前に基準と照らして確かめるよう頼むのは今も効く。"
    changed:
      date: 2026-07-24
      note: "Claude Opus 5 の公開の日。Opus 5 の頼み方の手引きが、確かめる指示を消すよう書く。Opus 5.5 の手引きも、Opus 5 の型は出発点として使えると書く"
    status: 条件付き
    principle: [確かめる]
    why_then: "自分の答えを見直させる一言で、コードや計算の誤りが減った。今の Prompting best practices も、多くのモデルにはこの頼み方を勧め、Opus 5 を例外とする。"
    how_to_find: "システムプロンプト・CLAUDE.md・スキルで、double-check・re-verify・「最後に見直して」・「確かめ役のサブエージェントを使え」を探し、使うモデルが Opus 5 か Opus 5.5 かを確かめる。"
    sources: [api-docs-prompting-opus-5, api-docs-prompting-opus-5-5, api-docs-prompting-best-practices, api-release-notes]
    checked: 2026-11-04

  - id: tell-it-to-use-subagents
    title: "「subagent を使え」と書き足す"
    now: "書き足さない。サブエージェントに任せるのは、大きく、本当に独立していて並べられる作業だけにする。同じ作業をサブエージェントに渡しても答えはよくならない（よくなるのは、書く過程を見ていない別のレビューを頼むとき）。Claude Code では CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH と CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS で数を縛れる。"
    changed:
      date: 2026-07-24
      until: 2026-10-27
      note: "Opus 5 の頼み方の手引き（2026-07-24 の公開）が委任のしすぎを抑えるよう書き、Best practices の改稿（2026-10-27 ごろ）が「よい答えのためにサブエージェントに任せる」を古い助言の表に入れた"
    status: 条件付き
    principle: [見せる]
    why_then: "以前のモデルは自分からはあまり委任しなかった。Opus 5 は、以前のモデルより進んで委任する（Opus 5 の頼み方の手引き）。"
    how_to_find: "CLAUDE.md・スキル・システムプロンプトで、「subagent を使え」「並べて調べさせよ」などの一言を探す。/usage でサブエージェントの種類ごとの使用量を見て、元が取れているかを確かめる。"
    sources: [api-docs-prompting-opus-5, cc-docs-best-practices, wb-cc-best-practices-2026-10-27, cc-docs-sub-agents]
    checked: 2026-11-04
    note: コンテキストを守るための委任は subagents-to-save-context の行に分けた（出典と理由が違う）

  - id: subagent-per-step
    title: "工程ごとにサブエージェントを大量に作る"
    now: "サブエージェントは、文脈を分ける意味のある作業に使う：本筋に残したくない長い出力（すべてのテストの実行や広い検索）、並べられる独立の作業、書く過程を見ていないレビュー、道具を絞った役。小さな作業は本体で済ませる。新しいサブエージェントは文脈を集め直すので、かえって遅くなることもある。"
    changed:
      date: 2026-07-24
      until: 2026-10-27
      note: "Opus 5 の頼み方の手引き（委任は大きく独立した作業だけにし、数を絞る）と、Best practices の改稿（サブエージェントが元を取る場面と、かかるもの）"
    status: 撤回
    principle: [見せる]
    why_then: "サブエージェントは文脈を分けられるので、工程ごとに役を作れば本筋が散らからないと考えられた。"
    how_to_find: ".claude/agents/ と ~/.claude/agents/ の定義の数と、実際に使われているものを見る。/usage でサブエージェントの種類ごとの使用量を見る。"
    sources: [api-docs-prompting-opus-5, cc-docs-best-practices, cc-docs-sub-agents]
    checked: 2026-11-04

  - id: prefill-for-json
    title: "prefill で JSON の形を強制する"
    now: "structured outputs（JSON の出力か strict tool use）で形を保証する。まず形を指示に書き、検査して再試行する手もある。分類なら、ラベルを enum にした道具か structured outputs を使う。Claude 4.6 以降のモデルは、最後の assistant のターンを先に書いた要求を 400 エラーで断る。"
    changed:
      date: 2026-02-05
      note: "Claude Opus 4.6 の公開の日。4.6 以降のモデル（と Claude Mythos Preview）は最後のターンの prefill を受け付けない。それより前のモデルは今も受け付け、会話の途中の assistant のメッセージには当たらない"
    status: 撤回
    principle: [縛る]
    why_then: "structured outputs が出る（2025-11-14 に beta、2026-01-29 に beta を外れた）前は、応答の先頭を書いて続けさせるのが、形を守らせる確かな手だった。前置きを省かせるのにも使われた。"
    how_to_find: "API を呼ぶコードで、messages の最後が assistant の役のメッセージになっている要求を探す。モデルを 4.6 以降に替えたときに 400 になったら、まずここを疑う。"
    sources: [api-docs-prompting-best-practices, api-docs-thinking, api-docs-structured-outputs, api-release-notes]
    checked: 2026-11-04

  - id: budget-tokens
    title: "budget_tokens で思考量を指定する"
    now: "thinking の type を adaptive にし、深さは effort で決める。Claude 4.7 以降のモデルは、budget_tokens を使う要求を 400 エラーで断る。Opus 4.6 と Sonnet 4.6 では非推奨。手動の思考しか持たないモデル（Opus 4.5・Haiku 4.5 など）は今のままでよい。"
    changed:
      date: 2026-02-05
      note: "Opus 4.6 の公開とともに budget_tokens の手動の思考が非推奨になり、effort が beta を外れた。Claude 4.7 以降（Opus 4.7 の公開は 2026-04-16）は受け付けない"
    status: 撤回
    principle: [確かめる]
    why_then: "拡張思考が入った Claude Sonnet 3.7（2025-02-24）から、思考の量を決める手段は budget_tokens だった。effort は 2025-11-24 に beta で入り、2026-02-05 に beta を外れた。"
    how_to_find: API を呼ぶコードと設定で、budget_tokens と、thinking の type が enabled の要求を探す。
    sources: [api-docs-extended-thinking, api-docs-thinking, api-docs-effort, api-release-notes]
    checked: 2026-11-04

  - id: thinking-tags
    title: "<thinking> タグに推論を書かせる"
    now: "推論を見たいときは、応答の本文に書かせず、thinking のブロックを読む（display を summarized にして要約を受け取る）。根拠が要るなら、短い説明を頼む。Fable 5・Opus 5・Sonnet 5.5・Opus 5.5・Fable 5.1 では、内部の推論を本文に書かせる頼み方は reasoning_extraction として断られることがある。"
    changed:
      date: 2026-06-09
      note: "Claude Fable 5 の公開の日。拒否の分類に reasoning_extraction が足された。思考を切れるモデルで思考を切ったときは、今も手で段階を踏ませ、答えを <answer> タグに書かせる手が使える"
    status: 撤回
    principle: [確かめる]
    why_then: "思考の機能を使わないときに、答えの前に考えを書かせると答えがよくなり、その過程を読んで確かめられた（手動の chain-of-thought）。"
    how_to_find: "システムプロンプトや頼み方の型で、<thinking>・「考えを書いてから答えよ」・「推論を出力せよ」を探す。stop_reason が refusal で、分類が reasoning_extraction の応答が出たら、まずここを疑う。"
    sources: [api-docs-prompting-best-practices, api-docs-prompting-opus-5-5, api-docs-thinking, api-release-notes]
    checked: 2026-11-04

