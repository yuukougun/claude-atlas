# 工程6b の下書き（担当 D3）：古くなった助言の台帳（advice。planning/catalog/registry.yaml の ledger の 37 行）と、
# 名称と旧名の表（names。機能・プラン・コマンドの改名。DR-18）
# - 形は data/outdated-advice.yml の advice、data/facts.yml の names、data/sources.yml の domains・sources
#   （schema/outdated-advice.schema.json・facts.schema.json・sources.schema.json）。メインが data/ にまとめる。
#   報告は planning/batches/step6/data-D3.md
# - 確認日は 2026-11-04（Claude Code の CHANGELOG を 2.1.318 まで、code.claude.com・platform.claude.com・support.claude.com・
#   claude.com の該当のページ、GitHub の claude-code-action と公式のチュートリアル、MCP の仕様の変更点を読んだ）
# - 版の日付は、公式の changelog のページ（cc-docs-changelog）の日付。npm の公開の時刻（UTC）と1日ずれることがある
# - 文書の改稿の時期は、Internet Archive にすでにある写しで確かめた（新しい写しは作っていない）
# - 名前と画面の変更の行は changed を持たず、name で names の id を指す（DR-18）。名前の変更が 2 つある行は、主の方を
#   指し、もう一方は note に書いた（報告の §4 の提案1）
# - 文は台帳と用語索引のページに生成されて書き方の検査（textlint・prh）にかかるので、用語集の表記で書いた。
#   生成の道具が記法の字を外すので、コマンドやキーもバッククォートで囲まない平文にした
# - 否定的な文脈なので、助言を広めた個人や記事を名指ししない（design §6.12）

