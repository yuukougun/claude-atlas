    checked: 2026-11-04
    status: 確認済み
    note: >-
      全プラン（Free は5件まで）。有料のプランでは、ナレッジが文脈の上限に近づくと RAG に切り替わる。Team と Enterprise は組織の中で共有できる。プロジェクトごとにメモリを持つ。Claude Code から順に展開している新しい版（beta。1つの会話を並列の threads に分ける）は D1 の code-projects で追う

