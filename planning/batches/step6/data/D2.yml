      個人は Free・Pro・Max・Ultra、組織は Team（Standard と Premium の席）と Enterprise（自分で買う形と営業を通す形。使った分は API の料金で払う）。Max 20x は Ultra に改名され、契約は料金そのままで移った（2026-10-30。リサーチの公式ブログの編集の注。名前の変更は names で持つ）。料金・倍率・席の数は facts に置く値。食い違い：Team の記事は含むものに「200k context window」と書くが、コンテキストウィンドウの記事は有料のプランの新しいモデルで 1M まで（モデルで違う）と書く

  - id: usage-limits
    title: 利用上限（usage limits）
    page: how-usage-limits-work
    surfaces: [app, claude-code]
    match_terms: [usage limits, five-hour limit, session limit, weekly limit, Current session, Settings > Usage, limit reset, Reset for free, length limits]
    sources: [hc-usage-limits, hc-pro-plan, hc-max-plan, hc-ultra-plan, hc-team-plan, hc-limit-reset, hc-claude-code-plan, claude-pricing]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      アプリ・Claude Code・Desktop の使用が同じ上限に数えられる。有料のプランは5時間ごとの上限と週の上限を持ち、Max と Ultra は Fable に別の週の上限がある。確認済みの Ultra の口座には5時間の上限がない。週の上限は口座ごとに決まった時刻に戻る。使用量に基づく Enterprise にはプランの上限がない。値と倍率は facts に置く

  - id: usage-credits
    title: usage credits
    page: usage-credits-basics
    surfaces: [app, claude-code]
    since:
      date: 2025-08-20
      note: Team と Enterprise に Extra usage の名前で公開（Help Center のリリースノート）。個人のプランへの公開の時期は確かめていない
    match_terms: [usage credits, Extra usage, Now using credits, monthly spend limit, auto-reload, Add funds]
    sources: [hc-usage-credits, hc-usage-limits, hc-release-notes, hc-api-credits]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      Pro・Max・Ultra（Team と席の Enterprise は別の記事）で、上限に達した後も API の標準の料金の従量で続けられる。Settings > Usage で有効にし、前払いと月の上限と自動の補充を決める。Claude と Claude Code の両方に効く。月の API credits とは別物。日本などでは 2026-09-10 以降に買ったものは6か月で失効する。モバイルのストアで契約しても web でだけ有効にできる。旧名の Extra usage が API credits の記事に残る

  - id: api-credits
    title: プランに付く API credits（monthly API credits）
    page: check-billing-path
    surfaces: [app, api]
    since:
      date: 2026-10-07
      note: Max と Team に公開（Help Center のリリースノート）。今の記事は Ultra も含める
    match_terms: [monthly API credits, API credits, Link organization, Supplemental Credit Terms]
    sources: [hc-api-credits, hc-release-notes, hc-agent-sdk-plan, claude-pricing]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      Max・Ultra・Team（割引の Team を含む）に付く月の Claude Platform のクレジット。Free・Pro・Enterprise は対象外。claude.ai で Console の組織を1つ結んで受け取る。Claude API（Messages・Message Batches）・Playground・Managed Agents・Agent SDK（API キーで動かす claude -p を含む）に使え、対話の Claude Code・プランの extra usage・Bedrock などには使えない。繰り越さない。額は facts に置く値

  - id: wrap-up-allowance
    title: Wrap-Up Allowance
    page: how-usage-limits-work
    surfaces: [claude-code]
    since:
      claude_code: 2.1.277
      note: 資格の条件の版（v2.1.277 以上）。導入の日付は記事にない
    match_terms: [Wrap-Up Allowance, wrap-up allowance, "Usage limit reached · wrapping up", wrapping up]
    sources: [hc-wrap-up-allowance, hc-claude-code-plan]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      Claude Code の応答の途中で5時間の上限に達したとき、区切りまで少しだけ続ける（量に上限がある）。Pro は週に1回まで、Max・確認前の Ultra・Team の Premium の席は5時間の上限に当たるたび。使った分は週の上限に数える。API キーと Bedrock・Vertex AI などでは効かず、アプリのチャットにもない。段階的に展開中で、口座と組織に公表しない最低の期間がある。成熟度の表記はない

  # ---- 組織と提供の経路 ----
  - id: team-onboarding
    title: /team-onboarding
    page: rolling-out-to-teams
    surfaces: [claude-code]
    maturity: GA
    since:
      claude_code: 2.1.101
      date: 2026-04
      note: What's new の Week 15（2026-04-06〜10）
    match_terms: [/team-onboarding, team onboarding guide]
    sources: [cc-docs-commands, cc-docs-whats-new-2026-w15]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      過去30日の Claude Code の使い方（セッション・コマンド・MCP サーバー）から、仲間が最初の発言に貼れる手引き（Markdown）を作る。claude.ai の Team と Enterprise では、仲間が Claude Code で開ける共有のリンクも返す。文書に beta などの表記はない

  - id: otel-telemetry
    title: OpenTelemetry による利用の記録
    page: audit-logs-and-telemetry
    surfaces: [app, claude-code, api]
    maturity: GA
    match_terms: [OpenTelemetry, OTel, CLAUDE_CODE_ENABLE_TELEMETRY, OTEL_METRICS_EXPORTER, OTEL_LOGS_EXPORTER, OTEL_TRACES_EXPORTER, CLAUDE_CODE_ENHANCED_TELEMETRY_BETA, OTEL_LOG_USER_PROMPTS, OTEL_LOG_TOOL_DETAILS]
    sources: [cc-docs-monitoring-usage, hc-cowork-otel, api-docs-opentelemetry, hc-release-notes, api-release-notes]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      Claude Code は環境変数で metrics と events（logs）を出す（traces は beta）。プロンプトの本文と道具の細部は既定で記録せず、OTEL_LOG_USER_PROMPTS などで入れる。Cowork は Team と Enterprise で、クラウドとローカルのセッションの出来事（プロンプト・道具・ファイル・承認）を流せる（2026-04-09 から）。API と Managed Agents の OpenTelemetry は 2026-10-14 から beta。成熟度は Claude Code の metrics と events に合わせた

  - id: usage-analytics-api
    title: Usage and Cost Analytics API
    page: audit-logs-and-telemetry
    surfaces: [api]
    maturity: beta
    since:
      date: 2026-10-29
      note: beta で公開（analytics-usage-cost-2026-08-24。Platform のリリースノート）
    match_terms: [Usage and Cost Analytics API, analytics-usage-cost-2026-08-24, /v1/organizations/analytics/usage, /v1/organizations/analytics/cost, Usage and Cost API, Claude Enterprise Analytics API, Claude Code Analytics API, Admin API]
    sources: [api-docs-usage-cost-analytics, api-release-notes]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      Console と Claude Enterprise の組織のトークンの使用量と費用を、モデル・ワークスペース・API キー・人などで分けて返す。Console は Admin API の鍵、Enterprise は read:analytics の鍵を使う。前の Usage and Cost API と、Enterprise Analytics API の usage_report などの端点は 2026-10-29 に legacy になった。Claude Code Analytics API（2025-09-10）と Enterprise の Analytics API は別

  - id: cloud-providers
    title: クラウドの事業者を経由した利用（Amazon Bedrock・Google Cloud・Microsoft Foundry など）
    page: via-cloud-providers
    surfaces: [claude-code, api]
    maturity: GA
    match_terms: [Amazon Bedrock, Claude in Amazon Bedrock, Claude Platform on AWS, Google Cloud's Agent Platform, Vertex AI, Claude Models on Google Cloud, Microsoft Foundry, Azure AI Foundry, CLAUDE_CODE_USE_BEDROCK, CLAUDE_CODE_USE_VERTEX, CLAUDE_CODE_USE_FOUNDRY, CLAUDE_CODE_USE_MANTLE, LLM gateway, Claude apps gateway]
    sources: [cc-docs-third-party-integrations, cc-docs-amazon-bedrock, cc-docs-google-vertex-ai, cc-docs-microsoft-foundry, api-docs-bedrock, api-docs-platform-on-aws, api-docs-google-cloud, api-docs-foundry, hc-api-credits, hc-wrap-up-allowance]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      API の経路：Amazon Bedrock（Opus 4.7 以降は Claude in Amazon Bedrock の Messages API。前のモデルは別の文書）・Claude Platform on AWS（Anthropic が運用し AWS で払う）・Claude Models on Google Cloud（Anthropic の管理と Google の管理）・Claude in Microsoft Foundry。Claude Code の文書は Google Cloud's Agent Platform（旧 Vertex AI）と書く。使える機能は経路で違う（表は facts）。プランの月の API credits・Wrap-Up Allowance・claude.ai のスキルとプラグインの同期は効かない。Claude Desktop と M365 のアドインも経由して使える。文書に preview などの表記はない

