    surfaces: [app]
    maturity: GA
    enforcement: 鍵
    match_terms: [Manually approve, Automatically approve, Skip all approvals, Ask before acting, Act without asking, Always allow, Needs approval, Blocked]
    sources: [hc-cowork-start, hc-cowork-and-chat, hc-cowork-safety]
    checked: 2026-11-04
    status: 確認済み
    note: >-
      Cowork の3つの段：Manually approve（Manual。旧 Ask before acting）は動作の前に許可を求め、Automatically approve（Auto）は Claude が動作ごとに安全を審査して危ないものを止め、Skip all approvals（Skip。旧 Act without asking）は何も確かめない。新しい Claude の体験では Auto（Pro・Max・Ultra・Team の既定）と Manual（Enterprise の既定）。どの段でもファイルを完全に消す前には確認する。Team と Enterprise では管理者が Auto を出すかと新しいタスクの既定を決める。強制力：Manual の許可と削除の確認は仕組みの鍵。Auto の審査は Claude が動作ごとに行う判断で、Skip は確かめない。始まった時期は確かめていない。Claude Code の permission-modes・auto-mode とは別

