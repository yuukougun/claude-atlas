# 工程6b の下書き（担当 D2）：features のうち「アプリ」「API・SDK」「面をまたぐもの」「プランと上限」「組織と提供の経路」の52項目と、
# その出典（sources）とドメイン（domains）。2026-11-04。報告は planning/batches/step6/data-D2.md
# - 形は data/facts.yml（features・names・facts）と data/sources.yml（domains・sources）と data/outdated-advice.yml（advice）。
#   メインがまとめる（sources の重なりは URL で見る）
# - 読み込みの時期（load_timing）とコンテキストのコスト（context_cost）は書かない（語彙は D1 が決める。当てはまる候補は報告の §3.4）
# - 成熟度：Claude Platform の文書は featureMetadata.status の stable を GA、beta を beta とした。ヘルプセンターと claude.com の文書は
#   本文の表記（beta・research preview・generally available）に従い、表記がなくプランで提供と書かれているものを GA とした。
#   プランと上限の項目と、拒否の項目は語彙に当てはまらないので書かない
# - 強制力（enforcement）は、指示として読まれるもの（お願い）と、仕組みが形や動作を縛るもの（鍵）だけに書いた

features:
