      - "02 §3-5（公式のモデル選択ガイド：二つの始め方・effort はモデルを替えるより良い手であることが多い・評価セットが最も大事）"
      - "02 §2-4（上位のモデルとプランの関係）・§1-9（アプリでの公式の推奨）"
      - "10 第15章（モデルと effort は既定から始め、難所でだけ上げ、効果を自分の評価で確かめる。根拠は中・版依存）"
      - "11 第2節 分野03 p34#155・p34#169"
      - "decisions 2026-11-03 書き方の方針（第三者・根拠・コンテスト）7（本文は「既定から始めて測る」、モデルごとの値は数値ファイル）"
      - "00 §5 台帳（Opus は高いので避ける）"
    notes: "三段の順は、公式の選択ガイド（モデルを替える前に effort を動かす・足りなければ上位へ）を、アプリと Claude Code の既定から始める形に言い換えたもの（02 §3 の Inferences）。公式には効率を先にする始め方（軽いモデルから上げる）もあるので、節 three-steps で並べる。どのモデルが既定か・どれが上位かは数値ファイルから書く（版で変わりうるので volatility は 高）。"

