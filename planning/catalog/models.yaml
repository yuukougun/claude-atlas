    notes: "症状の振り分けは symptoms の seems-less-capable が持ち、ここは「合っていない」（版・effort・モデル）の対処の本体にする。そのため症状の sign（雑な返事が増えた）は外し、症状の文は seems-less-capable の signs に任せた（symptoms#1。逆引きで症状のページの振り分けを飛ばさないため。M2）。体感と実測の本体は eval の felt-vs-measured。eval の担当が 整える・必須にしたので、related から前提に移した（「体感だけで結論を出さない」はこのページの要点で、その根拠を前提で読ませる）（2026-11-04 統合：eval#3・symptoms#1）。"

