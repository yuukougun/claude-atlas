  - id: permission-modes-overview
    chapter: 権限モードと計画
    title: "権限モードの選び方"
    aliases: ["権限モードの全体像", "permission modes", "Manual・acceptEdits・plan・auto・dontAsk・bypassPermissions", "Shift+Tab でモードを切り替える", "auto モード"]
    type: feature
