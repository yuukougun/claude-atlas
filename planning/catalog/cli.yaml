# 分野 cli（Claude Code の基本操作）の目次。形式は planning/catalog/README.md §3、規則は §4。担当：C4（工程3、2026-11-04）
# 境界（design §4.2）：操作は cli、会話の長さ・圧縮・/clear の判断（なぜ・いつ）は context。/clear と /compact の判断と操作は
# context の when-to-start-fresh と compact-and-auto-compact が持ち、cli の must-know-operations と command-cheatsheet から指す。
# /goal・/loop・並列・worktree・workflows・無人実行・定期実行は delegate が持ち、cli からリンクする。
# 本文は WSL・Linux の CLI を基準にし、ほかの OS と IDE の拡張の動作は「未確認」と書く（decisions 2026-11-03 の方針 B5）

field: cli
chapters: [入力と基本の操作, 権限モードと計画, 巻き戻しとセッション, 見る・切り分ける, 設定と最初の準備, ほかの面と離席, 早見表]

