    level_evidence: "Claude Code を使い始めてすぐ、承認の出方とモードの切り替えに出会う（00 は L2）。緩める判断の本体は enforce と safety の任せる以上のページにある"
    priority: 必須
    surfaces: [claude-code]
    principle: [縛る]
    prevents: [境界がない, 合っていない]
    pitfalls: []
    scenes: [開発]
    summary: "権限モードごとに何が確認なしで進むかを知り、作業の危うさと見ていられる度合いに合わせて選ぶ。既定は版で変わってきたので、手元の既定と確認の出方を確かめてから任せる。"
    signs:
      - {type: goal, text: "確認を減らしたいが、どのモードにすればよいか分からない"}
      - {type: situation, text: "確認なしで進むのが既定になってから、何が勝手に実行されるのか不安"}
    prerequisites: [agent-loop]
    related: [what-auto-mode-stops, permission-rules, sandboxing, where-bypass-is-ok, default-safety-settings, approval-fatigue, protected-paths, destructive-commands, when-to-plan, settings-layers, wrong-amount-of-approvals, permission-modes-in-the-app, "headless-basics#permissions", agent-teams-experimental]
    tracks: [permission-modes, auto-mode]
    outdated_advice: [approve-everything-first, yolo-skip-permissions]
    volatility: 中
    sections:
      - {title: "モードごとに確認なしで進むもの", anchor: modes}
      - {title: "既定のモードと版", anchor: defaults}
      - {title: "選び方の判断例", anchor: examples}
    templates:
      - {name: "既定の権限モードを決める settings の例", kind: settings, safety: true}
    visual: {kind: static, text: "モードを、確認なしで進む範囲の広さの順に並べ、どの段で sandbox と deny を足すかを添えた図"}
    materials: ["00 §3 分野07", "01 C-1・C-2", "05 1-10", "research/23 F2-a・F2-b・§3.3", "research/22 #8・#10", "research/26 §3.4（VS Code の最初の権限モード）"]
    notes: "既定のモードの変遷（Pro・Max・Team は 2026-08-14、ターミナルと VS Code の対話は v2.1.283〜284、-p は Manual）は数値ファイルに置く（research/23 F2）。auto モードが何を止めるかは enforce の what-auto-mode-stops、bypassPermissions の使いどころは safety の where-bypass-is-ok、アプリの権限モードは app の permission-modes-in-the-app が持つ。level は整えるにしたので比例則の検査の対象外だが、緩める内容を含むので enforce と safety のページを related に置いた。-p の権限モードの既定と承認の要る呼び出しの扱いは delegate の headless-basics（節 permissions）、teammate がリードの権限モードを受け継ぐかは delegate の agent-teams-experimental を指す（delegate の担当の提案）（2026-11-04 統合：delegate#3）"

