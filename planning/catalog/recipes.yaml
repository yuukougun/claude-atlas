    reason: "独自の判断を notes に1行で書けなかった（R3-17・DR-19 q）。要点の「足したテストは、わざと壊したコードで落ちることで受け取る」は verify の pitfalls-of-ai-written-tests の節 test-strength（と eval の test-the-verifier の節 broken-copy）と同じで、「既存のテストの書き方と境界値に合わせて足させる」は依頼の書き方（00 §3 分野16・01 KQ3）で、判断ではない。テストを足す作業の落とし穴（今の挙動を正解として固める・壊しても落ちない）の本体もまとめ先にある。まとめ先には、テストのないコードに足させる手順の節を足し、題名（テストを足す）・別名（テストを書かせる・テストの追加・カバレッジを上げる・単体テスト）・goal の sign（テストのない古いコードにテストを足したい）・雛形（既存のテストに合わせて足させ、わざと壊したコードで落ちることを出力つきで見せさせる依頼の型）・材料（01 KQ3・10 付録A-13）を移す（verify の担当かメインが移す。fix-F7 の「メインへ」）。symptom の sign（AI が書いたテストは全部通るが、何も確かめていない気がする）は、まとめ先の「テストは全部通るのに、バグが残っている」と同じ困りごとなので移さない（2026-11-04 工程4：DR-19 q）"

