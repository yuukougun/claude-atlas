notes:
  - "レシピの構成は design §6.3（要点 → 前提（確かめる・縛る）→ 手順 → 確かめ方 → 失敗したとき）に沿う。どのページも、前提か関連に verify・eval・enforce・safety のページを持たせた（比例則）。sections は手順の要の節だけを挙げた。"
  - "補完調査の雛形（10 付録A）は、requirements §10.3 と 11 第5節の不具合を直してから載せる前提で templates に書いた：A-6（spec-first。ツール名を書かない形にし、汎用の例を並べる）、A-8（data-analysis）、A-10（fix-a-bug）、A-11（performance-tuning。出力が変わる候補を分け、受け入れ条件を切り替える）、A-12（audit-ml-pipelines）、A-14（spec-first・refactor-and-migrate。git status の出力を会話に示させる）、A-16 の後半（research-and-reports）、A-17（create-and-review-prs。3行は例）。A-4（評価資産を守る hook）は enforce の freeze-eval-assets（設定）と verify の protect-tests（考え方）が持つのでリンクだけにした。A-6 は prompting の let-claude-ask と、A-8 は prompting の prompt-patterns と同じ雛形なので、snippets は1か所にする（open_issues）。安全とデータの雛形（safety: true）はこの分野に置いていない。"
  - "工程4（F7、2026-11-04）：推移的な前提5本を related に移し（DR-19 e。fix-a-bug・refactor-and-migrate・performance-tuning・office-paperwork・notes-and-pkm）、add-tests を verify の pitfalls-of-ai-written-tests にまとめた（DR-19 q）。症状のページが振り分ける困りごとの言い換えだった sign 4つを、goal か狭い場面に書き換えた（DR-19 a。spec-first・read-specs-yourself・audit-ml-pipelines・write-docs）。重なった別名「経費精算」は cost の paying-in-yen を主にして外した（DR-19 d）。症状のページの routes が、fix-a-bug・spec-first・read-specs-yourself の節を振り分け先に使う"
