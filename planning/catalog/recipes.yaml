# recipes（用途別レシピ）の目次
# 形式：planning/catalog/README.md §3。語彙：schema/site.yml。書いた担当：C11（工程3、2026-11-04）
# レシピは用途ごとの進め方で、原理と機能のページへリンクする（design §2.2・§4.2・§6.3）。
# どのレシピも、前提か関連に確かめる・縛るのページ（verify・eval・enforce・safety）を持たせた（比例則）。

field: recipes
chapters: [読んで理解する, 直す, 作る・変える, 確かめる道具を作らせる, データと分析, 調べものと文書, 事務とノート]

pages:
  # ── 読んで理解する ──
  - id: explore-a-codebase
    chapter: 読んで理解する
    title: "知らないコードベースを読む"
    aliases: [コードベースの理解, オンボーディング, 既存のコードを把握する, コードの地図を作る]
    type: recipe
    level: 整える
    level_evidence: "引き継ぎや参加の直後に、質問の仕方と確かめ方を整えて理解を進める段階で最初に要る（00 §3 分野16 の L2）"
    priority: 必須
    surfaces: [claude-code]
    principle: [見せる, 確かめる]
    prevents: [見えていない, 確かめていない]
    pitfalls: [預けすぎる]
    scenes: [開発, 学習]
    summary: "知らないコードベースの全体像を、広い質問から始めて具体的な箇所へ絞りながらつかむ。説明は該当のファイルと行で確かめ、分かったことは地図や用語集にして残す。"
    signs:
      - {type: situation, text: "引き継いだリポジトリで、どこに何があるか分からない"}
      - {type: goal, text: "ある処理が入口からどこを通って動くのかを追いたい"}
      - {type: symptom, text: "コードの説明がもっともらしいが、本当にそう動くのか分からない"}
    prerequisites: [choose-what-to-read, fact-checking]
    related: [read-specs-yourself, research-in-subagents, code-intelligence-plugins, own-generated-code, how-much-understanding-to-keep, learning-with-ai, before-opening-unknown-repos, "vetting-extensions#dependencies", what-to-put-in-claude-md, init-and-first-claude-md, uses-nonexistent-apis, fix-a-bug]
    tracks: [subagents, plugins]
    outdated_advice: [architecture-in-claude-md]
    volatility: 中
    sections:
      - {title: "広い質問から絞る", anchor: broad-to-narrow}
      - {title: "説明をコードで確かめる", anchor: check-against-code}
      - {title: "地図と用語集を残す", anchor: keep-a-map}
      - {title: "他人のリポジトリを開くとき", anchor: unknown-repos}
    templates:
      - {name: "全体像から特定の処理の流れへ絞る質問の型（答えにファイルと行を添えさせる）", kind: prompt, safety: false}
    visual: {kind: static, text: "広い質問 → 絞る → コードで確かめる → 書き残す、の漏斗と輪"}
    materials: ["00 §3 分野16", "01 KQ3（Common workflows：新しいコードベースの理解・関連コードを探す）", "11 第1節 分野09 p56#40（理解が追いつかないままコードが増える。分野16 にも関わる）", "research/23 §3.1（01 KQ2 の 2-1 は改稿前の Best practices の要約。アーキテクチャを CLAUDE.md に書かないのは現行の版の勧め）", "00 §5（architecture-in-claude-md）"]
    notes: "summary は Common workflows（01 KQ3）の要点で書いた。01 KQ2 の 2-1 の「シニアエンジニアに聞くように」は改稿前の Best practices の要約（【2026-11-03 注記】、research/23 §3.1）なので根拠にしていない。地図や用語集は CLAUDE.md ではなく別のファイルに置く（台帳の architecture-in-claude-md）。他人のリポジトリを開く前の確認は safety の before-opening-unknown-repos に任せ、節 unknown-repos からリンクする。読み進める途中で依存のパッケージを入れるときの確かめ方は、safety の vetting-extensions#dependencies（safety の担当が足した節）に任せる（2026-11-04 統合：recipes#7）"

  - id: read-specs-yourself
    chapter: 読んで理解する
    title: "仕様を自分で読み、AI に誤読を指摘させる"
    nav_title: "仕様を自分で読む"
    aliases: [誤読の検出, 仕様の読み違いを防ぐ, 要件定義書を読む, 問題文を読む]
    type: recipe
    level: 整える
    level_evidence: "与えられた仕様を読んで依頼に含める、任せる前の準備の段階で要る。自分の要約と原文を突き合わせさせる頼み方は、頼み方と確かめ方を整える段階の技術"
    priority: 推奨
    surfaces: [app, claude-code]
    principle: [握る, 確かめる]
    prevents: [見えていない, 確かめていない]
    pitfalls: [預けすぎる, みんなの案になる]
    scenes: [開発, コンテスト]
    summary: "与えられた仕様は原文を自分で読んで要約を書き、AI には原文と突き合わせて誤読や落とした条件を指摘させる。理解は、採点や検証の処理を書いて公式の値と照らして確かめる。"
    signs:
      - {type: goal, text: "要件定義書や API の仕様の読み違いを防ぎたい"}
      - {type: symptom, text: "AI に要約させた仕様で実装したら、仕様の条件を取り違えていた"}
      - {type: situation, text: "長い問題文や規約を読んでから取りかかる"}
    prerequisites: [summary-overgeneralization, fact-checking]
    related: [think-before-asking, spec-first, explore-a-codebase, research-and-reports, tests-first, handing-long-documents, ai-ideas-are-everyones, practice-vs-contest-day, documents-in-japanese, checking-citations]
    volatility: 低
    sections:
      - {title: "先に自分で読んで要約する", anchor: read-first}
      - {title: "AI に誤読を指摘させる", anchor: misreading-detector}
      - {title: "採点の処理で理解を確かめる", anchor: check-by-scoring}
    templates:
      - {name: "自分の要約と原文を突き合わせて食い違いを挙げさせる依頼の型（解き方や実装は聞かない）", kind: prompt, safety: false}
      - {name: "採点や評価の処理を書かせ、公式の値と小さな例で一致させる依頼の型", kind: prompt, safety: false}
    visual: {kind: static, text: "原文 → 自分の要約 → AI が原文と突き合わせて指摘 → 採点の処理で確かめる、の流れ"}
    materials: ["11 第1節 分野16 新「仕様を自分で読み、AI に誤読を指摘させる」p12#104・p12#116・p12#117", "11 第1節 分野16 p12#107・p12#108・p12#111（競技の例。本文に人名を出さない）", "10 第5章", "requirements §6.7（原文を見せるか、要約して渡すか）"]
    notes: "priority は C0 の見当のまま推奨：要件・API の仕様・契約など一般の業務に通じるが、根拠は実践（章:中）。問題文とテスターを細部まで読む競技の技術そのものは kyopro-atlas に任せ（decisions 2026-11-03 書き方の方針（第三者・根拠・コンテスト）5）、AI への渡し方と確かめ方に絞る。p12#111 は体験記で版依存なので、例にするなら確認日を付ける。発想の段階で自分の要約を先に作る助言は「類推・弱」として添える（requirements §6.7）。工程4：sign の「AI の要約だけ読んで進めたら、大事な条件を落としていた」は、症状の summary-overstates-source（条件や但し書きが要約から落ちる）の言い換えなので、このページが直接答える狭い場面（要約させた仕様で実装した）にした。summary-overstates-source は、確かめていないの routes でこのページを指す（2026-11-04 工程4：DR-19 a）"

  # ── 直す ──
  - id: fix-a-bug
    chapter: 直す
    title: "バグを直す"
    aliases: [デバッグ, 不具合の修正, エラーを直させる, バグ修正]
    type: recipe
    level: 整える
    level_evidence: "再現の手順と完了の定義を依頼に含め、結果を確かめて直す段階で最初に要る（00 §3 分野16 の L2）"
    priority: 必須
    surfaces: [claude-code, app]
    principle: [確かめる, 見せる]
    prevents: [見えていない, 確かめていない]
    scenes: [開発, コンテスト]
    summary: "バグは、再現の手順と「直った」の定義を渡し、失敗するテストで再現させてから直させる。原因の仮説を確かめる前にコードを変えさせず、症状を隠すだけの修正を認めない。"
    signs:
      - {type: goal, text: "エラーの原因を突き止めて直させたい"}
      - {type: symptom, text: "直したと言われたのに、条件を変えると同じバグが出る"}
      - {type: symptom, text: "修正を頼むたびに、的外れな場所が書き換えられる"}
    prerequisites: [evidence-not-reports]
    related: [define-done, shrink-failing-inputs, bisect-regressions, build-observation-tools, going-in-circles, claims-done-but-isnt, rewrote-tests-to-pass, rewind-dont-correct, tests-first, protect-tests, differential-testing, wont-rethink-approach, uses-nonexistent-apis, "vetting-extensions#dependencies", agent-teams, before-after-prompts]
    tracks: [checkpoints]
    outdated_advice: [add-double-check]
    volatility: 中
    sections:
      - {title: "再現と「直った」の定義を渡す", anchor: reproduce-and-define-done}
      - {title: "直す前に仮説を確かめさせる", anchor: hypotheses-before-fixes}
      - {title: "症状を隠す修正を認めない", anchor: no-symptom-patches}
      - {title: "直らないときは巻き戻して頼み直す", anchor: when-stuck}
    templates:
      - {name: "説明 → 仮説 → 反証 → 最小の修正の順に進める依頼（10 付録A-10。Before/After の折りたたみ）", kind: prompt, safety: false}
    visual: {kind: static, text: "再現 → 縮小 → 仮説と反証 → 最小の修正 → 退行の確認、の流れ"}
    materials: ["00 §3 分野16", "01 KQ3（Common workflows：バグ修正）", "11 第2節 分野16 p34#60・p34#69・p34#70・p34#80・p34#81・p56#126・p56#138", "11 第2節 分野12 p34#196（仮説を互いに反証させる構成。版依存）", "11 第5節 A-10", "10 第10章", "00 §5（add-double-check）"]
    notes: "p34#69 の数値は未確認（論文の存在だけ確認。11 第2節）、p34#70 は小規模の研究なので、本文で使うならモデルと世代と標本の大きさを添える。症状を抑えるだけの修正の具体例（特定の seed の分岐・例外の握りつぶし・閾値合わせ）は p34#81 による。直すために依存のパッケージを足させるときの確かめ方は、safety の vetting-extensions#dependencies（safety の担当が足した節）に任せる（2026-11-04 統合：recipes#7）。前提の define-done は、もう一つの前提の evidence-not-reports からたどれる推移的な前提なので related の先頭に移した。節 reproduce-and-define-done・no-symptom-patches・when-stuck は、症状のページ（going-in-circles・claims-done-but-isnt・rewrote-tests-to-pass）の routes と related から指される（2026-11-04 工程4：DR-19 e）"

  - id: shrink-failing-inputs
    chapter: 直す
    title: "失敗する入力を縮めるスクリプトを書かせる"
    nav_title: "失敗する入力を縮める"
    aliases: [入力の縮小, 最小の再現例, デルタデバッギング, ddmin, minimal reproducible example]
    type: recipe
    level: 任せる
    level_evidence: "縮める処理をスクリプトとして書かせ、その結果を受け取って次の依頼に使う、任せる段階の道具（11 第1節 分野16 p34#78）"
    priority: 任意
    surfaces: [claude-code]
    principle: [見せる, 確かめる]
    prevents: [見えていない, 散らかっている]
    scenes: [開発, コンテスト]
    summary: "大きな失敗入力は、直させる前に最小の再現例へ縮める。縮める処理は何度でも同じ結果を出せるスクリプトとして書かせ、縮めた入力を修正の依頼に渡す。"
    signs:
      - {type: symptom, text: "大きな入力でしか起きないバグで、どこが悪いのか分からない"}
      - {type: goal, text: "バグを再現する一番小さな入力を作りたい"}
    prerequisites: [fix-a-bug, differential-testing]
    related: [property-based-tests, bisect-regressions, build-test-harness, move-judgment-into-scripts, research-in-subagents, going-in-circles]
    volatility: 低
    templates:
      - {name: "最初の依頼を修正ではなく縮小にする型（縮める処理をスクリプトで書かせ、縮めた入力と仮説だけを報告させる）", kind: prompt, safety: false}
    materials: ["11 第1節 分野16 新「失敗入力を縮めるスクリプトを書かせる」p34#67・p34#78", "11 第4節 #52（1研究からの一般化。未確認）", "10 第10章", "10 付録A-9 の4（ddmin で縮める）"]
    notes: "p34#67 の数値（1研究の結果）は未確認で、11 第4節 #52 は「スクリプトを書かせるほうが強い」という一般化を戒める。summary は p34#78 の実践（縮小を先に・スクリプトで）と、同じ結果を何度でも出せるという理由で書き、どちらが強いとは書かない。本文で研究を引くなら、1研究であることと対象を添える。priority は任意のまま：根拠の数値が未確認で、使う場面が限られる。"

  - id: bisect-regressions
    chapter: 直す
    title: "退行の原因を git bisect で探させる"
    nav_title: "退行の原因を探させる"
    aliases: [git bisect run, リグレッションの原因探し, どのコミットで壊れたか, 退行の調査]
    type: recipe
    level: 任せる
    level_evidence: "判定の処理を書かせて、絞り込みを任せる段階の道具（11 第1節 分野16 p34#73）"
    priority: 任意
    surfaces: [claude-code]
    principle: [確かめる, 縛る]
    prevents: [確かめていない]
    scenes: [開発]
    summary: "前は動いていたものが壊れたとき、良し悪しを判定するスクリプトを書かせ、git bisect run で原因のコミットを機械的に絞り込ませる。判定は Claude の推測でなく、スクリプトの終了コードで決める。"
    signs:
      - {type: symptom, text: "前は動いていたのに、いつの間にか壊れていた"}
      - {type: goal, text: "どの変更から遅くなったのかを突き止めたい"}
    prerequisites: [fix-a-bug, working-with-git, verifier-three-conditions]
    related: [move-judgment-into-scripts, differential-testing, evidence-not-reports, shrink-failing-inputs, performance-tuning, build-test-harness]
    volatility: 低
    templates:
      - {name: "bisect の判定スクリプトを書かせて git bisect run を回させる依頼の型（良い・悪い・判定できない、を終了コードで分ける）", kind: prompt, safety: false}
    materials: ["11 第1節 分野16 新「退行の原因を git bisect で探させる」p34#73", "10 第10章"]
    notes: "priority は任意のまま：根拠は単独のブログ（強〜中）で、中身は git の標準の機能の使い方。終了コードの決まり（判定できないときに飛ばす値）は git の文書を出典にする。判定が揺れるテストでは、各段を2回走らせて一致を見る（p34#73）。判定スクリプトは検証器にあたるので、eval の verifier-three-conditions を前提にした（正しくないと別のコミットを指す）。"

  # ── 作る・変える ──
  - id: spec-first
    chapter: 作る・変える
    title: "仕様を先に固める（spec・インタビュー・モック先行）"
    nav_title: "仕様を先に固める"
    aliases: [仕様駆動開発, spec 駆動, SPEC.md, インタビューで仕様を詰める, spec-driven development]
    type: recipe
    level: 任せる
    level_evidence: "大きな機能を、仕様を書かせてから別のセッションで実装させる、計画させてから任せる段階の入口（00 §3 分野16 の L3）"
    priority: 必須
    surfaces: [claude-code, app]
    principle: [見せる, 確かめる]
    prevents: [見えていない, 確かめていない]
    scenes: [開発]
    summary: "大きな機能は実装の前に Claude にインタビューさせて仕様を書かせ、範囲外と確かめ方まで決める。画面はモックで先に合意し、実装は仕様を渡した新しいセッションで行う。"
    signs:
      - {type: goal, text: "大きな機能を作る前に、要件の抜けをなくしたい"}
      - {type: goal, text: "作り始める前に、画面の見た目と動きをモックで合意したい"}
      - {type: goal, text: "何を作るのかを、質問に答えながら詰めていきたい"}
    prerequisites: [let-claude-ask, define-done, when-to-plan]
    related: [read-specs-yourself, frontend-design, handoff-documents, state-the-scope, ask-for-outcomes, tests-first, goal-until-done, not-what-i-meant, does-more-than-asked, progress-files, record-decisions, refactor-and-migrate]
    tracks: [ask-user-question, plan-mode, goal]
    volatility: 中
    sections:
      - {title: "インタビューで仕様を詰める", anchor: interview}
      - {title: "仕様に書くこと", anchor: what-goes-in-the-spec}
      - {title: "モックで先に合意する", anchor: mock-first}
      - {title: "新しいセッションで実装する", anchor: implement-fresh}
      - {title: "決まった仕様の実装を停止条件つきで回す", anchor: goal-with-stop-conditions, level: 仕組みにする}
    templates:
      - {name: "インタビューで仕様を詰めて SPEC.md に書かせる依頼（10 付録A-6 を直して載せる：ツール名を書かずに「インタビューして」と頼む形にし、評価環境の例に汎用の機能の例を並べる。版依存（低〜中）なので確認日と版を付ける。prompting の let-claude-ask と同じ雛形で、snippets の1か所から取り込む）", kind: prompt, safety: false}
      - {name: "SPEC.md の項目の例（目的・範囲外・関わるファイルとインターフェース・決定事項と要確認事項・確かめ方）", kind: other, safety: false}
      - {name: "/goal の停止条件（10 付録A-14 を直して載せる：判定役は会話しか読まないので、テストと評価のファイルを変えていないことを git status の出力で会話に示させる。仕様と矛盾するテストを見つけたら止めて報告させ、上限のターン数を書く。版依存なので確認日と版を付ける。delegate の goal-until-done と同じ雛形）", kind: prompt, safety: false}
