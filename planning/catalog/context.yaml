  - "提案（symptoms）：forgets-in-long-chats と going-in-circles の対処先に when-to-start-fresh・rewind-dont-correct・handoff-documents を、forgot-after-compaction の対処先に promises-after-compaction と compact-and-auto-compact#idle-compaction を置く。forgets-in-long-chats（使う）の前提にできるのは when-to-start-fresh（使う）だけで、ほかは段が上なので related で指す"
  - "提案（basics）：what-survives-compaction は research/23 §3.4（公式の表の要約）で書き、11 3-2 #5 の「skill の一覧は圧縮の後に戻らない」を使わない（v2.1.304 以降は今の skills から作り直して入れ直す）。compact-and-auto-compact と promises-after-compaction はこのページを前提にしている"
  - "未決（basics と context）：requirements §2 の動く図の例「コンテキストの埋まり方」は、公式の Explore the context window が対話で見せている（21 §2.4）。自作するなら置き場所は basics の attention-budget、リンクで済ませるなら context の inspect-context と tidy-the-desk から案内する。どちらにするかは basics の担当とメインが決める"
  - "提案（changes）：台帳に「コンテキストを守るために subagent に調査させる」の行を足す。現行の Best practices の What you can stop doing の表にあり（research/23 §3.7）、今どうするかは「うるさい出力の隔離・並列・独立のレビューに限る。トークンが余分にかかる」。既存の tell-it-to-use-subagents は Opus 5 世代のプロンプトの指針が出どころで、理由が違う。あわせて save-context-for-200k の「今どうするか」に idle compaction を足す（research/22 §3.4）"
