merged:
  - id: managing-context-in-the-app
    into: tidy-the-desk
    reason: "面ごとにページを分けない（D9、design §4.1）。アプリの新しいチャット・メッセージの編集・Projects・Memory は、総論の四つの動作のタブと「アプリでの整え方」の節（tidy-the-desk#in-the-app）に置く。アプリに固有の仕組み（長い会話の自動の context 管理と長さの上限）は app の long-chat-limits、指示の置き場所は app の where-to-put-instructions が持つ"
  - id: compaction-settings
    into: compact-and-auto-compact
    reason: "自動圧縮の窓・/autocompact・idle compaction の切り替えは圧縮の機能の変種なので、節（compact-and-auto-compact#settings、level は仕組みにする）にした（design §4.1 の1）。実践者の値は幅があるので、本文は「実践者の幅」で示し、公式の値は数値ファイルに置く"
  - id: breaks-and-cache-expiry
    into: compact-and-auto-compact
    reason: "長い離席の後の cache 切れには、公式の idle compaction（放置した大きな会話を、cache が切れる前に要約する）が対応するようになった（research/22 #15、05 1-6）。離席の前に畳むか、要約に任せるか、切るかの判断は圧縮のページの節（compact-and-auto-compact#idle-compaction）に置く"
  - id: sessions-as-branches
    into: resume-and-branch
    reason: "cli の resume-and-branch と同じ単位（名前を付けて再開・分岐する操作と、セッションをブランチのように扱う判断）。design §4.2 で基本操作は cli が持つ。registry の notes も重なりを挙げていた"

