    notes: "prompting の long-context-first（並べる順）、app の how-attachments-are-read（読み込みの仕様）、symptoms の skipped-later-pages（症状）と分け、このページは資料をどう用意して渡すかの判断を持つ。面ごとのページ数などの限界は数値ファイルから。依頼の中の並べ方・答えの前に引用を抜かせること・原文か要約かは prompting の long-context-first が持つので、summary は資料の形と量（分ける・Markdown にする。添付の読まれ方は limits の節と app の how-attachments-are-read）にし、quotes-first の節は要点と long-context-first への案内だけにする（2026-11-04 統合：prompting#2）。symptom の「資料に書いてあることを無視した答えが返る」は症状の skipped-later-pages の「添付したのに読んでいないような答えが返る」の言い換えなので、このページが直接答える goal の形（形と量を整えてから渡す）にした。related の lost-in-the-middle は basics が context-rot の節にまとめたので、context-rot#lost-in-the-middle を指し直した（2026-11-04 工程4：DR-19 a・p）"

