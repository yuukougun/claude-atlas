    nav_title: "机を整える（総論）"
    aliases: ["コンテキスト管理", "context engineering", "コンテキストエンジニアリング", "文脈の整理", "アプリでの文脈管理"]
    type: concept
    level: 整える
    level_evidence: "頼み方と会話の長さを自分で整え始める段階の総論。四つの動作のページは整える〜任せるにある"
    priority: 必須
    surfaces: [app, claude-code]
