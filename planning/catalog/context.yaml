    notes: "managing-context-in-the-app をまとめた。アプリの手段（新しいチャット・メッセージの編集・Projects・Memory）は四つの動作のタブと「アプリでの整え方」の節に置き、アプリに固有の仕組みは app のページへ案内する（D9）。「コンテキストは埋まるほど性能が落ちる」は改稿の前の版の要約（01 KQ1・0-3・2-1、10 第12章。注記付き）なので、要約とサインの根拠にしない。現行の版の勧め（/clear は質と費用のため）で書く。標語「会話は使い捨て、学びはファイルへ、失敗は禁止事項の形で」（11 p34#113）は見出しの候補。四つの動作の「委任」は、コンテキストを守るためではなく、うるさい出力の隔離・並列・独立のレビューのためと書き、台帳 subagents-to-save-context を指す（research/23 §3.7）。sign の「会話が長くなると答えの質が落ちる気がする」は、症状の forgets-in-long-chats にある同じ項目（00 §4）なので外した（逆引きで振り分けを飛ばさないため）（2026-11-04 統合：M3・extend#3・M2）"

