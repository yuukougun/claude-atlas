    notes: "basics の what-survives-compaction（仕組みと公式の表）、enforce の when-to-lock の節 spoken-rules-fade（会話で言った禁止を鍵に移す。enforce は spoken-prohibitions-fade をここにまとめた）、symptoms の forgot-after-compaction（診断と振り分け）と重なる。このページは「どこに置くか」の判断だけを持ち、表の本体は basics に任せる。11 3-2 #5 の「skill の一覧は圧縮の後に戻らない」は誤りで、v2.1.304 以降は今の skills から作り直して入れ直す（research/23 #6）。題名は registry の「圧縮のあとに残る約束、消える約束」から、判断が分かる形に変えた（旧題は aliases）。このページは残したい約束の移し方（CLAUDE.md・rules・フック）に絞る。what-comes-back の節は置き場所を決めるのに要る要点だけにし、残るもの・消えるものの一覧は basics の what-survives-compaction に一本化して繰り返さない（節の題も一覧と読まれない形にした。anchor は変えない）。summary と節の題の用語は公式の日本語版の多数派（拒否ルール〔仮〕・フック・スキル）に揃えた（2026-11-04 統合：basics#2・M1）。symptom の「最初に伝えた禁止事項を、途中から守らなくなった」は症状の forgets-in-long-chats（最初に伝えた前提を途中から忘れる）と forgot-after-compaction（会話で禁止したことを圧縮の後にやられた）の言い換えで、圧縮でない人もここに着く（R3 付表A の15、R1-04）ので、goal の形にした。goal の「圧縮されても守ってほしいことを、どこに書けばよいか知りたい」は、basics の what-survives-compaction にあった同じ問いの文（圧縮のあとも守らせたい約束を、どこに書けばよいか知りたい）にした。basics は同じ工程でその goal を「何が残り、何が消えるのか」の問いに替えたので、置き場所の問いはこのページだけが持つ（DR-15）（2026-11-04 工程4：DR-19 a）"

