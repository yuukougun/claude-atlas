      - {title: "面ごとの戻し方", anchor: how}
      - {title: "巻き戻すと消えるもの", anchor: what-is-lost}
    templates: []
    visual: {kind: static, text: "Before/After。訂正を重ねた会話と、巻き戻して頼み直した会話を並べ、文脈に残るもの（失敗した2回の試み）の違いに注記する"}
    materials: ["00 §3 分野05", "03 Q3 X3（反論を含む）", "04 Q6（/clear や /rewind を使わない人もいる）", "05 1-1", "research/26 §3.3 (b)（断られたときは引き金になったやり取りより前に戻す）"]
    notes: "巻き戻すと失敗の教訓も消えるという反論（03 X3）は keep-failure-lessons で受ける。断られたときに巻き戻すのは公式が案内する手段の一つ（research/26 §3.3）で、利用ポリシーを回避する頼み方とは分けて書く（decisions 2026-11-03）。訂正より巻き戻す理由と操作の本体はこのページが持ち、prompting の refine-in-conversation の節 edit-the-request は1行でここを指す（R3-24）。訂正を重ねる場面の sign はこのページの1か所にした。ただし symptom の「「そうじゃない」と何度返しても方向が直らない」は症状の going-in-circles（直してと言うたびに同じ間違いが戻ってくる）の言い換えなので、訂正を書く前の状況の形にした。別名「Esc を2回」は cli の checkpoints-and-rewind が主なので外した（fix-aliases）（2026-11-04 工程4：DR-19 a・d・u）"

