      - {name: "残す焦点を指示した /compact と、CLAUDE.md に書く圧縮の方針の例", kind: prompt, safety: false}
    visual: {kind: mermaid, text: "続けて /compact するか、書き出して /clear するかを、残したいもの（決めごと・試した経緯・ファイルの位置とエラーの文）と次の作業の近さで選ぶ分かれ道の図"}
    materials: ["00 §3 分野05（/compact と自動圧縮・休憩と cache 切れ・1M 時代の圧縮設定）", "00 §1 の対立点の表（長い作業の続け方）", "01 K-1（注記を含む）・K-2・C-5（途中から要約）", "03 Q3 X4・X5（注記を含む）", "04 Q2（compact の目安、離席の前に畳む）", "05 1-6", "research/22 #14・#15・#17", "research/23 #6・§3.4"]
    notes: "compaction-settings（設定の節）と breaks-and-cache-expiry（idle compaction の節）をまとめた。実践者の圧縮の目安（使用率の半分、約150k トークン、自動圧縮の窓を 500000 にする など。04 Q2）は幅があり、自動圧縮の発動の割合（95%・80%）はベンダーの記事で確かめていない（03 X5）ので、要約とサインに使わない。idle compaction の条件（会話の大きさ・放置の時間）と入った版は数値ファイルに置く（research/22 #15）。CLAUDE.md の Compact instructions は Manage costs の文書にある（05 1-6）。アプリの長い会話の自動 context 管理は app の long-chat-limits へ案内する（タブ）。圧縮の要約が英語で書かれるという報告は根拠が弱い（research/27 §3.3）ので、本文で触れるなら弱と書く。何が残り何が消えるかの一覧は basics の what-survives-compaction に一本化し、auto-compact の節では繰り返さない（2026-11-04 統合：basics#2）。別名「compaction」は、題名にその語を含む basics の what-survives-compaction が主なので外した（fix-aliases。「自動圧縮」はこのページが主で残す）。機能 compaction の題名「圧縮（/compact と自動圧縮）」はこのページに当たるので、用語索引で機能の主のページを決めるとき（features.yaml の page）はこのページが合う（2026-11-04 工程4：DR-19 d）"

