# 分野 context（文脈を整える）の目次。形式は planning/catalog/README.md §3、規則は §4。担当：C4（工程3、2026-11-04）
# 前提：Claude Code の Best practices は 2026-10-26〜27 ごろに書き直され、「コンテキストを最大の制約として積極的に管理する」は
# 「もうやめてよい助言」に移った（1M の窓と自動圧縮で、溢れることはまれ）。関係のない作業の間の /clear は、焦点の合った文脈の
# ほうが答えがよく安いので今も勧める（research/23 #1・§3.1）。この分野の要約とサインは、溢れを防ぐ節約ではなく、答えの質と
# 費用のための整頓として書く。調査資料 01 の KQ1・0-3・2-1 と 10 第12章は改稿の前の版の要約で、注記が付いている

field: context
chapters: [総論, 新しくする・巻き戻す, 圧縮, 書き出す, 見る・絞る, 脇道を分ける]

pages:
