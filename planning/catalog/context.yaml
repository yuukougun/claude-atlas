    materials: ["00 §3 分野05", "00 §2（最初の1分を見てずれたら止め、訂正が2回失敗したら /clear して書き直す）", "03 Q3 X1・X2", "04 Q2（/clear のタイミング）", "05 1-1・1-11・2-1", "11 第2節 分野05 p34#71・p56#84", "research/25 §3.4（現行の Best practices：訂正が2回失敗したら /clear して書き直す）", "research/23 #1"]
    notes: "訂正が2回失敗したら /clear するという公式の勧めは、現行の版にもある（research/25 §3.4）。チャットの「30〜50ターン」などの目安は単独の実践者の値（03 X1）なので、要約とサインに使わない。本文で使うなら経験則と書く。/clear しても利用上限は戻らないことは cost の how-usage-limits-work に任せて指す。pitfalls の「やめられない」は、伸びた会話を手放せない形として本文の判断例に使う"

  - id: rewind-dont-correct
    chapter: 新しくする・巻き戻す
    title: "違うと返すより、巻き戻す・編集する"
    aliases: ["プロンプトを編集して送り直す", "失敗の残骸を残さない", "訂正の往復をやめる"]
    type: concept
    level: 整える
    level_evidence: "返答を確かめて直す段階で、訂正の往復が文脈を汚すことに気づく。使う操作はアプリのメッセージの編集と Claude Code の /rewind だけ"
    priority: 必須
    surfaces: [app, claude-code]
    principle: [見せる]
    prevents: [散らかっている]
    pitfalls: []
    scenes: [開発, 文章]
    summary: "期待と違う返答には、訂正を重ねるより、前のメッセージを直して送り直すか巻き戻すほうがよい理由が分かる。間違った試みが会話に残ると、次の答えがそれに引きずられる。"
    signs:
      - {type: situation, text: "期待と違う返事が来て、訂正を書こうとしている"}
      - {type: goal, text: "失敗したやり取りをなかったことにしてやり直したい"}
    prerequisites: [context-rot]
    related: [checkpoints-and-rewind, when-to-start-fresh, keep-failure-lessons, build-on-results, tidy-the-desk, going-in-circles, insists-on-mistakes, refine-in-conversation]
    tracks: [checkpoints]
    outdated_advice: []
    volatility: 低
    sections:
