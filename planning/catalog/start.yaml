  # ── 背骨 ──
  - id: four-principles
    chapter: 背骨
    title: 四つの原理と比例則（見せる・確かめる・縛る・握る）
    nav_title: 四つの原理と比例則
    aliases: [見せる, 確かめる, 縛る, 握る, 比例則, 背骨の考え方]
    type: guide
    priority: 必須
    wave: 1
    surfaces: [app, claude-code, api]
    summary: "うまくいかない理由と次の一手を、見せる・確かめる・縛る・握るの四つの原理で考えられる。任せる幅を広げるほど確かめる仕組みと封じ込めを強める比例則も分かる。"
    signs:
      - {type: goal, text: "個別の小技ではなく、うまく使うための考え方の筋をつかみたい"}
      - {type: goal, text: "どこまで任せてよいかを決める基準がほしい"}
    prerequisites: []
    related: [six-causes, roadmap, attention-budget, context-rot, agent-loop, why-hallucinations, request-vs-lock, data-vs-instructions, tidy-the-desk, verification-ladder, when-to-lock, what-not-to-delegate, verifier-defines-problem, human-pitfalls, "default-safety-settings#by-stage", five-questions-before-delegating, what-auto-mode-stops, lethal-trifecta, ai-amplifies-organizations, outdated-advice-ledger]
    volatility: 低
    sections:
      - {title: "見せる", anchor: show}
      - {title: "確かめる", anchor: verify}
      - {title: "縛る", anchor: lock}
      - {title: "握る", anchor: hold}
      - {title: "比例則", anchor: proportional-rule}
      - {title: "面ごとの手段", anchor: by-surface}
    visual: {kind: static, text: "四つの原理の表と比例則の図：任せる幅（横軸）が広がるほど確かめる仕組みと封じ込め（縦軸）を強め、握るものはどの段階でも手放さない"}
    materials:
      - "requirements §3.1（四つの原理と一つの比例則）・§9 D1"
      - "00 §2「三つの原理と一つの比例則」（表：なぜ成り立つか・代表的な手段。アプリ／Claude Code／API）"
      - "00 §1「公式は失敗を四つに分け、『お願い』と『鍵』を区別する」"
      - "00 §2「背骨が分野構成・メタデータ・レベルに効く五つの経路」"
      - "11 第2節 分野00「三つの原理」p12#1・p12#16・p12#86・p56#78"
      - "11 第4節 #59・#60（p12#1 の見出しは証拠より強い。AI のループを禁じる大会では限定が要る）"
      - "research/24 B-32（ALE-Bench の細部を一次資料で確かめた）"
      - "10 第4章・第5部（握るの根拠。requirements §3.1 の説明）"
    notes: "00 の「三つの原理」に、requirements §3.1 の「握る」を足して四つにした（registry の notes）。原理のページそのものなので principle は付けない。各原理の「なぜ」は basics へ、手段は各分野へリンクする（design §4.2 の背骨の行）。Anthropic の AI Fluency（4D）は参考文献に挙げるだけにし、構成に使わない（requirements §3.1。ライセンスの一次の表示は未確認：research/21 F5）。11 第2節の p12#1 は見出しが証拠より強い（11 第4節 #59・#60）ので、例に使うなら research/24 B-32 で確かめた ALE-Bench の数値だけにし、研究のモデルと世代を書く。team の ai-amplifies-organizations は比例則の組織版として関連に置いた（11 第1節 分野17 p56#59 は全体地図の前提にする案も挙げるが採らない）。段階ごとに足す安全の既定の正本は safety の default-safety-settings#by-stage（design §4.2）で、比例則の節は既定の中身を繰り返さずにそこを指す。安全の既定が変わる更新は作者が承認する（design §9.4）。related は20件までなので、用語集（terminology）は外した（how-to-use と glossary から入れる）。（2026-11-04 統合：safety#10・M6）"

  - id: six-causes
    chapter: 背骨
    title: 失敗の二つの軸と診断の入口
    aliases: [六つの失敗原因, 六つの「ない」, Claude 側の原因, 人の側の落とし穴, 診断の手順, 原因の切り分け]
    type: guide
    priority: 必須
    wave: 1
    surfaces: [app, claude-code, api]
    prevents: [見えていない, 散らかっている, 確かめていない, 縛っていない, 合っていない, 境界がない]
    pitfalls: [預けすぎる, 同意を根拠にする, やめられない, 体感を信じる, みんなの案になる]
    summary: "うまくいかないとき、Claude 側の六つの原因を安く確かめられる順に問い、人の側の五つの落とし穴も疑って、どの症状のページへ進むかを決められる。"
    signs:
      - {type: symptom, text: "うまくいかないが、何が悪いのか見当がつかない"}
      - {type: symptom, text: "AI に任せて失敗したが、原因が AI なのか自分の判断なのか分からない"}
      - {type: goal, text: "症状から原因を順に切り分けたい"}
    prerequisites: []
    related: [four-principles, reverse-index, human-pitfalls, not-what-i-meant, plausible-falsehoods, doesnt-know-latest, forgets-in-long-chats, going-in-circles, claims-done-but-isnt, instructions-ignored, hits-limits-quickly, seems-less-capable, deleted-something-important, over-reliance, agreement-is-not-evidence, decide-when-to-quit, felt-vs-measured, ai-ideas-are-everyones, roadmap]
    volatility: 低
    sections:
      - {title: "Claude 側の六つの原因", anchor: claude-side}
      - {title: "安く確かめられる順の診断", anchor: diagnosis}
      - {title: "人の側の五つの落とし穴", anchor: human-side}
      - {title: "二つの軸に分ける理由", anchor: why-two-axes}
      - {title: "症状のページへの振り分け", anchor: to-symptoms}
    visual: {kind: mermaid, text: "診断の流れ：見せたか → 片付けたか → 確かめさせたか → 縛ったか → 合っているか → 境界はあるか の順に問い、並べて人の側の五つを点検する"}
    materials:
      - "requirements §3.2（二つの軸の表と、表の後の【2026-11-03 注記】）・§9 D2"
      - "00 §2「六つの失敗原因は公式の四分類を研究と実践知で広げたもの」（安く確かめられる順と、その理由）"
      - "00 §4（逆引き73項目の原因タグ。振り分けの例）"
      - "05 §1「全体の構図」（公式の四分類）"
      - "research/24 F1・§2.3・P-1（人の側の五つの根拠の強さの付け直し）"
      - "research/21 §2.2 F1"
      - "11 第1節 新分野案X の冒頭の段落（⑦にせず別の軸として持つ）"
    notes: "design §7 の「失敗の二つの軸と診断の入口」の1ページにするため、registry の human-pitfalls-intro をまとめた（merged）。id は、症状のページなどから前提や関連に指されやすい six-causes のままにした。人の側の五つの本体は judgment の human-pitfalls（総論）で、ここは入口として並べ、各落とし穴のページへ案内する。人の側の五つの根拠の強さは現象ごとに違う（ア・イ・エは強、オは中、ウは人の現象としては強だが AI と組み合わさって強まる点は推論。どれもコンテストや現行の Claude を直接調べたものではなく類推。research/24 F1・§2.3）。requirements §3.2 の「（根拠：強）」は工程2で直したので、summary・signs・入口の表で強さを一括して断定しない。強さの区別は human-pitfalls に書く。「AI に頼って負けた経験の大半がこの重なりで説明できる」という統合の主張は弱（推論）で、入口に書かない。症状の全ページ（どれもこのページを前提か関連に持つ）への道は、節 to-symptoms の表で作る。表は症状のページの prevents・pitfalls から生成し（design §8.4 の生成の目印。どのページに生成するかは作る層の設定に持つ）、related は20件までなので、使うの段の必須の症状と各原因の代表だけを置く。（2026-11-04 統合：symptoms#9・start#2）"

