    notes: "新規：design §6.2 は用語集のページを正として prh.yml を作るとするが、registry に候補がなかった（design §7 の表には 2026-11-04 に行が足された）。生成の用語索引（glossary）とは別の手書きのページにした（kyopro-atlas と同じ分け方）。prh の元になるので、土台作り（工程6）で本文より先に書く必要があり、必須・wave: 1 にした。2026-11-04 の統合で決めたことと、このページで決める点（design §6.2）：(1) 目次の題名と要約は、公式の日本語版の本文の多数派（research/27 §3.1 の案）で全分野をそろえた。表は planning/batches/step3/brief-integrate.md の M1 で、訳語の表はそれを元に書く。(2) 公式で割れている3語は仮に plan モード（別名にプランモード）・effort（別名に努力レベル）・許可ルール・確認ルール・拒否ルール（別名に allow ルール・deny ルールなど）とした。どれも工程5でユーザーに確かめる（節 split-terms）。(3) アプリのメモリと Claude Code のメモリ・自動メモリを分ける（アプリのものは「アプリのメモリ」）。(4) アプリの Styles（スタイル。スキルへ移行中：research/26 §3.1）と Claude Code の出力スタイルを分ける。(5) 読者の段階（委任の段階。roadmap）と、作業ごとの任せ方の段階（delegate の five-questions-before-delegating#autonomy-stages）を分ける（節 definitions）。(6) API の機能名の訳語は、Platform の日本語版を確かめてから決める。それまで英語のまま書き、プロンプトキャッシングだけは Claude Code の日本語版の多数派に合わせる。(7) 旧名はこのページに手で書かず、数値ファイルの名称の項目から用語索引（glossary#old-names）に生成する（design §9.1）。節 same-names-across-surfaces は (3)(4) のほか、アプリのプロジェクトと Claude Code の Projects、音声モードと /voice、アプリのタスクと scheduled tasks、アプリのスキル・プラグイン・権限モードと Claude Code のもの、Message Batches API と /batch、API の compaction と Claude Code の圧縮を、features.yaml の note に沿って書き分ける。アプリの全会話の指示（Claude への指示）とプロジェクトの指示の画面の名前は確かめていない（research/27 §5）。（2026-11-04 統合：start#4・start#6・basics#9・app#5・cli#5・delegate#2・M1・M7）"

