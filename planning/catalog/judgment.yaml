    notes: "優先度：落とし穴ウの本体で、症状の wont-rethink-approach・going-in-circles から方針の単位の対処として指されるので必須・wave 1。人の固執の要因はメタ分析で確かめられている（research/24 §2.3 ウ）。AI の速さと迎合が固執を強めるという筋は推論（実践例なし）で、本文でそう書き、ページの中心にしない（方針 A3）。中心は、着手前の基準と、判定を作った本人から離すこと。「リスクや機会費用の情報は固執を弱める」は工程2で確かめていない（research/24 §5）。0.60 や 4回などの値は例と明記し、4回は Fishtest の目安（4〜5回。チェスエンジンの検定の慣行で、運のよい試行を通しすぎないため）を借りた例とする（research/24 A-15・B-50）。変えすぎの失敗は一人の研究者の助言として書く（research/24 B-58）。コンテストの事例（実装の前の概算で方針を棄却する、など）は個人の名前を出さずに型として書く。観戦の投稿の要約（research/25 P12）は本人の助言として使わない。10 付録A-15 は、前半（実験台帳）を eval の experiment-log、後半（撤退基準）をここで分け合う（eval の担当の提案と同じ）。sign の「微修正を続けているのに、いっこうに良くならない」は症状の wont-rethink-approach（直し続けて方針を疑わない）・going-in-circles・stuck-in-a-check-loop の言い換えに、situation の「Claude に「もう打ち手がない」と言われて、やめるか迷っている」は wont-rethink-approach（「これ以上は無理です」と言われる）の言い換えになるので、どちらもこのページが答える goal（頭打ちのときの判断、AI の撤退の勧めの再検証）にした。人の側の固執の「今さら方針を変えられない」は症状のページにない困りごとなので残した。（2026-11-04 工程4：DR-19 a）"

