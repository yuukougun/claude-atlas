    visual: {kind: static, text: "「全部通りました」という報告と、実行したコマンドと生の出力（分母つき）を並べた対比"}
    materials: ["00 §3 分野09", "00 §4 確かめ方の困りごと", "05 1-2・5-1", "11 第1節 分野09 p12#114", "11 第2節 分野09 p34#138・p34#230・p56#127・p34#219・p34#26", "11 第4節 #46（原典の issue を使う）", "11 第5節 A-3（報告の形式）", "research/22 #18・#24"]
    notes: "件数を変えて「ALL PASSED」と報告した事例は GitHub の原典を使う（11 第4節 #46）。research/22 #18（検索が途中で切れたのに全部の結果とみなした不具合）と #24（claude -p が起動に失敗しても 0 で終わった不具合）は、版の付いた例として本文で使い、値は数値ファイルへ。p34#26 の「都合のよい部分集合を強調する要約」もここに足す。symptoms の提案で、この2例を節 tool-output に置いた（「ない」と言い切られたら検索の打ち切りを、成功の終了コードでも起動の失敗を疑う）。claims-done-but-isnt と blames-the-tools はこのページを前提にしているので、症状のページの診断からこの節へ案内できる。逆引きの「「全部通りました」と言うが信用できない」は症状のページ claims-done-but-isnt の signs にあるので、ここの signs から外した（同じ文を対処のページに重ねない）（2026-11-04 統合：M2・symptoms#13）。related の does-double-check-work は verification-ladder にまとめられたので外した（verification-ladder は先頭にある）。残した2つの symptom（件数が報告のたびに変わる・うまくいった場合だけの報告）は、分母をそろえた証拠を求めることが直接の答えになる狭い場面とみなした（2026-11-04 工程4：DR-19 q・a）"

  - id: verification-ladder
    chapter: 完了を確かめる
    title: "検証の階段"
    nav_title: null
    aliases: [確かめ方の段階, 検証の強さ, Give Claude a check to run, "「念のため確認して」は効くか", double-check して]
    type: concept
    level: 任せる
    level_evidence: "計画させて長い作業を任せる段で、確かめ方の強さを任せる幅に合わせて選ぶ必要が出る"
    priority: 必須
    surfaces: [claude-code]
    principle: [確かめる, 縛る]
    prevents: [確かめていない, 縛っていない]
    pitfalls: []
    scenes: [開発]
    summary: "完了の確かめを、依頼に書く・判定役に見張らせる・フックで終了を止める・書いていない者に確かめさせる、の段から任せる幅に応じて選べる。「確かめて」と書き足すより、手段を渡すほうが効く。"
    signs:
      - {type: goal, text: "テストが通るまで終わらせたくない"}
      - {type: symptom, text: "「確かめて」と書いても、確かめずに終わる"}
      - {type: goal, text: "任せる範囲に合わせて、確かめ方の強さを選びたい"}
