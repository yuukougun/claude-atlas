    tracks: []
    outdated_advice: []
    volatility: 低
    sections:
      - {title: "証拠の形（コマンド・生の出力・分母）", anchor: what-counts}
      - {title: "説明と事実が食い違ったら", anchor: facts-win}
      - {title: "道具の出力も確かめる（途中で切れた検索・失敗を成功として返す起動）", anchor: tool-output}
