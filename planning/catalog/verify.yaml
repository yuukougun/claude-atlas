# claude-atlas 目次：verify（確かめる）
# 形式：planning/catalog/README.md §3。語彙：schema/site.yml。担当：C8（工程3、2026-11-04）
# 境界（design §4.2、D4）：完了・事実・レビューの確かめ方は verify。検証器を作って守る・実験を回す・評価の指標は eval（eval.yaml）
# 前提の向き：verify の基本（define-done → evidence-not-reports → verification-ladder）を、eval と他分野の必須のページが前提にする。
#   そのため必須のページの前提は、basics の必須のページと verify の必須のページだけにした
field: verify
chapters: [完了を確かめる, 事実を確かめる, テストで確かめる, レビューで確かめる, 結果を疑う]
pages:
  # ── 完了を確かめる ──
