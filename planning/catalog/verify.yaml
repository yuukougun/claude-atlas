    prerequisites: [evidence-not-reports, request-vs-lock]
    related: [goal-until-done, stop-hooks, independent-review, protect-tests, verifier-defines-problem, model-quirks, when-to-lock, five-questions-before-delegating, claims-done-but-isnt, checking-unattended-runs, visual-checks, four-principles]
    tracks: [goal, hooks, code-review]
    outdated_advice: [add-double-check]
    volatility: 中
    sections:
      - {title: "四つの段", anchor: four-steps}
      - {title: "「念のため確認して」と書き足すより、確かめる手段を渡す", anchor: verbal-checks}
      - {title: "任せる幅に合わせて段を選ぶ", anchor: choose-step}
    templates: []
    visual: {kind: static, text: "四段の階段の図（依頼に書く → 完了の判定役 → フックで終了を止める → 書いていない者のレビュー）。上るほどお願いから鍵に近づくことを示す"}
    materials: ["00 §3 分野09（冒頭）", "00 §2 背骨が効く五つの経路の三つ目", "research/25 §3.4・P9（現行の Best practices の四段階）", "research/23 §3.1（Best practices の改稿。01 2-1 は改稿前）", "11 第2節 分野09 p34#124・p34#126・p34#128・p12#45", "03 W1（言葉での念押しと、確かめる手段の区別）", "11 第3節 3-2 #6・#7、3-3 #2・#4", "research/23 #3", "05 1-2"]
    notes: "段は現行の Best practices（2026-10-27 ごろ以降）の四段階で書く。01 2-1 の「検証用 subagent / workflow（別モデルに反証させる）」は改稿前の書き方（research/23 §3.1、research/25 §3.4）。/goal の判定役は会話しか読まないこと（証拠を会話に出させる）と、Stop hook の連続ブロックの上限は、版と確認日を付けて数値ファイルに置く。/goal と Stop hook の使い方の本体は delegate の goal-until-done と enforce の stop-hooks。prompting の does-double-check-work と台帳 add-double-check を分け合う。prompting の does-double-check-work（「念のため確認して」は効くか）が、q でこのページの節 verbal-checks にまとめられた（prompting.yaml の merged）ので、その題名と別名を aliases に移し、related から外した。節 verbal-checks の題名を「「確かめて」と書き足すことの今」から「「念のため確認して」と書き足すより、確かめる手段を渡す」に改め、まとめた判断（言葉で確認を命じるより、実行するテストや照らす先を渡す）が題から読めるようにした（anchor は同じ。models の2ページがこの節を指す）。自分で検証するモデルに確認を重ねて命じると過剰になる点は models の model-quirks が持つので related に足した。担当 F3 の案の「節 verbal-checks の level を整えるにする」は、節の level をページの level 以上にする規則（design §3.1 の5）に合わないので採らなかった。goal「テストが通るまで終わらせたくない」は stop-hooks と同じ文のまま束ねる（DR-15）（2026-11-04 工程4：DR-19 q。F3 が does-double-check-work をまとめた）"

