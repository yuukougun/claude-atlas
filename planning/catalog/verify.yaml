    summary: "完了の報告を、実行したコマンドと生の出力と分母のそろった証拠で受け取れる。説明と事実が食い違えば、実行・grep・git で見た事実を正とする。"
    signs:
      - {type: symptom, text: "テストの件数が、報告のたびに変わっている"}
      - {type: symptom, text: "うまくいった場合だけを並べた報告が返ってくる"}
