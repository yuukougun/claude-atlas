    materials: ["00 §3 分野09", "05 1-2（終わったように見えると止まる。公式の Best practices）", "11 第2節 分野09 p34#137・p34#124・p34#3", "research/25 P9・§3.4（「終わったように見えると止まる」は研究ではなく Best practices の内容）", "00 §5 台帳（keep going と書く）"]
    notes: "p34#137 の「止まって報告すべき条件」は prompting の permission-to-stop と重なる。ここでは完了の定義の一部として書き、止まる権利の効き方（Claude Opus 4.1 では効果が小さい。research/24 A-10）は permission-to-stop と protect-tests に任せる。アプリと API では、完了は形式・分量・合格の基準として渡す（タブで並べる）。prompting の提案で related に ask-for-outcomes（結果で頼む。完了の定義を前提にする）を足した（2026-11-04 統合：prompting#5）。症状のページが振り分ける困りごとの言い換え（「完了しました」と言うのに頼んだ状態になっていない＝claims-done-but-isnt、途中で止まる・頼んでいない所まで広げる＝keeps-stopping・does-more-than-asked）を signs から外し、完了の定義に固有の goal にした。止まって相談してほしい場面の goal は prompting の permission-to-stop・suggest-or-do にあるので足さない（2026-11-04 工程4：DR-19 a）"

