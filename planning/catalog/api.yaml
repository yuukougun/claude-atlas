    notes: "対応表は、アプリと Claude Code の機能を行に、API の概念を列にする（Claude Code の /compact・自動メモリ・スキル・-p も API の概念に当たる）。02 の Inferences が挙げる対応のうち、定期タスクと Managed Agents の対応は推測なので、本文では公式の記述（Managed Agents は定期の実行に向く。02 §5-9）の範囲で書く。比例則の対象外（任せる幅を広げる内容ではない。対応関係の表）。M9 で見直した：level は 00 の L3（任せる）のままにした。読者が最初にこの表を要するのは、長い作業を任せてキャッシュや自動の要約・圧縮の挙動に出会い、理由を知りたくなる段階で、プログラムを書かずに読める（仕組みにするではない）。任せる幅を広げる内容ではないので守りのページは足さず、比例則の警告は残す。要約の cache を、プロンプトキャッシングに合わせてキャッシュにした（2026-11-04 統合：M1・M9）"

  - id: stateless-messages-api
    chapter: アプリと API の対応
    title: "Messages API と会話の正体"
    aliases: [ステートレス, stateless, message threads, system と messages]
    type: concept
    level: 任せる
    level_evidence: "長い会話の重さと費用の理由を、仕組みから理解したくなる段階で要る"
    priority: 推奨
    surfaces: [api]
    principle: [見せる]
    prevents: [散らかっている]
    scenes: [開発]
    summary: "Messages API の基本の形は状態を持たず、呼び出し側が system と messages で毎回それまでの全体を渡すことが分かる。message threads で送る量を減らしても、モデルが読む量は変わらないことも分かる。"
    signs:
      - {type: symptom, text: "API で呼ぶと、前の発言を覚えていない"}
      - {type: goal, text: "API で会話を続けるには、毎回何を送ればよいか知りたい"}
    prerequisites: [rereads-whole-history]
    related: [feature-to-api-mapping, prompt-caching-in-practice, long-running-agent-context, where-instructions-sit, attention-budget, where-your-data-goes, what-uses-up-limits]
    tracks: [messages-api, message-threads]
    volatility: 中
    sections:
      - {title: "毎回、全体を渡す", anchor: stateless}
      - {title: "system と messages", anchor: system-and-messages}
      - {title: "message threads（送る量だけを減らす）", anchor: message-threads}
    visual: {kind: static, text: "毎回それまでの全履歴を渡してモデルが読み直す流れと、message threads では送る量だけが減り、モデルが読む量は変わらないことを並べた図"}
    materials: ["00 §3 分野13", "02 §5-1", "research/22 #40（message threads：送るのは差分にできるが、モデルが読む量・料金・rate limit は変わらない。ZDR と HIPAA の対象外）", "requirements §6.6（毎回読み直す受験者）"]
    notes: "比喩と「なぜ」の本体は basics の rereads-whole-history（前提）。ここは API の形（状態を持たない、system と messages、message threads）だけを書く（basics の担当の提案のうち、API に固有の操作に絞る案を採った）。message threads のデータの扱いを safety の where-your-data-goes へつなぐ。比例則の対象外（任せる幅を広げる内容ではない）。basics の提案に合わせ、要約と signs から「なぜ長い会話が重く高くなるか」（rereads-whole-history の要約と sign と同じ問い）を外し、API の形（呼び出し側が渡す・message threads で減るのは送る量だけ）に絞った（2026-11-04 統合：basics#3）"

