  # ── レビューと判断 ──
  - id: review-bottlenecks
    chapter: レビューと判断
    title: "レビューのボトルネックと疲労"
    aliases: ["レビュー疲れ", "review bottleneck"]
    type: concept
    level: 任せる
    level_evidence: "メンバーが Claude に作業を任せ始め、AI が書いた変更と PR が増えたときに、チームのレビューで最初に詰まる"
    priority: 必須
    surfaces: [claude-code]
    principle: [確かめる, 握る]
    prevents: [確かめていない]
    pitfalls: [預けすぎる, 体感を信じる]
    scenes: [チーム, 開発]
    summary: "AI で変更が増えると、レビューと動作確認が人に積もって詰まり、疲れも溜まりやすい理由が分かる。変更を出す速さではなく、レビューできる量に合わせて流す。"
    signs:
      - {type: goal, text: "AI で増えた PR を、チームでレビューできる量に合わせて流したい"}
      - {type: symptom, text: "マネージャーのところで PR が止まる"}
    prerequisites: [independent-review]
    related: [humans-set-the-parallel-limit, parallel-fatigue, diffs-humans-must-read, own-generated-code, risk-tiered-approval, separate-roles, grow-review-checklists, automated-pr-review, approval-fatigue, felt-vs-measured, "paved-roads#amplifier"]
    volatility: 低
    sections:
      - {title: "詰まる場所はレビューと動作確認", anchor: where-it-clogs}
      - {title: "事例の数値の読み方（自己申告と標本の大きさ）", anchor: reading-case-numbers}
      - {title: "流す量をレビューに合わせる", anchor: match-review-capacity}
    visual: {kind: static, text: "PR が増え、レビューと動作確認の待ちが人に積もる流れ"}
    materials: ["00 §3 分野17「レビューのボトルネックと疲労」（冒頭の段落の注記）", "research/25 P7a（疲労の調査：12名の自己申告、並列との因果は示されていない）・P7b（マージまでの時間：導入1か月の自社計測）", "11 第2節 分野12 p34#185・p56#56（自己申告）", "04 Q6（人間側がボトルネックになり、疲労する）"]
    notes: "事例の数値は、どれも小さな標本の自己申告か自社計測なので、条件（標本・期間・測り方）を添える（research/25 P7）。delegate の humans-set-the-parallel-limit は一人の並列の本数、こちらはチームのレビューの流れを持つ。サイン「AI で PR が増えて、レビューが追いつかない」「AI の作業を見守るだけで疲れる」と別名「レビューが追いつかない」は、症状のページ parallel-fatigue（並列にしたら疲れた・レビューが追いつかない）の困りごとの言い換えなので外し、やりたいことの形と、チームに固有の狭い場面（マネージャーのところで止まる）だけを残した。症状の入口として parallel-fatigue を related に置いた。前提の humans-set-the-parallel-limit（仕組みにする）を related の先頭に移した：一人の並列の本数の判断を知らなくても、チームのレビューの詰まりは読める（R1-10 の判断どうしの前提）。これで level を、AI が書いた変更が増えて詰まり始める任せるにできた（R3-7）。前提の independent-review は必須で、比例則の守りも兼ねる。related の ai-amplifies-organizations は paved-roads#amplifier に、curb-sycophancy-and-overtrust は separate-roles にまとめた（2026-11-04 工程4：DR-19 f・a・p・q）"

