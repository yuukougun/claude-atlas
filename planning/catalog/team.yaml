    notes: "優先度は推奨にした（C0 の見当のまま）：根拠は中で、チームが前提。一部はコンテストに固有なので、例は業務の形（QA・実装・レビュー）を先に書く。registry の curb-sycophancy-and-overtrust（チームで迎合と過信を防ぐ）を節 against-sycophancy にまとめた：独自の判断を1行で書けなかった（R3-17）。AI の同意を根拠に数えない原則は judgment の agreement-is-not-evidence、AI の承認を人の承認に数えないことは risk-tiered-approval、人どうしの独立の案出しは ideate-independently が持ち、残る「チームの疑う役と人どうしの批評で迎合に備える」はこのページの疑う人の役割そのものだったため。旧題を aliases に、議論の場面のサインをここに、承認の場面のサインと別名「AI のお墨付き」を risk-tiered-approval に移した。まとめた論点はアプリでの議論にも当たるので surfaces に app を、pitfalls に預けすぎるを足した。別名「自動化バイアス」は主のページ judgment の over-reliance に任せた（fix-aliases）。「最も安価な対策」とは書かず「安価な備えの一つ」にする（11 第4節 #64）。11 の新「チームで使う意味」（p56#52）は【2026-11-03 注記】付きの行なので根拠にしない。level を仕組みにするから任せるに改めた（R3-7）（2026-11-04 工程4：DR-19 q・f）"

