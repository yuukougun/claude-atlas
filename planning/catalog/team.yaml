      - {title: "禁止は設定で縛る", anchor: lock-the-prohibitions}
    templates:
      - {name: "チームの AI 利用ルール（任せてよい・止まって相談する・禁止）", kind: claude-md, safety: true}
    materials: ["00 §3 分野17「社内ガイドラインに書くこと」", "11 第2節 分野17 p56#55（AI はレビューの補助はできるが、唯一または最終の判定者にはなれない、という規約の例）・p56#122", "11 第1節 分野17 p56#21（judgment の agreement-is-not-evidence に含めた）", "11 第5節 A-3（禁止の節は A-4 と組にする。第3節 C-13、第4節 #20）", "04 Q3 社内導入（5つのリスク、deny の例）", "00 §4 安全の困りごと「会社や学校で使ってよいか確かめたい」"]
    notes: "雛形 A-3 は、禁止の節がお願いにすぎないことを注記し、deny と hook の雛形（enforce・verify の A-4）と組にして示す（11 第5節）。データの扱いを含むので safety: true。法令の解釈と社内規則の回避は書かない（design §6.11）。優先度を推奨から必須に上げた：design §1.2 が「状況から引く」の例に挙げる「チームで導入する」の行き先が任意の rolling-out-to-teams だけで、初版（必須）では着けなかった（R1-11）。チームで使い始めるときに最初に決めるのは、面に関わらずこの決まりなので、ここを必須の受け皿にし、サイン「チームで Claude を導入する」を置いた（rolling-out-to-teams と同じ文で、逆引きで1行に束ねる。DR-15）。前提の checking-ai-rules・where-your-data-goes・request-vs-lock はどれも必須で、必須の前提は必須の規則を満たす。level を仕組みにするから整えるに改めた：決まりはチームで使い始めたときに要る（前提の request-vs-lock が整えるなので、それより下にはしない。R3-7）。章「導入と決まり」の先頭に移した（ナビゲーションで最初に出る）（2026-11-04 工程4：DR-19 f）"

