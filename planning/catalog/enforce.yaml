  # ---------------------------------------------------------------- 何を縛るか
  - id: when-to-lock
    chapter: 何を縛るか
    title: お願いを鍵に移す判断
    aliases: [お願いから鍵へ, 指示を仕組みに移す, 決定論的な制御に移す, 会話で言った禁止事項は圧縮で消える]
    type: concept
    level: 任せる
    level_evidence: "同じ注意を二回したら仕組みに移すと判断できることが、任せるから仕組みにするへ上がる条件（design §3.1）。その判断が最初に要るのは任せる段階（00 でも L3）"
    priority: 必須
    surfaces: [claude-code, app, api]
    principle: [縛る]
    prevents: [縛っていない, 散らかっている]
    pitfalls: []
    scenes: [開発, チーム]
    summary: "頼んだ規則のうち、どれを権限ルールやフックに移すかを判断できる。同じ注意を二回した、強調しても破られた、会話で言った禁止が圧縮で消えた、が移す合図になる。"
    signs:
      - {type: symptom, text: "CLAUDE.md に「〜しない」と書いたのに破られる"}
      - {type: symptom, text: "「push しないで」と言ったのに、しばらくすると push された"}
      - {type: goal, text: "例外なく守らせたい規則がある"}
    prerequisites: [request-vs-lock, what-survives-compaction]
    related: [request-lock-table, permission-rules, hooks-basics, lock-side-effects, move-judgment-into-scripts, instructions-ignored, forgot-after-compaction, promises-after-compaction, what-to-put-in-claude-md#what-to-leave-out, emphasis-words, hook-vs-skill]
    tracks: [claude-md, hooks, permissions, compaction]
    outdated_advice: [important-caps]
    volatility: 中
    sections:
      - {title: "鍵に移す合図", anchor: signals}
      - {title: "会話で言った禁止は圧縮で消える", anchor: spoken-rules-fade}
      - {title: "鍵にしない規則（判断を含むもの）", anchor: what-not-to-lock}
    templates:
      - {name: "会話で言った禁止（git push）を拒否ルールに移す例", kind: settings, safety: true}
    visual: {kind: mermaid, text: "お願い（会話・CLAUDE.md）から鍵（権限ルール・フック）へ移すかを決める流れ図。合図（二回目の注意・強調の失敗・圧縮で消える）と、鍵にしない規則（判断を含むもの）の分かれ道"}
    materials:
      - "00 §3 分野10（お願いを鍵に移す判断・会話で言った禁止事項は圧縮で消える）"
      - "00 §4 指示と仕組みの困りごと"
      - "11 第2節 分野10 p34#13・p34#108"
      - "01 C-1（会話で言った禁止と分類器、圧縮で失われうる）・F-1・2-4・2-5"
      - "05 1-5・1-6"
      - "research/23 §3.1・§3.7（現行の Best practices の What you can stop doing）"
      - "design §3.1（任せる → 仕組みにするの上がる条件）・§10.5（縛るのは機械的に判定でき、害の大きい規則だけ）"
    notes: "registry の spoken-prohibitions-fade（会話で言った禁止事項は圧縮で消える）を節 spoken-rules-fade にまとめた（merged）。なぜ消えるかの本体は basics の what-survives-compaction、約束の扱いは context の promises-after-compaction に任せ、ここは「だから鍵に移す」の判断だけを持つ。00 の強調語の行の「1行だけにする」は改稿前の Best practices の勧めなので（00 §5 の注記、research/23 §3.7）、要約とサインの根拠にしない。節 spoken-rules-fade では、圧縮で残るもの・消えるものの一覧（公式の表）を繰り返さず、what-survives-compaction を指す（一覧はそこに一本化する。basics の提案）。約束の置き場所の判断全般（CLAUDE.md・rules・計画のファイル）は promises-after-compaction、会話で言った禁止を拒否ルールとフックに移す判断はこの節が持つ（context の提案。compact-and-auto-compact と promises-after-compaction がこの節を指す）（2026-11-04 統合：basics#2・context#6）。goal「例外なく守らせたい規則がある」は、prompting の emphasis-words の近い goal（担当 F3 が「強調に頼らずに、大事な指示を守らせたい」に書き分けた）と並ぶので、このまま残した（DR-15）。symptom の2文（CLAUDE.md に書いた禁止が破られる・会話で禁じた push をされた）は、鍵に移すことが直接の答えになる狭い場面として残した（catalog/README §4.5 の4の例）。situation「同じ注意を何度も繰り返している」は、症状のページ repeating-the-same-explanation（毎回同じ説明をしている）と instructions-ignored が振り分ける困りごとの言い換えなので外した（担当 F4 も extend の when-to-add-what の同じ文を goal に替えた）。goal の形は、when-to-add-what（繰り返しをどの仕組みに移すか）・basics の request-vs-lock（どの規則を強制するか）と、このページの「例外なく守らせたい規則がある」で足りる。「同じ注意を二回した」は鍵に移す合図として summary と節 signals に残す（2026-11-04 工程4：DR-19 a）"

