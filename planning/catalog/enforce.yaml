      - "research/28 §3.1（規則ごとの強制の仕組み）"
    notes: "鍵の側の属性（強制力・読み込みの時期・圧縮で残るか）は数値ファイルの features から生成し、手書きするのは判断例だけにする。prompt と agent の型のフックは別のモデルが判断するので鍵に数えない（research/27 §3.2）。MessageDisplay のフックは表示を差し替えるだけで止められないので、文体・言語の行で鍵として扱わない（00 分野15 の訂正、research/27 §3.2）。アプリの形式・文体の行（お願いの側）に Styles を挙げない。調子と形式をいつもそろえるなら指示、場面ごとに切り替えるならスキル（台帳 styles-for-tone、research/26 §3.1）。Claude Code の出力スタイルとは別の機能（2026-11-04 統合：M3）"

