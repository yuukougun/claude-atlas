  # ---------------------------------------------------------------- 権限と封じ込め
  - id: permission-rules
    chapter: 権限と封じ込め
    title: 権限ルール（allow・ask・deny）
    aliases: [permissions, permission rules, 許可ルール, 確認ルール, 拒否ルール, allow ルール, ask ルール, deny ルール, "/permissions"]
    type: feature
    level: 任せる
    level_evidence: "確認を減らして長い作業を任せ始めるときに、許可と拒否の規則を最初に書く（00 でも L3）"
    priority: 必須
    surfaces: [claude-code]
    principle: [縛る]
    prevents: [縛っていない, 境界がない]
    pitfalls: []
    scenes: [開発, チーム]
    summary: "許可・確認・拒否のルールで、Claude が使える道具とファイルを決められる。拒否は先に評価されるが、当たらないパスのルールと、効かない子プロセスがある。"
    signs:
      - {type: goal, text: "`.env` や migrations を絶対に触らせたくない"}
      - {type: goal, text: "よく使う安全なコマンドは、毎回確認させたくない"}
      - {type: symptom, text: "拒否のルールに書いたのに、下のフォルダにある同じ名前のファイルは読まれた"}
    prerequisites: [permission-modes-overview]
    related: [what-auto-mode-stops, sandboxing, protected-paths, protecting-secrets, when-to-lock, settings-layers, freeze-eval-assets, managed-settings-enforcement, lock-side-effects, before-opening-unknown-repos, share-team-settings, hook-vs-skill]
    tracks: [permissions, settings]
    volatility: 中
    sections:
      - {title: "評価の順番（deny → ask → allow）", anchor: evaluation-order}
      - {title: "パスの書き方と、何にも当たらないルール", anchor: path-rules}
      - {title: "子プロセスには効かない", anchor: child-processes}
      - {title: "信頼の前に効くもの・後に効くもの", anchor: workspace-trust}
    templates:
      - {name: "秘密のファイルと生成物への読み書きを拒むルールの例", kind: settings, safety: true}
    visual: {kind: mermaid, text: "deny → ask → allow の評価の流れと、ルールが届かない経路（自分でファイルを開く子プロセス・MCP・フック）"}
    materials:
      - "00 §3 分野10（権限ルール）"
      - "00 §4 指示と仕組みの困りごと（.env や migrations を絶対に触らせたくない）"
      - "01 B-1（設定の階層、信頼の後に効く allow）・C-3"
      - "research/23 #4・#5"
      - "research/28 #10〜#13・#19"
      - "research/22 #4・#8"
      - "11 第4節 #21（deny のパスの書き方。Read(./.env) は直下だけに当たる）"
    notes: "工程2の事実：Write・NotebookEdit・Glob のパスのルールは受け付けられるが何にも当たらない（書き込みは Edit、Glob の代わりは Read で書く。research/23 #4、research/28 #11）。Read と Edit の deny は、組み込みの道具と Claude Code が見分けるシェルのコマンドにしか効かず、任意の子プロセスには効かない（すべてのプロセスを止めるのは sandbox。research/23 #5）。deny と ask は信頼の前から効き、プロジェクトの allow は信頼の後だけ（research/28 #19）。フックの allow で deny は外せない（research/28 #13）。/permissions のタブの旧名 Recently denied は、台帳ではなく数値ファイルと本文の注記で扱う（research/22 #8・§3.4）。題名の括弧の allow・ask・deny は設定のキーなので原文のまま残し、本文と summary のルールの呼び名は M1 の仮の表記（許可ルール・確認ルール・拒否ルール）にそろえ、aliases に allow ルール・ask ルール・deny ルールを入れた。逆引きの「`.env` や migrations を絶対に触らせたくない」は、同じ意味の sign（`.env` や特定のフォルダ）を逆引きの文に置き換え、block-with-exit-2 と同じ文にした（2026-11-04 統合：M1・B #37）。symptom「拒否のルールに書いたのに、そのファイルを読まれた」は sandboxing の「拒否のルールを書いたのに、スクリプト経由で読まれた」と近く、症状のページ secrets-exposed の「.env の中身を読まれた」にも重なるので、このページが直接の答えになる場面（パスの書き方。Read(./.env) は直下だけに当たる。11 第4節 #21・節 path-rules）に書き分けた（R1-06・DR-15）（2026-11-04 工程4：DR-19 a）"

