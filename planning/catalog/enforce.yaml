      - {title: "コンテナ（Docker・devcontainer）との使い分け", anchor: containers}
    templates:
      - {name: "秘密の場所を塞いでサンドボックスを有効にする設定の例", kind: settings, safety: true}
    visual: {kind: static, text: "サンドボックスの内側（Bash とその子プロセス）と外側（組み込みのファイルの道具・MCP・フック）の境界の図"}
    materials:
      - "00 §3 分野10（sandbox で封じ込める）"
      - "01 C-4"
      - "05 4-4・4-5・4-6"
      - "research/23 #5"
      - "research/28 #9・#36〜#44・§3.6"
      - "research/22 #4・#7"
      - "decisions 2026-11-03「安全の既定の勧め方」「危ない雛形を試す場所」"
      - "05 4-6（公式の Security：機密性の高いリポジトリは、sandbox runtime か dev container の中で動かす）"
      - "04 Q3（DevContainer のファイアウォールを使うチームの運用）"
    notes: "level を registry の「仕組みにする」から「任せる」に改めた（decisions 2026-11-03「安全の既定の勧め方」）。工程2の事実：Linux と WSL2 では bubblewrap と socat を使う（research/28 #36。制作の環境には 2026-11-04 に入った）。依存が欠けると既定でサンドボックスなしで動くので、頼る設定には failIfUnavailable を付ける（#40）。sandbox の denyRead は Read の道具を止めず、Read の deny は子プロセスを止めないので二重にする（research/23 #5）。フック・MCP・組み込みのファイルの道具は外側（#43）。権限ルールとサンドボックスでパスの書き方が違う（#41）。逆引きの「auto モードに任せて大丈夫か」を what-auto-mode-stops と同じ文で置いた（auto モードは安全を保証しないので、任せる段階ではサンドボックスで囲う）。段階ごとの既定の正本は safety の default-safety-settings#by-stage なので、related をその節に向けた（2026-11-04 統合：B #51・M6）。WSL2 では、サンドボックスの中から Windows の実行ファイル（cmd.exe や /mnt/c の下）を起動でき、止めるには seccomp のフィルタが要る（research/28 #37、R4-8）。雛形には failIfUnavailable: true を入れ、Windows の実行ファイルの経路を動作確認の期待に足す（2026-11-04 工程4：DR-07）。見せ方：検証ノート（制作の環境の WSL2 で、サンドボックスが止めたものと止めなかったものを、版と日付付きで記録する）（2026-11-04 工程4：DR-17）。R1-14：節 containers と goal「Docker や devcontainer の中で Claude Code を動かすべきか決めたい」を足した。コンテナや VM の中で動かす形（公式の Security は、機密性の高いリポジトリで sandbox runtime か dev container での実行を勧める。05 4-6）と、組み込みのサンドボックスの使い分けを書く。第三者の道具の名前を出すときは成熟度と確認日を付ける（DR-17）。別名の devcontainer・Docker・コンテナは、いったんここに足したが、担当 F6 が safety の where-bypass-is-ok に置いた（使い捨てのコンテナの雛形と sign「コンテナの中で Claude Code を無人で動かしたい」があり、このページの OS のサンドボックスはコンテナではない）ので、重ねないようここからは外した（DR-19 d）。無人で bypassPermissions を使うのは隔離したコンテナか VM の中だけで、その条件と手順の雛形は where-bypass-is-ok が持つ。コンテナの雛形はここに置かない（この環境では試せない：podman がなく、Docker Desktop は WSL と連携していない。DR-07、decisions「危ない雛形を試す場所」）（2026-11-04 工程4：DR-19 h・d）"

