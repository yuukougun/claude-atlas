      - "00 §4 指示と仕組みの困りごと（毎回フォーマッタ）・会話と文脈の困りごと（大量のログやテスト出力）"
      - "01 F-1（公式の代表的な用途）"
      - "research/28 #1・#14・§3.1"
      - "research/22 #5"
      - "design §10.5（制作の縛り H1〜H4）"
      - "03 Q8 F6（決めた道具を使わない：uv でなく pip で入れる）・T4 の反対意見（フックで誘導しきれず、PATH の差し替えで止めた例）"
      - "01 F-1（フックの if に権限ルールの構文を書ける）・research/28 #6（if の Bash の判定は best-effort）"
    notes: "担当にだけ禁じる型は、入力の agent_id の有無で見分ける（agent_type は --agent でメインにも付くので使わない。permissions の deny はメインも止め、disallowedTools は指定子を付けても Bash 全体を外す。research/28 #1・#14）。制作の .claude/settings.json の H3 と同じ型なので、土台作りで確かめた結果を雛形の動作確認に使える。日本語の表記の検査（textlint）の型は japanese の textlint-hook に任せる。R1-13：決めたコマンドへ誘導する型を節 redirect-commands と goal と雛形で足した。PreToolUse で決めていないコマンドを止め、決めたコマンドを理由とともに返す（返し方は block-with-exit-2#reason）。if の Bash の判定は best-effort なので、確実に止めるには拒否ルールと組む（research/28 #6）。フックで誘導しきれず PATH の差し替えで止めた実践の例もあり、手段の一つとして並べる（03 Q8 F6・T4）。決めたコマンドはまず CLAUDE.md に書く（extend の what-to-put-in-claude-md#what-to-write）。困りごとの文（決めたコマンドを使わず別の方法で実行する）は症状のページ instructions-ignored か what-to-put-in-claude-md が持つので、ここは goal の形にした（2026-11-04 工程4：DR-19 h）。見せ方：雛形と並べて、制作の .claude/settings.json の deny とフック（DR-08 の H2：止めて理由と代わりの gen_site.py を返す＝節 redirect-commands の実例、H3：担当にだけ commit を禁じる＝節 subagent-only）を注釈付きで示す（2026-11-04 工程4：DR-17）"

