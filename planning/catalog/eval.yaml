# claude-atlas 目次：eval（評価と実験）
# 形式：planning/catalog/README.md §3。語彙：schema/site.yml。担当：C8（工程3、2026-11-04）
# 境界（design §4.2、D4）：検証器を作って守る・実験を回す・評価の指標は eval。完了・事実・レビューの確かめ方は verify（verify.yaml）
# 第一波の核（D10「評価と実験の核」）：総論 verifier-defines-problem と、eval のほかのページの多くが前提にする
#   felt-vs-measured・measure-changes・verifier-three-conditions の4ページに wave: 1 を付けた（理由は各ページの notes と報告 catalog-C8.md）
#   2026-11-04 メインの判断で test-the-verifier・experiment-log にも wave: 1 を付けた（計6。統合では変えない）
# 前提の流れ：verify の verification-ladder → 総論 → 三条件 → 検証器の確かめ方。体感と実測 → 小さな eval → 選択圧 → 実験台帳・ロックボックス
# 用語：verifier を「検証器」にそろえた（評価器・採点器は aliases と本文の言い換え）
field: eval
chapters: [総論, 変化を測る, 検証器を作る, 実験を回す]
pages:
  # ── 総論 ──
  - id: verifier-defines-problem
    chapter: 総論
    title: "検証器が問題を定義する（Claude は置かれたループを何でも加速する）"
    nav_title: "検証器が問題を定義する"
    aliases: [評価器が問題を定義する, 評価を握る, 最初の成果物は検証器]
    type: concept
    level: 任せる
    level_evidence: "テストや点数を目標に Claude に反復させ始める任せるの段で、検証器の質が結果を決めるようになる"
    priority: 必須
    wave: 1
    surfaces: [claude-code, api]
    principle: [確かめる, 握る]
    prevents: [確かめていない]
    pitfalls: [預けすぎる]
    scenes: [開発, データ分析, コンテスト]
    summary: "Claude は渡された検証器（テスト・採点・ベンチマーク）が定める問題を解き、置かれたループを何でも速めることが分かる。検証器が誤れば、誤りも同じ速さで増える。"
    signs:
      - {type: goal, text: "Claude に長く改善を回させても、方向を誤らせたくない"}
      - {type: symptom, text: "テストに書いた条件だけが満たされ、書かなかった意図は抜けていた"}
      - {type: situation, text: "スコアやテストを目標に、Claude に試行を繰り返させている"}
    prerequisites: [verification-ladder]
    related: [verifier-three-conditions, selection-pressure, measure-changes, reward-hacking, four-principles, protect-tests, what-not-to-delegate, misses-broken-evaluation, build-test-harness, evaluators-by-format, open-ended-loop-trap, goal-until-done]
    tracks: []
    outdated_advice: []
    volatility: 低
    sections:
      - {title: "ループは何でも速める", anchor: loops-amplify}
      - {title: "最初の成果物は検証器", anchor: verifier-first}
      - {title: "評価と実験の地図", anchor: map}
    templates: []
    visual: {kind: static, text: "ループの図：Claude の変更 → 検証器 → 合否や点数 → 次の変更。検証器がずれていると、ずれた方向へ速く進むことを示す"}
    materials: ["requirements §3.1（握る）・§4.3（eval の総論）", "11 第1節 分野09 総論 p34#1・p34#5", "11 第2節 分野09 p34#3・p12#64・p12#45", "11 第2節 分野00 p12#1・p12#16・p12#86", "10 第8章", "research/24 A-7・B-32"]
    notes: "総論。reward hacking（basics）より広く、正直に最適化しても検証器の穴に合わせ込むことを書く。評価のループで大きく伸びた ALE-Bench の比較（p12#16）は Claude 以外のモデルの結果で、Claude の傾向としては書かない。C コンパイラの事例（p34#3）は Claude の並列の例で版依存。「AI はほぼ全形式で人の最上位に並んだ」は言い過ぎ（research/24 A-7）なので、総論の導入に使わない。人が規則の範囲で再現できる構造の話は、大会の規則で使える範囲に限って書く（research/24 B-60）。「テストは全部通るのに、欲しかったものになっていない」は、症状のページ misses-broken-evaluation（手元の評価は良いのに本番で通用しない）と claims-done-but-isnt が振り分ける困りごとの言い換えなので、このページが直接の答えになる狭い場面（検証器に書いたことだけが解かれる）にした（R1-07）（2026-11-04 工程4：DR-19 a）"

