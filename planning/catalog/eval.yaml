    notes: "priority を推奨から必須に、level を任せるから整えるに、type を concept から judgment に変えた。理由：人の側の五つの落とし穴のエ（体感を信じる）を受け持つページで、judgment の総論とア・イ・ウ・オのページ（必須、主に整える）とそろえるため。symptoms の seems-less-capable から routes で振り分けられる（judgment の型なので、症状のページの前提には置かない）。根拠の強さは research/24 F1 のエの行（強。ただし METR は熟練の開発者16人・2025年前半の道具で、追試は確かめていない。学習のずれの研究は GPT-4 と高校の数学）。「AI は遅い」の結論には使わない（00 §3 分野09）。「前より賢くなくなった気がする」は症状のページ seems-less-capable（題名「急に賢くなくなった気がする」）の言い換えなので外し、体感をどこまで信じるかを問う goal にした（劣化を測って確かめる手順の本体は models の suspected-degradation。DR-19 j）（R1-04）（2026-11-04 工程4：DR-19 a）"

