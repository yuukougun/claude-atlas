    visual: {kind: static, text: "同じタスクを変更の前後で数回ずつ走らせた結果の表。少なくとも1回の成功（pass@k）と、毎回の成功（pass^k）の違いを示す"}
    materials: ["00 §3 分野09", "00 §3 分野13（プロンプトの評価（eval）入門：api の prompt-evals-intro をまとめた）", "00 §4 確かめ方の困りごと", "02 4-0（成功の基準を先に決める）", "05 3-14・5-2・5-3", "11 第1節 分野09 p12#88・p56#71・p56#96", "11 第2節 分野09 p34#38・p34#39・p34#40・p34#166・p34#4", "11 第1節 分野09 小項目 p34#52（層別と最悪ケース）", "research/24 A-12・B-51・B-53", "01 D-2（スキルの有り無しを新しいセッションで比べる公式の方法：skill-creator のプラグイン・claude plugin eval）"]
    notes: "priority を推奨から必須に、level を仕組みにするから任せるに変えた。理由：逆引き「CLAUDE.md を変えて良くなったか知りたい」の受け皿で、eval のほかのページの多くが前提にする（registry の wave_core）。models の after-switching-models（必須・任せる）の前提にも置ける。registry の stratified-and-worst-case をまとめ、節 by-stratum にした（merged）。「失敗したタスクを数個〜二十個ほど、前後で数回ずつ」は 05 の推論の提案なので、本文では目安として書く。小さな集合では大きな差しか見分けられないこと（p34#39、research/24 B-53 で検算）と、実行環境だけで結果が動くこと（research/24 B-51。Claude のモデルで測った）を添える。p34#4 は採点・仕様・課題を直し scaffold も替えた例（research/24 A-12）。api の prompt-evals-intro（プロンプトの評価入門）は api の担当がここにまとめた：成功の基準を先に決めること（公式のプロンプトの手引きの前提）、task・trial・grader・transcript・outcome の語と pass@k・pass^k の違いを節 terms と graders に入れ、API で多数の試行を回す手段は api の batch-api-basics にリンクする。例には、CLAUDE.md の変更のほかに、プロンプトや指示を変えたときの小さな eval（prompting の提案）と、英語への回帰を数える検証ノート（japanese の keep-replies-in-japanese#measure。japanese の提案）を使う。extend の確認を受け、スキルの有り無しを新しいセッションで比べる公式の方法（skill-creator のプラグイン・claude plugin eval。01 D-2）を節 compare-skills の例にした（extend の writing-skills は節 evaluate からこのページへ案内する）。道具の名前・使える面・版は変わりうるので、tracks の plugin-eval（new_features）で追い、本文では数値ファイル経由で書く。summary の skill をスキルにした（M1）（2026-11-04 統合：M1・extend#4）。見せ方：検証ノート（制作の環境で、CLAUDE.md かスキルを変えた前後に同じタスクを数回ずつ走らせた観察。日付と版を付け、数回なら「観察」と書く。繰り返して「傾向」と書く数件の候補には、japanese の keep-replies-in-japanese#measure の英語への回帰の数え方がある。design §6.10）（2026-11-04 工程4：DR-17）"

