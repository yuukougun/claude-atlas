    notes: "「本番を代表する」の例の多く（対戦型の大会の事後報告）は類推と書き、業務の例（手元のデータと本番のデータの違い）と並べる。「書き換えられない」の手段は verify の protect-tests と enforce の freeze-eval-assets、「本番を代表する」の手段は lockbox-and-holdout と check-the-metric にリンクする。basics が reward-hacking を必須に上げたので、「書き換えられない」の「なぜ」として前提にした（basics の提案）。recipes・contest の前提になるので、段は任せるより上にしない（recipes・contest の提案）。「手元の評価では勝つのに、本番では効かない」は症状のページ misses-broken-evaluation の「手元のスコアは上がるのに本番で通用しない」の言い換え（R3 の付表A の4）なので、このページが直接の答えになる狭い場面（本番を代表しない入力）にした。ほかの eval のページも原因に固有の場面に書き分けた（選び続けた＝selection-pressure、指標がずれた＝check-the-metric、隠しテストで落ちた＝lockbox-and-holdout。R1-07）（2026-11-04 工程4：DR-19 a）"

