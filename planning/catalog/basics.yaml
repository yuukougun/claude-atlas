    volatility: 低
    visual: {kind: static, text: "同じ一文を英語と日本語でトークンに区切って色分けした列。倍率はトークナイザーで変わると添える"}
    materials:
      - "00 §3 分野01「トークンとは（日本語の場合）」"
      - "05 §3-1（トークンとトークン化）と Inferences（語のかけら）・Gaps と注記"
      - "research/27 #13（公式は言語ごとの倍率を出していない。Opus 4.7 以降の新しいトークナイザー。token counting で数える）"
      - "02 §5（token counting など API の概念）"
    notes: "ここはトークンの仕組みと、日本語ではトークンの量が変わるという考え方までにし、英語に替えて節約するかの判断と数え方は japanese の can-i-prompt-in-japanese#tokens に任せた（japanese が more-tokens-in-japanese をそこへまとめた。design §4.2：日本語に固有の論点は japanese。registry の notes の重なりの組）。そのため題名から「（日本語の場合）」を外した。例は日本語で出す。倍率の数値は数値ファイルに置き、本文と summary に書かない（05 §3-1 の比率は旧い tokenizer の移植版によるもので、現行のモデルの値ではない）。（2026-11-04 統合：basics#1・japanese#1・japanese#3）"

  - id: attention-budget
    chapter: コンテキストと注意
    title: コンテキストウィンドウと注意の予算
    aliases: [context window, attention budget, 注意の予算, 広い机]
    type: concept
    level: 使う
    level_evidence: "使う→整えるの上がる条件「見えていない／散らかっている を言い分けられる」の土台（requirements §3.3）"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [見せる]
    prevents: [散らかっている]
    summary: "コンテキストウィンドウに入ることと中身をよく使えることは別で、関係のない情報が増えるほど大事な情報への注意が薄くなることが分かる。見せることに片付けることが含まれる理由でもある。"
    signs:
      - {type: goal, text: "コンテキストが広くなったのなら、資料を全部入れてよいのか知りたい"}
      - {type: goal, text: "資料を多く渡すほど、大事な点が拾われにくくなる理由を知りたい"}
    prerequisites: [tokens]
    related: [context-rot, rereads-whole-history, subagent-isolation, large-context-window, tidy-the-desk, always-on-costs, inspect-context, "four-principles#show"]
    tracks: [context-window]
    outdated_advice: [save-context-for-200k]
    volatility: 低
    visual: {kind: static, text: "広い机：書類が増えるほど一枚ごとの目配りが薄くなる。机の広さと、よく読めることは別"}
    materials:
      - "00 §3 分野01「コンテキストウィンドウと注意の予算」"
      - "05 §3-2（Effective context engineering の attention budget と、高シグナルなトークンの最小集合）と Inferences（巨大な机）"
      - "00 §1 の段落（溢れさせない技術から、質とコストのために机を整える習慣へ）"
      - "research/23 #1・§3.1（「埋まるほど性能が落ちる」は改稿前の Best practices の前提。現行は溢れることはまれとし、質とコストのために /clear を勧める）"
    notes: "改稿前の Best practices の「コンテキストはすぐ埋まり、埋まるほど性能が落ちる」（research/23 #1）を根拠にしない。根拠は Anthropic の context engineering の記事と context rot の研究で書き、溢れることはまれでも質とコストのために片付ける、という現行の公式の立場に合わせる。窓の大きさの値は数値ファイルに置く。sign の「資料をたくさん渡したのに、大事な点を拾ってくれない」は、症状の skipped-later-pages（添付したのに読んでいないような答え）や forgets-in-long-chats が振り分ける困りごとの言い換えになるので、理由を知りたい goal にした。lost-in-the-middle は context-rot の節にまとめたので関連から外した（context-rot は関連の先頭にある）。（2026-11-04 工程4：DR-19 a・p）"

  - id: rereads-whole-history
    chapter: コンテキストと注意
    title: 毎ターン全履歴を読み直す
    aliases: [会話全体の再送, ステートレス, 長い会話が重い理由, 読み直す受験者]
    type: concept
    level: 使う
    level_evidence: "長い会話ほど遅く重くなり上限を早く使う、という使い始めの体験の理由になる"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [見せる]
    prevents: [散らかっている, 合っていない]
    summary: "Claude は毎回、会話の最初からすべてを読み直して返事をするので、長い会話ほど遅く重く、上限も早く使うことが分かる。同じ前置きが続くとキャッシュで安くなる理由にもつながる。"
    signs:
      - {type: goal, text: "長い会話ほど返事が遅く、上限の減りも早くなる理由を知りたい"}
    prerequisites: [tokens]
    related: [attention-budget, why-prompt-caching, what-survives-compaction, when-to-start-fresh, stateless-messages-api, what-uses-up-limits, hits-limits-quickly]
    volatility: 低
    visual: {kind: static, text: "公式の Explore the context window の対話型の図へのリンクを主にし、自作するのは公式にない点（毎ターン全部を読み直すこと、窓に近づくと圧縮されること）だけの静止図にする。動く図にするのは、公式で足りないと試作で分かったときだけ"}
    materials:
      - "00 §3 分野01「毎ターン全履歴を読み直す」"
      - "05 §3-1（Manage costs：Claude Code は毎回の request で会話全体を送る）と Inferences（読み直す受験者）"
      - "research/22 #40（message threads は送る量を減らすが、モデルが毎回全体を読むことと料金は変わらない。比喩は保てる）"
      - "requirements §2（動く図の例：コンテキストの埋まり方）・§6.6（比喩の一覧）"
    notes: "api の stateless-messages-api（Messages API と会話の正体）と同じ仕組みで、api の担当はそのページを API に固有の操作（messages の配列・message threads）に絞り、このページを前提にした（面ごとに分けない：D9）。図はコンテキストの埋まり方の図で、requirements §2 が動く図の例に挙げるもの。（2026-11-04 統合：basics#3・context#4・M1・M8）図は公式の対話型の図（Explore the context window）へのリンクを主にし、自作は公式にない点だけの静止図にする（統合の M8 を改めた。動く図にするのは公式で足りないと試作で分かったときだけ。DR-17・R2-29）。sign の「会話が長くなると返事が遅くなり、上限の減りも早くなる」は、症状の hits-limits-quickly（上限の減り）と too-slow（返事の遅さ）の困りごとの言い換えなので、もう1つの goal とまとめて理由を知りたい goal にした（DR-19 a）。（2026-11-04 工程4：DR-19 a・DR-17）"

  - id: context-rot
    chapter: コンテキストと注意
    title: context rot と紛らわしい情報
    aliases: [コンテキストの劣化, 長い会話の劣化, distractor, 失敗の残骸, lost in the middle, 中ほどの情報は使われにくい, 位置の効果, U 字型の性能]
    type: concept
    level: 使う
    level_evidence: "症状「長い会話で前提を忘れる・雑になる」（symptoms の forgets-in-long-chats、使う）の原因の説明で、使う→整えるの上がる条件の「散らかっている」の中身（requirements §3.3）。registry の見当は整える"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [見せる]
    prevents: [散らかっている]
    summary: "入力が長くなるほど、また似ているが違う情報が混ざるほど、答えの質が下がりやすいことが分かる。失敗した試みが会話に残ると紛らわしい情報になるので、片付けや巻き戻しが効く。"
    signs:
      - {type: goal, text: "長い会話で答えの質が落ちていく理由を知りたい"}
      - {type: goal, text: "失敗した試みが会話に残ると、同じ誤りに戻りやすくなる理由を知りたい"}
      - {type: goal, text: "長い資料の真ん中の情報は使われにくい、というのは本当か知りたい"}
    prerequisites: [attention-budget]
    related: [forgets-in-long-chats, going-in-circles, when-to-start-fresh, rewind-dont-correct, tidy-the-desk, handoff-documents, large-context-window, long-context-first, handing-long-documents, skipped-later-pages]
    outdated_advice: [save-context-for-200k]
    volatility: 低
    sections:
      - {title: "中ほどの情報は使われにくいか（lost in the middle）", anchor: lost-in-the-middle, level: 整える}
    visual: {kind: static, text: "似ているが違う書類が混ざるほど、正しい一枚を取り違える図。数値は傾向として、研究のモデルと世代を添える"}
    materials:
      - "00 §3 分野01「context rot と紛らわしい情報」"
      - "05 §3-3（Chroma の18モデルの実験。distractor、needle と質問の類似度）と Inferences（似ているが違う書類）"
      - "11 第2節 分野01「context rot と紛らわしい情報」p34#106（足すものなし）"
      - "research/23 #1（改稿前の Best practices の前提を根拠にしない）"
      - "00 §3 分野01「中ほどの情報は使われにくい（lost in the middle）」（節 lost-in-the-middle）"
      - "05 §3-4（位置の効果の研究と、Chroma の実験で位置の差が目立たなかった注意）・Gaps（掲載誌は未確認）（節 lost-in-the-middle）"
    notes: "level を registry の見当（整える）から使うに下げた（level_evidence）。症状の forgets-in-long-chats（使う）が前提にしても段階が逆転しない。研究は旧い世代のモデル（Claude 4 など）の結果なので、どのモデルの結果かを書き、現行の Claude の傾向としては書かない（requirements §6.2）。用語 context rot は研究の名前なので題名に残した。症状の項目「会話が長くなると精度が落ちる」は症状の forgets-in-long-chats にあるので、ここには同じ文を置かず、理由を知りたい読者の goal にした（M2）。（2026-11-04 統合：M2）lost-in-the-middle（推奨・整える）を節 lost-in-the-middle（level 整える）にまとめ、別名と旧題名をこのページの aliases に移した（merged。DR-19 p・R3-16：研究の結果の紹介が本体で独自の判断がなく、prompting の long-context-first も前提にしていなかった）。節では、研究は 2023 年のモデルの結果で、2025 年の実験では位置の差が目立たなかったこと（05 §3-4）を中心に、条件とモデルの世代で変わり、いつでも成り立つ法則ではないと書く。並べ方の手段は prompting の long-context-first と context の handing-long-documents に任せる。U 字型の図を節に置くなら、条件によっては差が消えることを併記する。sign の「失敗したやり方を何度も蒸し返してくる」は症状の going-in-circles（直してと言うたびに同じ間違いが戻ってくる）の言い換えなので、理由を知りたい goal にした。旧ページの sign「長い資料の真ん中あたりの内容を見落とされる」も症状の skipped-later-pages の言い換えなので、節の問いの goal にして移した（DR-19 a）。（2026-11-04 工程4：DR-19 p・a）"

  - id: why-prompt-caching
    chapter: コンテキストと注意
    title: プロンプトキャッシング（先頭が変わらないことの価値）
    nav_title: プロンプトキャッシングの仕組み
    aliases: [cache, キャッシュが切れる, 先頭部分の一致]
    type: concept
    level: 整える
    level_evidence: "資料の置き方や会話の進め方を整える段階で要る。アプリでは、よく使う資料をプロジェクトに置くと使用量が抑えられる理由になる（app の using-projects も整える）。Claude Code と API では、途中で effort・モデル・道具を変えると費用と上限の減りが増える理由になる（how-thinking-works と cost の what-uses-up-limits も整える）"
    priority: 推奨
    surfaces: [app, claude-code, api]
    principle: [見せる]
    prevents: [合っていない]
    summary: "会話の先頭（ツールの定義・システムプロンプト・前の発言）が変わらなければ読み直しが安く済み、途中で変えるとそこから後のキャッシュが外れることが分かる。途中で何を変えないかと、よく使う資料をどこに置くかを決める土台になる。"
    signs:
      - {type: goal, text: "セッションの途中でモデルや設定を変えると費用が増える理由を知りたい"}
    prerequisites: [rereads-whole-history]
    related: [prompt-caching-in-practice, using-projects, compact-and-auto-compact, always-on-costs, what-uses-up-limits, how-thinking-works]
    tracks: [prompt-caching]
    volatility: 中
    visual: {kind: static, text: "積み木：tools → system → messages の順に積み、上の段を変えると下の段のキャッシュがすべて外れる"}
    materials:
      - "00 §3 分野01「prompt caching（先頭が変わらないことの価値）」"
      - "05 §3-11（先頭部分の完全な一致、cache が無効になる操作、/usage の Prompt cache の行）と Inferences（付箋・積み木）"
      - "05 §3-8（effort を変えると prompt cache が無効になる）"
      - "02 §1-2・§5（アプリの対応物：プロジェクトの資料はキャッシュされ、繰り返し使うときの消費が少ない。使わない時間が続くと切れる。Help Center の Usage limit best practices）"
    notes: "題名は公式の日本語版の多数派（プロンプトキャッシング。research/27 §3.1）に合わせ、英語名を aliases に置いた。料金の倍率と cache の寿命は数値ファイルに置く。費用の仕組みの説明で、任せる幅を広げる内容ではない。M9 で段階を見直し、任せるから整えるに下げ、面にアプリを足した。最初に要るのは長い作業を任せる段階ではなく、資料の置き方や effort・モデルの使い方を整える段階で、アプリでもプロジェクトに置いた資料はキャッシュされる（02 §1-2・§5）。段の規則は保たれる（前提の rereads-whole-history は使う、このページを前提にする api の prompt-caching-in-practice は仕組みにする）。優先度は推奨のまま。下げたので比例則の対象の段から外れた。アプリの手段はタブで並べ、面ごとの機能の対応表は api の feature-to-api-mapping に任せる。（2026-11-04 統合：M9・M1）英語名の prompt caching は、api の prompt-caching-in-practice（機能のページ）を用語索引の主にしたので、このページの別名から外した。日本語の題名（プロンプトキャッシング）でこのページを引ける。（2026-11-04 工程4：DR-19 d）"

  - id: what-survives-compaction
