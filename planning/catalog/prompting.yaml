  - id: does-double-check-work
    into: verification-ladder
    reason: "独自の判断を1行で書けない（R3-17、DR-19 q。2026-11-04 工程4）。要点の「「念のため確認して」と言葉で書き足すより、確かめる手段（実行するテスト・照らす先）を渡す」は、verify の verification-ladder の節 verbal-checks（「確かめて」と書き足すことの今）と summary の2文目と同じで、00 §3 分野09 もこの区別を検証の階段に置く。答えの本体（確かめる手段と証拠）は evidence-not-reports にもある。自分で検証するモデルに確認を重ねて命じると過剰になる点は models の model-quirks と after-switching-models が持ち、台帳 add-double-check は verification-ladder も指している。題名と別名は、まとめ先の aliases に移る（verify の側が同じ工程で「「念のため確認して」は効くか」「double-check して」を足した）。prompting からは allow-i-dont-know・before-after-prompts が verification-ladder#verbal-checks を指す"
