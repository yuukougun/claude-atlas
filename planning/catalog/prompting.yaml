  - "提案（models・symptoms・メイン）：does-double-check-work を verify の verification-ladder（節 verbal-checks）にまとめた（2026-11-04 工程4：DR-19 q）。verify の側は同じ工程で、題名と別名を verification-ladder の aliases に移し、evidence-not-reports・verification-ladder の related から外した。残る参照（symptoms の claims-done-but-isnt。models の model-quirks・after-switching-models は同じ工程で直された）は verification-ladder#verbal-checks に直すか外す。下の2026-11-04 統合の提案のうち does-double-check-work を指すものは、まとめ先に読み替える"
  - "提案（symptoms・safety）：断られたときの頼み直しは、prompting にも新規のページ（when-refused）を足しかけたが、safety の when-requests-are-refused（新規）と題も中身も同じなので取り下げ、症状の入口は symptoms の refused-or-blocked、対処の本体は safety の when-requests-are-refused とみなして、give-reasons・asking-for-reasoning からそこを指した。refused-or-blocked の related に when-requests-are-refused を入れてほしい。あわせて、decisions 2026-11-03「断られたときの頼み直し」の手段の一覧に「モデルを変える」はなく、アプリの自動のモデル切り替えは仕組みとして説明する、とある。research/26 §4.3 も、モデルを変えると通ることがあるという案内は回避と紛らわしいので自動の切り替えの説明にとどめる案である。refused-or-blocked の notes の「モデルを変える」を、この線に揃えたい。自動の切り替えの設定を tracks で追うなら、機能の id（例：switch-models-when-flagged）を safety か symptoms の new_features に足すとよい"
  - "提案（context）：資料の渡し方の境界。依頼の中の並べ方・答えの前に引用を抜かせること・原文か要約か（requirements §6.7 の3行目）は prompting の long-context-first、資料の形と量（分割・Markdown にする・添付）は handing-long-documents に置きたい。handing-long-documents の related に long-context-first を入れてほしい"
  - "提案（context）：refine-in-conversation（頼み方を一回で決めない考え方）と、rewind-dont-correct・build-on-results（巻き戻す・結果を踏まえて直す操作とその理由）を分けた。rewind-dont-correct から refine-in-conversation へリンクしてほしい"
  - "提案（models）：モデルごとの癖（冗長さ・止まりすぎ・やりすぎ・自分で検証するので確認を重ねると過剰になる）は model-quirks に置き、suggest-or-do・output-shape・does-double-check-work・emphasis-words からリンクする。after-switching-models の見直しの項目に、強い言い方を和らげること（emphasis-words）と、確認を命じる一文を外すこと（does-double-check-work）を入れてほしい"
  - "提案（verify）：does-double-check-work は evidence-not-reports を前提にした（言葉で確認を命じるより、確かめる手段を渡す）。evidence-not-reports の related に does-double-check-work を、define-done の related に four-specifics と ask-for-outcomes を入れてほしい"
  - "提案（judgment）：requirements §6.7 の2行目（選択肢を出させるか、自分の案が先か）を、ask-for-options（答えを選ぶ場面）と think-before-asking（発想の場面）で分けた。think-before-asking から ask-for-options へリンクしてほしい"
  - "提案（recipes）：let-claude-ask（質問させる頼み方）と spec-first（仕様を先に固める進め方）、requesting-prose（文章の頼み方）と write-docs（技術文書の進め方）の境界。spec-first・write-docs の related にこちらを入れてほしい"
  - "提案（eval）：prompt-patterns・before-after-prompts・refine-in-conversation・share-targets-and-bounds は、頼み方を変えて効いたかを measure-changes で確かめる形でつないだ（api の prompt-evals-intro は measure-changes にまとめられた）。measure-changes の例に、プロンプトや指示を変えたときの小さな eval を入れてほしい"
  - "提案（changes）：台帳の important-caps の「今どうするか」は、現行の Best practices に合わせて「強調せず平易に書く。守られないなら、ファイルを短くするか hook・deny へ」、時期は「2026-10-27 ごろ（Best practices の改稿）」にしたい（research/23 §4.2）。prompting では emphasis-words・does-double-check-work・asking-for-reasoning・output-shape・prompt-patterns が outdated_advice で台帳を指す"
  - "提案（basics・api）：台帳の lower-temperature（research/22 #42。API の版によっては temperature などを送ると 400 になり、指示で振る舞いを導くよう勧められる）は、prompting では付けず、basics の nondeterminism か api のページに付けるのが合う"
