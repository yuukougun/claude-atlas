# 分野 prompting（頼み方）の目次。形式：planning/catalog/README.md §3、規則：§4。語彙：schema/site.yml
# 担当：C3（工程3、2026-11-04）。材料：00 §3 分野04・§4・§5、11 第1〜5節の分野04、02 §4、03 Q5、research/23・25・26
field: prompting
chapters: [頼み方の原則, 何をどこまで頼むか, 資料と入力の渡し方, 詰め方と頼み直し, 正直さと確かめ方, 型と例文]
notes:
  - "全ページを Before/After で書き、同じ原則の書き換えをアプリ／Claude Code／API のタブで並べる（00 §3 分野04、requirements §6.6）。何を足したかを注記する"
  - "requirements §6.7 の4つの統合方針は、ask-for-outcomes（成果か狙いか）・ask-for-options（選択肢か、自分の案が先か）・long-context-first（原文か要約か）・say-what-you-want と state-the-scope の two-layers の節（禁止を CLAUDE.md に書くか）に置いた"
  - "モデルごとの癖（冗長さ・止まりすぎ・やりすぎ・過剰な検証）は models の model-quirks が持つ。このファイルのページは頼み方の一般論にし、summary・signs・title にモデルの名前を書かない"
  - "日本語に固有の論点（英語への回帰・文体・表記・日本語の AI 臭さ）は japanese に置き、ここからリンクする（design §4.2）"
pages:
  # ── 頼み方の原則 ──
  - id: brief-a-new-colleague
    chapter: 頼み方の原則
    title: "新人の同僚に頼むつもりで"
    aliases: ["文脈のない新人として扱う", "Be clear and direct", "明確かつ直接的に", "brilliant but new employee"]
    type: concept
    level: 使う
    level_evidence: "最初の依頼から要る。期待外れの原因を「見えていない」と言い分ける、使うの段階の最初の物差しになる"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [見せる]
    prevents: [見えていない]
    scenes: [開発, 文章, 調べもの]
    summary: "Claude は会話の外の事情を知らないものとして頼むと、依頼に何を書き足せばよいかが分かる。文脈を知らない同僚が読んで迷う依頼は、Claude も迷う。"
    signs:
      - {type: symptom, text: "自分には当たり前の前提が伝わっていない"}
      - {type: goal, text: "頼み方の基本を一つだけ押さえたい"}
    prerequisites: []
    related: [four-specifics, give-reasons, show-examples, images-and-voice, refine-in-conversation, before-after-prompts, not-what-i-meant, six-causes, four-principles]
    volatility: 低
    sections:
      - {title: "文脈のない同僚に見せて確かめる", anchor: colleague-test}
      - {title: "役割を一文で伝える", anchor: role}
      - {title: "期待以上を望むなら、そう書く", anchor: ask-for-more}
    visual: {kind: static, text: "同じ依頼文を、文脈を知らない同僚と Claude が読み、どちらも見えている範囲だけで判断する図"}
    materials: ["00 §3 分野04", "02 §4-1", "02 §4-5", "03 Q5 P1（訂正つき：research/25 P9）", "00 §4 返答と品質の困りごと"]
    notes: "役割の一文は API の system prompt の勧め（02 §4-5）。アプリと Claude Code では指示の置き場所（app の where-to-put-instructions、extend の CLAUDE.md のページ）につなぐ。sign の『「いい感じに」と頼むと平凡なものが返ってくる』は、症状の not-what-i-meant にある同じ項目（00 §4）なので外した（逆引きで症状のページの振り分けを飛ばさないため）（2026-11-04 統合：M2）"

  - id: give-reasons
    chapter: 頼み方の原則
    title: "理由を添える"
    aliases: ["背景と目的を伝える", "Add context", "なぜを書く"]
    type: concept
    level: 使う
    level_evidence: "最初の依頼から使える。規則に理由があると書いていない場面にも当てはまることは、使うの段階から効く"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [見せる]
    prevents: [見えていない]
    scenes: [開発, 文章]
    summary: "規則や依頼に理由を添えると、Claude は書いていない場面にも意図を当てはめられる。禁止を並べるより、なぜそうしたいかを一文で書く。"
    signs:
      - {type: symptom, text: "書いた規則を、少し違う場面になると守らない"}
      - {type: symptom, text: "指示の文字どおりにだけ従い、意図を汲まない"}
    prerequisites: [brief-a-new-colleague]
    related: [say-what-you-want, emphasis-words, four-specifics, when-requests-are-refused, what-to-put-in-claude-md, request-vs-lock]
    volatility: 低
    sections:
      - {title: "禁止より理由（読み上げの例）", anchor: tts-example}
      - {title: "CLAUDE.md には理由と相談の基準を書く", anchor: claude-md}
    materials: ["00 §3 分野04", "02 §4-2", "requirements §6.7（禁止事項を CLAUDE.md に書くか）"]
    notes: "誤って断られたときに本当の目的と文脈を足すこと（偽らない）は safety の when-requests-are-refused が持ち、ここからリンクする"

  - id: four-specifics
    chapter: 頼み方の原則
    title: "具体性の4点（対象・状況・完了・手本）"
    aliases: ["具体的なプロンプト", "Write a specific prompt", "対象のファイルと症状を書く"]
    type: concept
    level: 整える
    level_evidence: "頼み方を整える段階の中心。完了の形を依頼に含めて渡せることは、整えるから任せるへ上がる条件と重なる"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [見せる, 確かめる]
    prevents: [見えていない]
    scenes: [開発, 文章, データ分析]
    summary: "依頼に対象・状況・完了の形・倣う手本の4点を書くと、Claude が推測で埋める所が減り、意図とのずれが減る。欠けている点が、次に書き足すものになる。"
    signs:
      - {type: symptom, text: "直してと頼んだのに、見当違いの場所を直された"}
      - {type: goal, text: "一回で意図どおりに動いてほしい"}
    prerequisites: [brief-a-new-colleague]
    related: [not-what-i-meant, define-done, show-examples, state-the-scope, choose-what-to-read, before-after-prompts, fix-a-bug, ask-for-outcomes, uses-nonexistent-apis]
    volatility: 低
    sections:
      - {title: "対象：どのファイル・どの画面か", anchor: target}
      - {title: "状況：症状と再現の手順", anchor: situation}
      - {title: "完了：何が起きれば終わりか", anchor: done}
      - {title: "手本：倣う既存のコードや文章", anchor: model}
      - {title: "誤読されやすい所（仕様の解釈・境界の条件）", anchor: misreadings}
    visual: {kind: static, text: "4点のどれかが欠けたとき、Claude が推測で埋める所を色で示した依頼文の図"}
    materials: ["00 §3 分野04（行の注記：research/25 P9）", "00 §1（研究の段落の訂正）", "03 Q5 Takeaway・P1（訂正）", "research/25 P9・§3.1", "11 第2節 分野04 p12#105・p34#74・p12#106", "00 §4 返答と品質の困りごと"]
    notes: "「熟練者との差は長さではなく具体性」は Anthropic の研究の結論ではない（research/25 P9）ので、summary・signs の根拠にせず、長さとの対比も書かない。4点は公式の Best practices を根拠にし、Before/After は Best practices の「Instead of / Try」から取る。研究を引くなら、熟練度が Claude の判定で暫定の結果であることを添える。誤読の類型の研究（11 第2節）は根拠の強さを添えて misreadings の節に置く。sign の「頼んだものと違うものが出てくる」は症状の not-what-i-meant と同じ文なので外した（逆引きで振り分けを飛ばさないため）（2026-11-04 統合：M2）"

  - id: show-examples
    chapter: 頼み方の原則
    title: "例を見せる"
    aliases: ["few-shot", "multishot", "例示", "手本を見せる"]
    type: concept
    level: 整える
    level_evidence: "形や文体を揃えたくなる整える段階で要る。自分の文章を手本にする使い方は、日本語の文体を揃えるページでも使う"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [見せる]
    prevents: [見えていない]
    scenes: [文章, 開発, データ分析]
    summary: "形や文体は言葉で説明するより、典型的で多様な例を見せるほうが揃う。自分の過去の文章やコードを手本にすると、言葉にしにくい好みまで伝わる。"
    signs:
      - {type: symptom, text: "説明しても、欲しい形式や文体にならない"}
      - {type: goal, text: "自分の文体に近い文章を書かせたい"}
    prerequisites: [brief-a-new-colleague]
    related: [four-specifics, consistent-politeness, requesting-prose, output-shape, xml-tags, less-ai-sounding-japanese, prompt-patterns]
    volatility: 低
    sections:
      - {title: "典型的で多様な例を選ぶ", anchor: choose}
      - {title: "何個見せるか", anchor: how-many}
      - {title: "自分の文章を手本にする", anchor: own-writing}
      - {title: "例にだけ合う出力に気をつける", anchor: overfit}
    materials: ["00 §3 分野04", "02 §4-3", "04 Q3（表記ゆれと漢字の開き：自分の文章を Few-shot で見せる）", "11 第2節 分野04 p12#105（例にしか合わないコード）"]
    notes: "registry の題名の「（3〜5個）」は、数値を題名に書かない規則（catalog/README §4.5）に合わせて外した。公式の勧める数は数値ファイルに置き、how-many の節に道具が書き込む。goal の「自分の書き方に寄せた文章を書かせたい」は requesting-prose の「自分の文体に近い文章を書かせたい」と同じ問いなので、同じ文にそろえた（逆引きで1行に束ね、考え方と手順の印で並べる。DR-15）（2026-11-04 工程4：DR-19 a）"

  - id: say-what-you-want
    chapter: 頼み方の原則
    title: "否定形ではなく、望む形で書く"
    aliases: ["「するな」より「こうして」", "正の例で示す", "Tell Claude what to do instead"]
    type: concept
    level: 整える
    level_evidence: "出力の形を整えようとして禁止を書き足し始める、整える段階で要る"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [見せる, 縛る]
    prevents: [見えていない, 縛っていない]
    scenes: [文章, 開発]
    summary: "「〜するな」より「〜で書け」と望む形を示すほうが守られやすい。例外を許さない禁止は言葉を重ねず、フックや権限のルールなどの仕組みに移す。"
    signs:
      - {type: symptom, text: "「使うな」と書いたのに、かえってそれが出てくる"}
      - {type: symptom, text: "禁止事項を足すほど、出力がぎこちなくなる"}
    prerequisites: [give-reasons, request-vs-lock]
    related: [emphasis-words, state-the-scope, output-shape, show-examples, when-to-lock, permission-rules]
    volatility: 低
    sections:
      - {title: "禁止を望む形に書き換える", anchor: rewrite}
      - {title: "例外のない禁止は仕組みへ（二層）", anchor: two-layers}
    materials: ["00 §3 分野04", "02 §4-10", "03 Q5 P7", "requirements §6.7（禁止事項を CLAUDE.md に書くか）"]
    notes: "requirements §6.7 の4行目（例外を許さない禁止は deny ルールや hook で強制し、CLAUDE.md には理由と相談の基準だけを書く）を two-layers の節に置く。state-the-scope の two-layers と同じ考え方で、ここは書き方、あちらは範囲の話にする"

  - id: emphasis-words
    chapter: 頼み方の原則
    title: "強調語（IMPORTANT・必ず）の現在"
    aliases: ["IMPORTANT", "YOU MUST", "CRITICAL", "全大文字で強調する", "「絶対に」と書く"]
    type: concept
    level: 整える
    level_evidence: "守られない指示に強調を足し始める整える段階で出会う。強調で直らないときに仕組みへ移す判断は、任せるの段階の上がる条件（二回同じ注意をしたら仕組みに移す）につながる"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [縛る]
    prevents: [縛っていない, 散らかっている]
    scenes: [開発]
    summary: "強調語を重ねても指示は守られるようにならず、強い言い方はかえって過剰に当てはめられることがある。守られないなら、指示を短くするか、例外のない規則は仕組みに移す。"
    signs:
      - {type: symptom, text: "IMPORTANT や「必ず」を付けても守られない"}
      - {type: symptom, text: "強く書いた指示を、関係のない場面にまで当てはめる"}
      - {type: goal, text: "強調に頼らずに、大事な指示を守らせたい"}
    prerequisites: [request-vs-lock]
    related: [instructions-ignored, when-to-lock, say-what-you-want, claude-md-length, give-reasons, request-lock-table, after-switching-models, model-quirks, outdated-advice-ledger]
    tracks: [claude-md]
    outdated_advice: [important-caps, keep-going-dont-be-lazy]
    volatility: 中
    sections:
      - {title: "強調で直らない二つの理由（長すぎる・例外がない）", anchor: why-not}
      - {title: "強い言い方が過剰に効く", anchor: overreaction}
      - {title: "「手を抜くな」「続けて」と書く代わりに", anchor: keep-going}
      - {title: "かつて強調が効いた理由", anchor: history}
    materials: ["00 §3 分野04（行の注記：research/23 §3.7）", "00 §1 対立点の表「強調語」（注記）", "00 §5 台帳の IMPORTANT の行（注記）と keep going の行", "research/23 §3.1・§3.7・§4.2", "02 §4-11", "03 Q2 C9"]
    notes: "「強調は1行だけにする」は改稿前の Best practices の勧め（research/23 §3.7）なので、summary・signs の根拠にせず、現行の版の「守られないなら、ファイルを短くするか hook にする」を軸にする。強調の効き目は実践者の間で割れるので、公式の立場・実践者の幅・この教材の推奨の三段で書く（design §6.6）。台帳の時期は「Best practices の改稿（2026-10-27 ごろ）」（research/23 §4.2）。強い言い方が過剰に効くというモデルごとの癖は models の model-quirks を関連で指す（2026-11-04 統合：prompting#4）。goal の「絶対に守らせたい規則がある」は enforce の when-to-lock の「例外なく守らせたい規則がある」と同じ問い（逆引きで近い行が並ぶ）なので、強調に頼らない形に書き分けた（DR-15）。symptom の「IMPORTANT や「必ず」を付けても守られない」は、強調の効き目に直接答えるこのページを持ち主にして残した（R1-06 の (3)。同じ型の sign は、同じ工程で basics の request-vs-lock が goal に替え、extend の claude-md-length が外した）（2026-11-04 工程4：DR-19 a）"

  # ── 何をどこまで頼むか ──
  - id: suggest-or-do
    chapter: 何をどこまで頼むか
    title: "提案してほしいのか、実行してほしいのか"
    aliases: ["提案だけで止まる", "動詞をはっきりさせる", "default_to_action"]
    type: concept
    level: 整える
    level_evidence: "Claude Code に作業を頼み始める整える段階で、提案で止まる・勝手に変えるの両方に出会う"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [見せる]
    prevents: [見えていない, 合っていない]
    scenes: [開発]
    summary: "提案だけか、実行までか、懸念があれば止まって相談するのかを動詞で書き分けると、勝手に書き換えられることも提案で止まることも減る。既定でどちらに寄せるかも、指示に書いておける。"
    signs:
      - {type: symptom, text: "相談のつもりだったのに、ファイルを書き換えられた"}
      - {type: goal, text: "大事な方針の変更では、手を止めて相談してほしい"}
    prerequisites: [four-specifics]
    related: [keeps-stopping, does-more-than-asked, state-the-scope, when-to-plan, ask-for-options, permission-to-stop, model-quirks]
    volatility: 中
    sections:
      - {title: "提案と実行を動詞で分ける", anchor: verbs}
      - {title: "既定の振る舞いを決める（すぐ実行するか、指示を待つか）", anchor: default}
      - {title: "懸念があれば止まって相談させる", anchor: stop-and-discuss}
    materials: ["00 §3 分野04", "02 §4-11", "02 §4-13", "11 第2節 分野04 p56#12・p56#123", "00 §4 返答と品質の困りごと"]
    notes: "モデルごとの既定の癖（止まりすぎ・やりすぎ）は models の model-quirks が持つ。懸念を一文で述べて続けさせる書き方と、方針や評価に関わる変更では手を止めて議論させる書き方を対にして示す（11 第2節。最新のモデルの手引きに同じ記述があるかは未確認）。sign の「提案だけで止まり、実行してくれない」は症状の keeps-stopping と同じ文なので外した（逆引きで振り分けを飛ばさないため）（2026-11-04 統合：M2）。summary の1文目が「動きは変わる」だけで何をすればよいかが分からなかったので、動詞で書き分けると何が減るかの答えにした（R3-22。節 default の既定の振る舞いを2文目に置いた）（2026-11-04 工程4：DR-19 w）"

  - id: state-the-scope
    chapter: 何をどこまで頼むか
    title: "範囲を伝える（やらないこと）"
    aliases: ["anti-goals", "スコープを絞る", "頼んだ範囲で", "やらないことを書く"]
    type: concept
    level: 整える
    level_evidence: "作業を頼むと頼んでいない変更が混ざる問題に、整える段階で出会う"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [見せる, 縛る]
    prevents: [見えていない, 合っていない]
    scenes: [開発]
    summary: "依頼に、やること・やらないこと・触ってよい範囲を書くと、頼んでいない機能や変更が増えにくくなる。例外を許さない範囲は、言葉ではなく権限やフックで縛る。"
    signs:
      - {type: goal, text: "小さな修正は、小さいまま終わらせたい"}
      - {type: goal, text: "触ってよいファイルを限りたい"}
    prerequisites: [four-specifics, request-vs-lock]
    related: [does-more-than-asked, say-what-you-want, suggest-or-do, permission-rules, protected-paths, "when-to-lock#spoken-rules-fade", model-quirks]
    volatility: 低
    sections:
      - {title: "やらないことを書く", anchor: anti-goals}
      - {title: "いまの作業に要る最小限を求める", anchor: minimum}
      - {title: "例外を許さない範囲は仕組みで縛る（二層）", anchor: two-layers}
    materials: ["00 §3 分野04", "02 §4-12", "02 §4-13", "03 Q5 P7", "requirements §6.7（禁止事項を CLAUDE.md に書くか）", "00 §4 返答と品質の困りごと"]
    notes: "requirements §6.7 の4行目の統合方針を two-layers の節に置く。会話で言った禁止が圧縮で消えうることは、enforce の when-to-lock の節 spoken-rules-fade（enforce が spoken-prohibitions-fade をまとめた先）にリンクする。sign の「頼んでいない機能やファイルが増える」は症状の does-more-than-asked と同じ文なので外した（逆引きで振り分けを飛ばさないため）（2026-11-04 統合：enforce#2・M2）。symptom の「小さな修正のつもりが、大きな書き換えになった」も does-more-than-asked の「小さな修正を頼んだのに周りまで書き換えられる」の言い換え（R3 付表A の14）なので、このページが直接答える goal の形にした（2026-11-04 工程4：DR-19 a）"

  - id: ask-for-outcomes
    chapter: 何をどこまで頼むか
    title: "細かく指図するか、成果で頼むか"
