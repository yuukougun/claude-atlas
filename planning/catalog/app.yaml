      - {title: "別のプロジェクトの話が混ざる", anchor: mixed-projects}
      - {title: "止め方の違い（Pause・Reset・会話ごとのオフ・シークレットチャット）", anchor: turning-off}
      - {title: "覚えた内容を棚卸しする", anchor: review}
    materials: ["00 §3 分野06", "02 §1-4（会話を消しても memory は残る、Pause と Reset、会話ごとにオフにする）", "05 §2-4", "00 §4 会話と文脈の困りごと（別のプロジェクトの記憶が混ざる・会話を消したのに覚えている）", "11 第2節 分野08 auto memory（p34#114：誤った結論が自動の記憶に入り、後の実験を汚した。棚卸しする。単独の経験談）"]
    notes: "症状の診断（どの記憶の仕組みが持ち込んだかの切り分け）は symptoms の unexpected-memories が持ち、ここはアプリのメモリの操作の答えを持つ（symptoms の担当もそう分けている）。棚卸しの節の根拠（11 p34#114）は Claude Code の自動メモリでの単独の経験談で、アプリのメモリを調べたものではない。本文では類推と根拠の強さ（弱）を添える。how-memory-works とまとめる案もある（open_issues）。symptoms の担当の分担（このページはアプリのメモリの操作の本体：消し方・Pause と Reset・会話ごとのオフ。unexpected-memories は面をまたいだ切り分け）に合わせて分けたままにし、症状の文「会話を消したのに覚えている」「別のプロジェクトの記憶が混ざる」は unexpected-memories の signs に任せて、ここから外した。節 deleted-chats・mixed-projects はその振り分けの受け皿として残す（2026-11-04 統合：symptoms#11・app#6・M2）"

