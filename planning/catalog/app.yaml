      - {title: "ナレッジを置くと何が変わるか", anchor: knowledge}
      - {title: "プロジェクトの指示に書くこと", anchor: instructions}
    templates:
      - {name: "プロジェクトの指示の雛形（目的・資料の使い方・出力の形）", kind: prompt, safety: false}
    materials: ["00 §3 分野06", "02 §1-2（knowledge・instructions・project memory・共有）", "02 §2-2（公式の節約の勧め：よく使う資料は project に置いて cache を効かせる。使わないと切れる）", "04 Q4（Projects の日本語の実践：少数のファイルから、1プロジェクト1目的）", "research/26 §3.13・research/27 #17（project instructions のプランの条件が記事の間で食い違う）"]
    notes: "Free で project instructions を使えるかは、ヘルプセンターの記事の間で食い違う（research/26 §3.13・§5、research/27 #17）。本文はプランに中立に書き、数値ファイルに「食い違いあり」で置く。「1プロジェクト1目的」は実践者の勧め（04 Q4、企業の記事）なので、根拠の強さを添える"

