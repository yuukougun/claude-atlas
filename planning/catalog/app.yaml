    materials: ["00 §3 分野06", "02 §1-2（有料プランでは容量に近づくと RAG mode が自動で有効になる）", "02 §2-3（長さの上限に当たったときの公式の対処：project のファイルを減らす）", "04 Q4（最初は少数のファイルにし、古い版は消す）"]
    notes: "RAG mode で読み方がどう変わるかは、調査資料では「容量が広がる」までしか確かめていない（02 §1-2）。本文で「一部しか読まれない」と断定せず、公式の説明と、確かめ方（引用とページの番号を出させる）を書く"

