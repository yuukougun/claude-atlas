open_issues:
  - "提案（safety）：会話の共有のページ（新規の sharing-chats）を足すつもりだったが、safety の担当が shared-artifacts-and-files を「共有リンクと公開アーティファクトの扱い」に改め、会話の共有の仕様（写し・見られる人・取り消し）を持ったので、app には足さなかった。shared-artifacts-and-files に、共有のしかたの操作（特定の人への招待と公開リンク・共有した会話の更新・Team と Enterprise の組織の中だけの共有）も短く入れてほしい（research/26 §3.2）。app からは artifacts-overview・artifacts-as-apps・files-and-code-execution・shared-projects-and-org-skills が関連で指している"
  - "提案（surfaces・features）：アプリのタスクの機能の id app-tasks を new_features に足した。surfaces の担当の提案どおり、choosing-a-surface と where-it-runs の tracks にも入れてほしい。unified-claude と claude-code-vs-cowork を choosing-a-surface にまとめたことに合わせ、app の前提と関連を直した（surfaces の担当の提案）"
  - "提案（changes とメイン）：台帳に「Styles で応答の調子と形式を揃える」を足すかを決めてほしい（changes の担当も registry の ledger への同じ提案を書いている。2026-06-01 に skills への移行が告知。今どうするか：いつも揃えるなら全会話の指示、場面ごとならスキル、移された style は名前から作られる slash command で呼ぶ。research/26 §3.1）。台帳の id は registry にあるので、足すならメインが registry を直す。足したら app の where-to-put-instructions と skills-in-the-app の outdated_advice に入れる"
  - "提案（japanese）：claude.ai には返答の言語を固定する設定がなく、指示で頼むしかない（research/27 #15）。keep-replies-in-japanese のアプリのタブから where-to-put-instructions を指してほしい"
  - "提案（start の用語集〔2026-11-04 に id を glossary にした〕）：アプリの題名は、ヘルプセンターの日本語版の訳語（プロジェクト・メモリ・シークレットチャット・アーティファクト・リサーチ・コネクタ・スキル・音声モード）にし、英語の名前を aliases に置いた（research/27 §3.1 の案の列）。用語集で決めるとき、アプリのメモリと Claude Code のメモリ・自動メモリ、アプリの Styles と Claude Code の output style を分けてほしい。全会話の指示（Instructions for Claude）の画面の名前は確かめていない（research/27 §5）"
  - "決めきれなかった点：memory-faq を how-memory-works にまとめるか。00 が両方を必須で別に立て、逆引き（00 §4）も両方を指すので分けた。symptoms の unexpected-memories ができて困りごとの入口はそちらにもあるが、symptoms・safety・extend の担当は memory-faq を「アプリの操作の本体」として指しているので残した。まとめれば1ページで済む。工程4で見てほしい"
  - "確かめていないこと（作者に頼むなら一度にまとめる）：Styles のメニューが今も出るか（research/26 §5）、Free でプロジェクトの指示を使えるか（記事の間で食い違い。research/26 §3.13）、Desktop の新しい設定画面での claude_desktop_config.json の入口（research/26 §5）、アプリの権限モードの Desktop と Web の既定（research/23 §5）、日本語の画面の項目名（research/27 §5）"

