    notes: "registry の searching-past-chats（過去チャットの検索）をまとめた（節 chat-search）。2026年に二度大きく変わった（02 §1-0）ので volatility を高にした。プランごとの既定は数値ファイルに置く。Claude Code の CLAUDE.md と自動メモリ（extend の using-auto-memory）とは別の機能なので、関連に置いて違いを書き、用語集で分ける。症状の文「別のプロジェクトの記憶が混ざる」は symptoms の unexpected-memories の signs にあり、そこが面をまたいで切り分けてからこのページと memory-faq へ振り分けるので、ここから外した（2026-11-04 統合：M2・symptoms#11）"

  - id: memory-faq
    chapter: 指示と記憶
    title: "アプリのメモリで困ったとき（消したのに覚えている・話が混ざる）"
    nav_title: "メモリで困ったとき"
    aliases: [Memory FAQ, メモリの困りごと, メモリの Pause と Reset]
    type: feature
    level: 整える
    level_evidence: "記憶が混ざる・消えないといった困りごとは、文脈を整え始めた段階で出会いやすい"
