# claude-atlas 目次：app（アプリを使いこなす）
# 形式：planning/catalog/README.md §3。語彙：schema/site.yml。書いた担当：C5（工程3、2026-11-04）
# 材料：research/00 §3 分野06・§4・§5、research/02 §1・§2、research/05 §2、research/04 Q4、
#       工程2の報告 research/22・23・26・27。research/11 第1節・第2節には分野06の行がない（第2節の分野08 の1行だけが関わる）
field: app
chapters: [指示と記憶, 資料と長い会話, 調べる・作る, つなぐ・足す, 任せる, チームとモバイル]

pages:
  # ── 指示と記憶 ──
  - id: where-to-put-instructions
    chapter: 指示と記憶
    title: "アプリの指示の置き場所（Claude への指示・プロジェクト・メモリ・スキル）"
    nav_title: "指示の置き場所"
    aliases: [Instructions for Claude, 全会話の指示, Project instructions, プロジェクトの指示, 組織の指示, カスタム指示, Styles]
    type: comparison
    level: 整える
    level_evidence: "同じ前提を何度も書いていると気づき、指示の置き場所を整え始める段階で最初に要る"
    priority: 必須
    surfaces: [app]
    principle: [見せる]
    prevents: [見えていない, 散らかっている]
    scenes: [文章, 開発]
    summary: "Claude への指示・プロジェクトの指示・メモリ・スキルを、効く範囲と読まれる時期で比べ、繰り返す前提や形式の指定をどこに置くかを決められる。"
    signs:
      - {type: goal, text: "返答の口調や形式をいつも揃えたい"}
      - {type: symptom, text: "設定した指示が、関係のない会話にまで効いてしまう"}
    prerequisites: [attention-budget, where-instructions-sit]
    related: [using-projects, how-memory-works, skills-in-the-app, shared-projects-and-org-skills, repeating-the-same-explanation, claude-md-vs-rules-skills-styles, output-style-modes, keep-replies-in-japanese, "tidy-the-desk#in-the-app", always-on-costs]
    tracks: [personal-instructions, project-instructions, app-memory, app-skills, styles]
    outdated_advice: [styles-for-tone]
    volatility: 中
    sections:
      - {title: "置き場所ごとの効く範囲と読まれる時期", anchor: comparison}
      - {title: "調子と形式を揃えたいとき（Styles を使っていた場合）", anchor: styles}
      - {title: "組織の指示があるとき", anchor: org-instructions}
      - {title: "Claude Code の置き場所との対応", anchor: claude-code}
    templates:
      - {name: "Claude への指示に書く短い方針の例（言語・文体・前提）", kind: prompt, safety: false}
    visual: {kind: static, text: "効く範囲の入れ子（アカウント全体・プロジェクト・一つの会話）に指示・メモリ・スキルを置き、毎回読まれるか必要なときだけ読まれるかを色で分けた図"}
    materials: ["00 §3 分野06「指示の置き場所」の行とその注記", "02 §1-3（公式の使い分け：全体は Instructions、案件は project instructions、形式と届け方は skills）", "research/26 #1〜#3・§3.1（Styles の skills への移行、Instructions の場所）", "research/27 #15〜#17・§3.1・§3.2 の claude.ai（訳語、組織の指示、返答の言語を固定する設定はない）", "00 §4 返答と品質の困りごと「毎回同じ背景を説明している」"]
    notes: "registry の題名から Styles を外したまま（00 §3 分野06 の注記）。Styles は aliases と節 styles にだけ置く。2026-06 の移行の告知の後の公式の使い分け（research/26 §3.1）で書き、画面に Styles のメニューが残るかは確かめていない（research/26 §5）と添える。Claude Code の出力スタイル（output style）とは別の機能で、cli の output-style-modes を関連に置いて取り違えを防ぐ。題名と要約の全会話の指示（Instructions for Claude）を、メインの決めた表記の「Claude への指示」にした（画面の名前は確かめていない。research/27 §5。「全会話の指示」は aliases に移した）。basics の where-instructions-sit（整える・必須。指示がシステムプロンプトとユーザーメッセージのどこに入るか）を前提に足した。Styles の移行の説明は台帳の styles-for-tone に一本化し、このページと skills-in-the-app の outdated_advice から指す。japanese の文体と表記のページのアプリのタブも、同じ書き方に揃えられる。症状の文「毎回同じ背景を説明している」は symptoms の repeating-the-same-explanation の signs にあり、そのページがこのページを前提にして振り分けるので、ここから外した（2026-11-04 統合：M1・basics#6・app#3・japanese#5・M3・M2）"

