    notes: "新規：japanese の核の総論（catalog/README §4.6 の2）。registry に総論の候補がなかったので足した。英語への回帰（keep-replies-in-japanese）と文体・表記（consistent-politeness・consistent-notation・textlint-hook）が共通に前提にする「どの手段がどこまで届き、どれが強制か」を集め、research/27 §3.2 の表と「効く範囲の三つの要点」を本体の材料にする。強制できる場所（ターンの終わりとツールの前後）と、アプリに機械の仕組みがないことは、版に依る挙動として確認日と版を付けて本文に書き、summary には書かない。縛る規則を少なく保つ注意は decisions「hooks と permissions」と Best practices による。アプリの Styles はスキルへの移行が告知された（research/26 §3.1）ので、お願いの層に Styles を挙げず、台帳 styles-for-tone を outdated_advice で指す（2026-11-04 統合：japanese#6・M3）。symptom の「日本語で、と何度書いても英語や文体の揺れが戻ってくる」は、症状の replies-in-english（途中から英語に切り替わって戻らない）と inconsistent-japanese-style（指定した文体が長い文章の途中で崩れる）の言い換えなので、お願いと鍵を選び分けるこのページが直接答える状況（指示では揃わず、仕組みにするか迷う）にした（2026-11-04 工程4：DR-19 a）"

