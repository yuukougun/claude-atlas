notes:
  - "第一波の核（decisions 2026-11-03「第一波に足すもの」：英語への回帰と、文体・表記を仕組みで揃えるページの数ページ）は、総論の align-japanese-output（新規）・keep-replies-in-japanese・consistent-politeness・consistent-notation・textlint-hook の5ページ"
  - "用語は公式の日本語版の本文の多数派に合わせる（research/27 §3.1、design §6.2）。日本語の出力を揃える公式の仕組みと、その届く範囲は research/27 §3.2 を本体の材料にする"
  - "GitHub の issue は個人のアカウント名を出さず番号で示し、利用者の集計は自己申告と書く（research/27 冒頭の注意）。第三者のプラグインと skill は名前だけにして推薦しない（D13）"
  - "頼み方の一般論は prompting に置き、ここは日本語に固有の論点だけにする（design §4.2）"
