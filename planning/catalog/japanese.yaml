    notes: "アプリの Styles は skills への移行が告知され、公式の記事が取り下げられている（research/26 §3.1）ので、置き場所は Instructions・プロジェクトの指示・skill で書き、Styles を頼りにしない（research/27 #16）。CLAUDE.md・skill・hook の効果を比べた記事はない（04 Q3 Gaps）ので、比べるなら検証ノートにする。混在を見つけるルールの設定は textlint-hook に置く。台帳 styles-for-tone を outdated_advice で指し、移された Styles の書き方は app の where-to-put-instructions（節 styles）と skills-in-the-app（節 migrated-styles）に揃える（画面にメニューが残るかは確かめていない。research/26 §5）。sign の「です・ますとだ・であるが混ざる」は症状の inconsistent-japanese-style と同じ文なので外した（逆引きで振り分けを飛ばさないため）（2026-11-04 統合：japanese#5・japanese#6・M3・M2）。残っていた symptom の「途中から文体が変わる」も inconsistent-japanese-style の「指定した文体が長い文章の途中で崩れる」の言い換えなので、このページが直接答える goal の形にした（2026-11-04 工程4：DR-19 a）"

