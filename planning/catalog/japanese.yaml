    prerequisites: [align-japanese-output]
    related: [replies-in-english, where-to-put-instructions, stop-hooks, output-style-modes, settings-layers, what-subagents-dont-inherit, what-survives-compaction, cloud-sessions-and-teleport, agent-loop, where-instructions-sit, hook-recipes, commit-and-comment-language, measure-changes]
    tracks: [language-setting, claude-md, output-styles, hooks, subagents, cloud-sessions]
    volatility: 高
    sections:
      - {title: "英語に戻りやすい場面", anchor: when}
      - {title: "言語の設定と、効かないときに確かめること", anchor: language-setting}
      - {title: "CLAUDE.md と出力スタイル（お願いの層）", anchor: instructions}
      - {title: "Stop フックで最後の返事を確かめる", anchor: stop-hook, level: 仕組みにする}
      - {title: "届かない所（サブエージェント・圧縮の要約・クラウドのセッション）", anchor: reach}
      - {title: "アプリと API の場合", anchor: app-and-api}
      - {title: "どこまで減ったかを測る（検証ノート）", anchor: measure}
    templates:
      - {name: "最後の返事が英語なら書き直させる Stop フック", kind: hook, safety: false}
      - {name: "language の設定の例（個人の設定に置く）", kind: settings, safety: false}
    visual: {kind: static, text: "1ターンの中で英語が出る場所（ツールの合間の一言・最後の返事）と、それぞれに届く仕組み（Stop・PreToolUse・MessageDisplay）を示す図"}
    materials: ["research/27 §3.2・§3.3", "research/27 #2・#3・#5・#6・#7・#8・#9・#10・#11", "research/27 #15（claude.ai には返答の言語を固定する設定がない）", "research/27 §4 P10・P12・P13", "04 Q3（日本語での返答：注記つき）", "00 §3 分野15（訂正と注記）", "00 §1（日本語特有の論点の段落、訂正）", "design §6.10（大事な数件は回数の上限を決めて繰り返し「傾向」と書く）"]
    notes: "registry の level（任せる）を整えるに下げ（level_evidence）、型も concept から recipe にした（設定 → 指示 → hook → 測る、の手順が本体になるため）。根拠の強さは research/27 §3.3 の表のとおりに付ける（戻ることがある：中、ツールの合間の一言は Stop で拾えず画面に出る前に止められない：強、圧縮の後に戻る：弱、など）。特定のモデルで増えたという報告は根拠の強さと確認日を付けて本文に書き、summary・signs には書かない。日本語を保つ hook の実践例は「保つ仕組み」と書き、強制とは書かない（00 分野15 の訂正）。検証ノートの測り方は research/27 P12（回数の上限はメインが決める）。症状の診断（安く確かめる順、research/27 P13）は symptoms の replies-in-english が持ち、ここは対処の本体にする。claude.ai には返答の言語を固定する設定がなく指示で頼むしかない（research/27 #15）ので、app-and-api の節のアプリのタブから app の where-to-put-instructions を指す。measure の節の検証ノートは eval の measure-changes の例から指されるので、related に measure-changes を置いた（2026-11-04 統合：app#4・eval#4・japanese#8）。symptom の3文（途中から英語になる・設定や指示をしても英語に戻る・ツールの直後の一言だけ英語）は、症状の replies-in-english の3文の言い換え（R3 付表A の8、R1-04）なので、設定してもなお混ざる狭い場面（R1-04 の例。診断の最初の確かめを済ませた読者が直接ここに来る）と、このページが直接答える goal（いつも日本語にする・最後の返事を Stop フックで直させる）にした。別名「英語に戻る」は fix-aliases でこのページが主なので残した（2026-11-04 工程4：DR-19 a）"

