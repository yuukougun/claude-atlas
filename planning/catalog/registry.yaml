notes:
  - "候補数：pages は378（requirements §4.2 の目安の合計は377）。目安と違うのは symptoms だけで、目安25に対して26。11 第1節 分野01 の「要約は原文より強く言いがち」の行が「分野18 に症状『要約が原文より断定的になる』も置く」と書くので summary-overstates-source を足した（requirements §4.2 の「新しい症状を5つ」には入っていない）。ほかの22分野は目安と同じ数。"
  - "team は目安どおり16だが、requirements §4.4 の6つのほかに足したのは、11 第1節 分野17 の新ページ「AI は増幅器」（ai-amplifies-organizations。11 は分野00「全体地図」の前提にする案も挙げる）。11 の新「チームで使う意味（個人＋AI とチーム＋AI）」は、根拠の行（p56#52）に【2026-11-03 注記】（P&G の実験の人数の食い違い。research/24 B-43）が付き、ほかに根拠の行がないので作らなかった。team の担当が、注記を踏まえて新規に足すかを決める。"
  - "start：00 の「三つの原理」は requirements §3.1・§4.2 に合わせて「四つの原理」に改め、1項目にした（four-principles）。requirements §4.2 が足す「人の側の五つの落とし穴」の入口は human-pitfalls-intro として別に立てたが、judgment の総論 human-pitfalls と中身が重なる。入口を短い案内にするか、six-causes と合わせて「失敗の二つの軸と診断の入口」の1ページにするかは、start と judgment の担当が決める。"
  - "start の型と level：design §3.1 の規則2（start は level を持たない）に合わせ、00 で L1 だった start の候補は guide か hub にして level を省いた。roadmap・reverse-index・glossary は design §2.2 の生成のページ（型を持たない）で、型は仮に hub にした。cli の command-cheatsheet と、changes の old-and-new-names・change-timeline-2026 も生成になりうる（仮に ledger）。design §2.1 の start の中身にある「知識マップ」と「方針」は、材料に候補がないので registry に入れていない（start の担当が新規で足す）。"
  - "verify と eval：requirements §4.3 に従い、00 分野09 の「変更が効いたかを測る」「体感と実測」「/insights と /usage で振り返る」を eval に移し、§4.3 の「verify に足すページ」4つを verify に置いた（verify 17・eval 13）。11 第1節 分野09 の小項目「採点の正本は一か所に」は test-the-verifier に、分野11 の解説節「なぜ規則が割れるか」は safety の checking-ai-rules と contest の competition-rules に含め、独立の候補にしていない。requirements §4.2 の recipes の「主な変更」に差分テストがあるが、§4.3 が eval の候補にしているので eval の differential-testing にだけ置いた。"
  - "api の prompt-evals-intro（00 分野13「プロンプトの評価（eval）入門」）は、requirements §4.2 の api の数（14）に合わせて api に残した。design §4.2 では評価の指標は eval が持つので、eval の measure-changes と重なる。移すかは api と eval の担当が決める。"
  - "contest の competition-rules は requirements §4.3 の「規則はなぜ割れるか：禁止・部門分け・開示の三類型と、規則の確認表」から作った。design §4.2 では一般の類型と確認表は safety（checking-ai-rules）が持ち、contest は大会の規則の早見と練習と本番の使い分けを持つので、題名を「大会の規則の早見」にした。境界は safety と contest の担当が決める。"
  - "wave_core：start 4・symptoms 26（全部）・changes 2（台帳と旧名の対応表）・eval 6・judgment 5・japanese 4 の計47に付けた。迷ったのは eval の measure-changes（00 では推奨）と felt-vs-measured。felt-vs-measured は人の側の落とし穴エ（体感を信じる）のページなので、judgment で落とし穴ア・イ・ウ・オに当たる over-reliance・agreement-is-not-evidence・decide-when-to-quit・ai-ideas-are-everyones とそろえて付けた。japanese の can-i-prompt-in-japanese（00 で必須）と less-ai-sounding-japanese は核に入れていない。contest は decisions 2026-11-03（第一波の後にする）により付けていない。"
  - "注記を受けて題名を変えた候補（origin に 00 の題名を残した）：app の where-to-put-instructions から Styles を外した（00 §3 分野06 の注記。research/26 #1〜#3）。delegate の batch-and-p-loops は fan-out の語を使わない（改稿前の Best practices の語。00 §3 分野12 の注記、research/23 §3.1）。cost の how-usage-limits-work から「5時間・週」を外した（確認済みの Ultra の口座は週の上限だけ。00 §3 分野14 の注記、research/22 #33）。cli の output-style-modes は組み込みの種類を題名に並べない（00 §3 分野07 の注記、research/23 #2）。delegate の choosing-automation は旧名 routine を「定期タスク」にした（00 §5 の台帳）。"
  - "decisions 2026-11-03「読者の前提」（非エンジニア向けの説明は省く）と食い違う候補：cli の for-non-engineers（00 分野07「Claude Code を非エンジニアが使う」）。材料にあるので registry には入れた。cli の担当が dropped にするか、Desktop の Code タブの使い方などへ組み替えるかを決める。"
  - "作らなかった候補：11 第1節 分野17 の節「教える側」（decisions 2026-11-03 で教える側を読者に足さない）、同「AI が最初の相談相手になると同僚とのやりとりが減る」（11 は既存の「チームに広める」に足す案を先に書く。rolling-out-to-teams の材料）、分野12 のデータ点「ハーネスの価値」（ページの案ではない）、新分野案X の「能力の凸凹（jagged frontier）」を分野01 に置く案（置き場所の別案で、出典は解説ブログ経由。11 第4節 #55）。11 第2節は既存のページに足す内容だけで、新しいページの案はなかった。"
  - "00 の中で重なる候補は、00 が別の分野に別のページとして置いているので、まとめずに残した。merged にするかは分野の担当が決める：basics の tokens と japanese の more-tokens-in-japanese、prompting の requesting-prose と japanese の less-ai-sounding-japanese、context の sessions-as-branches と cli の resume-and-branch、basics の what-survives-compaction・context の promises-after-compaction・enforce の spoken-prohibitions-fade・symptoms の forgot-after-compaction、cli の usage-context-statusline と cost の claude-code-costs、enforce の managed-settings-enforcement と team の org-managed-settings-and-mcp、surfaces の agent-sdk-and-managed-agents と api の sdk-comparison・agent-sdk-basics・managed-agents-basics、models の suspected-degradation と symptoms の seems-less-capable、app の research-and-writing-in-the-app と recipes の research-and-reports、start の glossary と changes の old-and-new-names。"
  - "新しい候補とほかの候補の重なり：enforce の freeze-eval-assets と verify の protect-tests、safety の instructions-hidden-in-materials と prompt-injection-in-practice、prompting の permission-to-stop と allow-i-dont-know、basics の summary-overgeneralization と symptoms の summary-overstates-source。11 が置き場所の別案を挙げるもの：delegate の pairing-and-delegating（分野00）、enforce の move-judgment-into-scripts（分野08）、models の harness-over-model（分野02）、context の build-on-results（分野04）。"
  - "設計書と catalog/README の例の id のうち、instructions-ignored・request-vs-lock・hooks-basics・verifier-defines-problem・important-caps はそのまま使った。例の permissions-deny に当たる候補は enforce の permission-rules（権限ルール（allow・ask・deny））。例の instructions-ignored の level は「整える」だが、00 の L3 に従い「任せる」にした。ページの id は catalog/README §5 の機能の id（tracks）と同じ綴りにしていない（例：機能 ultrathink に対してページは thinking-keywords）。"
  - "ledger：00 §5 の31項目と research/22 §3.4 の「足す候補」4項目の計35。題名は 00 §5 の「古い助言」の欄を基本にし、名前だけの行（routines・/cost など）には短い動詞を足した。research/22 §3.4 で「今どうするか」に足す内容がある3行（think-hard-keywords・yolo-skip-permissions・save-context-for-200k）は origin に書いた。research/22 §3.4 が「台帳ではなく数値ファイルと aliases で持つ」とした4つ（Opus 4.8 の fast mode の削除、アプリの Haiku 4.5、Recently denied から Recently blocked、session limit から 5-hour limit）は入れていない。research/26 の Styles から skills への移行も台帳に入りうるが、00 §3 分野06 の注記にある主張なので作っていない（changes の担当が research/26 を読んで決める）。"
  - "訂正・注記のある行から作った候補で、requirements §4.3・§4.4 に挙がるので残したもの：team の risk-tiered-approval（11 第1節 分野17 p56#58 に【2026-11-03 訂正】。summary と signs は訂正後の内容、research/25 P4 で書く）、contest の ai-in-contests-today・format-cheatsheet・practice-vs-contest-day（11 第1節 新分野案Y の表の後に、AWTF・ICPC・大会の規則の行への注記と訂正がある）。根拠の行の一部にだけ訂正・注記があるもの：delegate の what-not-to-delegate（事例の行 p12#96・p12#97 に訂正、p12#100 に注記。候補の根拠は p12#91）、eval の selection-pressure（p34#35 に注記。根拠は p34#33）、recipes の performance-tuning（p34#84 に注記。根拠は p34#83）。どれも、注記の付いた行を summary・signs・題名の根拠にしない（catalog/README §4.5）。"
  - "新しい候補の priority と level は C0 の見当で、根拠は書いていない（分野の担当が notes に理由を書いて決める）。eval と judgment は、症状や基礎のページの前提に置かれても段階が逆転しにくいように、総論と落とし穴のページを「整える」か「任せる」にした。11 が推論と明記した measure-the-upper-bound は、decisions 2026-11-03 の書き方の方針3（推論は必須ページの中心にしない）に合わせて任意にした。"
