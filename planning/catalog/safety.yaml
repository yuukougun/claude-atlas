    notes: "新規：research/26 §3.3 で断られたときの公式の案内が確かめられ、decisions 2026-11-03「断られたときの頼み直し」で書く範囲（公式が案内する手段だけ。本当の目的と文脈を足し、偽らない。巻き戻しや新しい会話、誤判定の報告、専門の仕事には検証の制度。アプリの自動のモデルの切り替えは仕組みとして説明する）が決まったが、受け持つページが registry にない。提供元の規則（利用ポリシー）と安全の仕組み（分類器）の話なので safety に置いた。言い換え・分割・偽の文脈など、利用ポリシーを回避する頼み方は書かない。分類器は会話全体（読み込んだ資料を含む）を見るので、同じ会話では止まり続けることがある。症状のページは symptoms への提案（open_issues）。推論の全文を求める指示が止められる点は prompting の asking-for-reasoning と重なる。symptoms が症状のページ refused-or-blocked を足した（safety#1）ので、merged にせず対処の本体として残す。分担（2026-11-04 工程4 で改めた）：引き金・推論の要求・モデルの切り分けは refused-or-blocked、面ごとの表示の文と、手段の本体と、分類器と自動の切り替えの仕組みはここ（節 by-surface に表示と仕組みを一か所で持つ。表示の文は変わりやすく、二か所に持つと点検で食い違う。DR-19 m・R3-12）。refused-or-blocked と同じ意味の症状のサイン2つ（断られた・モデルが切り替わった）は外し、やりたいこと・状況のサインに替えた（M2）。公式の errors にある「モデルを変えると通ることがある」は、回避と紛らわしいので手段として書かず、アプリの自動のモデルの切り替えを仕組みとして説明するだけにする（M5、research/26 §4.3）。推論の全文を求める指示を外すことは prompting の asking-for-reasoning#refusal、設定に入った指示の切り分けは cli の isolate-with-safe-mode、誤判定の報告で送られるものは what-feedback-sends に任せる。分類器を避ける頼み方（言い換え・分割・偽の文脈）は手段として書かず、節 why-not-evade には利用ポリシーが禁じることと、警告や停止になりうることだけを書く。自動の切り替えの設定・表示の文・分類の名前は数値ファイルに置き、features の refusals で追う（2026-11-04 統合：prompting#1・safety#1・symptoms#6・M5・M2）。サイン「同じセッションで言い直しても、止められ続ける」は症状のページ refused-or-blocked の困りごと（止められて続けられない）の言い換えなので外した。別名「拒否された」「分類器に止められた」は、困りごとの言い方なので症状の refused-or-blocked を主にし、このページから外した（2026-11-04 メイン。fix-aliases.md）。「分類器に止められた」は auto モードの分類器に操作を止められた場合とも読めるので、その読者のために related に what-auto-mode-stops#when-blocked を足した（R3-20）（2026-11-04 工程4：DR-19 m・a・d）"

