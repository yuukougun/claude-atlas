  # ---------------------------------------------------------------- 秘密と壊す操作
  - id: protecting-secrets
    chapter: 秘密と壊す操作
    title: 秘密情報（.env・API キー）を守る
    aliases: [".env を読ませない", API キーの漏洩, 認証情報を守る, 秘密の読み取りの禁止]
    type: recipe
    level: 任せる
    level_evidence: "decisions 2026-11-03「安全の既定の勧め方」で、任せる段階からは秘密の読み取りの禁止を既定にする（00 でも L3）"
    priority: 必須
    surfaces: [claude-code, app]
    principle: [縛る]
    prevents: [境界がない, 縛っていない]
    pitfalls: []
    scenes: [開発]
    summary: ".env や API キー、認証情報を Claude に読ませない設定を、権限ルールとサンドボックスの二重にして作れる。会話に貼った秘密は、手元の記録に平文で残る。"
    signs:
      - {type: goal, text: ".env や API キーを、絶対に読ませたくない"}
      - {type: situation, text: "認証情報のあるマシンで、Claude Code に作業を任せる"}
    prerequisites: [sandboxing]
    related: ["secrets-exposed#first-response", permission-rules, lethal-trifecta, what-feedback-sends, where-your-data-goes, what-auto-mode-stops, hook-recipes, before-opening-unknown-repos, check-billing-path, "default-safety-settings#by-stage"]
    tracks: [permissions, sandbox]
    volatility: 中
    sections:
      - {title: "秘密を作業ディレクトリと会話に置かない", anchor: keep-out}
      - {title: "権限ルールとサンドボックスの二重にする", anchor: two-layers}
    templates:
      - {name: "秘密の読み取りを権限ルールとサンドボックスで拒む設定の例", kind: settings, safety: true}
    materials:
      - "00 §3 分野11（秘密情報を守る）"
      - "00 §4 指示と仕組みの困りごと（.env を絶対に触らせたくない）"
      - "05 4-6"
      - "11 第2節 分野11 p34#211"
      - "11 第4節 #11（deny だけで足りるとする書き方は不十分。子プロセスには効かない）"
      - "research/23 #5"
      - "research/28 #12・#41・#42"
      - "research/22 #9（メールアドレスを送る前の確認）"
      - "research/26 §3.8（環境の API キーと課金の経路）"
    notes: "工程2の事実：Read と Edit の deny は任意の子プロセスには効かず（research/23 #5）、サンドボックスの denyRead は Read の道具を止めない（同）ので、二重にする。サンドボックスは既定でホームの秘密の場所も読める（research/28 #42）。秘密の読み取りの禁止は decisions 2026-11-03 の安全の既定。雛形は偽の秘密だけで確かめる（decisions「危ない雛形を試す場所」）。読まれた・外に出された後の症状の入口は symptoms の secrets-exposed なので、related の先頭に置いた。逆引きの「.env や migrations を絶対に触らせたくない」（00 §4）は、.env の側が同じ意味のサインとしてあるので足さない（migrations の側は enforce の permission-rules・block-with-exit-2）。サインの文からバッククォートを外した（平文）。段階ごとの既定は default-safety-settings#by-stage を正本にし、ここは秘密の読み取りの禁止の作り方を持つ（2026-11-04 統合：symptoms#7・safety#10・M2・M6）。漏れた直後の初動（鍵の無効化・手元の記録に平文で残ること）は症状のページ secrets-exposed の節 first-response が一か所で持つ（design §4.1 の例外。R3-12）ので、節「貼ってしまったとき」（if-leaked。ほかのページからの参照はなかった）を外し、related の先頭で secrets-exposed#first-response を指す。サイン「会話に API キーを貼ってしまった」も初動を問う困りごとなので外し、secrets-exposed へ移すよう提案した（open_issues）。ここは秘密を置かない・貼らない・読ませない側を持つ（節 keep-out に「会話に置かない」を足した）。前提の permission-rules は sandboxing からたどって届くので related に移した（2026-11-04 工程4：DR-19 m・a・e）"

