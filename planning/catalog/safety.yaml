    notes: "題名を registry の「公開された artifact とファイルの扱い」から、共有する側も含む題名に改めた（旧題は aliases に残した）。research/26 §3.2 で会話の共有の仕様（写し・招待と公開リンク・取り消し・消せない写し）が確かめられ、app の分野に共有のページがないため。優先度を任意から推奨に上げた：公式も「公開リンクは公開したものとして扱う」と勧める流出の経路で、読者が日常的に触れるため。プランごとの共有の可否は数値ファイルに置く。tracks の chat-sharing は new_features に提案した。app の分野に会話の共有のページを置かないので、共有の操作も短く持つ（節 how-to-share・snapshot）：特定の人への招待と公開リンク、共有した会話の更新（招待は更新の操作、公開リンクは共有し直す）、Team と Enterprise の組織の中だけの共有（research/26 §3.2）。操作の画面の名前と、公開リンクを作れるプランは数値ファイルから書く。組織の中の共有は app の shared-projects-and-org-skills、ファイルを含む会話の公開の制限は app の files-and-code-execution と結ぶ（2026-11-04 統合：app#1）"

