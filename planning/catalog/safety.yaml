  # ---------------------------------------------------------------- 規則と開示
  - id: checking-ai-rules
    chapter: 規則と開示
    title: 学校・組織・コンテストの規則（類型と確認表）
    nav_title: 学校・組織・コンテストの規則
    aliases: [AI の利用の規則, 生成 AI のガイドライン, 大会の AI のルール, 規則の確認表, 生成物のライセンス]
    type: concept
    level: 使う
    level_evidence: "使い始める前に、所属する場の規則を確かめる必要がある（00 でも L1）"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [握る]
    prevents: []
    pitfalls: []
    scenes: [学習, コンテスト, チーム]
    summary: "学校・組織・大会の AI の規則が、禁止・部門分け・許可と開示のどの型かを見分け、確かめる点を確認表で押さえられる。規則に AI の文言がないことは、使ってよいことを意味しない。"
    signs:
      - {type: situation, text: "会社や学校で使ってよいか確かめたい"}
      - {type: situation, text: "AI の利用に規則のある大会に出る"}
      - {type: goal, text: "規則のどこを読めばよいか知りたい"}
      - {type: situation, text: "大会や学校、会社の規則に、AI のことが書かれていない"}
      - {type: goal, text: "AI が書いたコードを、製品や OSS に入れてよいか確かめたい"}
    prerequisites: []
    related: [competition-rules, practice-vs-contest-day, disclosure-and-provenance, entrusted-data, ai-usage-guidelines, instructions-hidden-in-materials, where-your-data-goes, when-requests-are-refused]
    volatility: 中
    sections:
      - {title: "なぜ規則が割れるか（三つの型）", anchor: why-rules-differ}
      - {title: "確認表", anchor: checklist}
      - {title: "文言がないとき・分からないとき", anchor: when-unclear}
      - {title: "生成物の権利とライセンス（確かめる先だけ）", anchor: rights-and-licenses}
    templates:
      - {name: "規則の確認表（AI の許可の範囲の6区分を含む）", kind: other, safety: true}
    visual: {kind: static, text: "何を測るかで規則の型が分かれる図（個人の考える力を測る大会は禁止へ、成果物を測る大会は許可と開示へ、両方を測る大会は部門分けへ）。授業や仕事に当てはめる例は類推と書く"}
    materials:
      - "00 §3 分野11（学校・組織・コンテストの規則）"
      - "00 §4 安全の困りごと（会社や学校で使ってよいか確かめたい）"
      - "11 第1節 分野11 解説節「なぜ規則が割れるか」（p12#23・p12#29・p34#199）"
      - "11 第2節 分野11（p12#35・p12#40・p56#121・p12#41・p12#42・p56#44・p56#108・p56#109）"
      - "11 第5節（雛形 A-2 大会ルール確認表）"
      - "requirements §6.5"
      - "research/24 §2.4・P-3・P-4"
      - "decisions 2026-11-03「大会の規則の版」・書き方の方針（第三者・根拠・コンテスト）4"
      - "design §6.11（法令の解釈は書かない）・decisions 2026-11-03 書き方の方針（安全・面・表現）7（法的な助言ではない）"
    notes: "優先度を registry の推奨から必須に上げた：design §4.2 で contest の competition-rules（必須）と practice-vs-contest-day（必須）がこのページの確認表を前提にするため（必須の前提は必須）。個別の規則の条文の要約は載せず、版・確認日・類型・一次資料へのリンクだけを数値ファイルに置く（design §6.13）。AI の利用を断るドメインの規則は「未確認」とし、リンクだけを置く。11 第2節の注記の付いた行（長期 AHC の部門ごとの範囲・部門の選び方・終了前の解法公開の禁止）と、requirements §6.5 の「過去問の練習には適用されない」（注記あり）は根拠にしない。法令の解釈と社内規則の回避は書かない。確認表は規則とデータの雛形として safety: true にし、別の担当の確認を通ってから載せる。「AI が書いたコードを製品や OSS に入れてよいか」で引くと、この辞典自身のライセンス（start の ai-and-sources）にしか着かなかった（R1-16）ので、サインと別名と節 rights-and-licenses を足した。節には権利やライセンスの解釈を書かず、確かめる先（提供元の利用規約・組織の規則・入れる先のプロジェクトの規則）と、分からないときは組織の担当に確かめることだけを書く。入れてよいと分かった後の開示と出所の記録は disclosure-and-provenance。contest の competition-rules が、このページと重なる節（規則が割れる理由・文言がないこと）を外して指す形にした（DR-19 r。F4）ので、そこで外したサイン「規約に AI のことが書かれていない大会に出る」を受けた：答えは節 when-unclear にあり、学校と会社の規則にも同じ問いがあるので、大会に限らない状況のサインにした。F4 が挙げた三つの型の理由（11 第1節 p12#23。根拠は強、版依存）を、節 why-rules-differ の図の案（visual）にした（大会の例が根拠で、授業と仕事への当てはめは類推）（2026-11-04 工程4：DR-19 h・r）"

