    notes: "題名に段階ごとの勧めを足した（decisions 2026-11-03「安全の既定の勧め方」を受け持つページにした）。面ごとの既定の表は数値ファイルから生成し、確認日を付ける。段階ごとの勧め（節 by-stage）は教材の推奨で安全の既定なので、変えるときは作者の承認が要る（design §9.4）。法令の解釈と社内規則の回避は書かない。安全を保証するものではないことは、サイトの注意書き（decisions 2026-11-03 の方針7）とそろえる。節 by-stage を「安全の既定」の正本にする（2026-11-04 メインの決定 M6。anchor は変えない）：start の four-principles と roadmap から related で指され、段階ごとの既定に触れるほかのページ（where-bypass-is-ok・protecting-secrets・entrusted-data、delegate の five-questions-before-delegating）は既定を繰り返さずに default-safety-settings#by-stage を指す。00 分野07 の「作業用のフォルダを作り、手動のモードで始める」（cli#1）は足さない：作業用のフォルダは recipes の office-paperwork（節 work-folder）が持ち、手動のモードを既定として勧めると、公式の既定（auto モード）を基準にする決定と食い違う（足すなら安全の既定の変更として作者の承認が要る）（2026-11-04 統合：safety#10・cli#1・M6）"

  - id: approval-fatigue
    chapter: 既定と承認
    title: 承認疲れ
    aliases: [approval fatigue, 確認を読まずに押す, 承認のしすぎ]
    type: judgment
    level: 整える
    level_evidence: "確認のたびに承認しながら使い方を整える段階で出会う（00 でも L2）"
    priority: 推奨
    surfaces: [claude-code, app]
    principle: [握る, 縛る]
    prevents: [境界がない]
    pitfalls: [預けすぎる]
    scenes: [開発]
    summary: "確認が多いと中身を読まずに承認するようになり、確認が安全の仕組みとして働かなくなる理由が分かる。確認を auto モード・許可ルール・サンドボックスで減らし、残す確認を絞れる。"
    signs:
      - {type: goal, text: "どの確認を残し、どれを減らすかを決めたい"}
      - {type: goal, text: "確認を減らしても、残した確認は中身を読んで判断したい"}
    prerequisites: [permission-modes-overview]
    related: [what-auto-mode-stops, permission-rules, sandboxing, wrong-amount-of-approvals, keeps-stopping, over-reliance, review-bottlenecks, permission-modes-in-the-app, default-safety-settings]
    tracks: [auto-mode, permission-modes]
    outdated_advice: [approve-everything-first]
    volatility: 中
    sections:
      - {title: "なぜ読まなくなるか", anchor: why}
      - {title: "確認を減らす順番", anchor: reduce-prompts}
      - {title: "残す確認を選ぶ", anchor: keep-prompts}
    materials:
      - "00 §3 分野11（承認疲れ）"
      - "00 §4 安全の困りごと（確認ボタンを読まずに押している）"
      - "05 1-10"
      - "research/23 F2-c・§3.3（承認の割合の公式の値は二つの記事で時期とデータが違う。人は長いセッションほど止めなくなった）"
    notes: "型を registry の concept から judgment にした：人の側の慣れで確認が働かなくなる話で、判断例（どの確認を残すか）と握るものが本体になるため（人の側の落とし穴の「預けすぎる」に当たる）。00 の「93% が承認されている」は、97% も公式の値で、時期とデータが違う（00 §7 の注記、research/23 F2-c）。どちらも測った期間と母集団の説明がない。数値は数値ファイルに出典の日付付きで置き、要約とサインに書かない。05 1-10 の「headless ではプロセスが終了する」は注記付きで使わない。サイン「確認のボタンを、読まずに押している」は、症状のページ wrong-amount-of-approvals の signs（00 §4 の症状の項目）と同じ文なので外し、判断の側のサイン（どの確認を残すか）を置いた。症状からは wrong-amount-of-approvals がここへ振り分ける（2026-11-04 統合：M2）。残っていたサイン「確認が多すぎて、席を外すと作業が止まっている」も、同じ症状のページの「許可を求められる回数が多すぎて作業にならない」の言い換えなので外し、やりたいことの形（残した確認は読んで判断したい）に替えた。別名「承認疲れ」はこのページを主にした（fix-aliases。症状のページの側から外す）（2026-11-04 工程4：DR-19 a・d）"

  - id: where-bypass-is-ok
    chapter: 既定と承認
    title: bypassPermissions と無人の実行はどこで動かすか
    aliases: ["--dangerously-skip-permissions", YOLO モード, 全許可モード, 使い捨ての環境, bypassPermissions はどこで使ってよいか, devcontainer, Docker, コンテナ]
    type: concept
    level: 仕組みにする
    level_evidence: "確認を外す・無人で動かすことを考え始める段階（仕組みにする）で最初に要り、回すのページの前提になる（00 でも L4）"
    priority: 必須
    surfaces: [claude-code]
    principle: [縛る]
    prevents: [境界がない]
    pitfalls: []
    scenes: [開発]
    summary: "確認をすべて外すモードや無人の実行を、隔離した使い捨ての環境だけで動かす理由と、その環境の条件が分かる。確認を減らすだけなら、先に auto モードとサンドボックスを使う。"
    signs:
      - {type: goal, text: "--dangerously-skip-permissions で、確認なしに走らせたい"}
      - {type: goal, text: "コンテナの中で Claude Code を無人で動かしたい"}
      - {type: situation, text: "夜間や CI で、人が見ていない間に Claude を動かしている"}
    prerequisites: [what-auto-mode-stops, sandboxing]
    related: [headless-basics, five-questions-before-delegating, "default-safety-settings#by-stage", permission-modes-overview, managed-settings-enforcement, protected-paths, before-opening-unknown-repos, github-actions-with-claude, cloud-sessions-and-teleport, checking-unattended-runs, destructive-commands, cloud-schedules]
    tracks: [permission-modes, headless, cloud-sessions]
    outdated_advice: [yolo-skip-permissions]
    volatility: 中
    sections:
      - {title: "なぜ隔離した環境だけか", anchor: why-isolate}
      - {title: "使い捨ての環境の条件", anchor: requirements}
      - {title: "書き込みを作業ディレクトリに閉じても代わりにならない", anchor: not-a-substitute}
    templates:
      - {name: "使い捨てのコンテナで無人の実行を動かす手順の例", kind: other, safety: true}
    materials:
      - "00 §3 分野11（bypassPermissions はどこで使ってよいか）"
      - "00 §5 台帳（--dangerously-skip-permissions で YOLO 運用）"
      - "01 C-1（公式の警告：prompt injection にも意図しない操作にも保護がない、root では起動しない）"
      - "11 第2節 分野11 p34#198・p34#212"
      - "research/22 §3.4（作業ディレクトリの外への書き込みを閉じる設定は、bypass でも効くがシェルは止めない）"
      - "05 4-8（クラウドセッションは隔離した VM）"
      - "02 §1-15（取り消しにくい操作を予定のタスクにしない）"
      - "decisions 2026-11-03「安全の既定の勧め方」（無人の実行は使い捨ての環境）"
    notes: "題名を registry の「bypassPermissions はどこで使ってよいか」から、無人の実行も含む題名に改めた（旧題は aliases に残した）。decisions 2026-11-03「安全の既定の勧め方」の「無人の実行は使い捨ての環境」を受け持つ。優先度を推奨から必須に上げた：安全の既定は初版に入れ、delegate の回すのページ（headless-basics など）の比例則の受け皿になるため。bypass を組織で使えなくする設定は enforce の managed-settings-enforcement（設定名は permissions.disableBypassPermissionsMode。古い名前 bypassPermissionsDisabled は使わない。research/25 P6）。安全装置を外す近道は勧めない（requirements §6.3）。段階ごとの既定（回すで使い捨ての環境）は default-safety-settings#by-stage を正本にして繰り返さない。権限モードの一覧の入口として cli の permission-modes-overview を related に置いた（2026-11-04 統合：cli#8・enforce#4・safety#10・M6）。使い捨てのコンテナの雛形を名前と困りごとから引けるよう、別名に devcontainer・Docker・コンテナを、サインに「コンテナの中で Claude Code を無人で動かしたい」を足した（R1-14。enforce の sandboxing はコンテナではなく OS のサンドボックスなので、これらの別名は sandboxing に置かない）。状況のサインは verify の checking-unattended-runs と同じ文にそろえた：同じ状況に、どこで動かすか（ここ）と結果をどう確かめるか（checking-unattended-runs）の二つの答えがあるので、逆引きで1行に束ねる（DR-15・R1-06）（2026-11-04 工程4：DR-19 h・a）"

