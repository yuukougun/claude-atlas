# 分野 12 safety（安全とデータ）の目次。工程3 C7（2026-11-04）。
# 形式は planning/catalog/README.md §3、規則は §4。語彙は schema/site.yml。
# 安全の既定は decisions 2026-11-03「安全の既定の勧め方」に従う（公式の既定の auto モードを基準に限界を書き、比例則で段階ごとの既定を示す。
# 任せる段階からはサンドボックスと秘密の読み取りの禁止、無人の実行は使い捨ての環境、預かったデータは契約のある面だけ）。
# 攻撃の手口は型と仕組みまで、無害な再現だけ（方針 B1）。安全とデータの雛形はすべて safety: true（方針 B2）。法令の解釈と社内規則の回避は書かない。
field: safety
chapters: [既定と承認, データの扱い, 悪意ある入力, 秘密と壊す操作, 規則と開示]
pages:

