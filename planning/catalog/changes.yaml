      - "research/23 §3.1（Wayback の写しで文書の改稿を見分ける）・§3.6（版の数え方）"
      - "design §9.4（この辞典の点検の手順。読者が自分で使える形に写す）"
    notes: "この辞典の鮮度の点検（design §9.4）と同じ手順を、読者が自分の環境で使える形にする。/doctor prompt-audit と /release-notes の今の名前と動きは、書く前に一次資料で確かめる（00 と 01 の材料で、工程2では確かめていない）。手元の版の確かめ方として、stable の通り道は latest より遅れて届き、大きな退行のある版を飛ばすことを書く。公式の文書や Claude Code に聞いた答え（ask-claude-code）にある機能が、手元の版にまだないことがある（research/22 #3）。遅れの日数は数値ファイルに置く。（2026-11-04 統合：cli#6）"

