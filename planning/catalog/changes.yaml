      - "00 §5 の台帳の後の段落（かつてはなぜ正しかったか。回避策が正式な仕組みに置き換わる規則）・00 §2 の五つ目の経路"
      - "00 §6「変わりやすさでページを分け、数値は一か所に集める」"
      - "00 §1「既存教材は機能順の一本道で、症状・検証・鮮度が空白のまま」（公式の教材も古くなる例）"
