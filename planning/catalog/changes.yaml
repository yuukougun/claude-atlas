      - "research/22 §3.2 の7（変更の在り処が分かれている）"
    notes: "brief の「なぜ古くなるか」の入口をこのページに持たせた。台帳（outdated-advice-ledger）の導入は短くし、ここへリンクする。日付のない記事の扱い、機能名と既定値を書いた記事の見方、公式の文書も改稿されることを書く。否定的な文脈で実在の記事や著者を名指ししない（design §6.12）。level は 00 の L1 のまま使うにした。"

  - id: checking-for-updates
    chapter: 古い情報を見分ける
    title: 最新を自分で確かめる方法
    aliases: [変更の追い方, 変更履歴の読み方, リリースノート, 手元の版を確かめる]
