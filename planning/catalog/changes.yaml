open_issues:
  - "提案（registry の ledger）：台帳に2項目を足す。(1)「Styles で応答の調子と形式を切り替える」→ 今は Instructions for Claude（いつも）か skill（場面ごと）。2026-06-01 に skills への移行が告知され、2026-11-03 には公式の記事が取り下げられている。UI にメニューが残るかは未確認（research/26 §3.1）。状態は置換。(2)「コンテキストを守るために subagent を使う」→ 溢れることはまれになり、並列の作業・うるさい出力の切り離し・独立したレビューのために使う。どれも追加のトークンがかかる（現行の Best practices の「What you can stop doing」の行。research/23 §3.1・§3.7）。状態は条件付き。同じ表の「よい答えのために subagent に任せる」は tell-it-to-use-subagents の「今どうするか」に入れられる。"
  - "提案（全分野）：old-and-new-names を start の term-index にまとめた。旧名と新名の対応表を前提や関連に書いたページは term-index を指す。改名の時期と版は change-timeline-2026 に置く。"
  - "提案（土台作り・data/outdated-advice.yml）：台帳の行の「変わった時期」は、00 §5 の値のうち注記のあるもの（think-hard-keywords の「2026-01〜03 に変遷」、important-caps の「強調は1行だけにし」）を research/23 §3.5・§3.7 の内容で入れる。「2026（公式の撤回表）」とした行（important-caps・architecture-in-claude-md・keep-going-dont-be-lazy）と save-context-for-200k は「2026-10-27 ごろ（Best practices の改稿）」にできる（research/23 §3.7）。research/22 §3.4 の3行（think-hard-keywords・yolo-skip-permissions・save-context-for-200k）の足す内容も入れる。"
