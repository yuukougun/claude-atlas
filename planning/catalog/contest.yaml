    materials: ["requirements §4.3 contest（七つの形式）", "decisions 2026-11-03「コンテストの分野」（七つの形式を同じ厚さで）", "10 第2章（表と五つの軸。注記つき）", "11 第1節 新分野案Y「形式別の早見表」p12#53〜p12#62", "11 第1節 新分野案Y「形式と AI の効き方」p12#17・p34#94", "11 第1節 分野12 p12#63（五つの軸の一般の判断は delegate の is-the-task-ai-suited）", "11 第3節 C-12", "11 第4節 #49・#59", "research/24 A-1・A-3・A-5・A-7・B-2・B-3・B-6・§2.4", "research/22 #45・#46"]
    notes: "contest の formats-and-ai-fit をまとめた（形式と AI の効き方の五つの軸は、表の列と導入の節 why-formats-differ にする。軸の一般の判断は delegate の is-the-task-ai-suited が持つので前提にし、ここは大会の形式への当てはめだけにする（delegate の担当の提案と同じ）。成績の数値は ai-in-contests-today の確認日付きの囲みに置く）。型は hub にした（registry の見当は comparison）。七つの形式は比べて選ぶものではなく、自分の形式の行から規則・評価器・練習・本番のページへ進む題材の入口なので（design §1.2「題材の入口」、requirements §4.3 の置き方の理由3）。decisions 2026-11-03「コンテストの分野」により七つの形式を同じ厚さで扱う。requirements §4.3 の七つに短期のヒューリスティック（短期 AHC）がないので、ヒューリスティックの行の中で短期と長期を分ける。表の規則の列は条文を書かず、類型だけを数値ファイルから出す（方針 A4）。一次資料で確かめたのは長期 AHC の2部門制（AHC074 から、告知の範囲は今後数回）と ISUCON2026 のレギュレーションの所在だけで、ほかの版は「未確認」（research/24 §2.4、research/22 #45）。言語別の一発生成の平均は言語選びの根拠にしない（11 第4節 #49）。「AI はほぼ全形式でトップに並んだ」とは書かない（research/24 A-7）。対戦型と長期チーム戦の行は直接の研究がなく類推と書く（requirements §4.3）。例は調査の厚い AtCoder（ABC・AHC）から多く取る（decisions「コンテストの分野」）。AtCoder の規則の細部と競技の練習法は kyopro-atlas へリンクする（方針 A5。atcoder-system#ai-rules・practice-method・contest-strategy・stress-testing など）。優先度は推奨のまま（contest は第一波の後。decisions 2026-11-03「第一波に足すもの」）。"

  - id: ai-in-contests-today
    chapter: 入口と現在地
    title: "AI はコンテストでどこまで来たか（確認日付き）"
    nav_title: null
    aliases: ["AI の大会の成績", "AI はコンテストで勝てるか"]
    type: concept
    level: 使う
    level_evidence: "大会に AI を使うか考え始める段階で、何ができて何ができないかの見当として最初に引く"
    priority: 推奨
    surfaces: []
    principle: [確かめる, 握る]
    prevents: []
    pitfalls: []
    scenes: [コンテスト]
    summary: "AI が人の上位に並んだ大会と届かなかった大会を確認日付きで示し、勝ち方の構造と、人の寄与がどこに残ったかを読み取れる。"
    signs:
      - {type: goal, text: "AI がプログラミングコンテストでどこまで勝てるのか知りたい"}
      - {type: situation, text: "AI が大会で優勝したと聞いて、自分の大会でも同じことができるか考えている"}
      - {type: situation, text: "考察は人にしかできないと思って、AI をほとんど使っていない"}
    prerequisites: []
    related: [format-cheatsheet, evaluators-by-format, verifier-defines-problem, competition-rules, what-not-to-delegate, ai-ideas-are-everyones, agent-loop, dating-information]
    tracks: []
    outdated_advice: []
    volatility: 高
    sections:
      - {title: "確認日付きの成績", anchor: dated-results}
      - {title: "勝ち方の構造（大量の試行と局所評価による選別）", anchor: how-ai-wins}
      - {title: "届かなかった場面", anchor: where-ai-falls-short}
      - {title: "人の寄与が残ったところ", anchor: human-contributions}
      - {title: "規則の中で持ち込めるもの", anchor: what-you-can-reuse}
    visual: {kind: static, text: "知識を足した分と評価のループを足した分の伸びの比較（AHC の過去問のベンチマークのアブレーション。確認日とモデル名付き）"}
    materials: ["requirements §4.3 contest（確認日付きの囲み）", "10 第1章（訂正・注記つき）", "11 第1節 新分野案Y「AI はコンテストでどこまで来たか」p12#2〜p12#12・p12#14・p56#77", "11 第1節 新分野案Y「形式と AI の効き方」p12#17", "11 第2節 分野00 p12#1・p12#16", "11 第1節 分野12 p12#18〜p12#22", "11 第4節 #32〜#37・#57・#59・#60", "research/24 A-6・A-7・B-32・B-33・B-36・B-37・B-57・B-60・§3 の5・6", "research/25 P1"]
    notes: "優先度：成績は月単位で古くなるので数値ファイルの囲みに隔離し（requirements §4.3 の置き方の理由2）、原則のページから切り離すための受け皿。必須にはしない（推奨。registry の見当）。研究や事例の紹介だけのページにしないよう、「成績から何を読むか」（構造を取り出す、届かない場面、人の寄与、規則の中で持ち込めるもの）を本体にする（design §4.1-5）。成績の数値は本文に書かず、数値ファイルに出典の種類と確認日付きで置く。AWTF 2026 Heuristic について工程2で直した誤った記述（出場していない上位の競技者が負けたとする記述）を繰り返さない。観戦者としての発言を出場者の言葉として書かない（research/24 A-6、research/25 P1）。AWTF 2025 の結果、ICPC 2025 の OpenAI の12問、IOI 2025 の6位相当、AWTF 2026 Algorithm の5問は工程2で一次資料を確かめていない（research/24 §5）。使う前に確かめるか、出典の種類（報道）を添える。ICPC の検証の範囲の但し書きは Gemini の結果に付ける（research/24 B-36）。MLE-bench は公式のリーダーボードの値（B-37）、CTF の Anthropic の順位の一つはベンダー自身の推定（B-57）。「ほぼ全形式でトップ」とは書かず、届かなかった場面（難しい CTF で0問など）を並べる（A-7）。AI 単独の優勝事例は真似る方法として書かず、構造だけを取り出す（requirements §6.3）。AI のループが禁じられる大会で持ち込めるのは、人が回す局所評価のループだけ（B-60）。人の寄与の事例の順位は自己申告と書き、否定的な文脈で個人を名指ししない（方針 A1）。contest の formats-and-ai-fit の材料のうち、問題ごとの成績のばらつき（p12#17）はここの囲みに置く。"

