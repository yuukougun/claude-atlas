    notes: "優先度：推奨（registry の見当）。一般の原理（検証器が問題を定義する・三条件・red/green）は eval が持ち、ここは形式ごとの当てはめに絞る（design §4.2）。七つの形式を同じ厚さで扱うため（decisions「コンテストの分野」）、機械の評価器がないハッカソンも節にする。第三者のツール（テスタの実行ツール、対戦のリーグのツール）は例として名前を出すだけにする（D13）。同じモデルに書かせた基準のボットは戦略が似通う、は仮説（11 第2節 p34#26）。誤答で提出が止まる大会の例は版に依存するので、規則のページの確認に回す。level：registry の見当は仕組みにするだったが、AI に任せる前の最初の成果物なので任せるにした（competition-day-operations と search-code-checklist の前提にするため）。評価器の red/green の雛形（10 付録A-13）は eval の test-the-verifier に置かれる（11 第5節）ので、ここは関連でつなぐ。"

