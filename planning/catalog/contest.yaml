    summary: "大会の AI の規則が禁止・部門分け・許可と開示に割れる理由と、主な大会の類型・版・確認日・一次資料の所在が分かり、出る前に何を確かめるかを決められる。"
    signs:
      - {type: situation, text: "出る大会で、AI をどこまで使ってよいか確かめたい"}
