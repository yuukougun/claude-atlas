notes:
  - "D5 によりコンテストに固有の論点だけを置いた。一般化できる論点（迎合・撤退・均質化・学び方・評価器の原理・実験の規律・性能改善）は judgment・eval・verify・recipes・delegate のページに置かれ、それらは scenes にコンテストを付ける（各分野の担当）。この分野は、確認日の要る情報（成績・規則）の隔離と、コンテストから引く読者の入口（format-cheatsheet）を受け持つ（requirements §4.3 の置き方の理由1〜4）。"
  - "wave は付けていない（decisions 2026-11-03「第一波に足すもの」：コンテストの分野は第一波の後）。必須は competition-rules と practice-vs-contest-day の2つ（registry の見当のまま）。"
  - "七つの形式は、format-cheatsheet と evaluators-by-format で同じ厚さの節にした（decisions「コンテストの分野」）。規則の確認表は safety の checking-ai-rules が持つ（design §4.2）。"
  - "大会の規則と成績は、類型・版・確認日・出典の種類・リンクだけを数値ファイルに置き、確かめられない版は「未確認」（方針 A4、decisions「大会の規則の版」）。対戦型と長期チーム戦は類推と書く（requirements §4.3）。"
  - "materials と notes に実在の個人の名前を書いていない。事例は 11 の元ID と research/24・25 の項目の番号で指した。失敗例を名指ししない（方針 A1）。"
  - "kyopro-atlas へのリンク（方針 A5）は catalog の id では指せないので、各ページの notes に書いた（atcoder-system#ai-rules・practice-method・contest-strategy・stress-testing など、2026-11-04 に kyopro-atlas の docs を読んで見当を付けた）。"

