    related: [practice-vs-contest-day, format-cheatsheet, disclosure-and-provenance, instructions-hidden-in-materials, entrusted-data, dating-information, competition-day-operations, ai-in-contests-today]
    tracks: []
    outdated_advice: []
    volatility: 高
    sections:
      - {title: "規則が割れる理由", anchor: why-rules-differ}
      - {title: "類型ごとの大会（確認日付き）", anchor: rules-by-type}
      - {title: "文言がないことは許可ではない", anchor: silence-is-not-permission}
      - {title: "版が確かめられないとき", anchor: unverified-versions}
    visual: {kind: static, text: "規則の三類型の図：個人の考える力を測る大会は禁止へ、成果物を測る大会は許可と開示へ、両方を測る大会は部門分けへ"}
    materials: ["requirements §4.3 contest・§6.5（【2026-11-03 注記】を含む）", "decisions 2026-11-03「大会の規則の版」・書き方の方針（第三者・根拠・コンテスト）の4と5", "design §6.13・§4.2", "10 第1章 ルールの地図（注記つき）", "11 第1節 分野11 p12#23・p12#29・p34#199・p12#36・p12#39", "11 第3節 C-1〜C-12（注記つき）", "11 第4節 #1〜#8（注記つき）", "research/24 A-1〜A-5・B-2・B-3・B-6・B-8・§2.4・P-4", "research/22 #45・#46"]
    notes: "優先度：大会で AI を使う前に必ず通る確認で、requirements §6.3 の「日付と版のない『この大会では AI が使える／使えない』という断定」を避ける受け皿なので必須（registry の見当）。規則の表は数値ファイルから作り、類型・版・確認日・一次資料へのリンクだけを持つ。条文の要約は載せない（方針 A4、design §6.13）。主催者の公式 X など AI の利用を断るドメインの外の一次資料で確かめたのは、長期 AHC の2部門制（AHC074 から、告知の範囲は今後数回）、長期 AHC の規則の案の試験コンテストの日程（2026-10-15〜18）、ISUCON2026 のレギュレーションの所在（許可）、Universal Cup の録画の義務、高専プロコンの公式ページ（行動規範の熟読を求める）、IEEEXtreme 20.0 の規則の AI の節の所在（research/24 A-1・A-4・B-6・B-8、research/22 #45・#46）。ABC・ARC・AGC の20261014版、短期 AHC の20260818版、長期 AHC の20261026版と各部門の範囲、Codeforces の規則、「過去問の練習には適用されない」は「未確認」とし、規則のページへのリンクだけを置く（decisions「大会の規則の版」）。atcoder.jp・codeforces.com へのリンクは張ってよいが、中身を AI で読まない。AtCoder の規則の細部は kyopro-atlas の atcoder-system#ai-rules へリンクする（方針 A5）。一般の類型と確認表（10 付録A-2）は safety の checking-ai-rules が持ち、ここは大会の早見に絞る（design §4.2）。前提の checking-ai-rules は、safety の担当が必須に上げた（registry の見当は推奨）ので、必須の前提の規則も満たす。"

