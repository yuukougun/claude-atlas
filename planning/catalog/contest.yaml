  - "確認（safety・C7）：competition-rules は design §4.2 のとおり safety の checking-ai-rules を前提にした。checking-ai-rules は C7 が必須に上げたので、必須の前提の規則も満たす。C7 の提案のうち practice-vs-contest-day の前提への checking-ai-rules は、competition-rules を通して推移的に届くので書いていない（catalog/README §4.4-1。直接の前提だけを書く）。10 付録A-2（大会の規則の確認表）は 11 第5節のとおり checking-ai-rules の折りたたみ例で、competition-rules からはリンクする。"
  - "確認（ほかの分野からの参照）：formats-and-ai-fit を format-cheatsheet に、insight-patterns を think-before-asking に、reading-top-solutions を learning-with-ai にまとめた。2026-11-04 の途中で delegate の is-the-task-ai-suited・team の ideate-independently・recipes の build-observation-tools がまとめた候補を指して参照のエラーになったが、各担当が直し、いまはエラーがない。あとで書く分野がまとめた候補を指したら、まとめた先に替えてほしい（insight-patterns は、think-before-asking をすでに前提か関連に持つページなら外すだけでよい。#five-questions に替えると前提と関連の重複になる）。recipes の提案（practice-vs-contest-day と早見表から read-specs-yourself へ、evaluators-by-format から build-test-harness へ、search-code-checklist は固有の点検だけ）と、team の提案（long-team-competitions の前提に separate-roles）と、delegate の提案（早見表の前提に is-the-task-ai-suited）は取り込んだ。"
  - "提案（eval・C8）：10 付録A-9 の後半（差分スコアと全再計算の一致の assert、取り消した後の状態の一致）は局所探索に固有なので、eval の differential-testing の折りたたみではなく contest の search-code-checklist の雛形にする案（11 第5節は差分テストのページに置く）。eval の担当の提案（evaluators-by-format の前提に verifier-three-conditions、running-contest-experiments の前提に experiment-log と selection-pressure、層別は measure-changes#by-stratum）は取り込んだ。工程4で直すときも verifier-three-conditions を任せるより上の段にしないでほしい（evaluators-by-format は任せる）。"
  - "提案（メイン・数値ファイル）：data/facts.yml に、大会の規則の項目（大会・部門・類型〔禁止・部門分け・許可と開示〕・版・版の状態〔一次資料で確認・未確認〕・確認日・一次資料の所在・確かめた資料の種類〔主催者の公式 X など〕）と、AI の成績の項目（大会・日付・結果・出典の種類〔一次・報道・ベンダーの推定・自己申告〕・確認日）を持たせる形を design §9.1 に足してほしい。competition-rules・format-cheatsheet・ai-in-contests-today の表はここから作る。"
  - "報告（メイン）：方針 A5 でリンクする kyopro-atlas の atcoder-system#ai-rules は、「AtCoder生成AI対策ルール（20261014 版）は…過去問の練習には適用されない」と言い切っている（2026-11-04 に kyopro-atlas の docs/start/atcoder-system.md を読んで確認）。claude-atlas はこの点と版を「未確認」とする（decisions 2026-11-03「大会の規則の版」）。リンクするのはよいが、二つの教材の書き方が食い違って見える。kyopro-atlas は変えていない（読むだけ）。"
