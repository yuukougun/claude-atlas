  # ── CLAUDE.md・rules・自動メモリ ──
  - id: what-to-put-in-claude-md
    chapter: CLAUDE.md・rules・自動メモリ
    title: "CLAUDE.md に書くこと・書かないこと"
    aliases: ["CLAUDE.md の書き方", "CLAUDE.md に書かないこと", "地雷リスト", "メモリファイル"]
    type: feature
    level: 任せる
    level_evidence: "毎回説明していた前提を常駐させて任せる段階で要る。00 では書くこと・書かないことのどちらも L3"
    priority: 必須
    surfaces: [claude-code]
    principle: [見せる]
    prevents: [見えていない, 散らかっている]
    pitfalls: []
    scenes: [開発, チーム, コンテスト]
    summary: "CLAUDE.md に残す行と外す行を見分け、外す行の移し先を決められる。推測できないコマンド・理由・落とし穴・確かめ方を残し、例外を許さない禁止は鍵に移して理由だけを書く。"
    signs:
      - {type: goal, text: "CLAUDE.md に何を書けばよいか知りたい"}
      - {type: goal, text: "ビルドやテストのコマンドと落とし穴を、毎回説明せずに伝えておきたい"}
      - {type: symptom, text: "CLAUDE.md に構成の説明を長く書いたのに、役に立っている気がしない"}
    prerequisites: [where-instructions-sit, request-vs-lock]
    related: [claude-md-length, path-scoped-rules, claude-md-vs-rules-skills-styles, when-to-lock, permission-rules, init-and-first-claude-md, instructions-ignored, repeating-the-same-explanation, how-skills-load, using-auto-memory, agents-md, claude-md-loading-order, hooks-basics, ai-usage-guidelines, share-team-settings, when-to-add-what]
    tracks: [claude-md]
    outdated_advice: [architecture-in-claude-md, hash-to-memorize]
    volatility: 中
    sections:
      - {title: "書くこと", anchor: what-to-write}
      - {title: "書かないことと、移し先", anchor: what-to-leave-out}
      - {title: "足すときの手順", anchor: adding-lines}
    templates:
      - {name: "短い CLAUDE.md の例（コマンド・理由・落とし穴・確かめ方）", kind: claude-md, safety: false}
      - {name: "チームの AI の使い方を「任せてよい・止まって相談する・禁止」に分けて冒頭に置く例（禁止は deny と hook と組にする）", kind: claude-md, safety: false}
      - {name: "コンテスト用の CLAUDE.md の例（ビルドと評価のコマンド・制限時間・規則の確認先）", kind: claude-md, safety: false}
    materials: ["00 §3 分野08（書くこと・書かないことの2行）", "00 §4 指示と仕組みの困りごと", "01 A-1（含める／除外の表。改稿前の Best practices の要約の可能性がある：01 冒頭の注記、research/23 F6）", "03 Q2 C2・C3・C5", "04 Q1 B", "05 1-5", "11 第2節 分野08（p34#118・p34#136）", "11 第3節 C-13", "11 第5節 A-3", "research/25 §3.2", "research/27 #8"]
    notes: "registry の what-to-leave-out-of-claude-md をまとめた（同じ判断の表と裏で、00 §4 の逆引きも一つの行から両方を指す）。旧の題名は aliases に、中身は節 what-to-leave-out に置く。01 A-1 の含める／除外の表は、執筆の前に現行の Best practices で確かめる。A-3 の雛形は「禁止」がお願いにすぎないと注記し、enforce の deny と hook の雛形へ案内する（11 第3節 C-13）。コンテストの例は規則の中身を書かず、確認先へのリンクだけにする（decisions 2026-11-03「大会の規則の版」）。/init の操作と叩き台の扱い、/init の是非の両論（03 Q2 C6）は cli の init-and-first-claude-md が持ち、ここは related で指すだけにする（2026-11-04 統合：extend#5）。sign「プロジェクト固有のコマンドや落とし穴を、毎回知らないまま作業される」は、症状のページ repeating-the-same-explanation（新しい会話のたびにプロジェクトの説明からやり直している）が振り分ける困りごとの裏側の言い換えなので、やりたいことの形にした。決めたコマンドを使わない困りごと（R1-13）は症状のページの担当が受けるので、ここには足していない。叩き台の削り方は claude-md-length（節 init-draft）が持つ（2026-11-04 工程4：DR-19 a・l）"

  - id: claude-md-length
    chapter: CLAUDE.md・rules・自動メモリ
    title: "CLAUDE.md の長さと剪定"
    aliases: ["CLAUDE.md が長い", "CLAUDE.md の行数", "/doctor prompt-audit", "CLAUDE.md の育て方"]
    type: feature
    level: 任せる
    level_evidence: "CLAUDE.md を書き足しながら任せていく段階で、長さと守られにくさが問題になる。00 では L3"
    priority: 必須
    surfaces: [claude-code]
    principle: [見せる]
    prevents: [散らかっている]
    pitfalls: [体感を信じる]
    scenes: [開発, チーム]
    summary: "CLAUDE.md や /init の叩き台を、行ごとに残すか削るかを判断して短く保てる。消したら誤りが出るかで選び、強調しても守られない行はファイルを短くするか鍵に移す。"
    signs:
      - {type: situation, text: "CLAUDE.md が長くなってきた"}
      - {type: goal, text: "CLAUDE.md から何を削ればよいか知りたい"}
    prerequisites: [what-to-put-in-claude-md, always-on-costs]
    related: [init-and-first-claude-md, path-scoped-rules, how-skills-load, when-to-lock, emphasis-words, instructions-ignored, pruning-extensions, measure-changes, felt-vs-measured, after-switching-models, share-team-settings, claude-md-loading-order, inspect-context]
    tracks: [claude-md]
    outdated_advice: [important-caps, architecture-in-claude-md]
    volatility: 中
    sections:
      - {title: "削るときの問い", anchor: deletion-test}
      - {title: "/init の叩き台を削る", anchor: init-draft}
      - {title: "チームで育てる", anchor: team}
    templates:
      - {name: "各行に「消したら誤りが出るか」を問わせる剪定のプロンプト", kind: prompt, safety: false}
    materials: ["00 §3 分野08", "00 §4 指示と仕組みの困りごと", "01 A-1（行数の目安・削るときの問い・/doctor・prompt-audit。強調の行には research/23 §3.7 の注記）", "03 Q2 C1・C8・C9", "03 Q2 C6（自動生成の叩き台は膨らみやすく「なぜ」が抜ける。叩き台に使うなら削って手で直す。節 init-draft）", "04 Q1 B", "05 1-5", "11 第2節 分野08（p34#107・p34#117・p56#64）", "11 第4節 #15", "research/23 §3.1・§3.7", "research/24 A-15", "research/25 §3.2"]
    notes: "行数の目安は数値ファイルに置く（公式の Memory のページの値。research/24 A-15）。従える指示の数の目安（150〜200）は出どころが弱いので、主張の根拠にしない（research/25 §3.2）。強調の扱いは現行の Best practices（守られない行は短くするか hook に）に合わせ、改稿前の「1行だけ強調」は使わない（research/23 §3.7）。実践者の幅（短い例と長い例）の数値は自己申告と添え、二次要約の値はそう書く（11 第4節 #15）。足した・削った行が効いたかは体感で決めず、小さく測る（pitfalls の体感を信じる。eval の measure-changes・felt-vs-measured。00 §4 確かめ方の困りごと）。サイン「CLAUDE.md が長くなってきた」の種類を、逆引きの表（catalog-C12 §7 #30）に合わせて situation にした。同じサインを path-scoped-rules にも置いた（2026-11-04 統合：B#30）。CLAUDE.md の削り方の持ち主をこのページにした（R3-11）：cli の init-and-first-claude-md にあった「叩き台をどう削るか」（推測できる説明を削り、推測できない約束と落とし穴を残す）を節 init-draft に移し、/init のページは操作と流れだけにして、ここを指す。related の先頭は節でなくページ（init-and-first-claude-md）にした。叩き台に入りがちな構成の説明を削る根拠として、台帳の architecture-in-claude-md を outdated_advice に足した。sign「強調を書き足しても、規則が守られない」は、症状のページ instructions-ignored（CLAUDE.md を書き足すほど守られなくなった）の言い換えで、「強調しても守られない」は prompting の emphasis-words・basics の request-vs-lock にもあった（R1-06）ので外した（2026-11-04 工程4：DR-19 a・l）"

