open_issues:
  - "連絡（全分野・メインへ）：registry の what-to-leave-out-of-claude-md は what-to-put-in-claude-md に、commands-became-skills は writing-skills にまとめた。ほかの分野がこの2つの id を指していれば、what-to-put-in-claude-md#what-to-leave-out と writing-skills#from-commands（related の場合）か、まとめた先のページ（prerequisites の場合）に直す。2026-11-04 の最後の検査の時点では、cli の init-and-first-claude-md の related が what-to-leave-out-of-claude-md を指している（検査のエラー1件。what-to-put-in-claude-md#what-to-leave-out に直せば消える。enforce の when-to-lock の同じ参照は直っていた）。"
  - "決めきれなかった点（cli の担当・工程4へ）：output style の機能のページは cli の output-style-modes（整える・推奨）に置かれた。design §4.2 の「文脈と指示の置き場所」に当たるので extend に移す案もあるが、組み込みの切り替えの操作が中心なら cli でよい。extend からは claude-md-vs-rules-skills-styles（output-style-modes#vs-claude-md）・extensions-at-a-glance・when-to-add-what が指し、cli の側も claude-md-vs-rules-skills-styles を指している。"
  - "賛成（changes の担当の提案へ）：台帳に「コンテキストを守るために subagent を使う」を足す案（changes の open_issues。現行の Best practices の What you can stop doing、research/23 §3.1・§3.7）に賛成する。今の tell-it-to-use-subagents（Opus 5 の頼み方の手引き）とは出典と中身が違う。足したら extend の writing-subagents も outdated_advice で指す。basics の subagent-isolation・context の research-in-subagents と、extend の writing-subagents の書き方（向くのは並列・うるさい出力の隔離・独立のレビューで、どれも追加のトークンがかかる）は揃っている（2026-11-04 に確かめた）。"
  - "確認（eval の担当へ）：measure-changes は CLAUDE.md・プロンプト・skill の変更を対象にしている（2026-11-04 に確かめた）。extend の claude-md-length・writing-skills（節 evaluate）・skill-descriptions から related で指している。スキルの有り無しを新しいセッションで比べる公式の方法（skill-creator・claude plugin eval。01 D-2）を例に足すかは eval の担当に任せる。"
  - "境界（cli の担当へ）：cli の init-and-first-claude-md は /init の操作と叩き台の扱い、extend の what-to-put-in-claude-md は何を残し何を外すかの判断、とした。/init の是非の両論（03 Q2 C6）は cli に置く案（extend は related で指すだけ）。"
  - "境界（context の担当へ）：context の always-on-costs は常駐のコストの「なぜ」、extend の extensions-at-a-glance はその列を含む比較の表、pruning-extensions は見直しの手順とした。extend の claude-md-length と pruning-extensions は always-on-costs を前提にした。2026-11-04 の context.yaml では always-on-costs は extend のページを前提にしていないので循環しない。always-on-costs の前提に extend のページを足すときは、この2ページとの循環に注意する。"
  - "境界（safety の担当へ）：MCP・プラグイン・スキル・mod の入れる前の確認と、MCP の脅威の型（05 4-4）は safety の vetting-extensions に任せ、extend の connecting-mcp・choosing-mcp-servers・plugins-and-marketplaces・mods・writing-skills・pruning-extensions・code-intelligence-plugins から related で指した。vetting-extensions が extend のページを前提にしても循環しない。"
  - "境界（app の担当へ）：app の skills-in-the-app・connectors-in-the-app・plugins-in-the-app は、extend の how-skills-load・connecting-mcp・plugins-and-marketplaces のアプリのタブと重なる。アプリに固有の操作（アップロード・Plugins のページ・組織の配布・Customize の画面）だけを app に置き、仕組みの説明は extend を related で指す案。台帳の customize-tabs は app の担当に任せる。"
  - "提案（symptoms の担当へ）：instructions-ignored の対処先に what-to-put-in-claude-md・claude-md-length・path-scoped-rules・hook-vs-skill を、repeating-the-same-explanation の対処先に when-to-add-what・how-skills-load を、replies-in-english の確かめる候補に what-subagents-dont-inherit（サブエージェントには出力スタイルや会話の指示が届かない）を、forgot-after-compaction に path-scoped-rules（paths 付きの rules は引き金のファイルを読むまで戻らない）を置く案。"
  - "提案（team の担当へ）：CLAUDE.md をチームの合意文書として運用すること（変更は PR で別の人が承認・定期の見直し・個人の好みは個人用へ。11 第2節 p56#64）は extend の claude-md-length の節 team に置いた。team の share-team-settings からは claude-md-length#team を指せる。"
  - "表記（用語集へ）：題名は research/27 §3.1 の案（公式の日本語版の本文の多数派）に合わせ、スキル・サブエージェント・フック・プラグイン・マーケットプレイス・出力スタイル・自動メモリと書いた。機能名・ファイル名・設定のキー（CLAUDE.md・rules・description・MCP・LSP など）は原文のまま。enforce の担当も同じ案（フック・プラグイン・スキルなど）に合わせている。registry と、ほかの分野の題名に残る英語の表記（Hooks・Skill など）を揃えるかは用語集で決める。"
  - "決めきれなかった点：choosing-mcp-servers は D13（第三者は例として名前だけ）に合わせて題名を「MCP サーバーの選び方」に変え、判断の基準のページとした。例を一切出さない形にするか、mcp-or-cli にまとめるかは、工程4の見直しで決めてよい。"

notes:
  - "level は 00 §3 の L3（任せる）と L4（仕組みにする）に従った。変えたのは mods だけ（L5 回す → 仕組みにする。理由は level_evidence）。「使う」「整える」のページはない（読者は CLAUDE.md の基本操作を cli の init-and-first-claude-md で知っている前提）。"
  - "比例則：任せる幅を広げる内容のページ（MCP・プラグイン・mod・スキル・サブエージェント）には、safety の vetting-extensions・lethal-trifecta、enforce の permission-rules・hooks-basics、verify の independent-review を related に置いた。前提にしなかったのは、相手の分野がこちらのページを前提に置いたときに循環するのを避けるため。対象外のページ（agents-md・how-skills-load）は notes に理由を書いた。2026-11-04 の統合（M9）で見直し、agents-md は警告を残し、how-skills-load は補助のスクリプトを読まずに実行する点から safety の vetting-extensions を related に置いた。"
  - "2026-11-04 統合（I4）：ほかの分野の提案と逆引きの行を反映した。題名の表記は M1 にそろっていたので、変えたのは using-auto-memory（英語名を aliases へ）だけ。症状の項目と同じ文のサイン3つ（#33・#34・#42）を対処のページから外した（M2）。ページの数・id・anchor・priority・level は変えていない。扱いの一覧は planning/batches/step3/integrate-I4.md"
  - "前提は basics（request-vs-lock・where-instructions-sit・attention-budget・what-survives-compaction・subagent-isolation・agent-loop）、context の always-on-costs（相手が extend のページを前提にしていないと確かめた）、自分の分野のページに限った。ほかの分野のページは related で指す。"
  - "機能の属性（強制力・読み込みの時期・コンテキストのコスト・圧縮で残るか・成熟度）はページに持たない。comparison の5ページ（extensions-at-a-glance・claude-md-vs-rules-skills-styles・hook-vs-skill・skill-vs-subagent・mcp-or-cli）の表は数値ファイルから生成し、手書きは判断例だけにする。comparison にも tracks を書いたのは、表に並べる機能を道具に渡すため。"
  - "工程2の事実に合わせたもの：圧縮の後にスキルの説明文は v2.1.304 以降入れ直される（research/23 #6）、組み込みの出力スタイルは4種（research/23 #2）、/agents のウィザードは削除された（01 E-1・4-2）、コンテキストを守るための subagent と IMPORTANT の強調は現行の Best practices で古い助言の表に入った（research/23 §3.1・§3.7）。どれも、注記のある古い記述を summary・signs の根拠にしていない。"
  - "2026-11-04 工程4（F4）：DR-19 の a（症状のページの困りごとの言い換えを狭い場面か goal に）・b（記事の古さの一般的な sign）・d（別名の重なり）・e（推移的な前提）・h（R1-17：connecting-mcp の切り分け）・i（memory-faq への参照）・l（CLAUDE.md の削り方の持ち主を claude-md-length に）を反映した。ページの数・id・priority・level は変えていない。anchor は足しただけ（claude-md-length#init-draft、connecting-mcp#troubleshooting）。扱いの一覧は planning/batches/step4/fix-F4.md"
