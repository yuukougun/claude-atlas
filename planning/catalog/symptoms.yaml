    prerequisites: [when-requests-are-refused, rewind-dont-correct]
    related: [give-reasons, "asking-for-reasoning#refusal", what-feedback-sends, checkpoints-and-rewind, current-models, keeps-stopping, followed-injected-instructions, when-to-start-fresh, isolate-with-safe-mode, six-causes]
    tracks: [checkpoints, refusals]
    outdated_advice: []
    volatility: 高
    sections:
      - {title: "原因を安く確かめる順", anchor: diagnosis}
      - {title: "面ごとの表示の違い", anchor: by-surface}
    materials: ["research/26 #5・#6・#7・§3.3（公式の案内：面ごとの表示、会話全体の判定、巻き戻しと新しい会話、推論の全文を求めない、誤判定の報告、検証の制度。§3.3 (b) の5「モデルを変える」は、§4.3 の1 と decisions のとおり手段として書かない）", "decisions 2026-11-03「断られたときの頼み直し」と「書き方の方針（安全・面・表現）」3"]
    notes: "新規：research/26 §3.3 が症状のページ「断られた・止められた」を提案し、decisions 2026-11-03 が書き方を決めている。registry にない。優先度は推奨（初版の必須の外で、需要を見て足す）。対処の本体は safety の when-requests-are-refused（safety の担当が新しく足したページ）で、ここは面ごとの表示の文と、会話の中の引き金・指示の中の推論の要求・自動の切り替えが起きたかの切り分けに絞り、手段の手順と、分類器と自動の切り替えの仕組みの本体は when-requests-are-refused に任せて繰り返さない（safety の notes の分担と同じ。節 by-surface は表示の文の違いを書く）。推論の全文を求める指示が止められる点は prompting の asking-for-reasoning#refusal を指す。公式が案内する手段だけを書く（本当の目的と文脈を足す〔偽らない〕・巻き戻しや新しい会話で引き金になった内容を外す〔推論の全文を求める指示が引き金なら、その指示を外す〕・誤判定を報告する・専門の仕事には検証の制度を案内する）。アプリの自動のモデルの切り替えは、表示の違い（途中で別のモデルの返事になる）から切り替えが起きたと読む手がかりとして触れ、「モデルを変える」を通すための手段として書かない（decisions 2026-11-03「断られたときの頼み直し」、research/26 §4.3 の1）。そのため related に choosing-a-model を、tracks に model-selection を置かない（切り替えの設定は refusals で追う。current-models は、切り替わった先のモデルの位置づけを読むために残した）。言い換え・分割・偽の文脈は書かない。表示の文と分類の名前は数値ファイルに置く（volatility 高）（2026-11-04 統合：prompting#1・M5）"

