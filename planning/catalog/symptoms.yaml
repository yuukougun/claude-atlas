  - id: refused-or-blocked
    chapter: 返答と品質
    title: 断られた・止められた
    aliases: [拒否された, 利用ポリシーで止められた, 分類器に止められた, refusal]
    type: symptom
    level: 整える
    level_evidence: "資料や connector を読ませる、セキュリティの作業を頼むなど、会話に多くを持ち込む段階で出会いやすい。巻き戻しや新しい会話（整える）で進め直す"
    priority: 推奨
