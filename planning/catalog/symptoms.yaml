# symptoms（症状辞典）の目次。形式：planning/catalog/README.md §3。語彙：schema/site.yml。
# 担当：C12（工程3、2026-11-04）。症状は1症状1ページ。振り分けが本体で、対処の本体はほかの分野のページにある。
# 診断の順は六つの原因を安く確かめられる順（見えていない → 散らかっている → 確かめていない → 縛っていない →
# 合っていない → 境界がない。requirements §3.2・design §2.2・§6.3）。関われば人の側の落とし穴も問う。
# prevents は、そのページの診断で問う原因を上の順に並べた。全ページが第一波の核（wave: 1。registry の wave_core と D10）。
# ほかの分野のページは registry の id で指す。各ページの sections の diagnosis は、ほかのページから
# 「id#diagnosis」で診断の節を指せるように、全ページで同じ anchor にした。
# 工程4（F7、2026-11-04。design-review DR-02・DR-19 x）：原因ごとの振り分け先を routes に分けた。routes は prevents・pitfalls の
# 原因ごとに中心の対処を1〜3件、近い順に置き、中心の対処が必須なら先に置いた（第一波には各原因の最初の必須の先が入る）。
# prerequisites は診断を読むのに要る概念のページ（主に basics）だけにし、level はその症状に出会う段階で付け直した。
# related は routes にない近いページだけにした（工程3の版は、prerequisites に対処の中心を、related に残りの対処を置いていた）。

field: symptoms
chapters: [返答と品質, 事実と出典, 会話と文脈, 指示と仕組み, 日本語の出力, 完了と検証, 長い作業と方針, 安全と承認, 上限と速さ]

