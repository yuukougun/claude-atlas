    related: [checkpoints-and-rewind, what-feedback-sends, isolate-with-safe-mode, current-models, block-with-exit-2, keeps-stopping, followed-injected-instructions, wrong-amount-of-approvals, six-causes]
    tracks: [checkpoints, refusals, auto-mode]
    outdated_advice: []
    volatility: 高
    sections:
      - {title: "何に止められたかを見分ける（利用ポリシーか、auto モード・フック・権限ルールか）", anchor: what-stopped}
      - {title: "原因を安く確かめる順", anchor: diagnosis}
      - {title: "面ごとの表示（本体は when-requests-are-refused の節 by-surface）", anchor: by-surface}
    materials: ["research/26 #5・#6・#7・§3.3（公式の案内：面ごとの表示、会話全体の判定、巻き戻しと新しい会話、推論の全文を求めない、誤判定の報告、検証の制度。§3.3 (b) の5「モデルを変える」は、§4.3 の1 と decisions のとおり手段として書かない）", "decisions 2026-11-03「断られたときの頼み直し」と「書き方の方針（安全・面・表現）」3"]
    notes: "新規：research/26 §3.3 が症状のページ「断られた・止められた」を提案し、decisions 2026-11-03 が書き方を決めている。registry にない。優先度は推奨（初版の必須の外で、需要を見て足す）。対処の本体は safety の when-requests-are-refused で、ここは切り分け（何に止められたか・会話の中の引き金・指示の中の推論の要求・自動の切り替えが起きたか）に絞る。手段の手順・面ごとの表示の文・分類器と自動の切り替えの仕組みは when-requests-are-refused が一か所で持ち、ここでは繰り返さない。推論の全文を求める指示が止められる点は prompting の asking-for-reasoning#refusal を指す。公式が案内する手段だけを書く（本当の目的と文脈を足す〔偽らない〕・巻き戻しや新しい会話で引き金になった内容を外す〔推論の全文を求める指示が引き金なら、その指示を外す〕・誤判定を報告する・専門の仕事には検証の制度を案内する）。アプリの自動のモデルの切り替えは、表示の違い（途中で別のモデルの返事になる）から切り替えが起きたと読む手がかりとして触れ、「モデルを変える」を通すための手段として書かない（decisions 2026-11-03「断られたときの頼み直し」、research/26 §4.3 の1）。そのため related に choosing-a-model を、tracks に model-selection を置かない（切り替えの設定は refusals で追う。current-models は、切り替わった先のモデルの位置づけを読むために残した）。言い換え・分割・偽の文脈は書かない。表示の文と分類の名前は数値ファイルに置く（volatility 高）（2026-11-04 統合：prompting#1・M5）。工程4：(1) 診断の最初に、利用ポリシーの判定で断られたのか、auto モードの分類器・フック・権限ルールに操作を止められたのかを見分ける節 what-stopped を足した（R3-20・DR-19 t）。利用ポリシーの枝は、見えていない（本当の目的と文脈が伝わっていない → when-requests-are-refused#official-steps・give-reasons）と散らかっている（会話の中の引き金 → 巻き戻し・新しい会話・推論の全文の要求を外す）へ、止められた枝は合っていない（縛りや権限モードが作業に合っていない。requirements §3.2 の⑤「止まりすぎ」→ what-auto-mode-stops#when-blocked・lock-side-effects・permission-rules）へ振り分ける。(2) 節 by-surface は1行にして when-requests-are-refused#by-surface を指す（表示の文は変わりやすく、二か所に持つと点検で食い違う。DR-19 m・R3-12）。(3) 別名は利用ポリシーの言い方を先に並べた。「拒否された」「分類器に止められた」はこのページを主にした（fix-aliases）。「分類器に止められた」で着いた auto モードの読者は節 what-stopped から合っていないの枝へ進む。(4) level は、対話で頼む段階から断られることがあるので、出会う段階の使うにした。前提の when-requests-are-refused と rewind-dont-correct は対処なので routes に移した（2026-11-04 工程4：DR-19 x・t・m）（2026-11-04 工程5：第一波に入る推奨のページを必須に上げた。decisions 2026-11-04「第一波の範囲」）"

