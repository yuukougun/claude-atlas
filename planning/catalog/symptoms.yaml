    materials: ["requirements §4.4 symptoms", "11 第1節 分野18 p34#18（リークのある CV を仕込んだ実験。根拠：中〜強、類推）", "10 第8章・第18章", "11 第2節 分野09 p34#26"]
    notes: "requirements §4.4 で足した5つの症状の1つ。事例はコンテストのデータ分析だが、業務の分析とテストに一般化して書く（【競】の例は scenes のコンテストで示す）。人の側では、評価の設計まで任せきる（ア）を問う。層ごとと最悪の場合で測り直す手は eval の measure-changes#by-stratum（registry の stratified-and-worst-case をまとめた先）を指す（2026-11-04 統合：eval#2）。工程4：(1) 題名を、Claude の側の言い方から読者が出会う言い方「手元の評価は良いのに本番で通用しない」にし、前の題名は aliases に移した（R1-07・DR-19 c）。summary も題名に合わせた。同じ型だった eval・delegate・contest のサイン（指標のずれ・選び続けた版・隠しテスト・長く回した・公式の採点と合わない）は、それぞれの担当が原因に固有の場面に書き換えていた。(2) 前提は、検証器が問題を定義することを説明する eval の verifier-defines-problem（概念）だけにし、check-the-metric と verifier-three-conditions は routes に移した（verifier-defines-problem は両方からたどれる推移的な前提だった）。routes は、確かめていない → 検証器の三条件・検証器そのものを確かめる・指標そのものを確かめる、預けすぎる → 評価の定義は人が握る。level_evidence の「eval のページにそろえた」は、対処のページに合わせた言い方なので外した（2026-11-04 工程4：DR-19 c・x・e）（2026-11-04 メイン：良かった版を選び続けた枝〔eval の selection-pressure〕と、長く回し続けた枝〔delegate の open-ended-loop-trap〕を related の先頭に置いた。V2・V3 の指摘）（2026-11-04 工程5：第一波に入る推奨のページを必須に上げた。decisions 2026-11-04「第一波の範囲」）"

