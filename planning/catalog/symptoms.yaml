    notes: "復旧を先に、原因の切り分けを後に置く（読者が引くのは消された直後）。安全装置を外す近道を勧めない。雛形は safety と enforce のページに置き、ここには載せない。ノートの保管庫など、コードでないフォルダで一括の書き換えを任せる場面の予防（先に戻せる状態にする）は、related の recipes の notes-and-pkm から案内する（2026-11-04 統合：recipes#7）。工程4：(1) 消された直後の初動（節 recover：checkpoint と git で戻せるか・何が戻らないか）はこのページが一か所で持つ（design §4.1 の2の例外。DR-19 m・R3-12）。cli の recover-lost-work は初動の節を持たず、related の先頭でこの節を指す（fix-F4 の m）。戻した後に、途中のやり取りや失った作業をセッション記録から探す手は related の recover-lost-work（fix-F4 の5(a)）。(2) 前提は「何が止められなかったか（お願いだけだったか、鍵があったか）」を読むのに要る basics の request-vs-lock にし、checkpoints-and-rewind（初動の節から指す）は related、destructive-commands と permission-rules は routes に移した（checkpoints-and-rewind と permission-rules は destructive-commands からたどれる推移的な前提だった）。routes は、縛っていない → 消されたくないもの・権限ルール・protected paths、境界がない → サンドボックス・bypassPermissions と無人の実行の場所、預けすぎる → 段階ごとの安全の既定（正本の default-safety-settings#by-stage）・auto モードの限界。(3) 別名「破壊的な操作」は safety の destructive-commands を主にして外した（2026-11-04 工程4：DR-19 x・m・d・e）"

