    chapter: 返答と品質
    title: 断られた・止められた
    aliases: [利用ポリシーで止められた, 拒否された, 分類器に止められた, refusal]
    type: symptom
    level: 使う
    level_evidence: "対話で頼むだけの段階から、正当な依頼が断られることがある。auto モード・フック・権限ルールに操作を止められる場合は Claude Code に作業させる段から出会うが、最初に出会うのは対話の段（工程3は、巻き戻しや新しい会話〔整える〕で進め直すことから整えるにしていた）"
    priority: 必須
