    sections:
      - {title: "どの枠から引かれるか（プランごとの表）", anchor: which-limit}
      - {title: "使う価値がある仕事", anchor: when-worth-it}
    templates: []
    visual: null
    materials:
      - "00 §3 分野14（Fable を使う前に）・分野03 の本文（Fable の扱いはプランで大きく違う。モデルを選ぶページでは必ずプランとの関係を添える）"
      - "02 §2-4（Usage credits と Fable の扱い）・§2-2（Fable の消費は速い。倍率は非公開）"
      - "research/22 #34（Ultra を足す。Claude Code で使える版）"
      - "research/26 #22（料金のページの「週上限の半分まで」と、Max・Ultra の記事の「別の週上限」の書き方の違い）"
    notes: "料金のページと Max・Ultra の記事で、上位のモデルの枠の書き方が違う（research/26 #22）。数値ファイルに両方の出典を残し「食い違いあり」とする（design §6.7）。モデルを選ぶ判断の本体は models の choosing-a-model、ここは費用と枠に絞る。逆引きの「Fable を使ってみたい」（00 §4）は、同じ意味の goal（最上位のモデルを試してみたい）を、モデルの名前を使わないメインの決めた形「いちばん高性能なモデルを使ってみたい」に言い換えた（2026-11-04 統合：B #61・symptoms#15）。（2026-11-04 メイン：題名と id からモデルの系統の名前を外した。最上位のモデルは入れ替わり、名前が URL と題名に残ると古くなる。Fable の名前は aliases に置き、逆引きは「いちばん高性能なモデルを使ってみたい」で引く。I2 の報告のメインへ2）"

