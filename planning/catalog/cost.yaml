pages:
  - id: how-usage-limits-work
    chapter: 上限と節約
    title: 利用上限の仕組み（面をまたいで共有する枠）
    nav_title: 利用上限の仕組み
    aliases: [usage limits, 利用制限, 使用制限, five-hour limit, weekly limit, session limit]
    type: concept
    level: 使う
    level_evidence: "対話で使い始めて、最初に上限に当たる段階で要る"
    priority: 必須
    surfaces: [app, claude-code]
    principle: []
    prevents: [合っていない]
    pitfalls: []
    summary: "アプリ・Claude Code・Desktop が同じ利用枠を分け合うことと、枠の種類と戻り方が分かる。会話を片付けても、使った分は戻らない。"
    signs:
      - {type: goal, text: "/clear すれば上限が戻るのか知りたい"}
      - {type: symptom, text: "アプリをたくさん使った日は、Claude Code でも早く上限に当たる"}
      - {type: goal, text: "上限がいつ戻るのか知りたい"}
    prerequisites: []
    related: [what-uses-up-limits, saving-priorities, when-to-start-fresh, choosing-a-plan, usage-credits-basics, before-using-top-model, hits-limits-quickly, "usage-context-statusline#statusline", when-ai-is-unavailable]
    tracks: [usage-limits, plans, auto-continue, wrap-up-allowance]
    outdated_advice: [wait-out-5-hour-limit]
    volatility: 高
    sections:
      - {title: "面をまたいで一つの枠", anchor: shared-limit}
      - {title: "枠の種類と戻る時刻（プランごとの表）", anchor: limit-types}
      - {title: "残りを見る場所", anchor: where-to-check}
      - {title: "上限に当たったとき", anchor: when-you-hit-the-limit}
    templates: []
    visual: {kind: static, text: "アプリ・Claude Code・Desktop が一つの枠を分け合う図（枠の種類はプランで違う）"}
    materials:
      - "00 §3 分野14（利用上限の仕組み：面をまたいで共有、/clear では上限は戻らない。本文と表に【2026-11-03 注記】あり）・§4（/clear すれば上限は戻るのか）"
      - "02 §2-2（Usage limit の仕組み。注記あり）"
      - "research/22 #32・#33（2026-10-30 の改名と、確認済みの Ultra の口座は週の上限だけ。呼び方は five-hour limit と 5-hour limit）"
      - "research/22 #26（上限での自動の継続。3回で止まる）・#36（Wrap-Up Allowance。導入の時期は未確認）"
      - "research/26 §3.13（Ultra プランと確認の仕組み）"
      - "04 Q3（利用制限の歴史とユーザーの不満。二次情報）"
    notes: "registry の題名で外した「5時間・週」は外したまま（確認済みの Ultra の口座は週の上限だけ。research/22 #33）。プランごとの枠の種類と倍率は節 limit-types で数値ファイルから道具が書く。aliases の five-hour limit・weekly limit は公式の名前、session limit は Claude Code の旧い呼び方として置いた。公式の日本語版では「利用制限」の語も使われるので、用語集で表記を決める。「/clear すれば上限は戻るのか」（00 §4）の答えはこのページが持ち（sign と要約）、context の when-to-start-fresh から指される。/clear が上限を戻さなくても、関係のない作業の間で区切る価値は残るので、when-to-start-fresh を related に置いた（2026-11-04 統合：context#9）。"

  - id: what-uses-up-limits
    chapter: 上限と節約
    title: 上限を早く使う要因
    nav_title: null
    aliases: [使用量が多い, トークンを食う, Claude Code のコストを見る, /usage の内訳, /cost]
    type: concept
    level: 整える
    level_evidence: "会話の長さや資料の渡し方を整える段階で、何が枠を使っているかを知る必要が出る"
    priority: 必須
    surfaces: [app, claude-code]
    principle: [見せる]
    prevents: [散らかっている, 合っていない]
    pitfalls: []
    summary: "長い会話の送り直し・大きな添付・ツール・effort・並列の作業など、利用枠を早く減らす原因と、自分の場合に何が使っているかの確かめ方が分かる。"
    signs:
      - {type: symptom, text: "少し使っただけなのに上限に当たる"}
      - {type: goal, text: "何が使用量を食っているのか知りたい"}
      - {type: symptom, text: "長いセッションを続けると、消費が急に増える"}
    prerequisites: [how-usage-limits-work, rereads-whole-history]
    related: [saving-priorities, hits-limits-quickly, "usage-context-statusline#instruments", insights-and-usage-review, always-on-costs, effort-levels, "1m-context#cost-of-long-context", before-using-top-model, parallel-and-loop-costs]
    tracks: [usage, usage-limits]
    outdated_advice: [slash-cost-and-stats]
    volatility: 中
    sections:
      - {title: "枠を早く減らす原因", anchor: causes}
      - {title: "長いセッションで増える理由", anchor: long-sessions}
      - {title: "自分の場合を確かめる（/usage の内訳など）", anchor: find-what-uses-it}
    templates: []
    visual: {kind: static, text: "毎ターン全履歴を送り直すので、会話が長いほど1回の消費が増え、休んだ後はキャッシュが切れてさらに増える図"}
    materials:
      - "00 §3 分野14（上限を早く使う七つの要因・Claude Code のコストを見る（/usage・status line）：内訳と推奨、cache の状態）"
      - "02 §2-2（消費を早める要因・補足：effort・ツールと connector・自動の文脈管理）"
      - "01 M-1（/usage の内訳と推奨・長時間のセッションで使用量が増える理由・公式のトークン削減策）"
      - "10 第15章（消費を最も左右するのは、長いコンテキストの再送と、subagent・並列・ワークフローの増殖）"
      - "11 第2節 分野14 p34#156・p34#161（圧縮そのものにもコストがかかる、/clear はゼロ）"
      - "research/22 §3.4（idle compaction）"
    notes: "registry の claude-code-costs（Claude Code のコストを見る（/usage・status line））を節 find-what-uses-it にまとめた。/usage の内訳と推奨は「何が枠を使っているか」を確かめる手段で、原因のページと同じ問いに答えるため（面に固有の操作の本体は cli の usage-context-statusline、振り返りは eval の insights-and-usage-review）。題名から数（七つ）を外した（公式が挙げる要因の数は変わりうる）。"

