pages:
  - id: choosing-a-surface
    chapter: 面の選び方
    title: アプリ・Claude Code・API の選び方
    nav_title: null
    aliases: [面の選び方, どの Claude を使うか, Claude Code と Cowork の使い分け, 統合された Claude, Chat と Cowork の統合]
    type: comparison
    level: 使う
    level_evidence: "対話で頼み始めた段階で、どの面で作業するかを最初に選ぶ"
    priority: 必須
    surfaces: [app, claude-code, api]
    principle: [見せる]
    prevents: [合っていない]
    pitfalls: []
    scenes: [開発, 文章, 調べもの, データ分析]
    summary: "頼みたい作業を、アプリ・Claude Code・API のどれで進めるかを、誰が手を動かすか・何に触れるか・どこで動くかの三つで選べる。迷ったら、触れる必要のあるものから決める。"
    signs:
      - {type: goal, text: "この作業をアプリと Claude Code のどちらでやるべきか決めたい"}
      - {type: goal, text: "コードを書かない仕事にも Claude Code を使うべきか知りたい"}
      - {type: situation, text: "古い記事の「Cowork は別のアプリ」という説明が、今の画面と合わない"}
      - {type: goal, text: "自分のプログラムから Claude を呼ぶべきか、今ある面で足りるかを決めたい"}
    prerequisites: []
    related: [where-it-runs, claude-code-surfaces, what-each-surface-cannot-do, product-map, tasks-and-schedules-in-the-app, permission-modes-in-the-app, sdk-comparison, headless-basics, office-paperwork, browser-control, peripheral-products]
    tracks: []
    outdated_advice: [cowork-separate-app]
    volatility: 高
    sections:
      - {title: "三つの面を比べる", anchor: compare-surfaces}
      - {title: "アプリはチャットとタスクを一つの会話で扱う", anchor: app-chat-and-tasks}
      - {title: "アプリのタスクか Claude Code か", anchor: app-tasks-or-claude-code}
      - {title: "自分のプログラムから呼ぶとき（API・SDK）", anchor: when-to-build-with-api}
      - {title: "判断例", anchor: examples}
    templates: []
    visual: {kind: static, text: "三つの面を、誰が手を動かすか・何に触れるか・どこで動くかの三つの軸で並べた図"}
    materials:
      - "00 §3 分野02（アプリ・Claude Code・API の選び方・統合された Claude・Claude Code と Cowork の使い分け）"
      - "00 §4 費用・選び方・任せ方（アプリと Claude Code のどちらでやるべきか・コードを書かない仕事に Claude Code を使いたい・自分のアプリに Claude を組み込みたい）"
      - "02 §1-1（統合された Claude 体験：Tasks・権限モード・現時点の制約・展開状況）"
      - "04 Q4（Code と Cowork の使い分け「Cowork から始め、繰り返す作業になったら Code へ」。二次情報）"
      - "01 P-1〜P-3（Claude Code の面）"
      - "02 §5-9（Agent SDK・Managed Agents・Client SDK の使い分け表）"
      - "00 §5 台帳（Cowork は別アプリ、Web search はトグルで入れる）"
      - "00 §3 分野07（Claude Code を非エンジニアが使う：Desktop の Code タブ・作業用のフォルダ・手動のモードで始める。cli の担当は for-non-engineers を採らず、00 §4 のサイン「コードを書かない仕事に Claude Code を使いたい」をここか recipes の office-paperwork に置く提案をした）"
    notes: "registry の unified-claude（統合された Claude）と claude-code-vs-cowork（Claude Code と Cowork の使い分け）を、app-chat-and-tasks と app-tasks-or-claude-code の節にまとめた。2026-09 の統合で Cowork はアプリの会話のタスクの機能になり、「アプリのタスクか Claude Code か」はこのページの比較の中心そのものになったため。タスクの使い方の本体は app の tasks-and-schedules-in-the-app、API・SDK の比較の本体は api の sdk-comparison。比較の表は数値ファイルの面の属性から生成する（open_issues の提案）。"

