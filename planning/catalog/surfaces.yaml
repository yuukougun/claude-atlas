merged:
  - {id: unified-claude, into: choosing-a-surface, reason: "2026-09 の統合でアプリはチャットとタスクを一つの会話で扱うようになり、面を選ぶときの前提そのものになった。独自の判断は「どこで動き、何に触れるか」で選ぶことで、choosing-a-surface と where-it-runs の判断と同じなので、節 app-chat-and-tasks にする。タスクの使い方は app の tasks-and-schedules-in-the-app"}
  - {id: claude-code-vs-cowork, into: choosing-a-surface, reason: "統合の後の Cowork はアプリの会話のタスクの機能で、「アプリのタスクか Claude Code か」は choosing-a-surface の比較の中心と同じ軸。比較のページを同じ軸で二つにしないため、節 app-tasks-or-claude-code にする（「繰り返す作業になったら Claude Code へ」という実践知を含む）"}
  - {id: screen-control, into: browser-control, reason: "computer use は beta で、概念と注意が中心になる（catalog/README §4.2 の7）。公式の優先順（connector → ブラウザ → 画面操作）は Claude in Chrome との選び分けで一つの判断になるので、browser-control の節 computer-use にする"}
  - {id: office-and-workspace, into: peripheral-products, reason: "requirements §6.3 で Office アドインなどの周辺製品は一覧のページだけにする。research/26 §3.6 の機能の詳細は一覧の節と数値ファイルに置く"}
  - {id: agent-sdk-and-managed-agents, into: sdk-comparison, reason: "design §4.2 で API・SDK の概念は api の分野が持つ。Agent SDK と Managed Agents の位置づけ（自分のプロセスに組み込むか、Anthropic にホストさせるか）は api の sdk-comparison の比較と同じ問いなので、そちらへまとめ、choosing-a-surface の節 when-to-build-with-api からリンクする"}
dropped: []
open_issues:
  - "提案（app・features）：アプリのタスク（Cowork）の機能の id が catalog/README §5 にない。app の担当が new_features で足すなら、choosing-a-surface と where-it-runs の tracks にも入れる"
  - "提案（api）：agent-sdk-and-managed-agents を sdk-comparison にまとめた。sdk-comparison に「面の中での位置づけ（自分のプロセスに組み込む・Anthropic にホストさせる・CLI で対話する）」の観点を入れ、related に choosing-a-surface を持ってほしい。sdk-comparison を merged・dropped にするときは、この merged の into を直す必要がある"
  - "提案（数値ファイル）：data/facts.yml に「面の属性」の表（面ごとの、手を動かす主体・触れられるもの・動く場所・読む設定・PC を閉じても続くか・できないこと）を確認日つきで持つ。choosing-a-surface・claude-code-surfaces・what-each-surface-cannot-do の表はそこから生成する"
  - "取り込み済み（2026-11-04 に確かめた）：start の product-map は choosing-a-surface・where-it-runs などを指し、safety の browser-agent-cautions と verify の visual-checks は browser-control を、recipes の make-slides・office-paperwork は peripheral-products#office-add-ins を指している。cli の using-ides は claude-code-surfaces を、cloud-sessions-and-teleport は where-it-runs を前提にし、control-from-phone は where-it-runs を指している。app の提案で choosing-a-surface の related に permission-modes-in-the-app を、peripheral-products の related に artifacts-overview#claude-design を入れた。app の permission-modes-in-the-app・tasks-and-schedules-in-the-app は、まとめた unified-claude の代わりに choosing-a-surface を前提にした"
