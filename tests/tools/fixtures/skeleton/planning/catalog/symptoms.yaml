# 骨格の道具の試験用（値は作りもの）。blocked-by-a-rule は、診断の節の前と後にほかの節を持つ
field: symptoms
chapters: [指示と仕組み, 安全と承認]
pages:
  - id: instructions-ignored
    chapter: 指示と仕組み
    title: CLAUDE.md や指示が守られない
    nav_title: 指示が守られない
    aliases: [指示を無視される]
    type: symptom
    level: 整える
    level_evidence: "試験"
    priority: 必須
    wave: 1
    surfaces: [claude-code, app]
    principle: [縛る, 見せる]
    prevents: [散らかっている, 縛っていない]
    pitfalls: []
    scenes: [開発]
    summary: "CLAUDE.md や指示に書いた規則が破られる原因を切り分け、どれを仕組みに移すかを決める。"
    signs:
      - {type: symptom, text: "CLAUDE.md に書いたのに守られない"}
      - {type: symptom, text: "長い会話の途中から規則を無視し始める"}
    prerequisites: [request-vs-lock]
    routes:
      - {cause: 散らかっている, to: [outdated-advice-ledger]}
      - {cause: 縛っていない, to: ["hooks-basics#exit-codes", hook-recipes]}
    related: [blocked-by-a-rule]
    tracks: [claude-md, hooks]
    outdated_advice: [important-caps]
    volatility: 中
    sections:
      - {title: "原因を安く確かめる順", anchor: diagnosis}
    visual: {kind: static, text: "お願いと鍵の二層の図"}
    materials: ["試験"]
    notes: null

  - id: blocked-by-a-rule
    chapter: 安全と承認
    title: 断られた・止められた
    type: symptom
    level: 整える
    priority: 必須
    wave: 1
    surfaces: [claude-code]
    principle: [縛る]
    prevents: [縛っていない, 境界がない]
    pitfalls: [預けすぎる]
    summary: "操作を止めたのが何かを見分け、止め方に合った手を選ぶ。"
    signs:
      - {type: symptom, text: "操作が止められて先に進まない"}
      - {type: symptom, text: "理由の分からない拒否が出る"}
    prerequisites: [request-vs-lock]
    routes:
      - {cause: 縛っていない, to: [hooks-basics]}
      - {cause: 境界がない, to: [hook-recipes]}
      - {cause: 預けすぎる, to: [agreement-is-not-evidence]}
    volatility: 中
    sections:
      - {title: "何に止められたか", anchor: what-stopped}
      - {title: "原因を安く確かめる順", anchor: diagnosis}
      - {title: "面ごとの違い", anchor: by-surface}
