title: 中身・確かめ方・止まる条件を足した、集計ファイルの依頼
kind: prompt
place: 依頼の本文
safety: false
features: [file-creation]
conditions:
  - 実行環境の設定（Create and edit files）が有効なこと
  - 偽のデータ（架空の売上の CSV）を添付して試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 作る前に、行数・列名・欠けた値の数が返答に出る
  - 返答の最後に、シートごとの内容と、合計を突き合わせた計算が書かれる
  - 列名が想定と違うデータを渡すと、直さずに止まって行の番号を報告する
control: 雛形を置かず「集計して xlsx にして」とだけ頼むと、合計の突き合わせの報告がなく、値が式でなく数値で入ることがある
