title: 理由と相談の基準だけを書く CLAUDE.md の節
kind: claude-md
place: project
safety: false
conditions:
  - 新しいセッションで試す
  - "`migrations/` を、権限のルールかフックで別に止めてあること（この雛形は止める側ではない）"
expect:
  - when: 小さな修正を頼む
    then: 変更が頼んだ範囲に収まり、ついでの整理が返答の最後の提案に回る
  - when: 範囲の外のファイルを変えないと終わらない依頼を出す
    then: 変えずに止まり、理由を書いて相談してくる場合が多い（指示はお願いなので、合否にしない）
control: 節を置かないときは、範囲の外の変更が混ざる頻度を比べる
