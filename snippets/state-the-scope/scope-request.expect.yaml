title: やること・やらないこと・触ってよい範囲を足した依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで、`src/auth/` を持つ小さなリポジトリで試す
  - 「戻り先」「ファイル名」「関数名」を自分のコードに置き換える
expect:
  - when: 欄を埋めた依頼を出す
    then: 変更されるファイルが、触ってよい範囲に書いた 2 つに収まる
  - when: 直す途中で範囲の外にも手を入れたくなる箇所がある
    then: 範囲の外は変えず、返答の最後に気づいたこととして書かれる
control: 「やらないこと」と「触ってよい範囲」を書かない同じ依頼では、周りの整形や関連ファイルの変更が混ざる場合がある
