title: リサーチを頼む文の型（範囲・出典の条件・出力の形）
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - リサーチが使える画面で試す。web 検索を有効にしてある
  - 問いは、複数の観点を集めて比べるものにする。1 つの事実の確認には使わない
expect:
  - when: 上の型に問いと範囲を埋めて出す
    then: 調べ始める前に計画が出て、数分かけて調べたあと、主張ごとに出典の URL が付いたレポートが返る
  - when: レポートの主張を見る
    then: 出典のある事実と推測が分かれて書かれ、見つからなかった点は見つからなかったと書かれている
control: 「出典の条件」と「出力の形」を書かない依頼では、出典のない主張や、事実と推測が混ざった文が増えることがある
