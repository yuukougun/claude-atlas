title: レポートの主張と出典の対応表を作らせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - リサーチのレポートを受け取った同じ会話で出す
expect:
  - when: 上の依頼を出す
    then: 主張・出典の URL・引用・出典の種類の 4 列の表が返り、出典のない主張には「出典なし」が付く
  - when: 表の引用を、出典の原文と見比べる
    then: 表は確かめる入口で、引用の文言も原文と照らす必要がある。ここで違いが見つかることがある（観察として扱い、合否にしない）
control: 表を作らせずにレポートだけを読むと、どの主張にどの出典が付いているかが追いにくい
