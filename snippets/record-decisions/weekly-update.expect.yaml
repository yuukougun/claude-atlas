title: 週次アップデートの型（決めたこと・AI に任せたこと・レビューしてほしい点）
kind: other
place: project
safety: false
conditions:
  - docs/updates/ に前の週の週次アップデートが 1 つ以上ある
expect:
  - when: 今週の ADR と PR の一覧を渡し、「雛形の欄に沿って週次アップデートの下書きを書いて」と頼む
    then: 「レビューしてほしい点」が「何に照らして」「何は除外して」の形で並び、任せた作業と確かめ方の対が欠けない
control: 雛形なしで頼むと、作業の経過の要約になり、レビューの観点や除外が書かれない
