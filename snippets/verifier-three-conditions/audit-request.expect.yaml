title: 検証器を 3 条件で点検させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 採点スクリプトと手元の入力が実在する作業ディレクトリで、新しいセッションで試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 返答が 3 つの観点ごとに、確かめたこと・確かめていないこと・懸念に分かれる
  - when: 採点に懸念が見つかる
    then: 採点スクリプトを直さず、直し方の案が別の節に分かれて出る
control: 3 つの観点を書かずに「採点を点検して」とだけ頼むと、正しさの確認だけで終わり、書き換えと入力の傾向に触れない返答になりやすい
