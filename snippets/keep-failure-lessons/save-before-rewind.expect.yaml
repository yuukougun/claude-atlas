title: 巻き戻す前に、駄目だった理由を 1 件だけ書き残させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 方針を 1 つ試して駄目だった直後の会話で出す
expect:
  - when: この依頼を出す
    then: DEAD_ENDS.md の末尾に 4 項目の記録が 1 件だけ増える
  - when: 追記された内容を見る
    then: 避けることが「〜はしない」の形で書かれ、ログの全文は入っていない
  - when: 会話を巻き戻す（コードは戻さない選び方をする）
    then: DEAD_ENDS.md の追記は残っている
control: 依頼を出さずに巻き戻すと、駄目だった理由は会話ごと消え、新しい会話で同じ案が出ることがある
