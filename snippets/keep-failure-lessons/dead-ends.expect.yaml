title: 行き止まりの記録ファイルの書き方（DEAD_ENDS.md の例）
kind: other
place: project
safety: false
conditions:
  - 中身の例は作り物。自分の作業の内容に置き換える
  - 新しいセッションの最初に、このファイルを読ませる
expect:
  - when: 新しいセッションでこのファイルを読ませてから、同じ課題を頼む
    then: 記録にある案を最初の候補として出さない
  - when: 記録の「見直す条件」を満たす状況を伝える
    then: 該当の案を、条件が変わった旨とともに再検討の候補に出すことがある
control: ファイルを読ませずに同じ課題を頼むと、記録にある案が再び出ることがある
