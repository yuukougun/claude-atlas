title: 計測つきの高速化の依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 固定反復数モードと固定時間モードで動かせる、乱数を使う処理のあるリポジトリで試す
  - プロファイルの出力を貼ってから依頼する
expect:
  - when: 雛形を埋めた依頼を出す
    then: 変更の前に出力が保存され、対象の関数以外はほとんど変更されない
  - when: 作業が終わる
    then: 出力の diff のコマンドと生の出力、変更前後 5 回ずつの値と中央値が報告に付く
  - when: 乱数生成器の差し替えのような出力が変わる候補が出る
    then: 別のコミットに分けられ、受け入れ条件が平均と最悪の帯の比較に切り替わる
control: 雛形を置かずに「速くして」とだけ頼むと、プロファイルを取らずに対象を選び、速さを報告の文だけで伝えてくることがある
