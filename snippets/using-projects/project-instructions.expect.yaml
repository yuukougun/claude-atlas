title: プロジェクトの指示の雛形（目的・資料の使い方・出力の形）
kind: prompt
place: プロジェクトの指示
safety: false
features: [project-instructions]
conditions:
  - プロジェクトを 1 つ作り、ナレッジに資料を数点置く
  - 山かっこの所を自分の目的と形式に書き換えて、プロジェクトの指示の欄に貼る
expect:
  - when: プロジェクトの中で新しい会話を始め、目的に沿った依頼を出す
    then: 返答が出力の形に書いた形式になり、事実に資料の出どころが添えられる
  - when: 目的から外れた依頼を出す
    then: 作業の前に、このプロジェクトで扱うか別に分けるかを聞く返答になる。指示は鍵でないので、聞かずに作業を始める場合は観察として記録する
control: 指示を空にして同じ依頼を出すと、形式と出どころの添え方が会話ごとにばらつく
