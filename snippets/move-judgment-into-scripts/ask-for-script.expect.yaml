title: 繰り返す集計をスクリプトにさせる依頼
kind: prompt
place: 依頼の本文（Claude Code で、スクリプトを置くリポジトリから）
conditions:
  - 新しいセッションで試す
  - 角括弧の欄を自分の入力と規則で埋める
expect:
  - when: 欄を埋めた依頼を出す
    then: scripts/aggregate.py ができ、小さな入力での期待値と実行結果の突き合わせが返答に出る
  - when: 同じ入力でスクリプトを 2 回流す
    then: 出力が一致する
  - when: 入力に空の欄の行を足して流す
    then: 除外した件数が出力に現れ、行数の突き合わせが合う
control: スクリプトにせず、毎回同じ集計を直接頼むと、頼むたびに数字が少しずつ変わることがある
