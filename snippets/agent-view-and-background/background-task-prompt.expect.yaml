title: 背景に投げる依頼の型
kind: prompt
place: 依頼の本文
safety: false
features: [agent-view]
conditions:
  - 欄を自分の作業で埋める
  - 触ってよい範囲と完了の条件は、確認のコマンドまで具体的に書く
expect:
  - when: 欄を埋めた依頼を背景のセッションに投げる
    then: 完了の報告が、変えたファイル・実行した確認・残った疑問の順になる
  - when: 判断が要る場面になる
    then: セッションが質問を 1 つにまとめて待ち、一覧で返事待ちとして見える
control: 型を使わず「これを直して」だけで投げると、完了の基準がなく、戻ってきたときに何を確かめるかが決まらない
