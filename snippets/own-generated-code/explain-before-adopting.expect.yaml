title: 中核の変更を採る前に理解を確かめる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 説明させたい変更が作業ツリーに入っている（差分か対象のファイルを指せる）
expect:
  - when: 対象を埋めてこの依頼を出す
    then: 返答が、処理の流れ、入力の端ごとの行番号つきの扱い、確かめたことと推測の区別、自分で試せる入力の 4 つに分かれる（分かれることは保証されないので、欠けた項目は聞き直す）
control: この依頼を出さないと、返答が変更の要約だけになり、入力の端の扱いと推測した部分が見えないまま採ってしまいやすい
