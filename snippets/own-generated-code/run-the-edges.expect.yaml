title: 説明の入力の端を実行で照らす依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 直前に、入力の端を挙げた説明を受け取っている（同じ会話）
  - 入力を流せる環境（テストランナーや実行コマンド）がある
expect:
  - when: 説明を受け取った直後に、この依頼を出す
    then: 項目ごとに、コマンドと生の出力と、説明と合ったかどうかが並ぶ（実際の出力は自分でも読んで確かめる）
  - when: 説明と実際の動きが食い違う項目がある
    then: 説明を黙って書き換えず、食い違いとして報告される（保証されないので、報告に出ない項目は自分でも実行する）
control: この依頼を出さないと、説明を読んだだけで採る形になり、説明のずれは実行されるまで見えない
