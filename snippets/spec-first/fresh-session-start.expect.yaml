title: 新しいセッションで仕様を渡して実装に入る依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 仕様を書いたセッションとは別の、新しいセッションで試す
  - SPEC.md が作業ディレクトリにある
expect:
  - when: この依頼を最初のメッセージに出す
    then: SPEC.md を読んだ後、計画が出て止まる。承認するまでコードは書かれない
  - when: 要確認事項が SPEC.md に残っている
    then: 決めずに質問が返る
control: 渡さずに「SPEC.md の通りに実装して」とだけ頼むと、要確認事項を自分で決めて進めることがある
