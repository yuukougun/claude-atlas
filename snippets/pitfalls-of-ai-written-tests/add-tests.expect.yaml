title: 既存のテストに合わせて足させ、壊したコードで落ちることを見せさせる依頼
kind: prompt
place: 依頼の本文（Claude Code・テストを実行できる場面）
safety: false
conditions:
  - 新しいセッションで試す
  - 実行コマンドに、リポジトリですでに動くテストの実行コマンドを書く
  - 作業用のブランチの上で試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 既存のテストと同じ書き方でテストが足され、通った出力が返答に貼られる
  - when: 手順 4 まで進む
    then: 壊したコードでテストが落ちた出力が貼られ、落ちなかった壊し方にはテストが足される
  - when: 手順 5 まで進む
    then: git diff の出力に、対象のコードの変更が残っていない
control: 「テストを足して」だけで依頼すると、通ったことだけが報告され、コードを壊したときに落ちるかは確かめられないことがある
