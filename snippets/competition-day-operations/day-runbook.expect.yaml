title: 本番の手順表（前日・開始直後・中盤・終盤・提出）
kind: other
place: チームの共有メモ（リポジトリの外でもよい）
safety: false
conditions:
  - 前日までに、空欄を大会の規則と自分の環境に合わせて埋める
expect:
  - when: 表を埋めてチームに共有する
    then: 各段の「終わりの確かめ」が、本番の最中に見て判定できる文になっている
  - when: AI が止まったと仮定して、表の「AI が止まったとき」の行だけで作業を続けられるか読み合わせる
    then: 続ける人と切り替え先が分かり、表の外の資料を探さなくてよい
control: 表がないと、段ごとの確かめと凍結の時刻が本番の最中に決まり、終盤の判断が人によってぶれる
