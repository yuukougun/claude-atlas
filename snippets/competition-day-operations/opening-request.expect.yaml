title: 開始直後に評価器を先に立てさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 練習用の問題を 1 つ選び、AI の利用を許す条件で試す
expect:
  - when: 問題文を貼ってこの依頼を出す
    then: 解法やコードの前に、評価器の設計案と公式の採点とのずれの候補が返る（指示はお願いなので、解法が先に出ることがある。観察として扱う）
  - when: 評価器ができた後に、解法の変更を頼む
    then: 変更の前後の評価器の結果を並べた返答になる
control: 雛形を使わず問題文だけを貼ると、解法とコードが先に返り、評価器のない状態で版が積み上がる
