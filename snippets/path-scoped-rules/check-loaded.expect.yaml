title: 条件付きの規約が読み込まれる時期を確かめる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - "`<引き金にしたいファイルのパス>` を、`paths` に一致するファイルのパスに置き換える"
expect:
  - when: 一致するファイルを読む前後で一覧を比べる
    then: 読んだ後の一覧にだけ、paths 付きの規約が現れる（観察として扱う。Claude の自己申告なので、確実な確認にはならない）
control: "`paths` に一致しないファイルを読ませると、一覧は増えない"
