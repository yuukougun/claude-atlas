title: 変わりうる事実を、検索で確かめてから答えさせる頼み方
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - web 検索が使える状態の会話で試す
  - 質問を、料金や版のように変わる事実を含むものに置き換える
expect:
  - when: 質問を埋めて送る
    then: 回答に出典の URL と日付が付く
  - when: 検索で見つからない点を含む質問を送る
    then: 確かめられなかった点が、そう書かれて返る
control: 指示を書かないとき、検索せずに記憶で答える場合がある（検索するかどうかは Claude が判断する）
