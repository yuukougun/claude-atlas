title: リサーチに計画を先に出させ、事実と推測を分けさせる頼み方
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - リサーチが使える状態の会話で試す（起動しないときは、リサーチを使うよう文の頭で明示する）
  - 問いと範囲を、自分の調べものの内容に置き換える
expect:
  - when: 問いと範囲を埋めて送る
    then: 調べ始める前に、観点ごとの計画が短く出る場合がある（観察として扱う）
  - when: 返ってきたレポートを読む
    then: 出典のある事実と推測が、別の段落か別の見出しに分かれて書かれる
control: 計画と区別の指示を書かないとき、事実と推測が地の文で混ざったレポートになりやすい
