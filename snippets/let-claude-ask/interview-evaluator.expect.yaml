title: インタビューで仕様を詰める依頼の雛形（評価環境の例）
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - docs/rules.md に、作る対象の規則を置いておく
expect:
  - when: 依頼を出す
    then: コードを書く前に、規則の曖昧な点や入力の範囲について質問が返る
  - when: 質問に答え終える
    then: SPEC.md に、決定事項と要確認事項が分かれて書かれ、最後に評価器を確かめる手順が付く
control: 「決定事項と要確認事項を分ける」の指定を外すと、運営に聞くべき点が決定事項に混ざることがある
