title: インタビューで仕様を詰める依頼の雛形（機能の例）
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - 作りたいものは、1〜2 行で書けるが、細部を決めていないものにする
expect:
  - when: 欄を埋めた依頼を出す
    then: コードを書く前に、選択式を含む質問が返る
  - when: 質問に答え終える
    then: SPEC.md に、決めたこと・要確認の点・範囲外・確かめ方が分かれて書かれる
control: 雛形を使わず「コメント機能を作って」とだけ頼むと、質問されずに、思い込みで決めた実装が先に出ることがある
