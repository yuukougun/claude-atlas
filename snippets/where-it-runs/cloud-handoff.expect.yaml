title: クラウドに送る依頼に、届くものと止まる条件を書く
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 計画ファイルと CLAUDE.md を、コミットして push してから送る
expect:
  - when: 欄の内容を埋めた依頼を、クラウドのセッションに送る
    then: 返答かプルリクエストの説明に、実行したコマンドと結果が書かれる
  - when: 計画にない秘密が要る手順に当たる
    then: 秘密を探したり作ったりせず、何が要るかを書いて止まる
control: この前提と止まる条件を書かずに送ると、手元の設定が効いている前提のまま進み、結果が手元と食い違うことがある
