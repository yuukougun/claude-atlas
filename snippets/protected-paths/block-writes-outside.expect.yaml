title: 作業ディレクトリの外への書き込みと読み取りを、道具の側で閉じる設定
kind: settings
place: user
safety: true
conditions:
  - 新しいセッションで試す
  - このキーが入った版以上の Claude Code で試す（版の下限は数値ファイルで確かめる）
  - 作業ディレクトリの外に、壊れても困らない空のファイルを用意する
expect:
  - when: Write の道具で、作業ディレクトリの外のファイルに書かせる
    then: どの権限モードでも拒否される
  - when: Edit の道具で、作業ディレクトリの外の既存のファイルを書き換えさせる
    then: どの権限モードでも拒否される
  - when: Read の道具で、作業ディレクトリの外のファイルを読ませる
    then: 拒否される
  - when: Bash で、作業ディレクトリの外のファイルに echo でリダイレクトして書かせる
    then: 道具の側では止まらず、書けうる（観察として扱う。止めるにはサンドボックスが要る）
control: 設定を置かないとき、同じ依頼は権限モードに応じた確認や許可で扱われ、作業ディレクトリの外への書き込みが通りうる
