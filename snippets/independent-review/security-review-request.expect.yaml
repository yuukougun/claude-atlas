title: 脆弱性を探させるレビューの依頼
kind: prompt
place: 依頼の本文（新しいセッションの最初の発言）
safety: true
conditions:
  - 自分の環境の、壊れても困らないブランチで試す
  - 対象と、この変更が扱うものの欄を埋める
expect:
  - when: 欄を埋めた依頼を、新しいセッションに出す
    then: 観点ごとに、見た結果と見ていない範囲が返る
  - when: 脆弱性のない変更を渡す
    then: 見つからなかった観点と、見ていない範囲が返る（観察として扱う。指示は鍵でないので合否にしない）
control: 観点を渡さないとき、返答が一般的な注意の列挙になり、対象に固有の指摘が減る場合がある
