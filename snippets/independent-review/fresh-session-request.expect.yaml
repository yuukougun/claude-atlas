title: 新しいセッションに渡すレビューの依頼
kind: prompt
place: 依頼の本文（新しいセッションの最初の発言）
safety: false
conditions:
  - 変更を書いたセッションとは別の、新しいセッションで試す
  - 対象と基準の欄を埋める
expect:
  - when: 欄を埋めた依頼を、新しいセッションに出す
    then: 返答が、指摘ごとの場所・問題・確かめ方の形になる
  - when: 同じ対象を、変更を書いたセッションに同じ依頼で出す
    then: 新しいセッションより指摘が少なく、問題なしとなる場合がある（観察として扱う。指示は鍵でないので合否にしない）
control: 変更を書いたセッションに「確認して」とだけ頼むとき、指摘が出ずに問題なしと返る場合がある
