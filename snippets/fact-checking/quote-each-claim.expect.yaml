title: 主張ごとに引用を付けさせ、引用できない主張を外させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 資料に答えが書いてある質問と、資料に答えが書いていない質問を 1 つずつ用意する
expect:
  - when: 資料に答えが書いてある質問で出す
    then: 答えの主張ごとに引用の番号が付き、引用が資料の文言と一致する
  - when: 資料に答えが書いていない質問で出す
    then: 「該当する箇所なし」か【削除】が出て、答えを作らずに止まる
control: この依頼を置かず質問だけを出すと、資料にない内容を含む答えが引用なしで返ることがある
