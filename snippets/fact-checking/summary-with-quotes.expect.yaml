title: 要約の主張ごとに原文の引用を付けさせ、書かれていることと推測を分けさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 条件つきの主張（「〜の場合に限り」「〜の範囲で」など）を含む原文を使う
expect:
  - when: 条件つきの主張を含む原文で出す
    then: 表の「条件・限定」の列に、原文の条件が書かれる
  - when: 表の引用を原文で文字列検索する
    then: 引用が原文に一字一句そのまま見つかる
  - when: 返答を読む
    then: 推測の表が分かれていて、本文の表に推測が混ざらない
control: この依頼を置かず「要約して」とだけ頼むと、条件や限定が落ちて言い切りになることがある
