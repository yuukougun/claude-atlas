title: 変更履歴から、自分の設定に関わる変更を洗い出させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 【前回の版】と【手元の版】を実際の版に置き換える
  - 設定にコマンド名や環境変数を書いたプロジェクトで試す
expect:
  - when: この依頼を出す
    then: ファイルが書き換わらず、表が返る
  - when: 返った表を見る
    then: 各行に版・変更の項目・関わる設定の場所が付く
  - when: 変更履歴に項目のない版が範囲に含まれる
    then: その版が「項目なし」として行に出る
control: 依頼を出さず変更履歴を自分で読むと、自分の設定に関わる項目の見落としが出やすい。表の「関わる設定」は推測を含むので、出た行を目で確かめる
