title: 設定や指示に残った古い書き方を点検させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 古い名前や強調語を含む CLAUDE.md のあるプロジェクトで試す
expect:
  - when: この依頼を出す
    then: ファイルが書き換わらず、表が返る
  - when: 返った表を見る
    then: 各行にファイル名と行、引用、確かめた先の文書の題名が付く
  - when: 文書で確かめられなかった名前がある
    then: その行が「未確認」として出る
control: 公式の文書を確かめさせずに頼むと、記憶にもとづく答えが混ざる。確かめた先の列が空の行は信用しない
