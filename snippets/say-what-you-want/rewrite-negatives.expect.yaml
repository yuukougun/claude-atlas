title: 禁止を望む形に書き換えさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 「指示文」の欄に、禁止の形の項目を 5 つほど貼る
expect:
  - when: 欄に禁止の項目を貼って依頼を出す
    then: 項目が 3 つの区分に振り分けられ、望む形に書き直された文と、仕組みで止める候補の一覧が返る
  - when: 返ってきた文を読む
    then: 書き直された文が、元の項目を言い換えただけでなく、代わりにする行動を述べている（観察として扱い、合否にしない）
control: 依頼を出さずに禁止の項目をそのまま使うときと、出力のぎこちなさや守られ方を比べる
