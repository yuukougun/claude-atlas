title: 検証環境を作らせる依頼の雛形（既知の答えで確かめるところまで頼む）
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - 〔〕の欄を、実際の対象・入力の仕様・基準・件数で埋める
  - cases/hand/ に手で計算したケースを先に置く
expect:
  - when: 欄を埋めた依頼を出す
    then: 生成器・基準・並列の実行・集計の順に作られ、各段の終わりに確かめた方法が示される
  - when: 作り終わった報告を読む
    then: 何もしない解が負けた結果、手計算ケースとの一致、壊したコピーで落ちた出力が書かれている
  - when: 手計算ケースの期待値と集計が食い違う
    then: 環境も期待値も書き換えられず、原因の仮説が報告される
control: 確かめの 3 点を頼まないと、環境が動いたことだけを報告して終わり、正しさは確かめられないままになりやすい
