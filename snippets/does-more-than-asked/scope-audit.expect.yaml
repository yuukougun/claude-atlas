title: 頼んだ範囲を外れた変更を洗い出す依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 小さな修正を頼み、周辺の変更が混ざった作業ツリーで試す
expect:
  - when: 修正を頼んだセッションの後に、この雛形を出す
    then: 依頼に基づく文がない変更、残った一時ファイル、古い版と新しい版の並びが、ファイルごとの一覧で返る。見落としは残りうるので、一覧は `git diff` と照らす
control: 雛形を使わず「余計な変更はないか」とだけ尋ねると、問題なしと返ることがある
