title: 進捗ファイルの雛形（計画・やること・決めたこと・分かったこと）
kind: other
place: project
safety: false
conditions:
  - 空のプロジェクトのディレクトリで試す
  - 4 つの区切りごとに別のファイルとして `progress/` に置く
expect:
  - when: 4 つのファイルを置いて、新しいセッションで「`progress/` を読んで、次の一手と聞くべきことを言い直して」と頼む
    then: 返答の次の一手が TODO.md の先頭と一致し、聞くべきことが決めたことと分けて出る
control: ファイルを置かずに同じ依頼を出すと、前回の状態を答えられず、こちらの説明を求められる
