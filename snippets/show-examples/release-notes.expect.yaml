title: 典型的で多様な例を添えた、リリースノートの依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 末尾の欄に、例と種類の違うコミット（例えば性能の改善）を含む一覧を貼る
expect:
  - when: 欄を埋めた依頼を出す
    then: 返答の見出しの形（### と箇条書き）と文末が、例に近い形になる
  - when: 例にない種類のコミットを一覧に含める
    then: 例の形を保ったまま、その種類の見出しが足される
control: 例を外して「簡潔で読みやすい形式で」とだけ頼むと、見出しや文末の形が実行のたびにずれやすい
