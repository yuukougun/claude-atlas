title: 依頼の文も返事の形に合わせた、書式を指定する依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - ログは、自分のコードの本物のエラーログを使う（秘密や個人情報を含むものは貼らない）
expect:
  - when: ログを貼って、この雛形で依頼する
    then: 見出しや箇条書きが少ない、短い段落の文章で返る傾向がある。完全には保証されない
control: 見出しと箇条書きで書いた依頼に「markdown を使わないこと」と足すだけだと、返事に見出しや箇条書きが残ることがある
