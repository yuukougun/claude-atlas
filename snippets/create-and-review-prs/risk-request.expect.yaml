title: 出す前にリスクと確かめていない点を挙げさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - main と差のあるブランチがあるリポジトリで試す
expect:
  - when: この依頼を出す
    then: ファイルが書き換わらず、リスクの表が返る
  - when: 返った表を見る
    then: 各行に場所と確かめ方が付き、実行したものと実行していないものが分かれている
control: 依頼を出さず「PR を作って」とだけ頼むと、リスクの欄がない説明文が返りやすい
