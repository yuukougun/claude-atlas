title: レビューの指摘ごとに案を出させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションか、PR のセッションを再開して試す
  - 指摘を 2 件以上貼る。1 件は根拠の弱いもの（コードに該当しないもの）にする
expect:
  - when: この依頼を出す
    then: ファイルが書き換わらず、指摘ごとの案の表が返る
  - when: 根拠の弱い指摘を含めて出す
    then: その指摘について、根拠が見つからないと書かれることがある。観察として扱い、合否にしない
control: 「指摘を直して」とだけ頼むと、すべての指摘がそのまま直されやすい
