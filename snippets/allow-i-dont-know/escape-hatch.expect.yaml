title: 分からないと言える逃げ道を作る依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - 質問は、Claude が確かな知識を持たないもの（実在しない本の章の要旨など、自分で答えを知っているもの）にする
expect:
  - when: 実在しない本の第 7 章の要旨を、この雛形を付けて尋ねる
    then: その本を確かめられない旨か、推測と分けた答えが返る。作り話が確かな内容として並ぶ割合は下がる傾向だが、無くなるとは限らない
control: 雛形を付けず同じ質問だけを出すと、章の要旨が確かな内容のように返ることがある
