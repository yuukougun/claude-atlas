title: アプリに入れる最小のスキル（週報の書式）
kind: skill
place: 依頼の本文ではなく、スキルのフォルダ（weekly-report/SKILL.md）を ZIP にしてアプリに入れる
safety: false
conditions:
  - フォルダ名を weekly-report にして SKILL.md を入れ、フォルダごと ZIP にする
  - アプリで、コード実行とファイル作成を有効にしておく
  - アップロードしたスキルを有効にする
  - 新しい会話で試す
expect:
  - when: 週のメモを貼って「週報にして」と頼む
    then: 3 つの見出しの週報になる。スキルが使われたかは保証されないので、使われなければスキルの名前を挙げて頼み直す
  - when: スキルを無効にして同じ依頼を出す
    then: 見出しや順序が雛形のとおりにならないことがある
control: スキルを入れないとき、同じ依頼で見出しの名前と順序が毎回変わる
