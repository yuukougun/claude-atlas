title: 確かめやすい一覧を出させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 出典つきの答えが返ってきた直後の同じ会話で出す
expect:
  - when: 出典つきの答えの直後に、この依頼を出す
    then: 出典が 1 件ずつの項目になり、記憶で補った項目と確認できなかった出典に印が付く（印が付くことは保証されないので、付いていなくても原文では確かめる）
control: この依頼を出さないと、引用が言い換えのまま引用符で囲まれたり、確かめられなかった出典が黙って一覧から消えたりしても、読み手には見分けにくい
