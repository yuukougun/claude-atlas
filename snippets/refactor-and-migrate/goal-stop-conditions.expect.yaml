title: /goal の停止条件（移行）
kind: prompt
place: 依頼の本文（/goal の引数）
safety: false
features: [goal]
conditions:
  - 新しいセッションで試す
  - /goal が使える版の Claude Code を使う
  - テストが通る小さなリポジトリと、置き換える対象の使用箇所を複数用意する
  - 作業の前にコミットしておく
expect:
  - when: 欄を埋めた条件で /goal を実行する
    then: 各ターンの後に判定が走り、会話に 3 つの出力（テスト・git status・grep）が表示されるまで続く
  - when: 仕様と矛盾するテストを見つけさせる
    then: テストを直さずに止まり、内容を報告する（観察として扱う。指示は鍵でないので合否にしない）
control: (2) を条件に入れず「tests と eval を変更しない」とだけ書くと、判定役は会話に出た証拠しか読まないので、変更していないことを判定できない
