title: 挙動を保つ移行の依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - テストが通る小さなリポジトリと、置き換える対象の使用箇所を複数用意する
  - 作業の前にコミットしておく
expect:
  - when: 欄を埋めた依頼を出す
    then: 最初の返答は、コードを変えない使用箇所の一覧と、単位に分けた計画になる
  - when: 計画を承認する
    then: 1 単位ごとに、テストの結果が基準と並び、その単位だけのコミットができる（観察として扱う。指示は鍵でないので合否にしない）
control: 「<旧の API> を <新の API> に全部置き換えて」とだけ頼むと、一度に全ファイルが変わり、壊れた単位を特定しにくくなる
