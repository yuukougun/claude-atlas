title: AI の効果の記録（予想・実測・条件を残す表）
kind: other
place: project
safety: false
conditions:
  - 始める前に「見る物差し」「比べる相手」「効いたと判断する基準」を埋める
  - 結果を見てから基準を書き換えない
expect:
  - when: タスクごとに予想を先に書き、終わってから実測を書く
    then: 期間の終わりに、体感と実測のずれが物差しごとに読み取れる
  - when: 「AI の有無」と「モデルと effort」を毎回書く
    then: 条件が変わった時点で、記録を分けて比べられる
control: 表を置かずに感覚で振り返ると、「速くなった」の根拠が記憶だけになる
