title: 最後まで進めさせる依頼（止まる条件つき）
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 確認のコマンドと止まる条件を、自分の作業に合わせて埋める
expect:
  - when: 複数の部分に分かれる作業で、この依頼を出す
    then: 1 つ終えるたびの「続けますか」が減り、確認のコマンドが成功するまで進む
  - when: 止まる条件に当たる状況が起きる
    then: 進めずに止まり、止まった理由と選択肢が報告に書かれる
control: この依頼の代わりに「作業して」とだけ頼むと、1 つの部分を終えたところで続けるかを聞いて止まることがある
