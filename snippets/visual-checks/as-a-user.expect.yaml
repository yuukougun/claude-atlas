title: 画面で確かめさせる依頼（人のユーザーとして操作する）
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 画面を持つアプリを、ローカルで起動できるプロジェクトで試す
  - ブラウザを操作する手段（Claude in Chrome か、プロジェクトに入れたブラウザ自動操作の道具）が使える状態にしておく
expect:
  - when: 欄を埋めた依頼を出す
    then: 返答に、行った操作ごとのスクリーンショットのファイル名と、起きたことが並ぶ
  - when: 操作の途中で画面が動かない
    then: 動かなかった操作が一覧に出て、直した後に同じ操作をやり直した記録が付く
  - when: ブラウザを操作する手段がない
    then: 操作できなかった旨を「確かめていない」と書いて返す（観察として扱う。依頼の文は止める仕組みではない）
control: 「画面でも確かめて」だけを足した同じ依頼では、テストの結果だけで完了と返ってくる場合がある
