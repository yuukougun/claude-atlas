title: モックと出来上がりの違いを挙げさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - モックの画像と、ローカルで起動できる画面を用意しておく
  - ブラウザを操作する手段が使え、画像を読ませられる状態にしておく
expect:
  - when: 欄を埋めた依頼を出す
    then: 直す前に、場所ごとの違いの一覧が出る
  - when: 直しが終わる
    then: 撮り直したスクリーンショットのファイル名と、更新した一覧が返る
  - when: 画面の幅を 2 通り指定する
    then: 幅ごとに撮ったスクリーンショットが別のファイル名で出る
control: 「モックに合わせて直して」だけの依頼では、違いの一覧が出ないまま、直した旨だけが返る場合がある
