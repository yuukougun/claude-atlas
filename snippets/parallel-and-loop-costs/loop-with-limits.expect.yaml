title: 回数の上限と止める条件を書いたループの依頼
kind: prompt
place: 依頼の本文
safety: false
features: [subagents]
conditions:
  - 欄（山かっこの所）を自分の作業で埋める
  - 最初は小さな範囲で試し、使用量の内訳は /usage で見る
expect:
  - when: 欄を埋めた依頼を出す
    then: 最初の 1 回の後に、使った量の報告が返答に出る
  - when: 回数の上限に着く
    then: 続きを自分で始めず、試したことと残りを書いて止まる
  - when: 同じ失敗が続く
    then: 直し続けず、止まって報告する（依頼の指示なので、止まるかは観察として扱う）
control: 上限と止める条件を書かない同じ依頼では、終わりの条件を満たすまで、または別の上限に着くまで回りうる
