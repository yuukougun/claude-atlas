title: 完了の報告の根拠を出させる依頼
kind: prompt
place: 依頼の本文（報告の直後の同じセッション）
safety: false
conditions:
  - 完了の報告が出た直後の、同じセッションで試す
  - 報告を鵜呑みにせず、出てきたコマンドを自分でも実行して突き合わせる
expect:
  - when: 完了の報告の直後に、この依頼を出す
    then: 返答に、実行したコマンドと出力の末尾が並ぶ（観察として扱う。指示は鍵でないので合否にしない）
  - when: 計画に入っていたのに実行しなかった確認がある状態で、この依頼を出す
    then: 実行しなかった確認が 3 点目に挙がる（観察として扱う）
control: 「本当に全部通った？」とだけ聞くと、コマンドも出力も出さず「はい、通っています」と繰り返すことがある
