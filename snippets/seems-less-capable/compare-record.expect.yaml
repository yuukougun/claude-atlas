title: 劣化の疑いを並べて記録する票
kind: other
place: 手元のメモ（課題ごとに 1 枚）
safety: false
conditions:
  - 前にうまくいった時の条件は、記録が残っていれば書き、残っていなければ空欄にして今から記録を始める
  - 違う項目を 1 つに絞り、その項目だけを合わせて同じ課題を流し直す
expect:
  - when: 前と今の条件を並べて書く
    then: 版・モデル・effort・会話の状態のうち、違う項目が見つかる（観察として扱う）
  - when: 違う項目を 1 つ合わせて、同じ課題を何度か流す
    then: 結果が前の水準に戻るかで、その項目が差の原因かどうかを見分けられる（観察として扱う。1 回の結果では判断しない）
control: 記録を取らずに感覚で比べると、課題の難しさや答えのばらつきを、劣化と取り違えることがある
