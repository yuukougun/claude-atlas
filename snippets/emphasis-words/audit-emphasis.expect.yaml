title: 強調で書かれた行を洗い出して分ける
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 強調で書いた行が CLAUDE.md か rules に 1 行以上ある
  - 新しいセッションで試す
expect:
  - when: 依頼の本文をそのまま出す
    then: 編集はされず、行ごとに 3 つの分類を付けた表が返る
  - when: 例外のない禁止の行（例：特定のファイルを読むな）がある
    then: その行が、鍵に移す候補として分類される
control: 雛形を使わず「強調の行を見直して」とだけ頼むと、分類の基準が揃わず、編集まで進むことがある
