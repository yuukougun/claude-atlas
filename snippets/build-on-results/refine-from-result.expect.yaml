title: 前回の結果を見せて直させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 採点のスクリプトと、前回の版を置いたファイルがあるプロジェクトで試す
expect:
  - when: 前回の値と採点の手順を埋めて、この依頼を出す
    then: 直す点が先に 2 行で書かれ、同じ採点の出力と前回の値を並べた表が返る
  - when: 直した版の値が前回より下がる
    then: 最良の版は上書きされず、直した版が別名で残り、lessons に 1〜2 行が足される
control: 依頼に前回の値と採点の手順を入れず「もっと良くして」とだけ頼むと、全体を書き直した版が返りやすく、前後の値の比べ方は返答ごとにまちまちになる
