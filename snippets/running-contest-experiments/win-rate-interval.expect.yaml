title: 勝率の 95% 区間と、見分けに要る試合数を出すスクリプト
kind: other
place: project
safety: false
conditions:
  - Python 3.9 以上のある環境（WSL・Linux・macOS）で試す
  - 引き分けのない、独立な試合の数え方にそろえる
expect:
  - when: 勝ち数 55、試合数 100 を渡して実行する
    then: 95% 区間が約 [0.452, 0.648] と出て、50% と区別できないと表示される
  - when: 勝ち数 220、試合数 400 を渡して実行する
    then: 95% 区間の下限が約 0.501 と出て、50% と区別できると表示される
  - when: "`--need 0.55` を渡して実行する"
    then: 見分けに要る試合数の目安が約 381 と出る
control: 区間は正規近似なので、勝率が 0 や 1 に近いときと試合数が少ないときは粗い。先後の入れ替えや得点差を使った対応のある比較は、この計算には入らない
