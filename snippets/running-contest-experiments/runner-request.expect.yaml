title: 同じ入力で 2 つの版を比べる走らせ方と集計を作らせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 評価器と 2 つの版を置いたプロジェクトで試す（パスは自分の構成に合わせて読み替える）
expect:
  - when: この依頼を出す
    then: 走らせるスクリプトと集計のスクリプトができ、評価器のディレクトリは書き換わらない
  - when: 作られたスクリプトを数十件の seed で走らせる
    then: 実行ごとに別の結果ファイルができ、集計に平均の差・標準誤差・悪い seed の一覧が出る
control: 依頼に「同じ seed」「評価器は読むだけ」と書かないと、版ごとに別の入力で走る作りや、評価器の側を直す作りになることがある
