title: ホームの認証情報とトークンの環境変数を、全プロジェクトで読ませない設定
kind: settings
place: user
safety: true
features: [permissions, sandbox]
conditions:
  - 本物の ~/.ssh や ~/.aws に触れない。偽のディレクトリ名に書き換え、偽の環境変数で試す
  - 新しいセッションで試す
  - Linux か WSL2 で試す
expect:
  - when: Claude が Read の道具で、拒否したディレクトリの偽のファイルを読もうとする
    then: 権限ルールの拒否で止まる
  - when: Claude がシェルで、拒否したディレクトリの偽のファイルを cat や python で読もうとする
    then: サンドボックスの中で読み取りが拒否される
  - when: Claude がシェルで、拒否した名前の偽の環境変数を表示しようとする
    then: サンドボックスの中のコマンドでは、その変数が設定されていない状態に見える
control: 設定を置かないとき、サンドボックスの既定では ~/.ssh などの読み取りが通り、環境変数も見える
