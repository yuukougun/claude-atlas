title: 失敗した試行の原因を transcript から分類させる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 失敗した試行の記録を 2〜3 件用意する（原因が分かっているものを混ぜておく）
expect:
  - when: 雛形に記録を付けて依頼する
    then: 試行ごとに、分類と、記録から引いた根拠の行が返る
  - when: 記録だけでは原因が決められない試行を混ぜる
    then: 分類が「不明」になり、何が分かれば決められるかが書かれる（作り話で分類を埋めない、という観察。指示は鍵ではないので合否にしない）
control: 雛形を使わず「失敗の原因を教えて」とだけ頼むと、分類の枠も根拠の引用もそろわないことがある
