title: 筋・聞き手・1 枚ごとの主張を先に渡して、たたき台を作らせる依頼
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 〔 〕の欄を、実際の発表の内容で埋める
  - 使ってよい資料を、添付かファイルで渡す
expect:
  - when: 欄を埋めた依頼を出す
    then: 足りない条件があれば、作る前に質問が返る
  - when: 条件がそろった状態で依頼を出す
    then: 各枚のタイトルが渡した主張の 1 文になり、末尾に主張と資料の箇所の対応表が付く
  - when: 資料にない数字が必要な枚がある
    then: 数字が〔要確認〕の印付きで出る（観察として見る。印が付かないときは次の照合で拾う）
control: 筋と 1 枚ごとの主張を渡さず「スライドを作って」とだけ頼むと、聞き手に合わない一般論の並びになりやすい
