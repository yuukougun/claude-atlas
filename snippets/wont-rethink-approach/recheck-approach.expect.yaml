title: 方針を見直させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 同じ種類の修正が数回続いた会話で試す
expect:
  - when: 修正が数回続いた会話で、この依頼を出す
    then: コードを直さず、試した修正の一覧と、別の選択肢の有無と、やめる条件が返る
  - when: Claude が「限界です」と答えた会話で、この依頼を出す
    then: 「限界」の根拠が試した条件つきで返り、本番と同じ条件で確かめたかどうかが分かる
control: 「方針を見直して」とだけ頼むと、根拠のない結論や、また修正が返ることがある
