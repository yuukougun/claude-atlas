title: 読まれたかを引用で確かめてから答えさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 長い資料（数十ページ以上）を添付した新しい会話で試す
expect:
  - when: 長い PDF を添付して、この依頼を出す
    then: 質問への答えの前に、最初・中ほど・最後からの引用がページ番号か見出し付きで返る
  - when: 資料の後半が読み込みの範囲の外にある
    then: 後半の引用ができず、読めていないという旨が返る（観察として扱う。指示は鍵ではないので、必ずそうなるとは限らない）
control: 確認の手順を付けないで同じ質問をすると、後半を読んでいない答えでも、読んだ前提の文面で返ることがある
