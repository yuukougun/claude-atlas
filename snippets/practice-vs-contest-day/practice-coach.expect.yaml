title: 練習で AI を解説役・採点役にする依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 自分で解けていない問題を 1 つ用意し、「自分の解法」を書く前の状態で始める
expect:
  - when: 自分の解法を書く前にこの依頼を出し、「答えを教えて」と続ける
    then: 解法やコードを出さず、自分の考えを先に書くよう促す返答になる（指示はお願いなので、出てしまうことがある。観察として扱う）
  - when: 自分の解法を貼って採点を頼む
    then: 誤りがありそうな点と足りないテストの候補が返り、直したコードは付かない
control: 雛形を使わず「この問題を解いて」と頼むと、解法とコードがそのまま返り、自力で考える段階が飛ぶ
