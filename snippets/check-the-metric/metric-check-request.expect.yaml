title: 最適化の前に指標を確かめさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 壊れても困らない複製のリポジトリで、評価のコードと資料を置いて試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 実装を始めず、指標の定義・目的を外す出力の例・指標の使われ方の一覧・ずれの候補の順に返す。観察として扱い、返答の形だけで合否にしない
  - when: 一覧に、指標の違う所が含まれる
    then: 違う所を先に報告し、評価のコードと資料は書き換えない
control: この依頼を出さずに「指標を上げて」とだけ頼むと、指標の定義を確かめないまま最適化を始めることがある
