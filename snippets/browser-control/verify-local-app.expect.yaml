title: ローカルの画面を確かめさせる依頼
kind: prompt
place: 依頼の本文
safety: false
features: [claude-in-chrome]
requires:
  - Claude in Chrome の拡張（Claude Code と同じアカウントでログイン済み）
  - ローカルで動くログインフォームのある開発サーバー
conditions:
  - 新しいセッションで試す
  - 試験用のアカウントだけを使い、本物の認証情報を使わない
expect:
  - when: この依頼を出す
    then: ブラウザに新しいタブが開き、指定したアドレスだけが操作される
  - when: 3 つの試行が終わる
    then: 返答が指定した 4 列の表になり、コードのファイルは書き換わらない
control: 依頼をコードの確認だけにすると、画面でのエラー表示の崩れや、コンソールのエラーは見つからないまま完了になりやすい
