title: 実物の出力を見せて、どちらが正しいかを答えさせる頼み方
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 言い張りが起きた会話の続きで出す（巻き戻す前の、最初の手当として）
  - 主張を確かめるコマンドは、自分で先に実行して出力を貼る
expect:
  - when: 欄を埋めた頼みを出す
    then: 返答が、貼った出力の該当の行を引用して、説明と出力のどちらが正しいかを書く
  - when: 説明が間違っていたと認める
    then: その説明を前提にした直しや結論が、使えるものと取り消すものに分かれて一覧になる
control: 実物を貼らず「違う」とだけ返すと、同じ主張の言い換えが返ることがある
