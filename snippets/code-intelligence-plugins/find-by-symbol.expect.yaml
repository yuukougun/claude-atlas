title: シンボルで定義と参照を探させる依頼
kind: prompt
place: 依頼の本文
safety: false
features: [code-intelligence]
conditions:
  - 対応する言語のプラグインを入れ、言語サーバーが動いている
  - 同じ名前の文字列が別の意味で出るリポジトリだと、違いが分かりやすい
expect:
  - when: 依頼を出す
    then: 返答が、定義と参照の場所をファイル名と行で挙げる
  - when: 返答の場所を自分で開く
    then: 挙げられた行に、その関数の定義や呼び出しがある
control: プラグインがないと、文字列の検索で見つけた候補を多くのファイルから読んで絞るため、読むファイルが増える
