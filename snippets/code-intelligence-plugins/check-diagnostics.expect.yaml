title: 言語サーバーが動いているかを確かめる依頼
kind: prompt
place: 依頼の本文
safety: false
features: [code-intelligence]
requires:
  - 言語のプラグインと、言語サーバーの実行ファイル
conditions:
  - 対応する言語のプラグインを入れ、言語サーバーの実行ファイルが PATH にある
  - 新しいセッションで、壊れても困らないファイルを対象にして試す
expect:
  - when: 型エラーを入れる編集をさせる
    then: 編集の下に、新しい診断の件数を示す 1 行が出る（出ない場合は /plugin の Errors の欄を見る）
  - when: 型エラーを直させる
    then: 次の編集の後に、その診断が報告されなくなる
control: プラグインを入れないと、型エラーは編集の直後には報告されず、ビルドやテストを走らせるまで見つからない
