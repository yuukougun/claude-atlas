title: /insights の提案を下書きとして仕分けさせる依頼
kind: prompt
place: 依頼の本文
safety: false
features: [insights]
conditions:
  - 新しいセッションで試す
  - "`<ここに、報告の提案の部分を貼る>` を、自分の `/insights` の報告から写した提案に置き換える"
expect:
  - when: 提案を貼って送る
    then: 提案ごとに、根拠の引用・確かめ方・移す先の候補・効果の確かめ方が表で返る
  - when: 報告に根拠の書かれていない提案を混ぜて送る
    then: その提案が「根拠が見えない提案」に分けられる場合が多い（観察として扱う。合否にしない）
control: 仕分けを頼まず「この提案を全部反映して」と頼むと、確かめないまま CLAUDE.md や設定に足される場合がある
