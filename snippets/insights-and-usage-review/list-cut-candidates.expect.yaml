title: /usage の内訳から削る候補を仕分けさせる依頼
kind: prompt
place: 依頼の本文
safety: false
features: [usage]
conditions:
  - 新しいセッションで試す
  - "`<ここに、/usage の内訳を貼る>` を、自分の `/usage` の内訳に置き換える"
expect:
  - when: 内訳を貼って送る
    then: 仕分けの案を出す前に、各項目をいつ使ったかの質問が返る
  - when: 質問に答える
    then: 各項目に、削る・小さくする・残す のどれかと 1 行の理由が付く
control: 質問を挟ませず「割合の大きい順に削って」と頼むと、使っている項目まで削る案になる場合がある
