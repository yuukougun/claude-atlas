title: 採点の処理を書かせ、公式の値と一致させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 原文に、公式の例（入力と正しい値）が 1 件以上ある
  - テストを実行できる環境（Claude Code、またはコードの実行ができるアプリの会話）で出す
expect:
  - when: 原文と公式の例を添えて、この依頼を出す
    then: 関数と、公式の例を使ったテストが返る。補った前提には「補足」のコメントが付く（付くことは保証されないので、コードを読んで確かめる）
  - when: テストが 1 件落ちる
    then: 期待値を変えるのではなく、原文のどの文の読み違いかの報告が返る（返らないときは、期待値を書き換えていないかをコードの差分で見る）
control: この依頼を出さずに実装から頼むと、公式の値と合わない箇所が、実装が進んでから見つかりやすい
