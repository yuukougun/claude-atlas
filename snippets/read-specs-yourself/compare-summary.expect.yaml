title: 自分の要約と原文を突き合わせさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 原文と自分の要約を、同じ会話（Claude Code ではファイルのパス）で渡す
  - 原文は長すぎて途中で切れていない
expect:
  - when: 原文と自分の要約を添えて、この依頼を出す
    then: 食い違いが 1 件ずつ、原文の引用つきで挙がる。引用のない指摘には「推測」と付く（付くことは保証されないので、引用は原文で確かめる）
control: 要約だけを渡して「この仕様を確認して」と頼むと、原文との突き合わせではなく、要約をもとにした説明が返りやすい
