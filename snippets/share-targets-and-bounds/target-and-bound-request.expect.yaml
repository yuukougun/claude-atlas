title: 目標値と上界を添えて最適化を頼む依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 測るコマンドと、参照になる値（参照実装の実測など）がある最適化の課題で試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 最初の数回の改善で止まらず、目標の値との差を示しながら続ける
  - when: 目標の値に届かないと判断させる
    then: 試したこと、理由、差の説明の 3 点を添えた報告が返る
control: 目標の値と出どころを書かずに「速くして」とだけ頼むと、少し速くなった時点で終えることがある
