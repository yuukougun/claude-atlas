title: 観察と解釈を分け、仮説を反証できる形で出させる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 集計結果のファイルと、それを作ったスクリプトが作業ディレクトリにある
expect:
  - when: 欄を埋めた依頼を出す
    then: 観察の節と仮説の節が分かれて返り、観察の節に改善策が含まれない
  - when: 返答の仮説の節を読む
    then: 仮説ごとに、正しい場合と誤りの場合に観測されるはずのこと、最小の確認実験が付いている
  - when: 返答の末尾を読む
    then: どの仮説が有力かの断定がない。観察として扱い、合否にはしない
control: この依頼を使わずに「結果を分析して」とだけ頼むと、原因を 1 つに決めた説明と改善策が返ることがある
