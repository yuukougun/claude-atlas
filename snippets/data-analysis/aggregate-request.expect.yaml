title: 再実行できるスクリプトで集計させ、分母と元の行を添えさせる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 偽のデータ（作り物の CSV）で試し、預かったデータは使わない
expect:
  - when: 欄を埋めた依頼を出す
    then: スクリプトのファイルができ、実行したコマンドと出力が返る
  - when: 返答の数字を見る
    then: 総行数、除いた行数、集計に使った行数が示され、総行数が残りの 2 つの合計と合う
  - when: スクリプトだけを新しいセッションで実行する
    then: 同じ入力から同じ集計結果ができる
control: 「集計して傾向を教えて」とだけ頼むと、数字と解釈が文章で返り、どの行をどう数えたかが分からないことがある
