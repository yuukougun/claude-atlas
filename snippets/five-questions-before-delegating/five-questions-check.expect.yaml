title: 無人で走らせる前の 5 つの問い（確認表）
kind: other
place: 作業ごとのメモ（任せる前に埋める。リポジトリの docs や PR の説明に置いてもよい）
safety: false
conditions:
  - 任せる作業を 1 つ決めてから埋める
  - 空欄は、その作業の実際の値に置き換える
expect:
  - when: 5 つの欄を埋めようとする
    then: 埋められない欄が、任せる前に足りないものとして見つかる
  - when: 埋めた表の内容を、実行の依頼や設定に写す
    then: 終わりの条件・許す範囲・上限が、依頼と設定のどこかに書かれている
control: 表を埋めずに走らせると、終わりの条件や止まる上限が曖昧なまま始まり、朝に結果を見て初めて足りなかったものが分かる
