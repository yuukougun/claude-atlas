title: 完了の報告を、コマンド・生の出力・分母・最悪の例・前回との差で書かせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - テストなど、件数の出るコマンドがあるリポジトリで試す
expect:
  - when: 小さな修正を頼み、この形での報告を求める
    then: 報告に、実行したコマンドそのものと、加工されていない出力が載る
  - 通った件数と失敗した件数と飛ばした件数が、対象の総数とともに書かれる
  - 前回と件数が違うときは、違う理由が先に書かれる（理由の正しさは、自分で確かめる）
  - コマンドを実行できなかったとき、成功とは書かれず、その旨が書かれる
control: この形を書かずに「終わったら報告して」とだけ頼むと、要約の報告になり、コマンドや分母が省かれやすい
