title: 範囲を絞って試すワークフローの依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 山かっこの欄を、自分の作業で埋める
  - ワークフローが使える面（Claude Code）で、権限モードの確認の出方を確かめておく
expect:
  - when: 欄を埋めた依頼を出す
    then: 実行前の計画の確認が出て、段と担当の数を見てから承認か中止を選べる
  - when: 承認して最後まで走らせる
    then: 一覧と未検証の一覧が分かれて返り、ファイルは変更されない
  - when: /workflows を開く
    then: 担当ごとの使用量が見える
control: 範囲を書かずに「ワークフローで全部調べて」とだけ頼むと、リポジトリ全体に広がり、担当の数も費用も大きくなりうる
