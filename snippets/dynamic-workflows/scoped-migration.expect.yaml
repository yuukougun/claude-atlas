title: 大量の移行を、1 ディレクトリで試す依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 山かっこの欄を、自分の作業で埋める
  - 試すディレクトリはバージョン管理に入れておき、差分を戻せるようにしておく
expect:
  - when: 欄を埋めた依頼を出す
    then: 実行前の計画の確認が出て、ファイルごとの変換と確かめの段が見える
  - when: 最後まで走らせる
    then: 確かめを通ったファイルの変更だけが残り、通らなかったものは一覧になる
  - when: 触らせないものを欄に書いて走らせる
    then: 書いたファイルに変更が出ていないことを、差分で確かめる（指示は鍵ではないので、合否にせず観察として扱う）
control: 触らせないものと確かめるコマンドを書かずに頼むと、変換の合否の基準が担当ごとにばらつくことがある
