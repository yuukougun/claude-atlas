title: モデルの癖の観察記録の表
kind: other
place: project
safety: false
open: true
conditions:
  - 記録用のファイルを作業のリポジトリの外か、記録専用の場所に置く
  - 固定する依頼は、壊れても困らない小さな作業から選ぶ
expect:
  - when: 条件を 1 つずつ変えて同じ依頼を流し、表に記録する
    then: モデル・effort・依頼の文面のどれを変えたときに、止まる回数や頼んでいない変更が動くかを比べられる
control: 記録を付けずに体感で比べると、どの条件の差かを後から確かめられない
