title: 入れる前に見極めさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 見極めたいサーバーの README を貼る（入れたくない候補で試す）
expect:
  - when: README と作業を埋めて依頼を出す
    then: サーバーは入らず、設定ファイルも書き換わらない
  - when: 返った表を見る
    then: 5 項目の行があり、README にない項目は「不明」と、確かめ方が書かれている
  - when: 表の最後を見る
    then: 「入れる」「入れない」「先に確かめる」のどれかと、2 文までの理由がある
control: 依頼を出さずに README だけで入れると、能力の不足・権限・外す条件を決めないまま入る
