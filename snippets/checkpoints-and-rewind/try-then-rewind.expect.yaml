title: 試しにやらせて、駄目なら戻す依頼
kind: prompt
place: 依頼の本文
safety: false
features: [checkpoints]
conditions:
  - 作業ツリーの変更を git でコミットしてあるか、退避してある
  - 新しいセッションで試す
expect:
  - when: 欄を埋めた依頼を出す
    then: Claude がファイルの編集の道具で変更し、シェルでファイルを変える前に止まって知らせる（観察として扱う。指示は鍵でないので合否にしない）
  - when: 結果が気に入らず、空の入力欄で Esc を 2 回押すか /rewind を実行する
    then: 試しを送る前の時点を選んで「コードと会話を戻す」を選ぶと、編集の道具で変えたファイルが元に戻る
control: 依頼に編集の道具の指定がないとき、Claude がシェルでファイルを変えることがあり、その変更は戻らない場合がある
