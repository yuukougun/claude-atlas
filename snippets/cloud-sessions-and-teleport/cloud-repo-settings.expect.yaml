title: クラウドのセッションにも届く縛りをリポジトリに置く設定
kind: settings
place: project
safety: true
features: [cloud-sessions]
conditions:
  - 壊れても困らない作業用のリポジトリで、偽の秘密だけを入れた .env を置いて試す
  - .claude/settings.json として commit して push してから、claude --cloud で渡す
  - 手元の ~/.claude/settings.json や .claude/settings.local.json に同じ縛りがあっても、クラウドでは読まれないので、リポジトリの側で確かめる
expect:
  - when: クラウドのセッションに .env を読むよう頼む
    then: Read ツールによる読み取りが止められる（観察として扱う）
  - when: 強制 push を頼む
    then: git push --force の呼び出しが止められる（観察として扱う）
control: この設定を手元の ~/.claude/settings.json だけに置いて送ると、クラウドのセッションには縛りが届かない
