title: 自動メモリの記録を一覧させ、誤りと古い記録を挙げさせるプロンプト
kind: prompt
place: 依頼の本文
safety: false
features: [auto-memory]
conditions:
  - 自動メモリが有効で、すでにいくつか記録が溜まっているリポジトリで、新しいセッションを開く
  - 試す前に自動メモリのフォルダを別の場所に写しておく（書き換わっても戻せるようにする）
expect:
  - when: プロンプトを貼って依頼を出す
    then: 記録を書き換える前に、記録ごとの判定の表が返る（観察として扱う）
  - when: 表の「根拠」の列を見る
    then: 今のコードや設定を読んで確かめたことが書かれ、確かめられない記録は「確かめられない」になっている
  - when: 表を承認する前に自動メモリのフォルダを確かめる
    then: 記録のファイルが変わっていない
control: 「記憶を整理して」とだけ頼むと、何を消したかが見えないまま記録が書き換わることがある
