title: 読ませるファイルを @ で指す依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 症状と再現のテストが分かっている小さな不具合で試す
  - 新しいセッションで試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 指したファイルの読み込みから始まり、コードベース全体の検索を先にしない
  - when: ほかのファイルが要る場面になる
    then: 読む前にファイル名と理由が挙がり、返事を待つ
control: ファイルを指さず「ログインのバグを直して」とだけ頼むと、まず検索から始まり、関係のないファイルまで読むことがある
