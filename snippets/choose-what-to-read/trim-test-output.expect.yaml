title: 長いコマンド出力を絞って受け取る依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 出力が数百行になるテストやビルドのあるプロジェクトで試す
  - 新しいセッションで試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 出力の全文がファイルに書かれ、会話に入るのは失敗の件数と短い一覧だけになる
  - when: 失敗の原因を調べる段になる
    then: test.log の該当箇所だけが読まれ、全文を読む前に確認が入る
control: 「テストを実行して」とだけ頼むと、出力の全文が会話に入り、以後のターンでも読み直される
