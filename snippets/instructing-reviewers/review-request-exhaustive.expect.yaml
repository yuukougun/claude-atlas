title: 網羅させてから選別するレビューの依頼
kind: prompt
place: 依頼の本文
safety: false
expect:
  - when: 差分の範囲を埋めた依頼を、新しいセッションのレビュー役に出す
    then: 指摘が、場所・起きうること・確信度・影響の大きさ・確かめる最小の実験の組で返る
  - when: 迷うものも挙げるよう頼んだ依頼を出す
    then: 確信度が低の指摘も一覧に残り、重大なものだけに減らされない
  - 全体への評価の文（「問題なさそう」など）が返答に出ない
control: 「重大なものだけ教えて」と頼むと、同じ差分で指摘の件数が減り、確信度が低い指摘は一覧に出ない
