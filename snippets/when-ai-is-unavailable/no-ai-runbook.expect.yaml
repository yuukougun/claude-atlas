title: AI が止まったときの手順書の雛形
kind: other
place: project
safety: false
conditions:
  - 締め切りのある作業の前に、空欄を自分の作業に合わせて埋めておく
expect:
  - when: 空欄を埋めた手順書を、AI を使わない状態で読む
    then: 最低限の完了の条件と、次にやる作業と、切り替えを決める人が、AI に聞かずに分かる
  - when: 上限や障害で AI が止まる
    then: 止まった理由ごとの切り替え先の行を見て、待つか、追加の枠を使うか、AI なしで進めるかを決められる
control: 手順書がないと、止まった後に最低限の線と切り替え先を決めることになり、判断に時間を使う
