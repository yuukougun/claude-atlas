title: 書かれていることと推測を分け、原文の引用を添えて表にさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 資料の本文を同じ会話に渡してあるか、出典つきのレポートが返ってきた直後である
expect:
  - when: 資料を渡した会話で、この依頼を出す
    then: 主張ごとの行に「原文」か「推測」の区別と、条件の列と、引用の列が付く
  - when: 引用の列の文を原文で検索する
    then: 一致しない引用や、「引用なし」の行が見つかる（見つからないことは保証されないので、使う主張は原文を開いて確かめる）
control: この依頼を出さないと、要約が原文より強い言い方になり、推測が原文の内容と混ざっても、読み手には見分けにくい
