title: 問い・範囲・出典の条件を決めた調べものの依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 括弧の例を、自分の問いと範囲に書き換えてから出す
  - リサーチを使うときは、アプリで web 検索が使える状態にしておく
expect:
  - when: 括弧を埋めて、リサーチか通常の会話で出す
    then: レポートが結論・根拠・分からなかったことの順になり、根拠に出典と原文の引用が付く（引用が原文どおりかは保証されないので、使う主張は原文で確かめる）
control: 問いだけを渡すと、範囲と出典の条件を Claude が決め、何を調べなかったかがレポートから見えにくい
