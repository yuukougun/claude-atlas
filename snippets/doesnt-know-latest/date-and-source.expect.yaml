title: 日付・版・資料を渡して最新の情報を答えさせる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - 質問は、Claude の知識の締め切りより後に出た機能や版についてのものにする（答えを公式の文書で自分で確かめられるもの）
  - 検索の道具を使わせない状態で試すと、資料の効きだけを見られる
expect:
  - when: 締め切りより後に出た機能を、公式の文書の抜粋とこの雛形を付けて尋ねる
    then: 抜粋に書かれた内容に沿った答えが返り、抜粋にない点は「資料には書かれていない」と分けて返る傾向になる。古い知識が混ざらなくなるとは限らない
control: 雛形と抜粋を付けず同じ質問だけを出すと、古い版の説明が今の説明のように返ることがある
