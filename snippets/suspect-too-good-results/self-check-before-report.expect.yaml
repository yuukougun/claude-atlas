title: 良すぎる結果を自己点検させてから報告させる指示の雛形
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - 使い捨ての小さなリポジトリを使う。関数を 1 つ速くする依頼で、変更前後の出力を比べられるテストを用意する
expect:
  - when: 速度改善の依頼の末尾に、この雛形を付けて出す
    then: 報告に、退化・採点の省略・リーク・特例の分岐の 4 点ごとの実行結果と、確かめていない点の一覧が付く。形は完全一致にしない
  - when: 報告に「確かめていない」点が残る
    then: 完了ではなく未確認ありとして扱い、人が残りを確かめる。自己点検は同じ Claude の確認なので、独立した確認の代わりにはならない
control: 雛形を付けず「速くして」とだけ出すと、速くなった数字と「テストは通った」だけの報告になることがある
