title: 作業を 5 つの軸で見積もらせるプロンプト
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 任せたい作業を 1 つ決めてから、山かっこの欄を実際の値に置き換える
  - 見積もりの依頼であり、作業そのものは始めさせない
expect:
  - when: 欄を埋めた依頼を出す
    then: 返答が 5 つの軸ごとに「効く側・中間・欠ける」と理由を並べる
  - when: 欠ける軸のある作業を渡す
    then: 作業が任せる部分と人が受け持つ部分に分けられ、人が受け持つ理由が書かれる
  - when: 返答の判断の根拠を読む
    then: 確かめていない判断に「推測」が付く。返答は下書きであり、採るかどうかは人が決める
control: 軸を示さずに「これは AI に向いているか」と聞くと、向く理由だけが並び、欠ける軸と人が受け持つ部分が出ないことがある
