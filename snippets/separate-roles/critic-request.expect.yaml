title: 疑う人の依頼（成果物と基準だけを渡す）
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 作った人のセッションとは別の、新しいセッションで試す
  - 成果物と基準のパスを埋める
expect:
  - when: 成果物と基準を埋めて、新しいセッションに出す
    then: 基準を満たさない点、基準にない壊れそうな点、それぞれの確かめ方が返る。
  - when: 作った人が「問題ない」と思っている旨を足して出す
    then: 返答が賛成の側へ寄るか、同じ依頼で比べる。寄るなら、その旨は渡さないほうがよい。
control: 作った経緯と見込みを渡した同じ依頼では、批評が穏やかになるか比べる
