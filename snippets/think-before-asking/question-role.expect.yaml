title: 解法の名前を出させず、確かめるべき問いを原文の引用つきで挙げさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - "`<…>` の欄を、問題文の原文と、自分のメモで埋める。メモは、先に自分で書いたものを貼る"
expect:
  - when: 問題文とメモを貼って送る
    then: 5 つの観点ごとに問いが並び、各問いに問題文の引用が付く。解法の名前やコードは出ない場合が多い（観察として扱う。出たときは、問いだけに絞るよう頼み直す）
  - when: 引用できない問いについて見る
    then: 問題文にない推測だと書かれる場合がある（指示は鍵でないので、守られるとは限らない）
control: 問題文だけを貼って「どう解く？」と聞くと、解法の名前が先に返り、自分の考えを書く前にそれが基準になりやすい
