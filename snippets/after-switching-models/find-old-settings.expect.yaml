title: 見直す対象の候補を探すスクリプト
kind: other
place: project
safety: false
conditions:
  - プロジェクトのルートで実行する
  - grep のある環境（WSL・Linux・macOS）で試す
expect:
  - when: API を呼ぶコードに `temperature` を書いたファイルがある状態で実行する
    then: その行が「API の引数」の見出しの下に、ファイル名と行番号つきで出る
  - when: CLAUDE.md に IMPORTANT を含む行がある状態で実行する
    then: その行が「強調語」の見出しの下に出る
control: 候補は文字列の一致で探すだけなので、コメントや説明文の中の語も拾う。出た行を目で読んで、直す対象かを決める
