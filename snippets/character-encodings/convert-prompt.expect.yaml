title: 複製を作ってから集計させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - コード実行が使える環境で試す（アプリは、コード実行を有効にしておく）
  - 偽のデータ（Shift_JIS 系で保存した小さな CSV）で試す
expect:
  - when: 依頼を出す
    then: 複製を作った報告と、行数・先頭の行の確認が、集計より前に出る
  - when: 文字コードを取り違えた複製ができる
    then: 読めない先頭の行を見せて、集計に進まずに止まる
control: 雛形を使わず「この CSV を集計して」だけを頼むと、日本語の列が空欄や文字化けのまま集計されることがある
