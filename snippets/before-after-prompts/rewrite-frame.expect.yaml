title: 4 つの足しものを欄にした書き換えの枠
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - "`<…>` の欄を、自分の依頼の内容で埋める。要らない欄は消してよい"
expect:
  - when: 欄を埋めた依頼を出す
    then: 返答が、完了に書いた形と、確かめる手段に書いた結果を含む
  - when: 触ってよい範囲の外を変えないと終わらない依頼を出す
    then: 変えずに止まり、理由を書いて相談してくる場合が多い（指示はお願いなので、合否にしない）
control: 同じ依頼を欄なしの 1 文で出すと、対象の取り違え、範囲外の変更、確かめずに終わる、のいずれかが混ざる場合がある
