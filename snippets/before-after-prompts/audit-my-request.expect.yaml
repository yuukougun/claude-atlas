title: 送る前の依頼文を 4 つの観点で点検させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - "`<ここに、送る前の依頼文を貼る>` を、自分の依頼文に置き換える"
expect:
  - when: 「ログインのバグを直して。」だけの依頼文を貼って送る
    then: 対象・状況・完了の形が足りないという指摘と、確かめたいことの質問が返る
  - when: 4 つの観点を満たした依頼文を貼って送る
    then: 観点の多くが「なし」になる（指摘を 1 つも出さないとは限らない。観察として扱う）
control: 観点を書かずに「この依頼文をレビューして」とだけ頼むと、指摘の観点が回ごとに変わる場合がある
