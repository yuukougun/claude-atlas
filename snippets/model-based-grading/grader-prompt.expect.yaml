title: 採点の基準を書いた採点の依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 基準の名前と点の説明、基準の例は、自分の成果物に合わせて埋める（雛形の中の値は例）
  - 新しいセッションで、採点する成果物だけを見せて試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 基準ごとに点と、成果物から引いた根拠の行が返る
  - when: 基準では決められない成果物を混ぜる
    then: その項目が「判定不能」になり、何が分かれば決められるかが書かれる（作り話で点を埋めない、という観察。指示は鍵ではないので合否にしない）
control: 雛形を使わず「この文章を採点して」とだけ頼むと、基準が回ごとに変わり、点が高めに寄ることがある
