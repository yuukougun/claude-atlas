title: 人の判定と食い違った例を読み直させる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 較正用の表（成果物・人の点・採点役の点・人の理由）の場所を、自分の構成に読み替える
  - 食い違いが 3 件以上ある表を用意し、新しいセッションで試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 食い違いの行ごとに、4 つの原因のどれかと、成果物か人の理由から引いた根拠が返る
  - when: 返答を見る
    then: 採点の依頼と人の点が書き換わらず、直す案が前後の文の並びで出る
control: 雛形を使わず「食い違いの原因を調べて」とだけ頼むと、人の点を採点役に合わせて直す案が混じることがある
