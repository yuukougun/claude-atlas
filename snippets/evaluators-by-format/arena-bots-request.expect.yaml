title: 基準のボットを仕様どおりに作らせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 性質の違う 4 つの戦略を `bots/spec/` に書き分けてあるプロジェクトで試す
expect:
  - when: この依頼を出す
    then: 仕様ごとに別のボットと、総当たりの実行スクリプトが作られる
  - when: 返ってきた勝敗の表を見る
    then: 先手後手を入れ替えた結果が残り、極端な勝敗のボットがあれば、仕様の読み違いの疑いとして報告される
control: 仕様を書かずに「いくつかの基準のボットを作って」と頼むと、似た戦略のボットが並びやすい（仮説）
