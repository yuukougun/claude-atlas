title: ローカルのテスタを先に作らせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 公式のテスタと入力の生成器を `tools/official/` に置いたプロジェクトで試す
expect:
  - when: この依頼を出す
    then: 解法ではなく、実行スクリプトと集計の仕組みが作られる
  - when: 終わりの報告を読む
    then: 公式のサンプルでスコアが一致したかどうかが書かれ、合わないときは原因の調査が先に報告される
control: 依頼に公式のサンプルとの突き合わせを書かないと、自前で書いた採点のスコアが公式と一致するかを確かめないまま、完了が報告されやすい
