title: 設定ファイルで出力スタイルを指定する
kind: settings
place: user
safety: false
features: [output-styles]
conditions:
  - 既定にしたいときは ~/.claude/settings.json に、プロジェクトだけなら .claude/settings.local.json に書く
  - 新しいセッションで試す
expect:
  - when: 設定を書いて Claude Code を起動し、小さな変更を頼む
    then: 変更の前後に Insight と題した短い説明のブロックが付く
  - when: 値を explanatory のように小文字で書いて起動する
    then: スタイルが選ばれず、Default と同じ応答になる
control: 設定を書かない状態では、Insight のブロックは付かない
