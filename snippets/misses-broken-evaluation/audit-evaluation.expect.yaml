title: 評価の仕組みを点検させる依頼
kind: prompt
place: 依頼の本文（評価の診断で、人が点検するのと並べて使う）
safety: false
conditions:
  - 評価のコードとデータの分割のコードが、リポジトリにある状態で試す
  - 返答は手がかりとして使い、引用された行は自分でも開いて確かめる
expect:
  - when: 評価の仕組みを置いたリポジトリで、この依頼を出す
    then: 4 点それぞれに、コードの行の引用か「見つからなかった」と確かめた範囲が付く（観察として扱う。指示は鍵でないので合否にしない）
  - when: 検証用のデータが特徴量の作成に混ざっているコードで、この依頼を出す
    then: 1 点目にその行が挙がる（観察として扱う。挙がらなくても、問題がないとは言えない）
control: 「評価に問題はない？」とだけ聞いた場合と、返答に確かめた範囲が付くかを比べる
