title: handoff 文書を書かせる依頼（4 項目）
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 長めの作業が途中まで進んだ会話で試す
expect:
  - when: 依頼を出す
    then: HANDOFF.md が作られ、目的と完了の条件・現状と根拠・試して駄目だったこと・次の一手の 4 項目が並ぶ
  - when: 現状の項目を読む
    then: 通った・落ちた、の記述ごとに、実行したコマンドが付いている
  - when: 書き終えた後の返答を見る
    then: 実装の続きに進まず、書いたところで止まる
control: 4 項目を指定せず「引き継ぎを書いて」とだけ頼むと、経過の要約が中心になり、完了の条件や試して駄目だったことが抜けやすい
