title: リスクの段と承認者の表（例）
kind: other
place: チームの開発規約（リポジトリの文書など）
safety: false
conditions:
  - 段の中身と人の数は、自分のチームの変更の種類とレビューできる人数に合わせて書き換える
expect:
  - when: 表の段ごとに、直近の PR を 10 件ほど当てはめる
    then: どの段か迷う PR が出て、段の境目を書き足せる
  - when: AI のレビューだけが通った PR を表に当てはめる
    then: 低の段の条件を満たす場合を除き、人の承認が足りないと分かる
control: 表を置かないと、承認の数が PR ごとに、その場の気分で変わる
