title: 赤信号の候補を機械的に拾う確認の script
kind: other
place: project
safety: false
conditions:
  - git の作業ツリーで試す。基準のブランチ名が main でなければ、引数で渡す
  - 使い捨てのリポジトリに、テストと設定のファイルを変えたコミットを用意する
expect:
  - when: 用意したブランチで script を流す
    then: ファイル別の統計、テストや設定に触れたファイルの一覧、追加された行の中の語が順に出る
  - when: 赤信号の語を含まない変更で流す
    then: 2 つ目と 3 つ目の欄が「(なし)」になる。拾えるのは語の候補だけで、何も出ないことは安全の証明ではない
control: script を使わず差分を頭から読むと、テスト側の小さな変更が大きな差分に埋もれやすい
