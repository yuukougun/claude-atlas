title: 赤信号に当たる箇所だけを挙げさせる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 使い捨てのリポジトリに、期待値を緩めたテストと、握りつぶしの例外を入れた変更を用意する
expect:
  - when: 用意した差分にこの雛形で依頼を出す
    then: 2 つの項目の箇所がファイル名と行の番号つきで挙がり、ファイルは変わらない
  - when: 赤信号のない小さな差分にこの雛形で依頼を出す
    then: 各項目が「なし」になる。挙がった箇所を、人が自分の目で開いて読む。Claude が挙げなかったことは、読まなくてよい理由にしない
control: 雛形を付けず「差分を確認して」とだけ出すと、変更の要約が返り、赤信号の項目ごとの有無は分からないことが多い
