title: 選択肢と推奨案を出させる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - 〔〕の欄を、実際に迷っている決めごとと前提で埋める
expect:
  - when: 欄を埋めた依頼を出す
    then: コードは書かれず、前提の違う数案と、案ごとの利点・欠点・向く条件が返る
  - when: 返答の終わりを読む
    then: 推奨が 1 つ、理由と推奨が外れる条件の付いた形で示され、確かめるべき前提も挙がる
control: 「どうすればいい？」とだけ頼むと、案が 1 つだけ返り、捨てた案や推奨が外れる条件が見えないことがある
