title: 確かめるべき問いを挙げさせる依頼の雛形（問い役）
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 〔〕の欄を、手元の資料の名前に置き換え、その資料を添付する
expect:
  - when: 資料を添えて依頼を出す
    then: 解法や設計の案は書かれず、問いが 10 個前後並ぶ
  - when: 各問いを読む
    then: 問いごとに、資料の原文の箇所が短く引用されている
control: 「案は出さないでください」の指定を外すと、問いより先に解法や設計の案が返ることがある
