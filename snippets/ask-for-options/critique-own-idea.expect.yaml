title: 自分の案の批評を頼む依頼の雛形（批評役）
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 〔〕の欄を埋め、自分の案と、案の元になった資料を添える
expect:
  - when: 欄を埋めた依頼を出す
    then: 代案は返らず、前提・見落とした条件・崩れそうな状況の 3 つの見出しで指摘が並ぶ
  - when: 指摘を読む
    then: 指摘ごとに確かめる方法が 1 行付き、根拠のないものには「推測」と付く
control: 3 点の指定を置かず「どう思う？」とだけ頼むと、全体への賛成や褒め言葉が先に返りやすい
