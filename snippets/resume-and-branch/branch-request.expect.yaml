title: 分岐した先で別案を試す依頼
kind: prompt
place: 依頼の本文（`/branch <名前>` を実行した後の最初の依頼）
safety: false
conditions:
  - 本筋の作業をコミットか退避してから試す
  - 新しいセッションで、ある程度会話が進んだ状態にする
expect:
  - when: "`/branch try-streaming` のように分岐してから、この依頼を出す"
    then: 分岐した先のセッションで、それまでの会話を踏まえた別案の試行が始まる
  - when: 試行が終わる
    then: 最後に、うまくいった点・駄目だった点・本筋の案との差が短くまとまる（観察として扱う。指示は鍵ではないので、行数まで守られるとは限らない）
control: 分岐せずに同じ依頼を出すと、別案の試行の会話が本筋の会話に混ざり、本筋に戻るときに別案の前提が残る
