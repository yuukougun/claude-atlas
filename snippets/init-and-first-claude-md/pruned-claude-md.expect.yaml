title: /init の叩き台を削った後の CLAUDE.md の例
kind: claude-md
place: project
safety: false
features: [claude-md]
conditions:
  - 新しいセッションで試す（CLAUDE.md はセッションの開始で読まれる）
  - 例のコマンドと生成物のパスは、自分のリポジトリのものに置き換える
expect:
  - when: 新しいセッションで /context を開く
    then: Memory files にこの CLAUDE.md が出る
  - when: 公開 API の変更を頼む
    then: 変更の前に docs/api-changes.md へ理由を書く傾向がある（指示なので合否にしない。観察として数回流す）
control: 叩き台を削らずに置いたとき、同じ依頼で落とし穴の行が守られる割合と比べる
