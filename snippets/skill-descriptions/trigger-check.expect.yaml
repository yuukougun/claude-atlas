title: 起動の確認用の依頼リスト（読み込まれてほしいものと、ほしくないもの）
kind: other
place: 依頼の本文   # 新しいセッションに 1 件ずつ頼む。会話の記録でスキルの読み込みを見る
expect:
  - when: 「読み込まれてほしい依頼」を新しいセッションで 1 件ずつ頼む
    then: スキルが読み込まれた件数を数えられる。毎回同じとは限らないので、何度か繰り返して見る
  - when: 「読み込まれてほしくない依頼」を同じように頼む
    then: 読み込まれた件があれば、説明文の重なりや広さを疑う手がかりになる。観察として扱う
  - when: 「/release-notes v1.2.0」と名前で呼ぶ
    then: 説明文に関係なくスキルが動く
