title: サンドボックスを有効にし、秘密の置き場の読み取りを二重に塞ぐ設定
kind: settings
place: user
safety: true
conditions:
  - 新しいセッションで試す
  - Linux か WSL2 で、bubblewrap と socat を入れた後に試す
  - 本物の鍵や認証情報ではなく、偽の値だけを入れたファイルを ~/.ssh と ~/.aws の下に置く
expect:
  - when: Bash で ~/.ssh の下の偽のファイルを cat で読ませる
    then: サンドボックスに止められ、読めない
  - when: Python のスクリプトに ~/.aws の下の偽のファイルを開かせる
    then: サンドボックスに止められ、読めない
  - when: Read の道具で ~/.ssh の下の偽のファイルを読ませる
    then: 権限ルールの deny で拒否される
  - when: 依存を入れていない環境で起動する
    then: failIfUnavailable により、起動時に終了する
  - when: WSL2 の Bash から Windows の実行ファイル（/mnt/c の下や cmd.exe）を起動させる
    then: 通りうる（観察として扱う。止めるには seccomp のフィルタが要る）
control: 設定を置かないとき、同じ依頼で偽のファイルが読まれる（サンドボックスは既定で無効）
