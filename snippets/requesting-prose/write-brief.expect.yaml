title: 読み手・目的・手本を渡して下書きを頼む依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - 〔〕の欄を、実際に書きたい文章の情報で埋める
expect:
  - when: 欄を埋めた依頼を出す
    then: 下書きだけが返り、結論の置き場所や言葉の難しさが読み手と目的に合っている
  - when: 材料にない事実が要る箇所を読む
    then: 事実を足さず、足りない情報を質問するか、空欄として示す
control: 「週報を書いて」とだけ頼むと、読み手や目的に関わらない無難な文章が返りやすい
