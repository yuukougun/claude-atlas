title: 嫌な点を例で示して直させる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - 〔〕の欄を、直したい文章にある実際の嫌な箇所で埋める
expect:
  - when: 欄を埋めた依頼を出す
    then: 直す前と後が並んで返り、挙げた嫌な点の箇所が置き換わっている
  - when: 例に挙げていない箇所を比べる
    then: 例に当たらない箇所はほぼ変わらず、内容と事実も変わらない
control: 「もっと自然にして」とだけ頼むと、どの箇所をどう直したかが分からず、全体が書き換わることがある
