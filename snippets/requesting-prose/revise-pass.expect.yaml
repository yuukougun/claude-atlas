title: 観点を 1 つに絞って推敲させる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 〔〕の欄を埋め、書かせた下書きを貼る
expect:
  - when: 欄を埋めた依頼を出す
    then: 指定した観点に当たる箇所だけが、直す前と後の対で並んで返る
  - when: 直した文章と元の下書きを比べる
    then: 事実と数字は変わらず、観点に関係のない文は残る
control: 「書いて、読みやすくして」と 1 回で頼むと、直した箇所が増えて差分を読み切りにくい
