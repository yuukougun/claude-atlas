title: 定期タスクの依頼の型（質問しない・送らない・結果の置き場所を決める）
kind: prompt
place: 依頼の本文
safety: true
conditions:
  - 欄を埋めて、頻度を「手動」にしたタスクで試す
  - 専用の作業フォルダだけを許可しておく
expect:
  - when: タスクを手動で 1 回走らせる
    then: 置き場所に日付つきのファイルができ、未確認の項目が「未確認」と書かれる
  - when: 送信が要りそうな調査を頼む
    then: 送らずに、結果の先頭に人の確認待ちとして書かれる（依頼文の禁止はお願いなので、守られるかは観察する）
control: 結果の置き場所と止まる条件を書かないと、人が見ていない間に質問で止まるか、広い範囲に手を出すかのどちらかになりやすい
