title: タスクを結果で頼む文の型（完了の条件・触ってよい範囲・止まる条件）
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 欄を埋めて、新しいタスクとして頼む
  - 専用の作業フォルダだけを許可しておく
expect:
  - when: 欄を埋めた依頼でタスクを始める
    then: 置き場所のフォルダにファイルができ、返答に、場所と出典付きの項目の数と未確認の項目の数が書かれる
  - when: 範囲の外のファイルが要る調査を頼む
    then: 外のファイルを書き換えず、止まった理由を返す（依頼文の禁止はお願いなので、守られるかは観察する）
control: 完了の条件と止まる条件を書かずに「調べてまとめて」とだけ頼むと、どこまでが終わりか分からない報告で終わりやすい
