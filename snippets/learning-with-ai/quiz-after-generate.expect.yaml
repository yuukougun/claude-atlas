title: 生成の後に、役割について自分に質問を出させる
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - AI にコードを実装させた直後の会話で試す
expect:
  - when: 雛形の <手法名> を埋めて依頼を出す
    then: 返答が最初の 1 問だけになり、正解や解説を先に言わない（お願いなので守られないことがある。観察として扱う）
  - when: 1 問に自分の言葉で答える
    then: 採点と間違いの理由だけが返り、3 問が終わるまで実装の変更に進まない（観察として扱う）
control: 雛形を置かないとき、同じ依頼では実装とその説明が一度に返り、理解を確かめる場面が会話に現れない
