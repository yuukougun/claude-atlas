title: 上位解法を、手法・性質・引用の 3 列で要約させる
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 要約させたい解法の原文を、依頼の末尾に貼る
expect:
  - when: 雛形の末尾に上位解法の文章を貼って依頼を出す
    then: 手法・問題の性質・原文の引用の 3 列の表が返る
  - when: 原文が手法を選んだ理由を書いていない
    then: 「問題の性質」の列が「原文に記載なし」になる（お願いなので、理由を補って埋めることがある。引用を原文と照らして確かめる）
control: 雛形を置かないとき、同じ依頼では手法の一般的な説明が混ざり、原文にない条件が補われうる
