title: 完了の定義を含む依頼（開発）
kind: prompt
place: 依頼の本文（Claude Code・コマンドを実行できる場面）
safety: false
conditions:
  - 新しいセッションで試す
  - 完了のコマンドに、リポジトリですでに動くテストの実行コマンドを書く
expect:
  - when: 欄を埋めた依頼を出す
    then: 返答に、実行したコマンドとその出力が含まれる
  - when: 完了のコマンドを、わざと失敗する状態にして依頼を出す
    then: 「完了」と書かずに、失敗したことを報告する（観察として扱う。指示は鍵でないので合否にしない）
control: 完了の定義を書かず「直して」だけで依頼すると、実行した証拠のない「直しました」で終わることがある
