title: 確かめる手段と終わりの条件を渡す依頼
kind: prompt
place: 依頼の本文
safety: false
features: [goal]
conditions:
  - 新しいセッションで試す
  - テストと型の検査を実行できるプロジェクトで試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 直す前に、再現するテストが失敗する出力が出る
  - when: 修正が終わる
    then: 返答に、実行したコマンドと出力の最後の部分が貼られている
  - when: 既存のテストが落ちる
    then: テストを消したり緩めたりせず、落ちたことを報告する
control: 「最後に念のため確認して」だけを足した同じ依頼では、何で確かめたかが返答に出ない場合がある
