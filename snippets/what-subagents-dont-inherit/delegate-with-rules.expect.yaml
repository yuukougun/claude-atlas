title: 会話で決めた規則を、委任の文に書き直させるプロンプト
kind: prompt
place: 依頼の本文
safety: false
features: [subagents]
conditions:
  - 山かっこの部分を、自分の作業と規則に置き換えて出す
  - 新しいセッションで試す
expect:
  - when: 山かっこを埋めた依頼を出す
    then: サブエージェントへの依頼文に、目的・範囲・規則・報告の言語と形が書かれる（観察として扱う）
  - when: 担当の報告が戻る
    then: 報告が日本語で、結論・根拠の場所・未確認の点の順になる（指示は鍵でないので合否にしない）
control: 規則を書かずに「認証まわりを調べて」とだけ頼むと、依頼文に規則が入らず、担当が範囲や言語を自分で決めることがある
