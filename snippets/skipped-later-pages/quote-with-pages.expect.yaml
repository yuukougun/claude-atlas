title: ページ番号付きの引用を先に出させる依頼
kind: prompt
place: 依頼の本文（資料を添付した後の、質問のところ）
safety: false
conditions:
  - 資料を添付した新しい会話で試す
  - 返ってきた引用は、原本の該当ページを開いて文言を照らす
expect:
  - when: 長い PDF を添付し、後半のページにだけある内容をこの依頼で尋ねる
    then: 返答に、ページ番号付きの引用が並ぶ（観察として扱う。指示は鍵でないので合否にしない）
  - when: 読み込みの範囲の外にある図について、この依頼で尋ねる
    then: 「読めていない」と書かれるか、図の中身を書けずに止まる（観察として扱う）
control: 「後半の図を説明して」とだけ頼むと、読んでいない図についてそれらしい説明が返ることがある
