title: 記事の手順を、今の公式の資料と突き合わせさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 公式の文書を読める状態で試す（Web の検索や取得が使えるか、文書を貼る）
  - 実在の記事の手順を貼る。設定は変えさせない
expect:
  - when: 欄を埋めた依頼を出す
    then: 手順の名前ごとに、4 つの区分のどれかと、見た資料の URL が返る
  - when: 資料で確かめられない名前がある
    then: 推測で埋めず、確かめられなかった区分に入る
control: 雛形を置かないと、記事の手順を書き直した文だけが返り、どの名前をどの資料で確かめたかが分からない
