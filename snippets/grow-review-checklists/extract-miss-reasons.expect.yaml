title: 修正の PR から見落とした理由を抜き出す依頼文
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 元の PR と、その見落としを直した PR の差分を読める状態にする
expect:
  - when: 2 つの PR を指定して依頼文を出す
    then: 返答が「見落とした変更の型・見落とした理由・観点の案」の 3 行の組になる
  - when: 差分から理由が読み取れない見落としを混ぜる
    then: その件の理由が推測で埋められず、「不明」と書かれる
control: 依頼文の「守ること」を外すと、観点がそのまま書き足されたり、理由が推測で埋まったりすることがある
