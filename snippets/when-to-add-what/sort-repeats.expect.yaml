title: 繰り返したメモを移し先に仕分けさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 言い直した内容を数行のメモにして、山かっこの欄に貼る
  - 新しいセッションで試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 行ごとに移し先と理由が並び、ファイルやスキルはまだ作られない
  - when: 一度しか起きていない注意がメモにある
    then: 「移さない」に入るか、理由に繰り返しが見えていないと書かれる
control: メモを貼らずに「拡張を整えて」とだけ頼むと、繰り返しの根拠がないまま、一般的な構成の案が返ることがある
