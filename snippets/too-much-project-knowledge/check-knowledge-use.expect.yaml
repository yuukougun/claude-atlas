title: ナレッジが使われたかを確かめる依頼（引用とファイル名を先に出させる）
kind: prompt
place: 依頼の本文
safety: false
features: [projects]
conditions:
  - プロジェクトを 1 つ作り、ナレッジに資料を数点置く。資料の量は、容量に近づいた状態と、絞った後の状態の両方で試す
  - 山かっこの所を、ナレッジの資料にだけ答えがある自分の質問に書き換える
expect:
  - when: プロジェクトの中で新しい会話を始め、この依頼を出す
    then: 返答の先頭に、ファイル名と原文の引用が並び、その後に答えが続く。引用が資料にあるかは、人がファイルを開いて確かめる
  - when: 資料に答えがない質問を、同じ形で出す
    then: 「ナレッジにない」という返答になる。推測で答えた場合は、指示は鍵でないので、観察として記録する
control: 同じ質問を、資料を絞る前と後で出し、引用の有無と答えの違いを比べる
