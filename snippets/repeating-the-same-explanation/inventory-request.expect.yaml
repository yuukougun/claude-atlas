title: 繰り返している説明を、置き場所へ振り分けさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 繰り返し貼っている説明や注意を、実際に 1 つ以上貼る
expect:
  - when: 繰り返している説明を貼ってこの依頼を出す
    then: 背景・手順・注意に分けた案と、それぞれの移し先の案が返る。ファイルは作られない
  - when: 毎回変わる部分が貼った内容に混ざっている
    then: その部分は移し先に回さず、頼みの側に残す案になる
control: 振り分けの順を示さずに「置き場所を考えて」とだけ頼むと、背景・手順・注意が混ざった 1 つの長い指示にまとめる案が返りやすい
