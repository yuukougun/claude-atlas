title: 今把握している前提を列挙させる依頼
kind: prompt
place: 依頼の本文（長くなった会話の途中）
safety: false
conditions:
  - 前提を伝えてから何ターンも進んだ会話で試す
  - 列挙された前提は、自分が最初に伝えた文面と照らす
expect:
  - when: 前提を伝えた長い会話の途中で、この依頼を出す
    then: 目的・完了の条件・前提が列挙され、抜けや言い換えがあれば見分けられる（観察として扱う。指示は鍵でないので合否にしない）
  - when: 最初の前提が会話から失われた状態で、この依頼を出す
    then: その前提が列挙に出ないか、「確認できない」と書かれる（観察として扱う）
control: 確認を挟まずに作業を続けさせると、抜けた前提に気づかないまま答えが雑になることがある
