title: テストを先に書かせて失敗を確かめさせる依頼
kind: prompt
place: 依頼の本文（Claude Code・テストを実行できる場面）
safety: false
conditions:
  - 新しいセッションで試す
  - 実行コマンドに、リポジトリですでに動くテストの実行コマンドを書く
expect:
  - when: 欄を埋めた依頼を出す
    then: 実装のファイルを変える前に、テストだけが書かれて実行され、落ちた出力が返答に貼られる
  - when: 手順 3 で返事をせずに待つ
    then: 実装に進まずに止まる（観察として扱う。指示は鍵でないので合否にしない）
control: 「テストも書いて」だけで依頼すると、実装と同じ流れでテストが書かれ、落ちる状態を一度も見ないまま終わることがある
