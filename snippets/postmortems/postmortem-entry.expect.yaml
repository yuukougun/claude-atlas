title: ポストモーテムの項目（要約・影響・時間線・根本原因・うまくいったこと・アクション項目・再発防止の置き場所）
kind: other
place: プロジェクトの記録（例：docs/postmortems/）
safety: false
expect:
  - 要約・影響・時間線・根本原因・うまくいったこと・アクション項目・再発防止の置き場所の欄がそろっている
  - 時間線が、誰の操作かと、その時点で見えていたものを分けて書く形になっている
  - 根本原因の欄が、人や AI の誤りでなく仕組みの隙間として書く指示になっている
  - アクション項目にオーナー 1 人と測れる完了状態の欄がある
