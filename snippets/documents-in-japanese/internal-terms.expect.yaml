title: 社内用語の一覧を添えて文書を頼む依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 表の行は、自分の組織の用語に置き換える
  - 用語の一覧が長くなったら、依頼の本文ではなく CLAUDE.md やプロジェクトの指示に置く
expect:
  - when: 表と一緒に、一覧の語を含む文書を頼む
    then: 使わない言い方が右の欄の言い方に直って書かれる
  - when: 一覧にない社内の言い方を含む材料を渡す
    then: 「一覧にない語」として挙がるか、そのまま使われるかのどちらかになる。観察として記録する
control: 一覧を渡さないと、一般的な言い方で書かれ、社内の言い方と食い違いうる
