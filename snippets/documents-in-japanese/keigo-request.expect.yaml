title: 読み手と関係を渡して敬語のメールを頼む依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 括弧の欄を実際の内容に置き換える。社名や人名は仮のものでよい
  - 送る前に、必ず人が全文を読む
expect:
  - when: 欄を埋めた依頼を出す
    then: 宛先の動作が尊敬語、自社の動作が謙譲語で書かれた件名つきの下書きが返る。語の使い分けは人が読んで確かめる
  - when: 「迷った文」の欄を見る
    then: 判断に迷った文が挙がる。挙がらなくても、全文を読む手間は省けない
control: 宛先と関係を書かずに「敬語でメールを書いて」と頼むと、敬語の段階が関係に合わない下書きになりうる
