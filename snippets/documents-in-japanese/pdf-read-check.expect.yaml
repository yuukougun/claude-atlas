title: PDF が読めたかを先に確かめる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 試すときは、縦書きの PDF とスキャンした PDF を 1 つずつ用意し、機密のない資料を使う
  - 読み込みの範囲は面とファイルの大きさで違うので、アプリと Claude Code の両方で試す
expect:
  - when: 縦書きの PDF を添付して、この依頼を出す
    then: 原文の引用が返り、縦書きの箇所の引用が元の読み順と合っているかを、人が PDF と見比べて確かめられる
  - when: 文字の層がないスキャンの PDF を添付して、この依頼を出す
    then: 読めなかった箇所がページ番号付きで挙がるか、引用が原文と合わないかのどちらかになる。どちらになるかは観察として記録する
control: 引用を求めず「要約して」とだけ頼むと、読めていない箇所があっても、もっともらしい要約が返りうる
