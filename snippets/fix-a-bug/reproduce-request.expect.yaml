title: 再現と「直った」の定義を含む依頼（バグ修正）
kind: prompt
place: 依頼の本文（Claude Code・コマンドを実行できる場面）
safety: false
conditions:
  - 新しいセッションで試す
  - 再現のコマンドに、リポジトリで実際に失敗するコマンドを書く
expect:
  - when: 欄を埋めた依頼を出す
    then: コードを変える前に、再現のコマンドを実行した出力が返答に出る
  - when: 同じ依頼を続けて出す
    then: 修正の前に落ちるテストが 1 つ追加される（観察として扱う。指示は鍵でないので合否にしない）
control: 再現と完了を書かず「このエラーを直して」だけで依頼すると、再現を確かめずに修正が始まることがある
