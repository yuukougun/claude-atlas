title: 説明、仮説、反証、最小の修正の順に進める依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 再現できるバグを 1 つ用意する
expect:
  - when: 欄を埋めた依頼を出す
    then: 最初の返答は、ファイルを読んだ説明と、予測つきの仮説の一覧になり、コードはまだ変わらない
  - when: 予測を確かめる結果を返す
    then: 反証された仮説が捨てられ、残った仮説への diff が提案される（観察として扱う。指示は鍵でないので合否にしない）
control: 「このエラーを直して」だけで依頼すると、仮説を挙げずに最初の修正が適用されることがある
