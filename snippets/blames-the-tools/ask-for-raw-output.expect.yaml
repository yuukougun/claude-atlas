title: 「壊れている」の根拠を生の出力で出させる依頼
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - Claude が「環境や道具が壊れている」と言って作業を止めた会話で、そのまま続けて出す
expect:
  - when: この依頼を出す
    then: 実行したコマンド・生の出力・終了コードが貼られ、要約だけの返答にはならない
  - when: 再実行で結果が変わる、または出力が見つからない
    then: 「壊れている」という判断が根拠のない推測だったと分かる（観察として扱い、合否にしない）
control: 雛形を使わず「直して」とだけ頼むと、Claude が環境を作り直したり別の道具に切り替えたりして、原因が見えないまま進むことがある
