title: 調べものの依頼の型
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - "`<…>` の欄を、自分の依頼の内容で埋める。要らない欄は消してよい"
expect:
  - when: 欄を埋めた依頼を出す
    then: 返答が、結論・出典つきの根拠・推測・見つからなかったこと、の順に分かれる
  - when: 資料に答えがない問いを出す
    then: 推測で埋めず、見つからなかったと書く場合が多い（指示はお願いなので、合否にしない）
control: 同じ問いを 1 文だけで出すと、範囲が広がる、出典のない断定が混ざる、のいずれかが起きる場合がある
