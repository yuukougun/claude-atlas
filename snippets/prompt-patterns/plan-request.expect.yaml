title: 計画の依頼の型
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - "`<…>` の欄を、自分の依頼の内容で埋める。要らない欄は消してよい"
expect:
  - when: 欄を埋めた依頼を出す
    then: 実装に入らず、確かめ方の付いた段と、候補つきの選択肢と、質問が返る
  - when: 今の状態の欄が足りない依頼を出す
    then: 推測で進めず、足りない点を質問として並べる場合が多い（指示はお願いなので、合否にしない）
control: 「〜の計画を立てて」だけで頼むと、確かめ方のない段の列になる場合がある
