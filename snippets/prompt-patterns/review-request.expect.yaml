title: レビューの依頼の型
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - "`<…>` の欄を、自分の依頼の内容で埋める。要らない欄は消してよい"
expect:
  - when: 欄を埋めた依頼を出す
    then: 指摘ごとに、場所・問題・重さ・確かめ方が付く
  - when: 基準を満たしている対象を出す
    then: 指摘なしと、確かめた基準が書かれる場合が多い（指示はお願いなので、合否にしない）
control: 基準なしで「レビューして」と頼むと、好みの指摘が混ざり、確かめ方の付かない指摘が増える場合がある
