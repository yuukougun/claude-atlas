title: 観察と提案を分ける分析の依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - "`<…>` の欄を、自分のログと注目する対象で埋める"
expect:
  - when: 欄を埋めた依頼を出す
    then: 観察した事実、追加の集計案、仮説ごとの正しい場合・誤りの場合・最小の確認実験、の順に分かれて返る
  - when: 結果を見て、改善策を求めずに終える
    then: 改善策が書かれない場合が多い（指示はお願いなので、合否にしない）
control: 「失点の原因と改善策を教えて」と頼むと、観察と解釈と提案が混ざり、確かめていない原因に基づく改善策が出る場合がある
