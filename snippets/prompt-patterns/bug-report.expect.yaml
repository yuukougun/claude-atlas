title: バグ報告の依頼の型
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - "`<…>` の欄を、自分の依頼の内容で埋める。要らない欄は消してよい"
expect:
  - when: 再現できる不具合を、欄を埋めて出す
    then: 原因の見立てと根拠が先に返り、修正の後に再現の手順の結果が付く
  - when: 再現の手順を空にして出す
    then: 再現の手順を先に尋ねる、または再現を試みる場合がある（指示はお願いなので、合否にしない）
control: 「ログインが動かない、直して」だけで頼むと、症状に似た別の箇所を直す場合がある
