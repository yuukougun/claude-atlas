title: 下書き、基準でのレビュー、改善の連結
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - "`<…>` の欄を、自分の依頼の内容で埋める。1 回目、2 回目、3 回目は別々の依頼として出す"
expect:
  - when: 1 回目を出す
    then: 見直しをせず、下書きだけが返る
  - when: 2 回目を出す
    then: 下書きは直されず、基準ごとの指摘（場所・問題・重さ・確かめ方）だけが返る
  - when: 3 回目を出す
    then: 選んだ指摘に対応する箇所だけが直り、直した所の一覧が付く
control: 1 回の依頼で「書いて、見直して、直して」と頼むと、途中の下書きと指摘が見えず、どの直しが基準から来たかを確かめにくい
