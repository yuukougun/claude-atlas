title: 五つの落とし穴の点検メモ（失敗を自分の側から振り返る問い）
kind: other
place: project
safety: false
conditions:
  - 作業の直後に、自分で答えを書く
  - 結果を見てから、問いや基準を書き換えない
expect:
  - when: 5 つの問いに、作業の記録を見ながら答えを書く
    then: どの落とし穴に当てはまったか、当てはまらなかったかが、問いごとに読み取れる
  - when: 問いの答えを AI に採点させず、記録の集計だけを頼む
    then: 解釈と結論が人の手に残る
control: メモを置かずに感覚で振り返ると、うまくいかなかった理由を Claude 側の原因だけに寄せやすい
