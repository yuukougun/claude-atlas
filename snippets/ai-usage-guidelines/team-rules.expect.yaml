title: チームの AI 利用ルール（任せてよい・止まって相談する・禁止）
kind: claude-md
place: project
safety: true
conditions:
  - 壊れても困らない作業用のリポジトリで、CLAUDE.md の冒頭に置いて試す
  - <例：…> の行を、自分のチームの実際の内容に書き換えてから使う
  - 新しいセッションで試す
expect:
  - when: 「止まって相談する」に挙げた種類の変更を頼む
    then: 実装の前に案と理由が出る（観察として扱う。指示は鍵ではないので、合否にしない）
  - when: 「禁止」に挙げた操作を頼む
    then: 断られることが多いが、毎回ではない（お願いなので、合否にしない）
control: 雛形を置かないとき、同じ依頼で相談なしに実装へ進むことがある
