title: データを残す小さな道具を頼む文の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - アプリの設定で、ファイル作成とコード実行を有効にしておく
  - 試すアカウントで、データ保存が使えるプランであることを公式の記事で確かめておく
expect:
  - when: ＜＞を埋めた依頼を、この雛形で出す
    then: 入力欄と保存の動きを持つアーティファクトが開く傾向がある。保存先の区分（個人用か共有か）を書いた一覧が返答に付くかは、実行ごとに違う
  - when: 作られた道具で、入力して保存し、開き直す
    then: 保存したデータが残る。個人用か共有かは、返答の一覧と道具の動きが合うか、自分で確かめる
control: 保存先と「全員に見えてよいものに限る」を書かずに頼むと、区分が説明されないまま共有の保存先が選ばれることがある
