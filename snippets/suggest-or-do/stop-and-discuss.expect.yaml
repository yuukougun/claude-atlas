title: 懸念があれば止まって相談させる指示
kind: prompt
place: 依頼の本文、CLAUDE.md（Claude Code）、システムプロンプト（API）
safety: false
conditions:
  - 新しいセッションで試す
  - 止めたい変更の種類に、試す作業の種類を書く
expect:
  - when: 止めたい変更の種類に当たる変更を、懸念が出るように頼む
    then: 気になる点と選択肢と推奨が返り、その変更はまだ行われない（指示は鍵ではないので、合否にしない）
  - when: 種類に当たらない小さな変更を頼む
    then: 懸念があれば一文で述べ、そのまま作業が進む
control: 指示を置かないとき、懸念が一文で触れられるだけで変更が進むことがある
