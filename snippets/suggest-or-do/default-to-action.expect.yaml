title: 既定を「実行」に寄せる指示
kind: prompt
place: システムプロンプト（API）、CLAUDE.md（Claude Code）、会話の最初の依頼（アプリ）
safety: false
conditions:
  - 新しいセッションで試す
  - 試す作業は、git で戻せるリポジトリで行う
expect:
  - when: 「この関数のエラー処理を直す案はあるか」と聞く
    then: 案の説明で終わらず、ファイルが変更される
  - when: 確認してほしい操作に書いた操作が必要になる
    then: 実行の前に、Claude が確認を求める（指示は鍵ではないので、合否にしない）
control: 指示を置かないとき、同じ質問で案の説明だけで終わることがある
