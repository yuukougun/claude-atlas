title: 結論は書かせず、観察の道具だけを作らせる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - 〔〕の欄を、見たいものと入力の場所で埋める
expect:
  - when: 欄を埋めた依頼を出す
    then: 原因や改善案の文章は返らず、再実行できるスクリプトとその使い方が返る
  - when: 小さな入力での実行結果を読む
    then: 出力した値の計算の意味が 1 行ずつ付き、読み飛ばした行や欠けた入力があればその数が出る
control: 「ログを見て原因を教えて」と頼むと、道具ではなく原因の推測の文章が先に返りやすい
