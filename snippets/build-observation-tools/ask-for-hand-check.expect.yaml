title: 道具の出す値を、手計算の例で確かめさせる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 観察の道具が既にあり、〔〕の欄を、道具の出す値が満たすべき関係で埋める
expect:
  - when: 欄を埋めた依頼を出す
    then: 手計算の式つきの例が、道具の実行より先に返る
  - when: 実行結果を読む
    then: 道具の出力がそのまま貼られ、食い違う値があれば、直されずに一覧で挙がる
control: 「道具を確かめて」とだけ頼むと、道具を動かして「問題なし」と報告するだけで、手計算の例が出ないことがある
