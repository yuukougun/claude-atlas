title: 説明の主張を、コードの引用で確かめ直させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - コードの流れを説明させた直後の、同じセッションで試す
expect:
  - when: 説明を受けた直後に、この依頼を送る
    then: 主張ごとの表が返り、各行に行番号と引用が付く
  - when: 返った引用を、自分でファイルを開いて照らす
    then: 引用がコードと一致する。一致しない引用や「合わない」の判定が出ることもある（観察として扱う）
control: 「本当にそう？」とだけ聞くと、根拠を示さずに前の説明を言い直すだけになる場合がある
