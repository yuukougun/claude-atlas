title: 全体像から特定の処理の流れへ絞る質問（答えにファイルと行を添えさせる）
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 読んだことのないリポジトリのルートで、新しいセッションを開いて試す
  - "`<処理の名前。例：ログイン、注文の確定>` を、追いたい処理に置き換える"
expect:
  - when: リポジトリの概観を聞いた後に、この依頼を送る
    then: 入口から順に、「ファイルのパス:行番号」付きで流れが並ぶ
  - when: 返答の行番号の 1 つを、自分でファイルを開いて確かめる
    then: 多くの行で、書かれた内容と一致する（一致しない行が混ざることがあるので、観察として扱う）
control: 「ログインの流れを説明して」とだけ頼むと、行番号がなく、推測と読んだ内容が混ざった説明になる場合がある
