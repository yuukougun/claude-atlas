title: 読んで分かったことを、地図と用語集に残させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 処理の流れをいくつか読ませた後の、同じセッションで試す
  - git のリポジトリで試す（地図の末尾に版を書かせるため）
expect:
  - when: この依頼を送る
    then: 地図と用語集の案が出る。承認するまで、ファイルは作られない（お願いなので、必ず守られるとは限らない。観察として扱う）
  - when: 承認してファイルを作らせ、地図の内容を数か所、自分で照らす
    then: 地図のパスと関数名が実在する。実在しない名前が混ざることもある
control: 「まとめて」とだけ頼むと、行番号入りの長い説明が会話に出るだけで、ファイルに残らない場合がある
