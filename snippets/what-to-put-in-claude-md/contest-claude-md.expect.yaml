title: コンテスト用の CLAUDE.md の例（ビルドと評価のコマンド・制限時間・規則の確認先）
kind: claude-md
place: project
safety: false
features: [claude-md]
conditions:
  - 新しいセッションで試す
  - 山かっこの所は、自分のコマンド・時間・規則のページに書き換える
  - 「触らないもの」の各行は、deny ルールとフックでも止めてから使う
expect:
  - when: 「手元の点数を上げて」と頼む
    then: 書いた評価のコマンドで前の版と比べながら進める様子が観察できる
  - when: 評価用のデータを書き換える案を出させる
    then: CLAUDE.md の文だけでは止まらないことがある。設定で止めてあれば、操作が拒否される
control: 評価のコマンドを書かないと、評価の流し方を毎回尋ねるか、独自の流し方を作ることがある
