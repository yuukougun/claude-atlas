title: 定期タスクの依頼文（成功の定義と結果の置き場所）
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 結果を書くフォルダを先に作っておく
  - まず手動で 1 回走らせ、結果のファイルが想定の形になるのを見てから定期にする
expect:
  - when: 依頼文を定期タスクの依頼に貼って 1 回走らせる
    then: 質問で止まらず、置き場所に日付つきのファイルができる
  - when: 調べる対象に到達できない状態で走らせる
    then: 到達できなかった旨だけを書いたファイルができる
control: 成功の定義と置き場所を書かない同じ依頼では、結果が会話の中だけに残るか、実行のたびに形が変わる
