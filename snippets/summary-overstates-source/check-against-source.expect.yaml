title: 要約を原文と照らさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 原文と要約の両方を依頼に含める（長い原文は添付かファイルで渡す）
expect:
  - when: 原文と、わざと「場合がある」を「必ず」に変えた要約を渡して依頼する
    then: 表の「要約で落ちたもの」の列に落ちた限定が書かれ、最後の一覧にその主張が入る
  - when: 原文にない主張を含む要約を渡して依頼する
    then: その主張の引用の列が「見つからない」になる
control: 「この要約は正確か」とだけ頼むと、引用や落ちた条件が示されないまま「おおむね正確」と返ることがある
