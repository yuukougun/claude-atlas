title: 調査を任せる依頼と、戻させる要約の形
kind: prompt
place: 依頼の本文
safety: false
features: [subagents]
conditions:
  - 新しいセッションで試す
  - 出力の多い調査になる題材（広い検索や長いログ）を選ぶ
expect:
  - when: 空欄を埋めてこの依頼を出す
    then: サブエージェントが読み取りだけで調べ、本筋の会話に結論・根拠の場所・分からなかったことの 3 つが戻る
  - when: 戻ってきた根拠の場所を開く
    then: 結論に対応する箇所がそこにある（観察として確かめる。一致しないときは要約を信じない）
control: 戻す形を書かずに「サブエージェントで調べて」とだけ頼むと、戻る報告の長さと形が一定にならない
