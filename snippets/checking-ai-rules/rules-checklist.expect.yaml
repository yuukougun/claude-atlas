title: 規則の確認表（大会・授業・組織の AI の規則を読むときのメモ）
kind: other
place: 手元のメモ（規則を読む前に写して使う）
safety: true
open: true
conditions:
  - 実在の規則を 1 つ選び、その規則の最新版を公式の所在で開いて記入する
  - 記入できない欄は空にせず「不明」と書き、運営や担当者への質問の記録に移す
expect:
  - when: 規則を読みながら確認表の欄を埋める
    then: 規則に書かれていない欄が「不明」として残り、確かめる質問の一覧になる
  - when: 規則に AI の文言がない大会や授業で記入する
    then: 許可の範囲の 6 区分がすべて「不明」になり、質問の記録に移る（使ってよいとは読まない）
  - when: 学校や組織の規則で記入する
    then: 「学校・組織で足す欄」の確認先とデータの区分が埋まる
control: 確認表を使わないとき、規則の一部（開示や事前に作ったコードの扱いなど）を読み落としたまま使い始めることがある
