title: 無人の実行の後に結果を確かめるスクリプト（出力・差分・再実行）
kind: other
place: project
safety: false
conditions:
  - 使い捨てのブランチで、始めの HEAD を控えてから無人の実行を 1 回行い、出力をファイルに保存してから試す
  - npm test が動く Node.js のプロジェクトで試す
expect:
  - when: 出力のファイルが空のまま実行する
    then: 「出力が空」と出て、終了コード 1 で止まる
  - when: 無人の実行が複数のコミットを作った後に実行する
    then: コミットの一覧と変更ファイルの概要が出て、テストに当たるファイルがあれば別に列挙される
  - when: 最後まで進む
    then: Claude の外で npm test が流れ、その結果が出る
