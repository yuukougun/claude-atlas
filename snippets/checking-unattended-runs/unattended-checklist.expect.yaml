title: 無人の実行の結果を確かめる点検表
kind: other
place: project
safety: false
conditions:
  - 無人の実行の前後で、始めの HEAD と終わりの HEAD を控えられる git のリポジトリで試す
expect:
  - when: 実行の前に、上半分の項目を埋める
    then: 完了の定義、許す道具と上限、触れる範囲、保存先が、走らせる前に決まっている
  - when: 実行の後に、下半分の項目を Claude の要約を見ずに埋める
    then: 終了コード、出力、再実行の件数、止まった理由、差分のそれぞれに、残ったものに基づく答えが書ける
control: 点検表を使わないと、Claude の要約と終了コードだけで成功と決めてしまい、件数の変化や想定外の変更が見落とされる
