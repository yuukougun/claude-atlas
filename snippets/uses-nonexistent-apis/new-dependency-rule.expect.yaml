title: 依存を足す前に相談させる CLAUDE.md の節
kind: claude-md
place: project
safety: false
conditions:
  - 新しいセッションで試す
  - 試す場所は、壊れても困らない作業用のリポジトリにする
expect:
  - when: 未導入のライブラリが要る機能を依頼する
    then: インストールの前に、名前・用途・理由の報告と確認が返ってくる
  - when: 制約に反するパッケージの追加を頼む
    then: 追加せず、代わりの案が相談される
control: 節を置かないとき、同じ依頼で確認なしに新しいパッケージの導入が書かれることがある
