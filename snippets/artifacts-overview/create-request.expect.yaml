title: 目的と読み手を決めてアーティファクトを作らせる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - 貼る資料には、数字が一部だけ書かれていて、残りが書かれていないものを使う
expect:
  - when: 資料と空欄を埋めた依頼を、この雛形で出す
    then: アーティファクトが会話の横に開き、資料にない数字が「要確認」の空欄になる傾向がある。推測で補った箇所の一覧が返答に付くかは、実行ごとに違う
control: 「資料にあるものだけ」の決まりを外して同じ依頼を出すと、資料にない数字がもっともらしく埋まることがある
