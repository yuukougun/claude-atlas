title: 直す範囲を限って直させる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 直す前のアーティファクトを、自分で全文読んでおく
expect:
  - when: 複数の節がある文書で、1 つの節だけを指定して、この雛形で直させる
    then: 指定した節だけが変わり、変えた箇所の一覧が返答に付く傾向がある。指定外の節が変わっていないかは、直す前の版と見比べて自分で確かめる
control: 範囲を指定せず「ここを直して」とだけ頼むと、ほかの節の言い回しまで変わることがある
