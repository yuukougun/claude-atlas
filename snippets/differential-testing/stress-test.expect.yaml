title: 愚直解と入力の生成器でストレステストを回させる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - 〔〕の欄を、実際の問題・本解・入力の上限で埋める
  - 本解に、小さい入力で出る間違いを 1 つ入れた版でも試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 愚直解・入力の生成器・比較の駆動役が作られ、愚直解を確かめた小さい入力 3 つの結果が示される
  - when: 間違いを入れた本解で回す
    then: 最初の不一致で止まり、入力・両方の出力・種が保存され、本解は直されない
  - when: 間違いのない本解で回す
    then: 回した件数と種の範囲が実行ログで示される
control: 禁止の 3 行を置かないと、不一致が出たときに愚直解のほうを本解に合わせて直す返答が出ることがある
