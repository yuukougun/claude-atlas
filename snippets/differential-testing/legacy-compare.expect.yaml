title: 旧い実装との突き合わせを作って回させる依頼の雛形
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - 〔〕の欄を埋める。壊れても困らない小さい旧実装と新実装の組で試す
expect:
  - when: 欄を埋めた依頼を出す
    then: 本格的に比べる前に、旧い実装の出力が毎回同じかの確認と、揺れる項目の一覧が返る
  - when: 新しい実装に違いを入れて回す
    then: 最初の 1 件で止まり、入力と両方の出力が保存される
  - when: 報告を読む
    then: 流した件数・一致した件数・比較から外した項目とその理由が書かれている
control: 揺れる項目の確認を頼まないと、時刻や並び順の違いが不一致として大量に出て、比較から黙って外される形になりやすい
