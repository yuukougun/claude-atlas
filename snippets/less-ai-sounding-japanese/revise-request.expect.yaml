title: 推敲の観点を書いた依頼
kind: prompt
place: 依頼の本文
safety: false
open: true
conditions:
  - 新しいセッションで試す
  - 手本の文章と推敲する文章に、自分の文章を入れる
expect:
  - when: 前置きと締めの定型を含む文章で、この依頼を出す
    then: 直した箇所の一覧が先に出て、定型が削られた文章がその後に出る
  - when: 数値や固有名詞を含む文章で、この依頼を出す
    then: 数値と固有名詞は元のまま残る
control: 「もっと自然な日本語に直して」とだけ頼むと、直す箇所の範囲が毎回変わり、一覧も出ないことがある
