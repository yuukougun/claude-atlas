title: 自分の案を含む複数案を、誰の案かを伏せて同じ表で比べさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す
  - "`<…>` の欄を、自分の案と目的で埋める。どれが自分の案かは書かない"
expect:
  - when: 3 つの案を貼って送る
    then: 前提の異なる案が 3 つ足され、全部の案が同じ行の表に並ぶ
  - when: 同じ案を、「A が私の案」と書き添えて送る
    then: 表の評価や推奨が、書き添えなしと変わる場合がある（観察として扱う。変わらないとは限らない）
control: 「この方針で良いよね？」とだけ聞くと、同意が返りやすい
