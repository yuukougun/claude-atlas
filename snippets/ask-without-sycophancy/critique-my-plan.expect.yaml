title: 自分の案を、代案なしで批評させる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 新しいセッションで試す（Claude Code では、新しいセッションか、サブエージェントの依頼の本文に入れる）
  - "`<…>` の欄を、基準と成果物で埋める。見立てや好みは貼らない"
expect:
  - when: 計画の本文と基準だけを貼って送る
    then: 前提・見落とし・崩れそうな入力の指摘が、確信度と影響と確かめる実験つきで並ぶ
  - when: 問題のない成果物を貼って送る
    then: 見つからなかったという答えか、確信度が低い指摘が返る（指摘を 1 つも出さないとは限らない。観察として扱う）
control: 基準を書かずに「この計画をレビューして」とだけ頼むと、指摘の観点が回ごとに変わる場合がある
