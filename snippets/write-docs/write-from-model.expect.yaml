title: 既存の文書を手本に渡して、技術文書を書かせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 括弧の例を、自分のリポジトリの文書とコードに書き換えてから出す
  - Claude Code をリポジトリのルートで起動し、手本の文書とコードを読める状態にする
expect:
  - when: 括弧を埋めて、この依頼を出す
    then: 最初に手本の文体のまとめが返り、そのあとに文書と、記述ごとのコードの根拠の一覧が返る
  - when: 根拠の一覧のファイルと行を開く
    then: 一覧と合わない記述が見つかることがある（一覧は自己申告なので、文書に採る前に開いて確かめる）
control: 手本を渡さずに「README を書いて」と頼むと、文体と見出しが既存の文書と揃わず、コードにない既定値や手順が混ざっても読み手には見分けにくい
