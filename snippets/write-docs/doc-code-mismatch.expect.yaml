title: 書いた文書とコードの食い違いを挙げさせる依頼
kind: prompt
place: 依頼の本文
safety: false
conditions:
  - 括弧の例を、自分の文書とコードに書き換えてから出す
  - 照らす文書とコードを、Claude Code が読める場所に置いておく
expect:
  - when: 括弧を埋めて、書かせた直後の文書に対してこの依頼を出す
    then: 食い違いの表が 4 つの種類のどれかを付けて返り、確かめられなかった記述が別に挙がる
  - when: 表の「コードの実際」のファイルと行を開く
    then: 表の指摘と合わない行が見つかることがある（見落としもあり得るので、一覧が空でも文書が正しい証拠にはならない）
control: 「この文書は正しいか」とだけ頼むと、全体を読んだ感想が返り、どの記述がどのコードと食い違うのかが見えにくい
