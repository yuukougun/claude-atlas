title: strict tool use の依頼の本文（道具の入力をスキーマに合わせる）
kind: other
place: 依頼の本文
safety: false
conditions:
  - Messages API に、この本文を POST する（モデルの id は自分の環境で使えるものに替える）
  - 使うモデルが structured outputs に対応している
expect:
  - when: この本文で依頼を出す
    then: 応答に tool_use ブロックが入り、その input が city と unit を持ち、unit が enum の値になる
control: strict を外すと、input のキー名や型が定義と食い違うことがある
